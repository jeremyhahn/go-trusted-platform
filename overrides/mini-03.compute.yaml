# lab-node-3 Compute Worker Overrides
# Supermicro X10 (X10SDV-TP8F)
# Applied on top of: configs/platform/templates/dedicated/supermicro/x10/compute.yaml

debug: true
debug-secrets: true

os:
  hostname: lab-node-3
  # Debug root password for easy iKVM/SOL/SSH access during development.
  root-password: "password"
  # Post-install: enable serial getty on ttyS1 so SOL gets a login prompt,
  # install the operator SSH key, load KVM module, and start OVS.
  post-install: |
    set -e
    echo "[post-install] Installing operator SSH authorized_keys"
    mkdir -p /root/.ssh
    chmod 700 /root/.ssh
    cat > /root/.ssh/authorized_keys <<'PUBKEY'
    ssh-rsa  mail@jeremyhahn.com
    PUBKEY
    chmod 600 /root/.ssh/authorized_keys

    echo "[post-install] Allowing root SSH login + password auth"
    sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
    sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

    echo "[post-install] Enabling agetty on ttyS1 for SOL login"
    if ! grep -q '^ttyS1:' /etc/inittab 2>/dev/null; then
      echo "ttyS1::respawn:/sbin/getty -L 115200 ttyS1 vt100" >> /etc/inittab
    fi

    echo "[post-install] Loading KVM kernel module at boot"
    echo "kvm" >> /etc/modules
    echo "kvm_intel" >> /etc/modules

    echo "[post-install] Enabling OVS at boot"
    rc-update add ovsdb-server default 2>/dev/null || true
    rc-update add ovs-vswitchd default 2>/dev/null || true

    echo "[post-install] Done"

network:
  dns:
    nameservers:
      - 127.0.0.1
    search-domains:
      - trusted-platform.internal
  dnsmasq:
    enabled: true
    upstream-servers:
      - 198.18.1.140#9053
    local-domain: trusted-platform.internal
  subnets:
    - name: production
      scope: internal
      vlan-id: 200
      cidr: 198.18.0.0/24
      gateway: 198.18.0.1
      dns:
        - 198.18.0.1
  interfaces:
    - name: eth0
      type: static
      ipv4-address: 198.18.1.141/24
      ipv4-gateway: 198.18.1.1
      auto-start: true
  bonds:
    - name: bond0
      # OVS bond — eth6 (10G SFP+ → coreswt-01) + eth7 (10G SFP+ →
      # coreswt-02) form a vPC (Po37) across the Nexus pair.
      type: ovs
      bridge: trusted0
      mode: balance-tcp
      lacp: active
      interfaces:
        - eth6
        - eth7
      vlans:
        - subnet: production
          ipv4-address: 198.18.0.3/24
          auto-start: true
      auto-start: true

bmc:
  address: 198.18.1.104
  port: 623
  username: claude
  password: "REMOVED-BMC-PASSWORD"
  protocol: ipmi

tpm:
  idevid:
    serial: lab-node-3-compute-01
