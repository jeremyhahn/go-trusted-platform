# lab-node-1 Gateway Overrides
# Supermicro X10 (X10SDV-TP8F)
# Applied on top of: configs/platform/templates/dedicated/supermicro/x10/gateway.yaml

debug: true
debug-secrets: true

domain: gw.trusted-platform.io
hostmaster: hostmaster@trusted-platform.io

os:
  hostname: lab-node-1
  root-password: "password"
  post-install: |
    set -e
    echo "[post-install] Installing operator SSH authorized_keys"
    mkdir -p /root/.ssh
    chmod 700 /root/.ssh
    cat > /root/.ssh/authorized_keys <<'PUBKEY'
    ssh-rsa  mail@jeremyhahn.com
    PUBKEY
    chmod 600 /root/.ssh/authorized_keys

    echo "[post-install] Allowing root SSH login + password auth"
    sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
    sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

    echo "[post-install] Enabling agetty on ttyS1 for SOL login"
    if ! grep -q '^ttyS1:' /etc/inittab 2>/dev/null; then
      echo "ttyS1::respawn:/sbin/getty -L 115200 ttyS1 vt100" >> /etc/inittab
    fi

    echo "[post-install] Done"

network:
  dns:
    nameservers:
      - 127.0.0.1
    search-domains:
      - trusted-platform.internal
  dnsmasq:
    enabled: true
    upstream-servers:
      - 198.18.1.140#9053
    local-domain: trusted-platform.internal
  subnets:
    - name: production
      scope: internal
      vlan-id: 200
      cidr: 198.18.0.0/24
      gateway: 198.18.0.1
      dns:
        - 198.18.0.1
    - name: provisioning
      scope: internal
      vlan-id: 201
      cidr: 172.16.201.0/24
      gateway: 172.16.201.1
      dns:
        - 172.16.201.1
      role: provisioning
      dhcp:
        enabled: true
        range-start: 172.16.201.50
        range-end: 172.16.201.254
        lease-duration: 1h
    - name: quarantine
      scope: internal
      vlan-id: 202
      cidr: 172.16.202.0/24
      gateway: 172.16.202.1
      dns:
        - 172.16.202.1
      role: quarantine
    - name: storage
      scope: internal
      vlan-id: 203
      cidr: 172.16.203.0/24
      gateway: 172.16.203.1
      dns:
        - 172.16.203.1
    # ISP-assigned WANs
    - name: att-wan
      scope: isp
      cidr: 99.12.246.32/29
      gateway: 99.12.246.38
    - name: comcast-wan
      scope: isp
      cidr: 96.65.171.16/29
      gateway: 96.65.171.22
    # ARIN-assigned public space (BGP-announced)
    - name: public-v4
      scope: public
      cidr: 23.143.36.0/24
    - name: public-v6
      scope: public
      cidr: 2602:F5BB::/36
    # GRE tunnel transit links
    - name: gre-miami-att
      scope: transit
      cidr: 10.255.0.0/30
    - name: gre-miami-att-2
      scope: transit
      cidr: 10.255.0.4/30
    - name: gre-atlanta-comcast
      scope: transit
      cidr: 10.255.0.16/30
    - name: gre-atlanta-comcast-2
      scope: transit
      cidr: 10.255.0.20/30
  interfaces:
    # Management interface (IPMI/SSH access via mgmt network)
    - name: eth0
      type: static
      ipv4-address: 198.18.1.139/24
      ipv4-gateway: 198.18.1.1
      auto-start: true
  # OVS bridge — platformd creates this at runtime via OVSDB and
  # assigns the first bond.vlans[].ipv4-address to it per node. The
  # entry here is required so initBridgeIPs iterates and reaches
  # assignBridgeAddr.
  bridges:
    - name: trusted0
      type: ovs
      interfaces:
        - bond0
      auto-start: true
      stp: false
  bonds:
    - name: bond0
      # OVS bond — created at runtime by platformd via native OVSDB
      # wire protocol. eth6 = 10G SFP+ to coreswt-01 (nexus-01 Eth1/35),
      # eth7 = 10G SFP+ to coreswt-02 (nexus-02 Eth1/35). Forms a vPC
      # (Po35) across the Nexus pair with LACP rate fast.
      type: ovs
      bridge: trusted0
      mode: balance-tcp
      lacp: active
      interfaces:
        - eth6
        - eth7
      vlans:
        - subnet: production
          ipv4-address: 198.18.0.1/24
          auto-start: true
        - subnet: provisioning
          ipv4-address: 172.16.201.1/24
          auto-start: true
        - subnet: storage
          ipv4-address: 172.16.203.1/24
          auto-start: true
      auto-start: true

gateway:
  id: lab-node-1-gateway
  anycast-ip: "198.18.0.1"

  # Stateful firewall with zone-based policy
  firewall:
    enabled: true
    default-policy: deny

  # BGP: AS401870, iBGP to VPS via GRE tunnels
  bgp:
    asn: 401870
    router-id: 23.143.36.1
    listen-port: 179
    peers:
      # iBGP to Miami VPS (primary, no prepend)
      - name: miami-vps
        address: 10.255.0.2
        asn: 401870
        families:
          - ipv4-unicast
          - ipv6-unicast
      # iBGP to Atlanta VPS (backup, 3x prepend)
      - name: atlanta-vps
        address: 10.255.0.18
        asn: 401870
        families:
          - ipv4-unicast
          - ipv6-unicast
    announce:
      ipv4:
        - "23.143.36.0/24"
      ipv6:
        - "2602:F5BB::/36"

  # GRE tunnels to Vultr VPS nodes
  tunnels:
    - name: gre-miami-att
      type: gre
      local: 99.12.246.36
      remote: 45.63.110.165
      tunnel-ip: 10.255.0.1/30
      tunnel-ipv6: "2602:f5bb:cafe:1::1/64"
    - name: gre-miami-att-2
      type: gre
      local: 99.12.246.37
      remote: 45.63.110.165
      tunnel-ip: 10.255.0.5/30
      tunnel-ipv6: "2602:f5bb:cafe:2::1/64"
    - name: gre-atlanta-comcast
      type: gre
      local: 96.65.171.20
      remote: 66.42.90.190
      tunnel-ip: 10.255.0.17/30
      tunnel-ipv6: "2602:f5bb:cafe:5::1/64"
    - name: gre-atlanta-comcast-2
      type: gre
      local: 96.65.171.21
      remote: 66.42.90.190
      tunnel-ip: 10.255.0.21/30
      tunnel-ipv6: "2602:f5bb:cafe:6::1/64"

  # DHCP on provisioning VLAN
  dhcp:
    enabled: true
    interface: bond0.201
    segment: provisioning

  # PXE boot server for provisioning
  pxe:
    enabled: true
    http-port: 8069
    tftp-port: 69
    kernel-path: /var/lib/trusted-platform/pxe/vmlinuz
    initrd-path: /var/lib/trusted-platform/pxe/initramfs
    config-server-url: "https://cp.trusted-platform.internal:8443/api/v1/devices/config"
    bootstrap-strategy: dane

  # NAT for outbound LAN traffic
  nat:
    enabled: true
    external-ip: 23.143.36.1
    port-range-start: 1024
    port-range-end: 65535
    max-sessions: 131072

bmc:
  address: 198.18.1.102
  port: 623
  username: claude
  password: "REMOVED-BMC-PASSWORD"
  protocol: ipmi

tpm:
  idevid:
    serial: lab-node-1-gw-01
