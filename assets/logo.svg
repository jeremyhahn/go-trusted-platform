<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Trusted Platform project logo</title>
  <desc id="desc">A stylized logo for Trusted Platform combining the approved platform shield mark with enterprise product branding.</desc>
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2f0ff"/>
      <stop offset="100%" stop-color="#c7ddff"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9dbff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#dbeafe" stop-opacity="0.56"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="912" height="272" rx="36" fill="#f5f8fc"/>

  <g filter="url(#shadow)">
    <rect x="48" y="48" width="224" height="224" rx="52" fill="url(#panel)"/>
    <rect x="84" y="84" width="152" height="152" rx="36" fill="url(#frame)" opacity="0.15"/>
    <rect x="96" y="96" width="128" height="128" rx="30" fill="#162235"/>
    <rect x="108" y="108" width="104" height="104" rx="24" fill="none" stroke="#bfdbfe" stroke-opacity="0.22" stroke-width="4"/>
    <path d="M94 132h18M94 160h18M94 188h18M208 132h18M208 160h18M208 188h18"
          stroke="url(#pulse)"
          stroke-width="6"
          stroke-linecap="round"/>
    <path d="M132 94v18M160 94v18M188 94v18M132 208v18M160 208v18M188 208v18"
          stroke="url(#pulse)"
          stroke-width="6"
          stroke-linecap="round"/>
    <path d="M160 116
             l34 14
             v28
             c0 29-13 49-34 58
             c-21-9-34-29-34-58
             v-28
             z"
          fill="url(#shield)"/>
    <path d="M160 126
             l24 10
             v21
             c0 18-8 32-24 40
             c-16-8-24-22-24-40
             v-21
             z"
          fill="none"
          stroke="#5b6c85"
          stroke-opacity="0.36"
          stroke-width="3"/>
    <g fill="url(#core)">
      <rect x="138" y="141" width="18" height="18" rx="5"/>
      <rect x="164" y="141" width="18" height="18" rx="5"/>
      <rect x="138" y="167" width="18" height="18" rx="5"/>
      <rect x="164" y="167" width="18" height="18" rx="5"/>
    </g>
    <path d="M156 150h8M147 159v8M173 159v8M156 176h8"
          stroke="#eff6ff"
          stroke-width="4"
          stroke-linecap="round"/>
  </g>

  <g transform="translate(314 86)">
    <text x="0" y="72" fill="#0f172a" font-size="72" font-weight="700" font-family="'Plus Jakarta Sans', 'Trebuchet MS', 'Segoe UI', sans-serif" letter-spacing="0.5">Trusted Platform</text>
    <text x="2" y="118" fill="#2563eb" font-size="24" font-weight="600" font-family="'Plus Jakarta Sans', 'Trebuchet MS', 'Segoe UI', sans-serif" letter-spacing="2">CONFIDENTIAL COMPUTING PLATFORM</text>
    <path d="M2 148 h560" stroke="#d9e6f2" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="190" fill="#51657b" font-size="24" font-family="'Plus Jakarta Sans', 'Trebuchet MS', 'Segoe UI', sans-serif">
      <tspan>Attestation</tspan>
      <tspan dx="18">•</tspan>
      <tspan dx="18">Identity</tspan>
      <tspan dx="18">•</tspan>
      <tspan dx="18">Key Management</tspan>
      <tspan dx="18">•</tspan>
      <tspan dx="18">Secure Orchestration</tspan>
    </text>
