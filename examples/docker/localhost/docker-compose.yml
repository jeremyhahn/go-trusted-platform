services:
  server:
    build:
      context: ./server
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: trusted-platform-server
    hostname: server
    domainname: platform.local
    networks:
      trusted-platform:
        ipv4_address: 172.20.0.10
        aliases:
          - server.internal
          - server.platform.local
    extra_hosts:
      - "edge-001.platform.local:172.20.0.20"
      - "edge-001:172.20.0.20"
    ports:
      - "8443:8443"  # HTTPS/TLS
      - "8080:8080"  # HTTP
      - "8053:8053"  # Public DNS
      - "9053:9053"  # Internal DNS
    volumes:
      - server-data:/opt/trusted-platform/trusted-data
    environment:
      - TPM_SIMULATOR=true
      - PASSWORD=test
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:8443/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  client:
    build:
      context: ./client
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: trusted-platform-client
    hostname: edge-001
    domainname: platform.local
    networks:
      trusted-platform:
        ipv4_address: 172.20.0.20
        aliases:
          - edge-001.internal
          - edge-001.platform.local
    extra_hosts:
      - "server.platform.local:172.20.0.10"
      - "platform.local:172.20.0.10"
    dns:
      - 172.20.0.10  # Use server's DNS
      - 8.8.8.8
    dns_search:
      - local
      - internal
    ports:
      - "8081:8081"  # HTTP
      - "9443:9443"  # HTTPS/TLS
    volumes:
      - client-data:/opt/trusted-platform/trusted-data
    environment:
      - TPM_SIMULATOR=true
      - PASSWORD=test
      - SERVER_URL=https://server.internal:8443
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:9443/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  trusted-platform:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  server-data:
  client-data: