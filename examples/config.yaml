# Minimal configuration for web E2E testing
# This config uses swtpm (software TPM) for integration testing

debug: true
debug-secrets: true
platform-dir: trusted-data
config-dir: trusted-data/etc
log-dir: trusted-data/log
domain: localhost
hostmaster: hostmaster@localhost
pin-seal-policy: false

# Use built-in TPM simulator for development
tpm:
  simulator: true
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  platform-pcr-bank: sha256
  ek:
    debug: true
    handle: 0x81010001
    password:
    rsa:
      keysize: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    hierarchy-auth:
    password:
    platform-policy: false
    rsa:
      keysize: 2048
  iak:
    debug: true
    hash: SHA-256
    handle: 0x81010002
    password:
    rsa:
      keysize: 2048
    signature-algorithm: SHA256-RSAPSS
  idevid:
    model: web-test
    serial: "001"
    cert-handle: 0x01C90000
    debug: true
    handle: 0x81020000
    hash: SHA-256
    pad: true
    password:
    rsa:
      keysize: 2048
    signature-algorithm: SHA256-RSAPSS
  keystore:
    srk-handle: 0x81000002
    srk-auth: platform
    platform-policy: false

quicbaas:
  transport: embedded
  storage-backend: pebble
  data-dir: trusted-data/quicbaas
  wal-dir: trusted-data/quicbaas/wal
  node-id: 1
  cache-size: 67108864
  log-level: warn
  consistency-level: 0
  request-timeout: 10s
  kms:
    enabled: true
    backend: software
  iam:
    enabled: true

certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: false
  default-validity: 365
  default-idevid-cn: default-device-id
  sans-include-localhost: true
  require-password: false
  quantum-safe: false
  identity:
    - # Root Certificate Authority (index 0)
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      hash: SHA-256

      valid: 3650
      subject:
        cn: root-ca.localhost
        organization: Test Platform
        country: US
        province: Test
        locality: Test City
      sans:
        dns:
          - root-ca.localhost
        email:
          - hostmaster@localhost

      keystores:
        software:
          platform-policy: false

    - # Issuing/Intermediate CA (index 1) - Used for issuing certs
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      hash: SHA-256

      valid: 1825
      subject:
        cn: issuing-ca.localhost
        organization: Test Platform
        country: US
        province: Test
        locality: Test City
      sans:
        dns:
          - issuing-ca.localhost
        email:
          - hostmaster@localhost

      keystores:
        software:
          platform-policy: false

webservice:
  port: 8080
  jwt-expiration: 1440
  jwt-refresh-expiration: 10080
  key:
    algorithm: RSA
    rsa:
      keysize: 2048
    signature-algorithm: SHA256-RSAPSS
    hash: SHA-256
    store: software
    platform-policy: false
  certificate:
    valid: 365
    subject:
      cn: localhost
      organization: Test Platform
      country: US
    sans:
      dns:
        - localhost
      ip:
        - 127.0.0.1
    eku:
      - server
  home: trusted-data/www
  tls-port: 8443
  webauthn:
    id: localhost
    origins:
      - https://localhost:8443
      - https://localhost:3000
      - http://localhost:3000
    display-name: Trusted Platform
  session:
    name: tp-session
    domain: localhost
    max-age: 86400
    secure: true
    http-only: true
    same-site: lax
  cors:
    enabled: true
    allowed-origins:
      - https://localhost:3000
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
    credentials: true
    max-age: 3600
  routes:
    - host: localhost
      route: /
      root: trusted-data/www
      index: index.html
    - host: localhost
      route: /api
      protected: false

iam:
  enabled: true
  auth:
    authorization-code:
      enabled: true
    client-credentials:
      enabled: true
    jwt:
      enabled: true
      issuer: https://localhost:8443
      audience: https://localhost:8443
      algorithm: RS256
      expiration: 1440
      refresh-expiration: 10080

argon2:
  memory: 65536
  iterations: 3
  parallelism: 4
  salt-length: 16
  key-length: 32
