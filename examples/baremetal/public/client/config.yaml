acme:
  client:
    account:
      email: hostmaster@dev.example.com
      key:
        debug: true
        cn: acme_dev.example.com
        default: false
        hash: SHA-256
        algorithm: RSA
        password: "123456"
        rsa:
          size: 2048
        platform-policy: true
        signature-algorithm: SHA256-RSA
        store: software
      register: true
    directory: https://dev.example.com/api/v1/acme/directory
    enrollment:
      challenge: enroll-01
      ip: ${PREFERRED_IP}
    request-server-bundle: false
argon2:
  memory: 65536
  iterations: 3
  parallelism: 2
  saltLen: 16
  keyLen: 32
attestation:
  allow-attestor-self-ca: false
  allow-open-enrollment: false
  allowed-verifiers: []
  insecure-port: 0
  tls-port: 0
  quote-pcrs: []
certificate-authority:
  auto-import-issuing-ca: true
  default-validity: 10
  identity:
  - keystores:
      software:
        platform-policy: true
      pkcs11:
        library: /usr/local/lib/softhsm/libsofthsm2.so
        config: trusted-data/etc/softhsm.conf
        pin: "123456"
        platform-policy: true
        slot: 0
        so-pin: "123456"
