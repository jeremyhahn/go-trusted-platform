config-dir: /etc/trusted-platform
datastore:
  consistency-level: local
  read-buffer-size: 50
  home: trusted-data/datastore
  serializer: yaml
  quicbaas:
    data-dir: trusted-data/quicbaas
    node-id: 1
    cache-size: 67108864
    log-level: warn
    consistency-level: linearizable
debug: true
debug-secrets: true
domain: dev.example.com
hostname: omega
hostmaster: hostmaster@dev.example.com
log-dir: trusted-data/log
platform-dir: trusted-data
tpm:
  device: /dev/tpmrm0
  encrypt-sessions: true
  ek:
    cert-handle: 29360130
    debug: true
    handle: 2164326401
    algorithm: RSA
    platform-policy: false
    rsa:
      size: 2048
  platform-pcr-bank: sha256
  # PCRs to include in golden integrity measurement for TPM-sealed secrets.
  # Leave empty to use ALL PCRs (0-23) for comprehensive boot chain measurement.
  # This includes BIOS/UEFI firmware, kernel command line, and IMA file measurements.
  # For specific PCRs only, use: [0, 7, 9, 10]
  golden-pcrs: []
  hash: SHA-256
  iak:
    cert-handle: 0
    debug: true
    handle: 2164326402
    hash: SHA-256
    algorithm: RSA
    platform-policy: false
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  identity-provisioning: IAK_IDEVID_SINGLE_PASS
  idevid:
    cert-handle: 29949952
    debug: true
    handle: 2164391936
    hash: SHA-256
    algorithm: RSA
    model: edge
    pad: true
    platform-policy: true
    rsa:
      size: 2048
    serial: "001"
    signature-algorithm: SHA256-RSA
  keystore:
    srk-auth: platform
    srk-handle: 2164260866
    platform-policy: true
  platform-pcr: 16
  platform-pcr-bank: sha256
  ssrk:
    debug: true
    handle: 2164260865
    algorithm: RSA
    platform-policy: true
    rsa:
      size: 2048
  entropy: false
  simulator: true
webservice:
  certificate:
    acme:
      challenge: http-01
      cross-sign:
        directory: https://acme-staging-v02.api.letsencrypt.org/directory
        challenge: http-01
      renew: 15
    sans:
      dns:
      - dev.example.com
      email:
      - hostmaster@dev.example.com
    subject:
      cn: dev.example.com
      organization: Example Corporation
      country: US
      province: Linux
      locality: Hypervisor
      address: 123 acme street
      postal-code: "012345"
    valid: 365
  home: public_html
  index: index.html
  jwt:
    expiration: 60
    issuer: example
  key:
    debug: false
    default: false
    hash: SHA-256
    algorithm: RSA
    rsa:
      size: 2048
    platform-policy: false
    signature-algorithm: SHA256-RSA
    store: software
  port: 8080
  rewrite: []
  tls-port: 8443
  virtual-hosts:
  - certificate:
      acme:
        challenge: http-01
        renew: 15
      sans:
        dns:
        - dashboard.dev.example.com
        email:
        - hostmaster@dev.example.com
      subject:
        cn: dashboard.dev.example.com
        organization: Example Corporation
        country: US
        province: Linux
        locality: Hypervisor
        address: 123 acme street
        postal-code: "012345"
      valid: 365
    cors:
      allowed-origins:
      - https://dashboard.dev.example.com
      - https://dashboard.dev.example.com:8080
      - https://dashboard.dev.example.com:8443
      - https://localhost
      - https://localhost:8080
      - https://localhost:8443
      - https://localhost:3000
      allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowed-headers:
      - '*'
      allow-credentials: true
    home: dashboard.dev.example.com
    hosts:
    - dashboard.dev.example.com
    index: index.html
    key:
      debug: true
      ecc:
        curve: P-256
      default: false
      hash: SHA-256
      algorithm: ECDSA
      platform-policy: false
      signature-algorithm: ECDSA-SHA256
      store: software
  webauthn:
    display-name: Example Corporation
    id: example.com
    origins:
    - https://dev.example.com
    - https://dev.example.com:8080
    - https://dev.example.com:8443
    - https://localhost
    - https://localhost:8080
    - https://localhost:8443
    - https://localhost:3000
  cors:
    allowed-origins:
    - https://dev.example.com
    - https://dev.example.com:8080
    - https://dev.example.com:8443
    - https://localhost
    - https://localhost:8080
    - https://localhost:8443
    - https://localhost:3000
    allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    allowed-headers:
    - '*'
    allow-credentials: true
