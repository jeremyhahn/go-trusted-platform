      data-dir: trusted-data/quicbaas
      node-id: 1
      cache-size: 67108864
      log-level: warn
      consistency-level: linearizable
  default-ttl: 3600
  internal:
    port: 9053
    forwarders:
    - 192.168.1.1
    - 192.168.2.1
    - 192.168.3.1
    zone:
      id: 18411453967522201964
      name: dev.example.internal.
      ttl: 3600
      records:
        a:
        - name: '@'
          ttl: 3600
          value: ${PRIVATE_IPv4}
        - name: ns1
          ttl: 3600
          value: ${PRIVATE_IPv4}
        - name: ns2
          ttl: 3600
          value: 192.168.2.1
        - name: ns3
          ttl: 3600
          value: 192.168.3.1
        - name: ${HOSTNAME}
          ttl: 3600
          value: ${PRIVATE_IPv4}
        cname:
        - name: www
          ttl: 3600
          value: dev.example.internal.
        ns:
        - name: dev.example.internal.
          ttl: 3600
          value: ns1.dev.example.internal.
        - name: dev.example.internal.
          ttl: 3600
          value: ns2.dev.example.internal.
        - name: dev.example.internal.
          ttl: 3600
          value: ns3.dev.example.internal.
        soa:
          expire: 86400
          mname: ns1.dev.example.internal.
          min-ttl: 3600
          name: dev.example.internal.
          rname: hostmaster@dev.example.internal
          refresh: 86400
          retry: 7200
          serial: 1
          ttl: 3600
      description: Internal zone for dev.example.internal
      internal: true
