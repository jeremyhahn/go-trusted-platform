networks:
  trustnet0: 
    driver: bridge
  pxenet0: 
    driver: bridge
    internal: true

services:
  pxe:
    image: jeremyhahn/pxe-server
    networks:
      - pxenet0

  nfs:
    image: jeremyhahn/nfs-server
    networks:
      - trustnet0

  platforrm:
    image: jeremyhahn/trusted-platform
    ports:
      - "80:8080"
      - "443:8443"
    networks:
      - trustnet0
    environment:
      DEBUG: "true"
