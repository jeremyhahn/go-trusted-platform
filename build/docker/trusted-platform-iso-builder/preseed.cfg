# Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string trusted-platform.local

# Enable using a mirror
d-i apt-setup/use_mirror boolean true

# Configure the mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Enable contrib/non-free if you need them
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true

# User setup
d-i passwd/root-password password password
d-i passwd/root-password-again password password
d-i passwd/user-fullname string Platform Administrator
d-i passwd/username string tpadm
d-i passwd/user-password password password
d-i passwd/user-password-again password password

# # The disk to partition
d-i partman-auto/disk string /dev/vda

# Partitioning - Use entire disk (guided partitioning)
# d-i partman-partitioning/choose_label string gpt
# d-i partman-auto/method string regular
# d-i partman-auto/choose_recipe select atomic
# d-i partman-auto/confirm boolean true
# d-i partman-auto/confirm_nooverwrite boolean true
# d-i partman/choose_partition select finish
# d-i partman/confirm boolean true
# d-i partman/confirm_nooverwrite boolean true


# LVM with LUKS
d-i partman-auto/method string crypto
d-i partman-crypto/passphrase string password
d-i partman-crypto/passphrase-again string password
d-i partman-crypto/weak_passphrase boolean true
d-i partman-crypto/confirm boolean true
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string crypt
d-i partman-auto/choose_recipe select trusted-root
d-i partman-auto/expert_recipe string \
      trusted-root :: \
              538 538 1075 free \
                    $primary{ } \
                    $iflabel{ gpt } \
                    $reusemethod{ } \
                    method{ efi } format{ } \
              . \
              256 512 512 ext2 \
                    $primary{ } \
                    $defaultignore{ } \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext2 } \
                    mountpoint{ /boot } \
              . \
              8192 16384 16386 linux-swap \
                    $lvmok{ } \
                    in_vg { crypt } \
                    lv_name{ swap } \
                    method{ swap } format{ } \
              . \
              16384 16385 32768 ext4 \
                    $lvmok{ } lv_name{ var } \
                    in_vg { crypt } \
                    $primary{ } \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    mountpoint{ /var } \
              . \
              32768 65536 131072 ext4 \
                    $lvmok{ } lv_name{ root } \
                    in_vg { crypt } \
                    $primary{ } $bootable{ } \
                    method{ format } format{ } \
                    use_filesystem{ } filesystem{ ext4 } \
                    mountpoint{ / } \
              . \

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Force UEFI booting ('BIOS compatibility' will be lost).
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt

# Package installation
tasksel tasksel/first multiselect standard
d-i pkgsel/include string \
    sudo \
    syslog-ng \
    vim \
    curl \
    ssh \
    wget \
    cron \
    iptables \
    docker.io \
    python3-ansible-runner \
    tpm2-tools \
    iputils-ping \
    net-tools \
    efitools \
    efivar \
    efibootmgr \
    sbsigntool \
    systemd-boot-efi \
    binutils \
    initramfs-tools
d-i pkgsel/upgrade select safe-upgrade

# Bootloader installation
# d-i grub-installer/bootdev string default

# Finish installation and reboot automatically
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/reboot boolean true

# Late command to pull and run a Docker image
d-i preseed/late_command string \
    cp /cdrom/late_command.sh /target/root/late_command.sh; \
    in-target /bin/bash -c '/root/late_command.sh'

