---
trusted_platform_image: "docker.io/jeremyhahn/trusted-platform:latest"
trusted_platform_container_name: "trusted-platform"

trusted_platform_ports:
  - "8080:8080"
  - "8443:8443"

trusted_platform_volumes:
  - "/opt/trusted-platform/trusted-data:/data"

trusted_platform_extra_args: "--debug --init"

trusted_platform_user: "tpadm"
trusted_platform_systemd_service: "/etc/systemd/system/trusted-platform.service"
