---
- name: Ensure Podman is installed
  package:
    name: podman
    state: present

- name: Create systemd service for Trusted Platform
  template:
    src: trusted-platform.service.j2
    dest: "{{ trusted_platform_systemd_service }}"
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start Trusted Platform container
  systemd:
    name: trusted-platform
    enabled: yes
    state: restarted
