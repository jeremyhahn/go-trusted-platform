---
# Namespace for the deployment
k3s_namespace: "trusted-platform"

# Image details
trusted_platform_image: "jeremyhahn/trusted-platform:latest"

# Ports for Trusted Platform Service
trusted_platform_http_port: 8080
trusted_platform_https_port: 8443

# Default arguments for the container
trusted_platform_default_args:
  - "--debug"
  - "--init"
  - "--platform-dir"
  - "/opt/trusted-platform/trusted-data"
  - "--log-dir"
  - "/opt/trusted-platform/trusted-data/log"
  - "--ca-dir"
  - "/opt/trusted-platform/trusted-data/ca"
  - "--raw-so-pin"
  - "123456"
  - "--raw-pin"
  - "123456"

# Additional user-defined arguments (can be overridden in playbook)
trusted_platform_extra_args: []
