---
- name: Apply Kubernetes Deployment for Trusted Platform
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k3s_namespace }}"
    src: "{{ role_path }}/templates/trusted-platform-deployment.yaml.j2"

- name: Apply Kubernetes Service for Trusted Platform
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k3s_namespace }}"
    src: "{{ role_path }}/templates/trusted-platform-service.yaml.j2"
