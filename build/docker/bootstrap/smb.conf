# Samba configuration for the Trusted Platform bootstrap container.

[global]
   workgroup = WORKGROUP
   server string = Trusted Platform Bootstrap
   server role = standalone server
   security = user
   map to guest = Bad User
   guest account = nobody
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/log.%m
   max log size = 50
   logging = file
   dns proxy = no

   # Allow SMB1 (NT1).
   server min protocol = NT1
   client min protocol = NT1
   ntlm auth = ntlmv1-permitted

   # Encryption disabled: some BMC stacks (Supermicro X10) only negotiate cleartext SMB.
   smb encrypt = disabled

[boot]
   comment = Trusted Platform boot media
   path = /data
   browseable = yes
   read only = yes
   guest ok = yes
   guest only = yes
   force user = nobody
   create mask = 0644
   directory mask = 0755
