# Samba configuration for the Trusted Platform bootstrap container.
#
# Anonymous read-only SMB share of /data so BMCs can mount the platform
# ISO over SMB virtual media. No authentication is configured: this
# server only ever runs on the bootstrap network and only ever exposes
# read-only boot media.

[global]
   workgroup = WORKGROUP
   server string = Trusted Platform Bootstrap
   server role = standalone server
   security = user
   map to guest = Bad User
   guest account = nobody
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/log.%m
   max log size = 50
   logging = file
   dns proxy = no

   # Allow SMB1 (NT1). Old Supermicro X10/X11 BMC firmware only speaks
   # NT1 for virtual media — when set to SMB2 the BMC reports
   # "ISO file does not exist" because the SMB protocol negotiation
   # fails before the file is even queried. NT1 is insecure on the open
   # internet but the bootstrap network is operator-controlled L2 only.
   server min protocol = NT1
   client min protocol = NT1
   ntlm auth = ntlmv1-permitted

   # Encryption disabled because some BMC stacks (Supermicro X10 in
   # particular) only negotiate cleartext SMB.
   smb encrypt = disabled

[boot]
   comment = Trusted Platform boot media
   path = /data
   browseable = yes
   read only = yes
   guest ok = yes
   guest only = yes
   force user = nobody
   create mask = 0644
   directory mask = 0755
