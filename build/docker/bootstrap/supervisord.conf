; supervisord configuration for the Trusted Platform bootstrap container.
;
; Three long-running services share PID 1:
;   - smbd  : SMB share for BMC virtual media
;   - nmbd  : NetBIOS name service (helps older BMC firmware)
;   - pxeboot : DHCP/TFTP/HTTP for PXE boot

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:smbd]
command=/usr/sbin/smbd --foreground --no-process-group --debuglevel=1 --configfile=/etc/samba/smb.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nmbd]
command=/usr/sbin/nmbd --foreground --no-process-group --debuglevel=1 --configfile=/etc/samba/smb.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=11

[program:pxeboot]
command=/usr/local/bin/pxeboot
  --manifest /data/manifest.yaml
  --config-dir /data/configs
  --kernel /data/vmlinuz
  --initrd /data/initramfs
  --interface %(ENV_BOOTSTRAP_INTERFACE)s
  --http-port %(ENV_BOOTSTRAP_HTTP_PORT)s
  --dhcp-server-ip %(ENV_BOOTSTRAP_SERVER_IP)s
  --dhcp-range-start %(ENV_BOOTSTRAP_DHCP_START)s
  --dhcp-range-end %(ENV_BOOTSTRAP_DHCP_END)s
  --dhcp-gateway %(ENV_BOOTSTRAP_GATEWAY)s
  --dhcp-dns %(ENV_BOOTSTRAP_DNS)s
  --apk-mirror %(ENV_BOOTSTRAP_APK_MIRROR)s
  --alpine-version %(ENV_BOOTSTRAP_ALPINE_VERSION)s
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
