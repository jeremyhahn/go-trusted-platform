# go-trusted-platform devcontainer: one service per shipped stage of the Dockerfile beside this file.

x-posture: &posture
  init: true
  read_only: true
  network_mode: none
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 4096
  mem_limit: 8g
  memswap_limit: 8g
  ulimits:
    memlock:
      soft: 67108864
      hard: 67108864
    core:
      soft: 1048576
      hard: 1048576
    nofile:
      soft: 65536
      hard: 65536
  working_dir: /src

services:
  integration:
    image: ${GO_TRUSTED_PLATFORM_IT_IMAGE:-go-trusted-platform-it:local}
    pull_policy: never
    # `docker compose run integration <target> <build-tags>` passes the suite runner its arguments.
    entrypoint:
      - /usr/local/bin/entrypoint.sh
      - bash
      - /workspace/build/docker/devcontainer/run-integration-tests.sh
    init: true
    privileged: true
    # The Makefile's IT_MEMORY, swap included.
    mem_limit: ${GO_TRUSTED_PLATFORM_IT_MEMORY:-16g}
    memswap_limit: ${GO_TRUSTED_PLATFORM_IT_MEMORY:-16g}
    # The Makefile's CI_CGROUP_PARENT.
    cgroup_parent: ${CI_CGROUP_PARENT-ci.slice}
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /tmp:rw,exec,mode=1777
    ulimits:
      memlock:
        soft: -1
        hard: -1
      core:
        soft: 1048576
        hard: 1048576
      nofile:
        soft: 65536
        hard: 65536
    working_dir: /workspace
    # The ISO VM fixture's APK pre-fetch cache.
    volumes:
      - iso-apk-cache:/var/cache/go-trusted-platform/iso-apk
    environment:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly -buildvcs=false
      GOPROXY: "off"
      GOWORK: "off"
      CGO_ENABLED: "1"
      CI: ${CI:-}
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
      GTP_ISO_APK_CACHE: /var/cache/go-trusted-platform/iso-apk

  toolchain:
    <<: *posture
    image: go-trusted-platform-toolchain:${GO_TRUSTED_PLATFORM_TOOLCHAIN_TAG:-latest}
    pull_policy: never
    user: "${GO_TRUSTED_PLATFORM_UID:-10001}:${GO_TRUSTED_PLATFORM_GID:-10001}"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=3g,mode=1777
    volumes:
      - ../../..:/src
      - toolchain-gocache:/gocache
      - toolchain-tmp:/var/tmp
    environment:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: "off"
      GOWORK: "off"
      HOME: /tmp

volumes:
  toolchain-gocache:
  toolchain-tmp:
  # External: created by `make integration-test`, kept across legs and runs.
  iso-apk-cache:
    external: true
    name: go-trusted-platform-iso-apk-cache
