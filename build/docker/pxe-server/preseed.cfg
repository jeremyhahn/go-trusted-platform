# Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string unassigned-hostname
d-i netcfg/get_domain string unassigned-domain

# User setup
d-i passwd/root-password password root
d-i passwd/root-password-again password root
d-i passwd/user-fullname string Trusted Admin
d-i passwd/username string user
d-i passwd/user-password password password
d-i passwd/user-password-again password password

# Partitioning - Use entire disk (guided partitioning)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/confirm boolean true
d-i partman-auto/confirm_nooverwrite boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Package installation
tasksel tasksel/first multiselect standard
d-i pkgsel/include string curl wget docker.io
d-i pkgsel/upgrade select safe-upgrade

# Bootloader installation
d-i grub-installer/bootdev string default

# Finish installation and reboot automatically
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/reboot boolean true

# Shutdown instead of reboot
#d-i debian-installer/exit/reboot boolean false
#d-i debian-installer/exit/poweroff boolean true