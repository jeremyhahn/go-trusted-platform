[supervisord]
nodaemon=true
user=root

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/apache2.log
stderr_logfile=/var/log/supervisor/apache2_error.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
logfile_backups=5

[program:isc-dhcp-server]
command=/usr/sbin/isc-dhcp-server
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/dhcp_server.log
stderr_logfile=/var/log/supervisor/dhcp_server_error.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
logfile_backups=5

[program:tftpd-hpa]
command=/usr/sbin/in.tftpd --foreground --verbose
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/tftp.log
stderr_logfile=/var/log/supervisor/tftp_error.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
logfile_backups=5
