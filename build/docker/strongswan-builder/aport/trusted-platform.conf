# Trusted Platform charon settings, installed as /etc/strongswan.d/trusted-platform.conf, which loads after and overrides the package defaults.

charon {
	# Only the plugins this package is built with.
	load = @STRONGSWAN_PLUGINS@

	# Reauthentication builds the new SAs before deleting the old ones.
	make_before_break = yes

	# IKE_SA_INIT hardening.
	cookie_threshold = 10
	init_limit_half_open = 1000

	plugins {
		# The VICI socket at its fixed path, handed to platformd's account at mode 0600.
		vici {
			socket = unix:///run/charon.vici
		}
	}
}

# swanctl reaches charon over the same socket.
swanctl {
	socket = unix:///run/charon.vici
}
