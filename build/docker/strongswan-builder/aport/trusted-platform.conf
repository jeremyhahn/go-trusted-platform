# Trusted Platform charon settings, installed as /etc/strongswan.d/trusted-platform.conf.
# strongswan.conf includes strongswan.d/*.conf in file order and a later file
# overrides an earlier one, so this file (after charon.conf and swanctl.conf)
# wins over the package defaults. Operators add their own file after this one.

charon {
	# Only the plugins this package is built with: the builder substitutes the
	# Makefile's STRONGSWAN_PLUGINS for the placeholder, and the APKBUILD fails
	# if the installed set differs. Listing them keeps a plugin dropped into the
	# plugin directory later from loading.
	load = @STRONGSWAN_PLUGINS@

	# Reauthentication builds the new IKE_SA and CHILD_SAs before it deletes
	# the old ones, so the overlay carries traffic throughout.
	make_before_break = yes

	# IKE_SA_INIT hardening. Above 10 half-open IKE_SAs charon answers with a
	# stateless cookie (RFC 7296 §2.6) before it spends any state or a key
	# exchange on the initiator; above 1000 it refuses new IKE_SA_INITs.
	cookie_threshold = 10
	init_limit_half_open = 1000

	plugins {
		# The VICI socket at its fixed path. charon creates it as root and
		# hands it to the strongswan user; /etc/init.d/charon then gives it to
		# platformd's account at mode 0600 (CHARON_VICI_USER / CHARON_VICI_GROUP).
		vici {
			socket = unix:///run/charon.vici
		}
	}
}

# swanctl reaches charon over the same socket.
swanctl {
	socket = unix:///run/charon.vici
}
