# Installed as /etc/strongswan.d/charon/pkcs11.conf (inside charon's plugins {}).
#
# The go-xkms PKCS#11 module is a Go c-shared library, which a musl process
# cannot dlopen (golang/go#13492). charon therefore loads p11-kit-client.so,
# which forwards every call over the socket named by P11_KIT_SERVER_ADDRESS
# (exported by /etc/conf.d/charon) to the p11-kit server of the module host
# (trusted-platform-p11-host), where libxkms_pkcs11.so runs under glibc.
pkcs11 {
	load = yes
	modules {
		xkms {
			path = /usr/lib/pkcs11/p11-kit-client.so
		}
	}
}
