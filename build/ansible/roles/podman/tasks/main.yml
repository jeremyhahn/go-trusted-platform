---
- name: Install required system packages
  package:
    name:
      - podman
      - python3-pip
      - python3-setuptools
      - python3-venv
      - python3-kubernetes
      - podman-compose
    state: present

- name: Ensure Podman socket is running
  systemd:
    name: podman.socket
    enabled: yes
    state: started

- name: Enable lingering for user
  command: loginctl enable-linger "{{ ansible_user_id }}"
  changed_when: false

- name: Create systemd directory for Podman
  file:
    path: "/etc/systemd/system/podman.service.d"
    state: directory
    mode: '0755'

- name: Configure Podman systemd override to run rootless
  copy:
    dest: "/etc/systemd/system/podman.service.d/override.conf"
    content: |
      [Service]
      Environment="XDG_RUNTIME_DIR=/run/user/1000"
  notify: Restart Podman

- name: Ensure Podman service is running
  systemd:
    name: podman
    enabled: yes
    state: started
    daemon_reload: yes
