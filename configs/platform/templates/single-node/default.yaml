# =============================================================================
# Single-Node Default Template
#
# Reference-architecture default for `platformctl iso create` with no flags.
# Deploys a single-box Trusted Platform running BOTH control-plane services
# (platformd server mode: CA, ACME, DNS authoritative, IAM, KMS, QuicBaaS)
# AND gateway/data-plane services (gatewayd: DHCP, firewall, NAT,
# load-balancer, tunnels, edge onboarding) collocated on one host.
#
# DEPLOYMENT PROFILE: single-node
#   All roles on one box. Non-HA. Local pebble storage. No Raft consensus.
#   Matches docs/architecture/deployment-reference.md §1.
#
# PROCESS MODEL:
#   platformd.service  - Control plane daemon (root master + deprivileged
#                        workers per binary-separation.md)
#   gatewayd.service   - Data plane daemon (CAP_NET_ADMIN, delegates OVS
#                        ops to platformd master over unix socket)
#   Both started by systemd target: trusted-platform.target
#
# TRUST MODEL: The platform CA bundle is baked into the install ISO and
#   installed to the system trust store via update-ca-certificates during
#   installation. Runtime trust bootstrap (DANE/Noise/SPKI) is intentionally
#   absent for single-node.
#
# HARDWARE: Vendor-neutral. Tested on Supermicro X10 and Dell R640;
#   should work on any x86_64 box with UEFI + TPM 2.0 (hardware or swtpm).
#
# DEPLOYER: Before using this template in production, override the following:
#   - domain, hostmaster (your domain)
#   - os.hostname (default: trusted-platform.local)
#   - network.interfaces[].name (match your NIC, default: eth0)
#   - tpm.idevid.serial (actual chassis serial)
#   - webservices[].sans (DNS SANs for TLS certs)
#   - DHCP pool (if serving DHCP to LAN devices — off by default)
# =============================================================================

debug: false
debug-secrets: false
platform-dir: /var/lib/trusted-platform
config-dir: /etc/trusted-platform
log-dir: /var/log/trusted-platform
ca-dir: /var/log/trusted-platform/ca
domain: trusted-platform.local
hostmaster: hostmaster@trusted-platform.local
tenant-id: platform
pin-seal-policy: true

secrets:
  enabled: true
  auto-generate: true
  local-kms: true
  migrate-to-kms: true
  update-config-file: true

platform:
  # Vault-style persistent auto-generation via QuicBaaS EnsureSecret.
  # First boot generates per spec (length + encoding) and persists at
  # the path; every subsequent boot returns the same stable bytes via
  # a distributed lock in the SecretsService. Paths are short-form —
  # tenant and node identifiers are implicitly prepended at resolution
  # time from platform.tenant_id and the node hostname.
  so-pin:   "kms://platform/so-pin?ensure=true&len=8&enc=numeric"
  user-pin: "kms://platform/user-pin?ensure=true&len=6&enc=numeric"


# =============================================================================
# INSTALLATION CONFIGURATION (System Manifest)
# =============================================================================

# Disk configuration for system installation
disk:
  device: ""
  partition-table: gpt
  efi-partition-size: 538
  root-filesystem: lvm
  lvm-volume-group: vg0
  lvm-logical-volume: root
  encryption:
    version: luks2
    cipher: aes-xts-plain64
    key-size: 512
    hash: sha256
    pbkdf: argon2id
    mapped-name: cryptroot
    tpm:
      enabled: true
      # DESTRUCTIVE — DEFAULT FOR REFERENCE ARCHITECTURE.
      #
      # When true, firstboot calls FactoryResetWithClear which issues a
      # TPM2_Clear via the LOCKOUT hierarchy with empty auth BEFORE
      # provisioning. This wipes any persistent objects in the owner /
      # endorsement / lockout hierarchies that may have been left behind
      # by a previous failed install run, AND resets those hierarchy auths
      # to empty. Manufacturer EK certificates in the Platform hierarchy
      # are preserved.
      #
      # The reference architecture defaults this to TRUE because:
      #   - Fresh hardware deployment is the primary use case
      #   - First-time provisioning of newly-purchased servers
      #   - Recovery from a stuck TPM after a failed previous run
      #
      # Set this to FALSE if you are re-imaging a node and need to
      # preserve known-good TPM state from a prior provisioning, or in
      # multi-tenant scenarios where another component owns the TPM.
      #
      # The Go library default is FALSE — only this template-level
      # opt-in enables the destructive behaviour.
      #
      # See: docs/installer/factory-reset.md
      factory-reset-on-firstboot: true

# Operating system configuration
os:
  os: alpine
  version: "3.22.2"
  architecture: x86_64
  hostname: trusted-platform.local
  packages:
    - bash
    - vim
    - curl
    - wget
    - htop
    - lsblk
    - parted
    - e2fsprogs
    - lvm2
    - tpm2-tools
    - dracut
    - softhsm
    - openvswitch
    - openvswitch-openrc
    - chrony
    - chrony-openrc
  kernel-modules:
    - igb
    - ixgbe
    - e1000e
    - i40e
    - ice
    - openvswitch
    - vxlan
  filesystem-type: lvm
  fips: false
  lockdown: true
  lockdown-mode: confidentiality
  tpm-auto-upgrade-seal: true
  enable-fido2: false
  ima:
    enabled: false
    policy: tcb
    hash-algorithm: sha256
    evm: false
    appraise-mode: off
    audit-enabled: true

# Network configuration for installed system
#
# Single-node default: one NIC (eth0) gets its address from upstream DHCP
# (home/office router). A single internal OVS bridge (trusted0) hosts
# local VMs and containers with an RFC1918 subnet NAT'd out eth0.
#
# Operators should override `network.interfaces[].name` to match their
# actual NIC (run `ip link` on the target host).
network:
  dns:
    nameservers:
      - 1.1.1.1
      - 1.0.0.1
    search-domains:
      - trusted-platform.local
  subnets:
    - name: trusted
      scope: internal
      cidr: 192.168.100.0/24
      gateway: 192.168.100.1
      dns:
        - 192.168.100.1
      dhcp:
        enabled: true
        range-start: 192.168.100.10
        range-end: 192.168.100.254
        lease-duration: 24h
  interfaces:
    - name: eth0
      type: dhcp
      auto-start: true
  bridges:
    - name: trusted0
      type: ovs
      auto-start: true
      stp: false
      # No uplink interface attached — bridge is host-local for VMs/containers.
      # Operators who want L2 extension to a physical port should add:
      #   interfaces: [ eth1 ]
  bonds: []
  vlans: []
  wait-online: true
  wait-timeout: 30

# UKI (Unified Kernel Image) configuration
uki:
  cmdline: "root=/dev/mapper/vg0-root ro quiet"
  kernel-path: /boot/vmlinuz-lts
  initramfs-path: /boot/initramfs-lts

# Secure Boot configuration
secure-boot:
  key-path: /boot/efi/secure-boot/db.key
  cert-path: /boot/efi/secure-boot/db.crt

# Enable TPM-based LUKS key sealing
enable-tpm-sealing: true

# PCR registers to seal LUKS keys against
# This is THE SINGLE SOURCE OF TRUTH for seal PCRs used by:
# - Installer (initial LUKS key sealing)
# - Initrd firstboot (writes to pcr-banks file)
# - Initrd boot (reads from config or pcr-banks file)
#
# Common PCRs:
#   0: BIOS/UEFI firmware
#   7: Secure Boot state
#   9: Kernel command line
#   10: Linux IMA - DON'T USE for LUKS (changes on every boot)
seal-pcrs:
  - 0
  - 7
  - 9

# FIDO2 configuration
enable-fido2-enrollment: false
fido2:
  relying-party-id: cp.example.com
  keyslot: 3
  user-presence-required: true
  timeout: 60


# =============================================================================
# DNS CONFIGURATION
# =============================================================================

dns:
  resolver:
    servers:
      - address: "127.0.0.1"
        port: 8053
    fallback:
      - "1.1.1.1:53"
      - "8.8.8.8:53"
    local-forwarder:
      enabled: false
  allow-registration: true
  allow-external-registration: true
  allow-internal-registration: true
  quicbaas:
    data-dir: /var/lib/trusted-platform/quicbaas
    storage-backend: file
    node-id: 1
    cache-size: 67108864
    log-level: warn
    consistency-level: linearizable
    request-timeout: 30s
  default-ttl: 3600
  dnssec:
    enabled: true
    default-key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
    signature-expiry: 30d
    nsec-mode: nsec3
    nsec3-iterations: 1
    nsec3-salt: ""
    ksk:
      lifetime: 365d
      ttl: 86400
    zsk:
      lifetime: 30d
      ttl: 3600
  dane:
    enabled: true
    auto-generate: true
    default-port: 8443
    ttl: 3600
    default-usage: 2
    default-selector: 1
    default-matching-type: 1
    publish-dane-ee: true
    key-reuse: true
    rollover-ttl: 0
  public:
    port: 8053
    forwarders:
      - 1.1.1.1
      - 8.8.8.8
    zone:
      description: Public zone for cp.example.com
      name: example.com.
      ttl: 3600
      records:
        soa:
          name: cp.example.com.
          mname: ns1.cp.example.com.
          rname: hostmaster.cp.example.com.
          serial: 1
          refresh: 86400
          retry: 7200
          expire: 86400
          minimum_ttl: 3600
          ttl: 3600
        # Every zone carries its NS records at the apex (RFC 1034
        # §4.2.1). The owner used to read cp.example.com., which the
        # resolver ignored back when it matched no owner names at all;
        # now that it matches them, an apex NS query needs the record
        # to actually sit at the apex.
        ns:
          - name: "@"
            value: ns1.cp.example.com.
            ttl: 3600
        a:
          - name: "@"
            value: ${PUBLIC_IPv4}
            ttl: 3600
          - name: ns1
            value: ${PUBLIC_IPv4}
            ttl: 3600
          - name: www
            value: ${PUBLIC_IPv4}
            ttl: 3600
          # The public webservice is issued CN=cp.example.com with SANs
          # cp.example.com and www.cp.example.com, but this zone's apex is
          # example.com, so the platform's own public name needs its own
          # record. Without it the name a client reads out of the
          # certificate has no answer here.
          - name: cp
            value: ${PUBLIC_IPv4}
            ttl: 3600
        cname:
          - name: www
            value: cp.example.com.
            ttl: 3600
        mx:
          - name: cp.example.com.
            value: mail.cp.example.com.
            priority: 10
            ttl: 3600
        txt:
          - name: cp.example.com.
            value: v=spf1 include:_spf.google.com ~all
            ttl: 3600
  internal:
    port: 9053
    forwarders:
      - 127.0.0.1:8053
    zone:
      description: Internal zone for example.internal
      name: example.internal.
      ttl: 3600
      internal: true
      records:
        soa:
          name: example.internal.
          mname: ns1.example.internal.
          rname: hostmaster.example.internal.
          serial: 1
          refresh: 86400
          retry: 7200
          expire: 86400
          minimum_ttl: 3600
          ttl: 3600
        ns:
          - name: example.internal.
            value: ns1.example.internal.
            ttl: 3600
        a:
          - name: "@"
            value: ${PRIVATE_IPv4}
            ttl: 3600
          - name: ns1
            value: ${PRIVATE_IPv4}
            ttl: 3600
          - name: ${HOSTNAME}
            value: ${PRIVATE_IPv4}
            ttl: 3600
          # "cp" is the control plane's role alias. The internal
          # webservice is issued CN=cp.example.internal with that as its
          # only DNS SAN, and every node's acme.client.directory targets
          # https://cp.example.internal:9443/... The ${HOSTNAME} record
          # above covers this node's own hostname, not the alias, so
          # without this record gateway and compute ACME enrolment has no
          # answer for the directory URL. Targeting the hostname instead
          # would resolve but then fail TLS against the certificate SAN.
          - name: cp
            value: ${PRIVATE_IPv4}
            ttl: 3600
        cname:
          - name: www
            value: example.internal.
            ttl: 3600


# =============================================================================
# TIME SYNCHRONIZATION (NTP)
# =============================================================================
#
# Time is a trust primitive on this platform: TPM attestation freshness, ACME
# (RFC 8555) issuance, DANE/DNSSEC signature windows, and JWT exp/nbf are all
# meaningless against a wrong clock. platformd does NOT implement NTP: chrony
# runs as a packaged OpenRC service and platformd renders chrony.conf, manages
# the service, and reads sync state from its control socket.
#
# Removing this section entirely makes platformd leave chrony alone.

ntp:
  enabled: true
  # A single node is its own control plane: it consumes public time and
  # serves the local network.
  mode: both
  consume:
    upstream:
      - address: pool.ntp.org
        pool: true
        iburst: true
        nts: false
    startup-gate:
      block-until-synced: true
      timeout: 120s
      on-timeout: warn-and-continue
    orphan-fallback: true
  serve:
    # Explicit CIDR allow-list. NEVER 0.0.0.0/0.
    listen-networks:
      - 192.168.100.0/24
    local-stratum: 10
    nts:
      enabled: true
      cert-uri: kms://platform/ntp/nts-cert
      key-uri: kms://platform/ntp/nts-key
  rtc:
    write-back: true


# =============================================================================
# ACME CLIENT CONFIGURATION
# =============================================================================

acme:
  client:
    directory: https://cp.example.internal:9443/api/v1/acme/directory
    account:
      email: hostmaster@cp.example.com
      key:
        # TPM 2.0 ECDSA
        algorithm: ECDSA
        cn: acme-account
        debug: true
        hash: SHA-256
        password: "kms://acme/account-key/password?ensure=true&len=32&enc=raw"
        platform-policy: true
        ecc:
          curve: P-256
        signature-algorithm: ECDSA-SHA256
        store: tpm2
      register: true


# =============================================================================
# TRUST CONFIGURATION (BMC Trust Bootstrap)
# =============================================================================

# BMC endpoint trust chain (Phase 3 — BMC TLS lifecycle). Each strategy is
# attempted in order; the first to succeed is used.
# This is a single-node deployment; the node serves its own public DNS on
# 127.0.0.1:8053 which is used for DANE TLSA lookups.
# tofu is NOT available for the bmc class (#83): it fetches a CA bundle and a
# BMC serves none. First contact is spki with a per-node bmc_spki_pin, until
# DANE TLSA records for <hostname>-bmc.<internal-zone> are published (bmc
# enroll does this).
trust:
  bmc:
    # BMC endpoint trust chain. First strategy to succeed wins.
    #
    # tofu is available here again. It was barred under #83 while it was a
    # CA-bundle fetch — a BMC serves Redfish, never a bundle — but
    # go-xkms#139 (v0.12.0-alpha) made the TLS path an endpoint verifier
    # that pins the leaf SPKI on first contact and enforces it afterwards,
    # with session tickets disabled so resumption cannot bypass the check.
    # Its changelog names this exact case.
    #
    # Prefer dane once TLSA records for <hostname>-bmc.<internal-zone> are
    # published (bmc enroll does this). Before that, tofu is the better
    # first-contact option than a hand-carried bmc_spki_pin: it captures and
    # PERSISTS the pin itself rather than requiring an operator to obtain
    # the fingerprint out of band.
    strategies: [dane, spki, tofu, ca-file]
    dane:
      dns-server: "127.0.0.1:8053"   # local public DNS

# =============================================================================
# DATASTORE CONFIGURATION
# =============================================================================

bmc:
  address: 198.18.0.1
  port: 623
  username: admin
  password: "kms://bmc/password?ensure=true&len=16&enc=base64"
  protocol: ipmi

# QuicBaaS runs in STANDALONE EMBEDDED MODE (non-HA reference architecture).
# storage-backend=file with node-id=1 and no join-addresses means Raft
# consensus is NOT engaged. For HA, switch to storage-backend=raft and
# populate join-addresses (see configs/platform/templates/high-availability/).
quicbaas:
  data-dir: /var/lib/trusted-platform/quicbaas
  storage-backend: file
  node-id: 1
  cache-size: 67108864
  log-level: warn
  consistency-level: linearizable
  request-timeout: 30s
  # Required for qrdb first-boot to seed IAM (system tenant, roles, admin
  # certificate). The bootstrap seeder overwrites this placeholder with the
  # deployment's platform.internal_domain.
  spiffe-trust-domain: example.internal

  # ---------------------------------------------------------------------------
  # Admin enrollment at first boot (optional; passed through to the embedded
  # server's auth.* section). Three paths, in increasing order of key hygiene:
  #
  #   A. Neither path below set — THE DEFAULT. The node generates the admin
  #      keypair and writes the certificate AND THE PRIVATE KEY under
  #      <data-dir>/admin for the operator to collect and then remove. Simple,
  #      and the only path that puts a private key on this host.
  #
  #   B. bootstrap-admin-csr-path — the admin generates their keypair
  #      off-host and supplies a PKCS#10 CSR; the platform CA signs it. The
  #      private key NEVER reaches this node, so there is nothing on disk to
  #      protect or delete afterwards.
  #
  #   C. bootstrap-admin-piv-cert-path — adopt a certificate the admin
  #      already holds, typically on a PIV card.
  #
  # bootstrap-admin-csr-path: /etc/trusted-platform/admin.csr
  # bootstrap-admin-piv-cert-path: /etc/trusted-platform/admin-piv.crt
  #
  # admin-factors is a SEPARATE concern from the paths above: it is the
  # ordered set of LOGIN factors enrolled for that administrator. A seal
  # strategy answers "how is the barrier key protected at rest"; a login
  # factor answers "how does a human prove who they are". Empty means the
  # mTLS baseline alone. Log in afterwards with
  # `platformctl auth login --method mtls|fido2|piv`.
  #
  # admin-factors: [mtls, fido2]
  # passkey-device: /dev/hidraw0   # only needed when several FIDO2 keys are attached


# =============================================================================
# SDN CONFIGURATION
# =============================================================================

sdn:
  enabled: true
  controller: true
  ovs:
    socket: /var/run/openvswitch/db.sock
    bridge: trusted0
    datapath: system
    protocols:
      - OpenFlow13
      - OpenFlow15
  ipam:
    backend: quicbaas
    pools:
      - name: trusted
        cidr: 192.168.100.0/24
        gateway: 192.168.100.1
        dns:
          - 192.168.100.1
        range-start: 192.168.100.10
        range-end: 192.168.100.254
        lease-duration: 24h
        dhcp: true
  dhcp:
    enabled: true
    interface: trusted0
  networks:
    - name: trusted
      zone: trusted
      pool: trusted
  # Physical switch fabric not used in single-node (box only sees its
  # own NICs, no managed switches). Add switches under `fabric:` only
  # when promoting this node to a multi-box deployment.
  fabric:
    mode: vlan
    switches: []
    peers: []
    # zones: built-in zones are pre-declared in the code defaults registry.
    # Override only if you need to change default policy. Example:
    #   zones:
    #     - {name: trusted, internet_ingress: false}
    #     - {name: public,  internet_ingress: true, isolate_from: [trusted]}
    segments:
      # Single-node trusted segment. No role (empty = general data
      # plane); only `provisioning` and `quarantine` are first-class
      # fabric roles. VLAN 200 is the reference-architecture default
      # for the trusted LAN (matches DefaultTrustedVLAN in pkg/sdn/vlan).
      # Override in your site override file if your LAN uses a different VLAN.
      - name: trusted
        vlan: 200
  overlay:
    enabled: false
    vxlan-port: 4789
  # Gateway data-plane services run in the separate `gatewayd` daemon
  # on the same host. This block tells platformd about the gatewayd
  # endpoint for OVS delegation. gatewayd itself is configured via
  # the `gatewayd:` top-level block below.
  gateway:
    enabled: true
    mode: edge
    endpoint: unix:///run/gatewayd.sock


# =============================================================================
# GATEWAYD CONFIGURATION
# =============================================================================
#
# gatewayd runs alongside platformd on the same host (single-node). It
# holds CAP_NET_ADMIN + CAP_NET_BIND_SERVICE and delegates OVS/flow
# operations to platformd's root master over the platformd unix socket.
#
# For a pure control-plane node (no local data plane), set
# `gatewayd.enabled: false` and gatewayd.service will not start.

gatewayd:
  enabled: true
  data-dir: /var/lib/trusted-platform/gatewayd
  log-level: info
  # REST/gRPC listen addresses — bound to localhost only by default;
  # platformctl talks to gatewayd over the unix socket.
  api:
    rest-listen: 127.0.0.1:8080
    grpc-listen: 127.0.0.1:10444
    unix-socket: /run/gatewayd.sock
  # Service enablement — flip to true as needed per deployment.
  edge:
    enabled: true
  dhcp:
    enabled: false
    # DHCP server off by default. Enable when this box should serve
    # DHCP for the `trusted` subnet to local VMs/containers.
    pools:
      - subnet: 192.168.100.0/24
        gateway: 192.168.100.1
        dns: [192.168.100.1]
        range-start: 192.168.100.100
        range-end: 192.168.100.200
        lease-duration: 24h
  firewall:
    enabled: true
    default-policy: drop
    trusted-interfaces:
      - trusted0
  nat:
    enabled: true
    # NAT the internal trusted subnet out via eth0.
    rules:
      - source: 192.168.100.0/24
        out-interface: eth0
        type: masquerade
  bgp:
    enabled: false
    # Single-node typically sits behind a consumer router. Enable
    # and populate asn + router-id + neighbors for dedicated/HA.
  load-balancer:
    enabled: false
  tunnels:
    enabled: false


# =============================================================================
# TPM CONFIGURATION
# =============================================================================

tpm:
  device: /dev/tpmrm0
  simulator: false
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  ek:
    debug: true
    handle: 0x81010001
    hash: SHA-256
    password:
    rsa:
      size: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    hierarchy-auth:
    password:
    platform-policy: false
    rsa:
      size: 2048
  iak:
    auth:
    debug: true
    hash: SHA-256
    handle: 0x81010002
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  idevid:
    model: control-plane
    serial: tp-cp-01
    cert-handle: 0x01C90000
    debug: true
    handle: 0x81020000
    hash: SHA-256
    pad: true
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  platform-pcr: 23
  platform-pcr-bank: sha256
  # Golden PCRs for platform policy (separate from seal-pcrs)
  # NOTE: PCR 10 (IMA) changes on every boot - DO NOT include for LUKS unlock!
  # PCR 10 is only suitable for post-boot application key sealing when IMA measurements are complete.
  golden-pcrs: [7, 9]
  platform-srk:
    srk-handle: 0x81000002
    srk-auth: "kms://tpm/platform-srk/srk-auth?ensure=true&len=32&enc=raw"
    platform-policy: true


# =============================================================================
# CERTIFICATE AUTHORITY CONFIGURATION
# =============================================================================

certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: false
  default-validity: 365
  default-idevid-cn: default-device-id
  sans-include-localhost: true
  require-password: true
  quantum-safe: true
  identity:
    - # Root Certificate Authority
      is-root: true
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000001
          srk-auth: "kms://ca/root/tpm2/srk-auth?ensure=true&len=32&enc=raw"
          platform-policy: true
      keys:
        # PKCS #8 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "kms://ca/root/keys/0/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: "kms://ca/root/keys/1/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "kms://ca/root/keys/2/password?ensure=true&len=32&enc=base64"
