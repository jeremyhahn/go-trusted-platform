          - ca.cp.example.com
        email:
          - hostmaster@cp.example.com


# =============================================================================
# WEBSERVICES CONFIGURATION
# =============================================================================

webservices:
  # Public webservice - external/internet facing
  - name: public
    home: /var/lib/trusted-platform/public_html
    port: 8080
    tls-port: 8443
    index: index.html
    acme:
      enabled: true
      directory: https://cp.example.com/api/v1/acme/directory
      terms-of-service: /tos.html
      challenges:
        - enroll-01
        - device-attest-01
        - dns-01
        - endorse-01
        - http-01
        - http-8080
        - http-8081
        - enroll-8080
        - enroll-8081
    rewrite:
    - pattern: "^/test.html$"
      target: /swagger/
    jwt:
      expiration: 60
      issuer: trusted-platform
    webauthn:
      display-name: Trusted Platform
      id: cp.example.com
      origins:
        - https://cp.example.com
        - https://cp.example.com:8443
    cors:
      allowed-origins:
        - https://cp.example.com
        - https://cp.example.com:8443
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
      password: "kms://webservices/0/key/password?ensure=true&len=32&enc=raw"
      platform-policy: true
      debug: true
    certificate:
      # Public webservice TLS — issued by the platform's internal ACME
      # directory via http-01 (self-referential for single-node — the
      # ACME server and client both run on this host), then cross-signed
      # by a public ACME directory so browsers trust the chain.
      # Operator owns public DNS + upstream routing; Alpine ships
      # without a host firewall so inbound :80 reaches platformd on
      # 0.0.0.0 without extra configuration.
      acme:
        challenge: http-01
        authz-type: dns
        authz-value: cp.example.com
        renew: 15
        cross-sign:
          directory: https://acme-staging-v02.api.letsencrypt.org/directory
          challenge: http-01
      subject:
        cn: cp.example.com
        organization: ACME Corporation
        country: US
        province: Florida
        locality: West Palm Beach
        address: 123 Automation Street
        postal-code: 12345
      sans:
        dns:
          - cp.example.com
          - www.cp.example.com
        email:
          - hostmaster@cp.example.com

  # Internal webservice - local network facing
  - name: internal
    home: /var/lib/trusted-platform/public_html
    port: 9080
    tls-port: 9443
    index: index.html
    acme:
      enabled: true
      directory: https://cp.example.internal:9443/api/v1/acme/directory
      terms-of-service: /tos.html
      challenges:
        - enroll-01
        - device-attest-01
        - dns-01
        - endorse-01
        - http-01
        - http-8080
        - http-8081
        - enroll-8080
        - enroll-8081
    jwt:
      expiration: 60
      issuer: trusted-platform
    cors:
      allowed-origins:
        - https://cp.example.internal
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    webauthn:
      display-name: Trusted Platform Internal
      id: cp.example.internal
      origins:
        - https://cp.example.internal
        - https://cp.example.internal:9443
    key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
      password: "kms://webservices/1/key/password?ensure=true&len=32&enc=raw"
      platform-policy: true
      debug: true
    certificate:
      subject:
        cn: cp.example.internal
        organization: ACME Corporation
        country: US
        province: Florida
        locality: West Palm Beach
        address: 123 Automation Street
        postal-code: 12345
      sans:
        dns:
          - cp.example.internal
        email:
          - hostmaster@cp.example.com
