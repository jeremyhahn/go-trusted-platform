# =============================================================================
# WEBSERVICE CONFIGURATION (Compute Worker)
# =============================================================================

webservice:
  home: /var/lib/trusted-platform/public_html
  port: 9080
  tls-port: 9443
  index: index.html
  jwt:
    expiration: 60
    issuer: compute.example.internal
  webauthn:
    display-name: Trusted Platform Compute
    id: compute.example.internal
    origins:
      - https://compute.example.internal
      - https://compute.example.internal:9443
  cors:
    allowed-origins:
      - https://compute.example.internal
      - https://compute.example.internal:9443
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
  key:
    algorithm: ECDSA
    ecc:
      curve: P-256
    signature-algorithm: ECDSA-SHA256
    hash: SHA-256
    store: software
    password: "kms://webservice/key/password?ensure=true&len=32&enc=raw"
    platform-policy: true
    debug: true
  certificate:
    # The listener serves the node's CP-ISSUED identity, not a certificate
    # this node's own CA minted. A compute node is enrolled by the
    # control-plane CA (the enterprise/privacy CA) and already proves that
    # enrolment with its IDevID, so device-attest-01 is what issues this
    # listener's operational certificate — deployment-reference.md:173,
    # "auto-enroll with control-plane CA via custom ACME extensions
    # (enroll-01, device-attest-01)".
    #
    # This matters beyond tidiness. The reporting collector verifies a node's
    # certificate against the platform anchor (pkg/trust Anchor), i.e. the
    # control-plane CA and nothing else. A locally-issued certificate cannot
    # chain there, so
    # without this the collector's mTLS fails against every node and remote
    # attestation produces no verdict at all. The bootstrap orchestrator's
    # post-install health probe verifies against the same captured CP bundle
    # and fails for the identical reason.
    acme:
      challenge: device-attest-01
    subject:
      cn: compute.example.internal
      organization: Trusted Platform
      country: US
      province: Florida
      locality: West Palm Beach
      address: 123 Automation Street
      postal-code: 12345
    sans:
      dns:
        - compute.example.com
        - compute.example.internal
      email:
        - hostmaster@compute.example.com
