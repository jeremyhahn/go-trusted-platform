# Dell PowerEdge R640 - Compute Template
# UNTESTED - Phase 2 hardware
#
# Compute / worker node with ACME enrollment and trust bootstrap
# Customize: domain, IPs, passwords, serial number, NIC names

debug: false
debug-secrets: false
platform-dir: /var/lib/trusted-platform
config-dir: /etc/trusted-platform
log-dir: /var/log/trusted-platform
ca-dir: /var/lib/trusted-platform/ca
domain: client.example.com
hostmaster: hostmaster@client.example.com
tenant-id: platform
pin-seal-policy: true

secrets:
  enabled: true
  auto-generate: true
  local-kms: true
  migrate-to-kms: true
  update-config-file: true

platform:
  so-pin: "kms://platform/so-pin?ensure=true&len=6&enc=numeric"
  user-pin: "kms://platform/user-pin?ensure=true&len=6&enc=numeric"
# =============================================================================
# INSTALLATION CONFIGURATION (System Manifest)
# =============================================================================

# Disk configuration for system installation
disk:
  device: ""
  partition-table: gpt
  efi-partition-size: 538
  root-filesystem: lvm
  lvm-volume-group: vg0
  lvm-logical-volume: root
  encryption:
    version: luks2
    cipher: aes-xts-plain64
    key-size: 512
    hash: sha256
    pbkdf: argon2id
    mapped-name: cryptroot

# Operating system configuration
os:
  os: alpine
  version: "3.22.2"
  architecture: x86_64
  hostname: client
  kernel-modules:
    - igb
    - ixgbe
    - i40e
    - ice
    - bnxt_en
    - openvswitch
    - vxlan
  packages:
    - bash
    - vim
    - curl
    - wget
    - htop
    - lsblk
    - parted
    - e2fsprogs
    - lvm2
    - tpm2-tools
    - dracut
    - openvswitch
    - openvswitch-openrc
    - chrony
    - chrony-openrc
  filesystem-type: lvm
  fips: false
  lockdown: true
  lockdown-mode: confidentiality
  tpm-auto-upgrade-seal: true
  enable-fido2: false
  ima:
    enabled: false
    policy: tcb
    hash-algorithm: sha256
    evm: false
    appraise-mode: off
    audit-enabled: true

# Network configuration for installed system
# DNS resolution: dnsmasq (127.0.0.1:53) forwards to server's internal DNS
# NOTE: upstream-servers MUST use IP address - hostname would create chicken-and-egg problem
# The ${SERVER_IP} variable should be replaced during installation with actual server IP
network:
  dns:
    nameservers:
      - 127.0.0.1
    search-domains:
      - example.internal
  dnsmasq:
    enabled: true
    upstream-servers:
      - 10.4.6.10:9053
    local-domain: example.internal
  # Host addressing by role (reference network, "Host addressing"): a
  # compute node holds its fabric VTEP, its hypervisor (live migration)
  # address and a storage address because it mounts storage, and nothing
  # else. It never forwards, its host firewall drops traffic between
  # interfaces, and its one platform-VRF address (from 10.4.144.0/20) lives
  # in a Linux VRF. It reaches the control plane through the platform VRF
  # over the overlay (#709); it holds no control-plane address.
  role: compute
  ip-forward: false
  platform-vrf:
    address: 10.4.144.20/32
  bridges:
    # br-fabric carries the physical trunk. The host's zone addresses are
    # OVS internal ports on it; the VLANs it only passes through to guests
    # get no host address.
    - name: br-fabric
      type: ovs
      interfaces:
        - bond0
      stp: false
      auto-start: true
    # br-int is the integration bridge for workload ports (VMs and
    # containers). It never carries the trunk: workloads reach the network
    # only through the overlay.
    - name: br-int
      type: ovs
      stp: false
      auto-start: true
  bonds:
    - name: bond0
      # OVS bond, created at runtime by platformd over native OVSDB (no
      # kernel bonding driver). The members are brought up as raw
      # interfaces so ovs-vswitchd can claim them.
      type: ovs
      bridge: br-fabric
      # OVS port bond_mode: balance-tcp with active LACP hashes on L4.
      mode: balance-tcp
      lacp: active
      interfaces:
        - ens2f0
        - ens2f1
      # Port class hypervisor (reference switch port model): the switch
      # trunk carries 401 and 403-408 with native VLAN 405, MTU 9216.
      vlans:
        - zone: fabric
          ipv4-address: 10.4.1.20/24
          auto-start: true
        - zone: hypervisor
          ipv4-address: 10.4.3.20/24
          auto-start: true
        - zone: storage
          ipv4-address: 10.4.7.20/24
          auto-start: true
      auto-start: true
  vlans: []
  wait-online: true
  wait-timeout: 30

# UKI (Unified Kernel Image) configuration
uki:
  cmdline: "root=/dev/mapper/vg0-root ro quiet"
  kernel-path: /boot/vmlinuz-lts
  initramfs-path: /boot/initramfs-lts

# Secure Boot key management. PK/KEK are TPM-resident (store: tpm2); the DB key
# is CP-KMS software-backed and signs the UKI + kernel modules via remote
# hash-signing (resign-mode: remote) so the DB key never leaves the server. Key
# material is referenced by kms:// URI; the KMS picks the backend from `store`.
# See docs/firmware/secure-boot.md.
secure-boot:
  enabled: true
  enforce: false
  resign-mode: remote
  pk:  { cn: "Trusted Platform Secure Boot PK",  store: tpm2,     key-uri: kms://platform/secureboot/pk,  cert-uri: kms://platform/secureboot/pk-cert }
  kek: { cn: "Trusted Platform Secure Boot KEK", store: tpm2,     key-uri: kms://platform/secureboot/kek, cert-uri: kms://platform/secureboot/kek-cert }
  db:  { cn: "Trusted Platform Secure Boot DB",  store: software, key-uri: kms://platform/secureboot/db,  cert-uri: kms://platform/secureboot/db-cert }

# Enable TPM-based LUKS key sealing
enable-tpm-sealing: true

# PCR registers to seal LUKS keys against
# This is THE SINGLE SOURCE OF TRUTH for seal PCRs used by:
# - Installer (initial LUKS key sealing)
# - Initrd firstboot (writes to pcr-banks file)
# - Initrd boot (reads from config or pcr-banks file)
#
# Common PCRs:
#   0: BIOS/UEFI firmware
#   7: Secure Boot state
#   9: Kernel command line
#   10: Linux IMA - DON'T USE for LUKS (changes on every boot)
seal-pcrs:
  - 7
  - 9

# FIDO2 configuration
enable-fido2-enrollment: false
fido2:
  relying-party-id: client.example.com
  keyslot: 3
  user-presence-required: true
  timeout: 60



# =============================================================================
# DNS CONFIGURATION
# =============================================================================

# Platform-wide DNS resolver configuration.
# Clients do not run CoreDNS but need a resolver pointing to the server's
# public DNS. All DNS consumers (bootstrap, ACME, installer) use this as the
# platform-wide default.
dns:
  resolver:
    servers:
      - address: "10.4.6.10"
        port: 8053
    search-domains:
      - example.internal
    fallback:
      - "1.1.1.1:53"
      - "8.8.8.8:53"
    local-forwarder:
      enabled: true
      listen: "127.0.0.1:53"
      cache-size: 1000


# =============================================================================
# TRUST CONFIGURATION (Trust Bootstrap)
# =============================================================================

# Client-side trust bootstrap fetches the CA certificate bundle from the server
# before TLS can be established. Each class (bootstrap, bmc) carries an
# ordered strategy chain; strategies are attempted in order until one succeeds.
# Strategies: dane, noise, spki, embedded (bootstrap class: how this node
# fetches the platform CA bundle before it has one).
# NOTE: dane.dns-server is optional when dns.resolver is configured. When
# omitted, the resolver derives the DNS server from dns.resolver.servers[0].
trust:
  bootstrap:
    strategies: [dane]
    server-url: "https://10.4.6.10:8443"
    # hostname is required for DANE when server-url uses an IP address,
    # because TLSA records are published under the hostname, not the IP.
    hostname: "cp.example.com"
    bundle-path: "/api/v1/ca/bootstrap"
    per-method-timeout: 15s
    install-to-system-trust: true
    dane:
      dns-server: "10.4.6.10:8053"

  bmc:
    # BMC endpoint trust chain (Phase 3 — BMC TLS lifecycle). First strategy
    # to succeed wins. TLSA records are published at _443._tcp.<hostname>-bmc.<internal-zone>
    # by the enroll ceremony and AutoCertManager rotation hook.
    # tofu is NOT available here (#83): it fetches a CA bundle and a BMC
    # serves none. Use a per-node bmc_spki_pin for first contact until DANE
    # TLSA records for <hostname>-bmc.<internal-zone> are published (bmc
    # enroll does this).
    strategies: [dane, spki, ca-file]
    dane:
      dns-server: "10.4.6.10:8053"

# =============================================================================
# TIME SYNCHRONIZATION (NTP)
# =============================================================================
#
# Time is a trust primitive on this platform: TPM attestation freshness, ACME
# (RFC 8555) issuance, DANE/DNSSEC signature windows, and JWT exp/nbf are all
# meaningless against a wrong clock. platformd does NOT implement NTP: chrony
# runs as a packaged OpenRC service and platformd renders chrony.conf, manages
# the service, and reads sync state from its control socket.
#
# Removing this section entirely makes platformd leave chrony alone.

ntp:
  enabled: true
  # Nodes consume time from the control plane over NTS.
  mode: consume
  consume:
    upstream:
      # The control plane by NAME, not by address. RFC 8915 key
      # establishment is a TLS handshake: chronyd verifies the NTS-KE
      # certificate against the name written here, and platform
      # certificates carry DNS SANs only — an IP address here cannot
      # validate, whatever the address is (#509).
      #
      # `cp.example.internal` resolves on every node through exactly the
      # mechanism the ACME directory URL already uses: the node's local
      # dnsmasq (127.0.0.1:53) forwards the internal zone to the control
      # plane's internal DNS server, whose zone carries the `cp` A record.
      # Nothing is written to /etc/hosts, and nothing here needs
      # re-rendering when the control plane's address changes.
      #
      # WHICH address that record publishes is a deployment decision, and
      # it matters twice over. The control plane must (a) list this same
      # name in ntp.serve.nts.server-names so its NTS-KE certificate is
      # issued with it, and (b) have a serve.listen-networks entry that
      # COVERS the address the name resolves to. Miss (b) and the node
      # completes the NTS-KE handshake and is then refused time — a
      # working-looking configuration whose clock never moves. The control
      # plane reports that mismatch on its own `ntp` health component at
      # bring-up and at every certificate renewal (nts-name-unreachable).
      #
      # The platform CA that signs the certificate is already in this
      # node's system trust store from the install ISO
      # (/usr/local/share/ca-certificates/), which is what makes the
      # handshake verify without any extra anchor.
      - address: cp.example.internal
        prefer: true
        iburst: true
        nts: true
    startup-gate:
      block-until-synced: true
      timeout: 120s
      on-timeout: warn-and-continue
  rtc:
    write-back: true


# =============================================================================
# ACME CLIENT CONFIGURATION
# =============================================================================

acme:
  client:
    directory: https://10.4.6.10:9443/api/v1/acme/directory
    # Use OS system certificate pool for CA trust.
    # The platform CA is installed to the system trust store during ISO installation
    # via /usr/local/share/ca-certificates/ and update-ca-certificates.
    # This is more secure than insecure-bootstrap which disables TLS verification.
    system-cert-pool: true
    enrollment:
      challenge: enroll-01
      ip: ${PREFERRED_IP}
    account:
      email: hostmaster@client.example.com
      key:
        # PKCS #8 RSA w/ PSS (for initial enrollment before TPM is provisioned)
        algorithm: RSA
        cn: acme-account
        debug: true
        hash: SHA-256
        password: "kms://acme/client/account/key/password?ensure=true&len=32&enc=raw"
        platform-policy: true
        rsa:
          size: 2048
        signature-algorithm: SHA256-RSAPSS
        store: software
      register: true


# =============================================================================
# DATASTORE CONFIGURATION
# =============================================================================

bmc:
  address: 10.4.2.21  # management (VLAN 402) carries BMCs only
  port: 623
  username: admin
  password: "kms://bmc/password?ensure=true&len=16&enc=base64"
  protocol: ipmi

quicbaas:
  data-dir: /var/lib/trusted-platform/quicbaas
  storage-backend: file
  node-id: 1
  cache-size: 67108864
  log-level: warn
  consistency-level: linearizable
  # Required for qrdb first-boot to seed IAM (system tenant, roles, admin
  # certificate). The bootstrap seeder overwrites this placeholder with the
  # deployment's platform.internal_domain.
  spiffe-trust-domain: example.internal


# =============================================================================
# SDN CONFIGURATION
# =============================================================================

sdn:
  enabled: true
  controller: false
  # The environment numbers every zone (docs/architecture/reference-network.md):
  # the zone at offset n is VLAN E*100+n with IPv4 10.E.n.0/24 and IPv6
  # <ula>:<VLAN digits>::/64, and overlay network n is VNI E*100000+n.
  # Block 4 is the reference example. A non-reference site overrides single
  # zones under `overrides:` (vlan, subnet, subnet6) instead of renumbering.
  environment:
    id: 4
    base: 10.0.0.0/8
    # The deployment's RFC 4193 ULA /48. Generate your own random global
    # ID; this one is the reference document's example.
    ula: fd12:3456:789a::/48
  # zones: the built-in zones (transit, fabric, management, hypervisor,
  # quarantine, provisioning, control-plane, storage, backup) need no entry.
  # An entry tunes a built-in's policy or declares an owner-defined zone at
  # an offset from 09 to 99, for example:
  #   zones:
  #     - name: lab
  #       offset: 9
  #       port_classes: [hypervisor]
  #       isolate: true
  #       allow_to: [{zone: storage, services: [storage]}]
  # A path into control-plane or management beyond the reference defaults
  # also needs privileged_access: {reason: ..., approved_by: ...}, which is
  # logged as an audit record whenever the configuration loads.
  ovs:
    socket: /var/run/openvswitch/db.sock
    # br-fabric carries the physical trunk and the host's zone addresses.
    # Workload ports live on br-int, which never carries the trunk.
    bridge: br-fabric
    datapath: system
    protocols:
      - OpenFlow13
      - OpenFlow15
  ipam:
    backend: quicbaas
    pools: []
  dhcp:
    enabled: false
  overlay:
    enabled: false
    vxlan-port: 4789
  gateway:
    enabled: false


# =============================================================================
# TPM CONFIGURATION
# =============================================================================

tpm:
  device: /dev/tpmrm0
  simulator: false
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  ek:
    debug: true
    handle: 0x81010001
    hash: SHA-256
    password:
    rsa:
      size: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    hierarchy-auth:
    password:
    platform-policy: false
    rsa:
      size: 2048
  iak:
    auth:
    debug: true
    hash: SHA-256
    handle: 0x81010002
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  idevid:
    model: r640
    serial: DELL-R640-COMPUTE-01
    cert-handle: 0x01C90000
    debug: true
    handle: 0x81020000
    hash: SHA-256
    pad: true
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  platform-pcr: 23
  platform-pcr-bank: sha256
  # Golden PCRs for platform policy (separate from seal-pcrs)
  # NOTE: PCR 10 (IMA) changes on every boot - DO NOT include for LUKS unlock!
  golden-pcrs: [7, 9]
  platform-srk:
    srk-handle: 0x81000002
    srk-auth: "kms://tpm/platform-srk/srk-auth?ensure=true&len=32&enc=raw"
    platform-policy: true


# =============================================================================
# CERTIFICATE AUTHORITY CONFIGURATION
# =============================================================================

certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: true
  default-validity: 365
  default-idevid-cn: default-device-id
  sans-include-localhost: true
  require-password: true
  quantum-safe: true
  identity:
    - # Root Certificate Authority
      is-root: true
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000003
          srk-auth: "kms://certificate-authority/identity/keystores/tpm2/srk-auth?ensure=true&len=32&enc=raw"
          platform-policy: true
      keys:
        # PKCS #8 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "kms://certificate-authority/identity/keys/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 RSA
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: "kms://certificate-authority/identity/keys/password/1?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "kms://certificate-authority/identity/keys/password/2?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: "kms://certificate-authority/identity/keys/password/3?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 Ed25519
        - algorithm: Ed25519
          ecc:
            curve: P-256
          signature-algorithm: Ed25519
          hash: SHA-256
          store: software
          password: "kms://certificate-authority/identity/keys/password/4?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

      valid: 50
      subject:
        cn: root-ca.client.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - root-ca.client.example.com
        email:
          - hostmaster@client.example.com

    - # Intermediate Certificate Authority
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000004
          srk-auth: "kms://certificate-authority/identity/keystores/tpm2/srk-auth/1?ensure=true&len=32&enc=raw"
          platform-policy: true
      keys:
        - # PKCS #8 RSA
          algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "kms://certificate-authority/identity/keys/password/5?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 RSA
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: "kms://certificate-authority/identity/keys/password/6?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "kms://certificate-authority/identity/keys/password/7?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: "kms://certificate-authority/identity/keys/password/8?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 Ed25519
        - algorithm: Ed25519
          ecc:
            curve: P-256
          signature-algorithm: Ed25519
          hash: SHA-256
          store: software
          password: "kms://certificate-authority/identity/keys/password/9?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true
      valid: 10
      subject:
        cn: ca01.client.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - ca01.client.example.com
        email:
          - hostmaster@client.example.com


# =============================================================================
# WEBSERVICE CONFIGURATION (Client-side, minimal)
# =============================================================================

webservice:
  home: /var/lib/trusted-platform/public_html
  port: 9080
  tls-port: 9443
  index: index.html
  jwt:
    expiration: 60
    issuer: client.example.internal
  webauthn:
    display-name: Trusted Platform Client
    id: client.example.internal
    origins:
      - https://client.example.internal
      - https://client.example.internal:9443
      - https://localhost
      - https://localhost:9443
  cors:
    allowed-origins:
      - https://client.example.internal
      - https://client.example.internal:9443
      - https://localhost
      - https://localhost:9443
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
  key:
    algorithm: ECDSA
    ecc:
      curve: P-256
    signature-algorithm: ECDSA-SHA256
    hash: SHA-256
    store: software
    password: "kms://webservice/key/password?ensure=true&len=32&enc=raw"
    platform-policy: true
    debug: true
  certificate:
    subject:
      cn: client.example.internal
      organization: Trusted Platform
      country: US
      province: Florida
      locality: West Palm Beach
      address: 123 Automation Street
      postal-code: 12345
    sans:
      dns:
        - client.example.com
        - client.example.internal
      email:
        - hostmaster@client.example.com


# =============================================================================
# PASSWORD HASHING (Argon2)
# =============================================================================

argon2:
  memory: 65536
  iterations: 3
  parallelism: 2
  saltLen: 16
  keyLen: 32
