# Dell PowerEdge R640 - Control Plane Template
# UNTESTED - Phase 2 hardware
#
# Certificate authority, DNS, ACME, and platform services
# Customize: domain, IPs, passwords, serial number, NIC names

debug: false
debug-secrets: false
platform-dir: /var/lib/trusted-platform
config-dir: /etc/trusted-platform
log-dir: /var/log/trusted-platform
ca-dir: /var/log/trusted-platform/ca
domain: cp.example.com
hostmaster: hostmaster@cp.example.com
tenant-id: platform
pin-seal-policy: true

secrets:
  enabled: true
  auto-generate: true
  local-kms: true
  migrate-to-kms: true
  update-config-file: true

platform:
  so-pin: "kms://platform/so-pin?ensure=true&len=6&enc=numeric"
  user-pin: "kms://platform/user-pin?ensure=true&len=6&enc=numeric"
# =============================================================================
# INSTALLATION CONFIGURATION (System Manifest)
# =============================================================================

# Disk configuration for system installation
disk:
  device: ""
  partition-table: gpt
  efi-partition-size: 538
  root-filesystem: lvm
  lvm-volume-group: vg0
  lvm-logical-volume: root
  encryption:
    version: luks2
    cipher: aes-xts-plain64
    key-size: 512
    hash: sha256
    pbkdf: argon2id
    mapped-name: cryptroot

# Operating system configuration
os:
  os: alpine
  version: "3.22.2"
  architecture: x86_64
  hostname: server
  kernel-modules:
    - igb
    - ixgbe
    - i40e
    - ice
    - bnxt_en
    - openvswitch
    - vxlan
  packages:
    - bash
    - vim
    - curl
    - wget
    - htop
    - lsblk
    - parted
    - e2fsprogs
    - lvm2
    - tpm2-tools
    - dracut
    - softhsm
    - openvswitch
    - openvswitch-openrc
  filesystem-type: lvm
  fips: false
  lockdown: true
  lockdown-mode: confidentiality
  tpm-auto-upgrade-seal: true
  enable-fido2: false
  ima:
    enabled: false
    policy: tcb
    hash-algorithm: sha256
    evm: false
    appraise-mode: off
    audit-enabled: true

# Network configuration for installed system
network:
  dns:
    nameservers:
      - 198.18.0.1
    search-domains: []
  interfaces:
    - name: eno1
      type: static
      ipv4-address: 198.18.0.1/24
      auto-start: true
  bridges:
    - name: trusted0
      members:
        - ens2f0
  bonds: []
  vlans: []
  wait-online: true
  wait-timeout: 30

# UKI (Unified Kernel Image) configuration
uki:
  cmdline: "root=/dev/mapper/vg0-root ro quiet"
  kernel-path: /boot/vmlinuz-lts
  initramfs-path: /boot/initramfs-lts

# Secure Boot configuration
secure-boot:
  key-path: /boot/efi/secure-boot/db.key
  cert-path: /boot/efi/secure-boot/db.crt

# Enable TPM-based LUKS key sealing
enable-tpm-sealing: true

# PCR registers to seal LUKS keys against
# This is THE SINGLE SOURCE OF TRUTH for seal PCRs used by:
# - Installer (initial LUKS key sealing)
# - Initrd firstboot (writes to pcr-banks file)
# - Initrd boot (reads from config or pcr-banks file)
#
# Common PCRs:
#   0: BIOS/UEFI firmware
#   7: Secure Boot state
#   9: Kernel command line
#   10: Linux IMA - DON'T USE for LUKS (changes on every boot)
seal-pcrs:
  - 0
  - 7
  - 9

# FIDO2 configuration
enable-fido2-enrollment: false
fido2:
  relying-party-id: cp.example.com
  keyslot: 3
  user-presence-required: true
  timeout: 60


# =============================================================================
# ACME CLIENT CONFIGURATION
# =============================================================================

acme:
  client:
    directory: https://cp.example.internal:9443/api/v1/acme/directory
    account:
      email: hostmaster@cp.example.com
      key:
        # TPM 2.0 ECDSA
        algorithm: ECDSA
        cn: acme-account
        debug: true
        hash: SHA-256
        password: "kms://acme/client/account/key/password?ensure=true&len=32&enc=base64"
        platform-policy: true
        ecc:
          curve: P-256
        signature-algorithm: ECDSA-SHA256
        store: tpm2
      register: true


# =============================================================================
# DNS CONFIGURATION
# =============================================================================

dns:
  resolver:
    servers:
      - address: "127.0.0.1"
        port: 8053
    fallback:
      - "1.1.1.1:53"
      - "8.8.8.8:53"
    local-forwarder:
      enabled: false
  allow-registration: true
  allow-external-registration: true
  allow-internal-registration: true
  quicbaas:
    data-dir: /var/lib/trusted-platform/quicbaas
    storage-backend: file
    node-id: 1
    cache-size: 67108864
    log-level: warn
    consistency-level: linearizable
    request-timeout: 30s
  default-ttl: 3600
  dnssec:
    enabled: true  # Uses QuicBaaS KMS for DNSSEC key management
    default-key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
    signature-expiry: 30d
    nsec-mode: nsec3
    nsec3-iterations: 1
    nsec3-salt: ""
    ksk:
      lifetime: 365d
      ttl: 86400
    zsk:
      lifetime: 30d
      ttl: 3600
  dane:
    enabled: true
    auto-generate: true
    default-port: 8443
    ttl: 3600
    default-usage: 2
    default-selector: 1
    default-matching-type: 1
    publish-dane-ee: true
    key-reuse: true
    rollover-ttl: 0
  public:
    port: 8053
    forwarders:
      - 1.1.1.1
      - 8.8.8.8
    zone:
      description: Public zone for cp.example.com
      name: example.com.
      ttl: 3600
      records:
        soa:
          name: cp.example.com.
          mname: ns1.cp.example.com.
          rname: hostmaster.cp.example.com.
          serial: 1
          refresh: 86400
          retry: 7200
          expire: 86400
          minimum_ttl: 3600
          ttl: 3600
        ns:
          - name: cp.example.com.
            value: ns1.cp.example.com.
            ttl: 3600
        a:
          - name: "@"
            value: ${PUBLIC_IPv4}
            ttl: 3600
          - name: ns1
            value: ${PUBLIC_IPv4}
            ttl: 3600
          - name: www
            value: ${PUBLIC_IPv4}
            ttl: 3600
        cname:
          - name: www
            value: cp.example.com.
            ttl: 3600
        mx:
          - name: cp.example.com.
            value: mail.cp.example.com.
            priority: 10
            ttl: 3600
        txt:
          - name: cp.example.com.
            value: v=spf1 include:_spf.google.com ~all
            ttl: 3600
  internal:
    port: 9053
    forwarders:
      - 127.0.0.1:8053
    zone:
      description: Internal zone for example.internal
      name: example.internal.
      ttl: 3600
      internal: true
      records:
        soa:
          name: example.internal.
          mname: ns1.example.internal.
          rname: hostmaster.example.internal.
          serial: 1
          refresh: 86400
          retry: 7200
          expire: 86400
          minimum_ttl: 3600
          ttl: 3600
        ns:
          - name: example.internal.
            value: ns1.example.internal.
            ttl: 3600
        a:
          - name: "@"
            value: ${PRIVATE_IPv4}
            ttl: 3600
          - name: ns1
            value: ${PRIVATE_IPv4}
            ttl: 3600
          - name: ${HOSTNAME}
            value: ${PRIVATE_IPv4}
            ttl: 3600
        cname:
          - name: www
            value: example.internal.
            ttl: 3600



# =============================================================================
# DATASTORE CONFIGURATION
# =============================================================================


# =============================================================================
# BOOTSTRAP CONFIGURATION
# =============================================================================

bootstrap:
  noise:
    enabled: false
    listen-addr: ":9446"
    max-connections: 100
    read-timeout: 10s
    write-timeout: 10s

bmc:
  address: 198.18.0.1
  port: 623
  username: admin
  password: "kms://bmc/password?ensure=true&len=16&enc=base64"
  protocol: ipmi

quicbaas:
  data-dir: /var/lib/trusted-platform/quicbaas
  storage-backend: file
  node-id: 1
  cache-size: 67108864
  log-level: warn
  consistency-level: linearizable
  request-timeout: 30s


# =============================================================================
# SDN CONFIGURATION
# =============================================================================

sdn:
  enabled: true
  controller: true
  ovs:
    socket: /var/run/openvswitch/db.sock
    bridge: trusted0
    datapath: system
    protocols:
      - OpenFlow13
      - OpenFlow15
  ipam:
    backend: quicbaas
    pools:
      - name: production
        cidr: 198.18.0.0/24
        gateway: 198.18.0.1
        dns:
          - 198.18.0.1
        range-start: 198.18.0.10
        range-end: 198.18.0.254
        lease-duration: 24h
        dhcp: true
      - name: provisioning
        cidr: 172.16.201.0/24
        gateway: 172.16.201.1
        dns:
          - 172.16.201.1
        range-start: 172.16.201.50
        range-end: 172.16.201.254
        lease-duration: 1h
        dhcp: true
      - name: quarantine
        cidr: 172.16.202.0/24
        gateway: 172.16.202.1
        dns:
          - 172.16.202.1
        range-start: 172.16.202.50
        range-end: 172.16.202.254
        lease-duration: 1h
        dhcp: false
      - name: storage
        cidr: 172.16.203.0/24
        gateway: 172.16.203.1
        dns:
          - 172.16.203.1
        range-start: 172.16.203.10
        range-end: 172.16.203.254
        lease-duration: 24h
        dhcp: true
      - name: dmz-public
        cidr: 172.16.210.0/24
        gateway: 172.16.210.1
        range-start: 172.16.210.10
        range-end: 172.16.210.254
        lease-duration: 24h
        dhcp: false
      - name: dmz-private
        cidr: 172.16.211.0/24
        gateway: 172.16.211.1
        range-start: 172.16.211.10
        range-end: 172.16.211.254
        lease-duration: 24h
        dhcp: false
      - name: dmz-data
        cidr: 172.16.212.0/24
        gateway: 172.16.212.1
        range-start: 172.16.212.10
        range-end: 172.16.212.254
        lease-duration: 24h
        dhcp: false
  dhcp:
    enabled: true
    interface: trusted0
  networks:
    production:
      vlan: 200
      pool: production
    provisioning:
      vlan: 201
      pool: provisioning
    quarantine:
      vlan: 202
      pool: quarantine
    storage:
      vlan: 203
      pool: storage
    dmz-public:
      vlan: 210
      pool: dmz-public
    dmz-private:
      vlan: 211
      pool: dmz-private
    dmz-data:
      vlan: 212
      pool: dmz-data
  overlay:
    enabled: false
    vxlan-port: 4789
  gateway:
    enabled: false


# =============================================================================
# TPM CONFIGURATION
# =============================================================================

tpm:
  device: /dev/tpmrm0
  simulator: false
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  ek:
    debug: true
    handle: 0x81010001
    hash: SHA-256
    password:
    rsa:
      size: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    hierarchy-auth:
    password:
    platform-policy: false
    rsa:
      size: 2048
  iak:
    auth:
    debug: true
    hash: SHA-256
    handle: 0x81010002
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  idevid:
    model: r640
    serial: DELL-R640-CP-01
    cert-handle: 0x01C90000
    debug: true
    handle: 0x81020000
    hash: SHA-256
    pad: true
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  platform-pcr: 23
  platform-pcr-bank: sha256
  # Golden PCRs for platform policy (separate from seal-pcrs)
  # NOTE: PCR 10 (IMA) changes on every boot - DO NOT include for LUKS unlock!
  # PCR 10 is only suitable for post-boot application key sealing when IMA measurements are complete.
  golden-pcrs: [7, 9]
  platform-srk:
    srk-handle: 0x81000002
    srk-auth: "kms://tpm/platform-srk/srk-auth?ensure=true&len=32&enc=base64"
    platform-policy: true


# =============================================================================
# CERTIFICATE AUTHORITY CONFIGURATION
# =============================================================================

certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: false
  default-validity: 365
  default-idevid-cn: default-device-id
  sans-include-localhost: true
  require-password: true
  quantum-safe: true
  identity:
    - # Root Certificate Authority
      is-root: true
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000001
          srk-auth: "kms://certificate-authority/identity/keystores/tpm2/srk-auth?ensure=true&len=32&enc=base64"
          platform-policy: true
      keys:
        # PKCS #8 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "kms://certificate-authority/identity/keys/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: "kms://certificate-authority/identity/keys/password/1?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "kms://certificate-authority/identity/keys/password/2?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: "kms://certificate-authority/identity/keys/password/3?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 Ed25519
        - algorithm: Ed25519
          ecc:
            curve: P-256
          signature-algorithm: Ed25519
          hash: SHA-256
          store: software
          password: "kms://certificate-authority/identity/keys/password/4?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

      valid: 50
      subject:
        cn: root-ca.cp.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - root-ca.cp.example.com
        email:
          - hostmaster@cp.example.com

    - # Intermediate Certificate Authority
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000001
          srk-auth: "kms://certificate-authority/identity/keystores/tpm2/srk-auth/1?ensure=true&len=32&enc=base64"
          platform-policy: true
      keys:
        - # PKCS #8 RSA w/ PSS
          algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "kms://certificate-authority/identity/keys/password/5?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: "kms://certificate-authority/identity/keys/password/6?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "kms://certificate-authority/identity/keys/password/7?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: "kms://certificate-authority/identity/keys/password/8?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 Ed25519
        - algorithm: Ed25519
          ecc:
            curve: P-256
          signature-algorithm: Ed25519
          hash: SHA-256
          store: software
          password: "kms://certificate-authority/identity/keys/password/9?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true
      valid: 10
      subject:
        cn: ca01.cp.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - ca01.cp.example.com
          - ca.cp.example.com
        email:
          - hostmaster@cp.example.com


# =============================================================================
# WEBSERVICES CONFIGURATION
# =============================================================================

webservices:
  # Public webservice - external/internet facing
  - name: public
    home: /var/lib/trusted-platform/public_html
    port: 8080
    tls-port: 8443
    index: index.html
    acme:
      enabled: true
      directory: https://cp.example.com/api/v1/acme/directory
      terms-of-service: /tos.html
      challenges:
        - enroll-01
        - device-attest-01
        - dns-01
        - endorse-01
        - http-01
        - http-8080
        - http-8081
        - enroll-8080
        - enroll-8081
    rewrite:
    - pattern: "^/test.html$"
      target: /swagger/
    jwt:
      expiration: 525960
      issuer: trusted-platform
    webauthn:
      display-name: Trusted Platform
      id: cp.example.com
      origins:
        - https://cp.example.com
        - https://cp.example.com:8443
        - http://cp.example.com
        - http://cp.example.com:8080
        - https://localhost
        - https://localhost:8443
        - http://localhost
        - http://localhost:8080
        - http://localhost:3000
    cors:
      allowed-origins:
        - https://cp.example.com
        - https://cp.example.com:8443
        - http://cp.example.com
        - http://cp.example.com:8080
        - https://localhost
        - https://localhost:8443
        - http://localhost
        - http://localhost:8080
        - http://localhost:3000
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
      password: "kms://webservices/key/password?ensure=true&len=32&enc=base64"
      platform-policy: true
      debug: true
    certificate:
      acme:
        challenge: http-01
        renew: 15
      subject:
        cn: cp.example.com
        organization: ACME Corporation
        country: US
        province: Florida
        locality: West Palm Beach
        address: 123 Automation Street
        postal-code: 12345
      sans:
        dns:
          - cp.example.com
          - www.cp.example.com
        email:
          - hostmaster@cp.example.com

  # Internal webservice - local network facing
  - name: internal
    home: /var/lib/trusted-platform/public_html
    port: 9080
    tls-port: 9443
    index: index.html
    acme:
      enabled: true
      directory: https://cp.example.internal:9443/api/v1/acme/directory
      terms-of-service: /tos.html
      challenges:
        - enroll-01
        - device-attest-01
        - dns-01
        - endorse-01
        - http-01
        - http-8080
        - http-8081
        - enroll-8080
        - enroll-8081
    jwt:
      expiration: 525960
      issuer: trusted-platform
    cors:
      allowed-origins:
        - https://cp.example.internal
        - http://cp.example.internal
        - https://localhost
        - http://localhost
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    webauthn:
      display-name: Trusted Platform Internal
      id: cp.example.internal
      origins:
        - https://cp.example.internal
        - https://cp.example.internal:9443
        - http://cp.example.internal
        - http://cp.example.internal:9080
        - https://localhost
        - https://localhost:9443
        - http://localhost
        - http://localhost:9080
    key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
      password: "kms://webservices/key/password/1?ensure=true&len=32&enc=base64"
      platform-policy: true
      debug: true
    certificate:
      subject:
        cn: cp.example.internal
        organization: ACME Corporation
        country: US
        province: Florida
        locality: West Palm Beach
        address: 123 Automation Street
        postal-code: 12345
      sans:
        dns:
          - cp.example.internal
        email:
          - hostmaster@cp.example.com


# =============================================================================
# PASSWORD HASHING (Argon2)
# =============================================================================

argon2:
  memory: 65536
  iterations: 3
  parallelism: 2
  saltLen: 16
  keyLen: 32
