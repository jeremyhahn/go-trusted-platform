# Dell PowerEdge R640 - Gateway Template
# UNTESTED - Phase 2 hardware
#
# TLS termination, reverse proxy, and load balancing
# Customize: domain, IPs, passwords, serial number, NIC names

debug: false
debug-secrets: false
platform-dir: /var/lib/trusted-platform
config-dir: /etc/trusted-platform
log-dir: /var/log/trusted-platform
ca-dir: /var/lib/trusted-platform/ca
domain: gw.example.com
hostmaster: hostmaster@gw.example.com
tenant-id: platform
pin-seal-policy: true

secrets:
  enabled: true
  auto-generate: true
  local-kms: true
  migrate-to-kms: true
  update-config-file: true

platform:
  so-pin: "kms://platform/so-pin?ensure=true&len=6&enc=numeric"
  user-pin: "kms://platform/user-pin?ensure=true&len=6&enc=numeric"
# =============================================================================
# INSTALLATION CONFIGURATION (System Manifest)
# =============================================================================

# Disk configuration for system installation
disk:
  device: ""
  partition-table: gpt
  efi-partition-size: 538
  root-filesystem: lvm
  lvm-volume-group: vg0
  lvm-logical-volume: root
  encryption:
    version: luks2
    cipher: aes-xts-plain64
    key-size: 512
    hash: sha256
    pbkdf: argon2id
    mapped-name: cryptroot

# Operating system configuration
os:
  os: alpine
  version: "3.22.2"
  architecture: x86_64
  hostname: gateway
  kernel-modules:
    - igb
    - ixgbe
    - i40e
    - ice
    - bnxt_en
    - openvswitch
    - vxlan
  packages:
    - bash
    - vim
    - curl
    - wget
    - htop
    - lsblk
    - parted
    - e2fsprogs
    - lvm2
    - tpm2-tools
    - dracut
    - openvswitch
    - openvswitch-openrc
    - chrony
    - chrony-openrc
    # The NAT64 kernel translator gateway.nat64 drives (#603). The module
    # follows linux-lts: a kernel upgrade that outruns jool-modules-lts
    # leaves it unloadable, and gatewayd refuses the nat64: section.
    - jool-modules-lts
    - jool-tools
    - jool-tools-openrc
  filesystem-type: lvm
  fips: false
  lockdown: true
  lockdown-mode: confidentiality
  tpm-auto-upgrade-seal: true
  enable-fido2: false
  ima:
    enabled: false
    policy: tcb
    hash-algorithm: sha256
    evm: false
    appraise-mode: off
    audit-enabled: true

# Network configuration for installed system
network:
  dns:
    nameservers:
      - 127.0.0.1
    search-domains:
      - example.internal
  dnsmasq:
    enabled: true
    upstream-servers:
      - 10.4.6.10:9053
    local-domain: example.internal
  # Host addressing by role (reference network, "Host addressing"): a
  # gateway routes and NATs by role, so it is exempt from the forwarding
  # and addressing rules. It holds node address .2 on every zone it routes
  # (transit, fabric, quarantine, provisioning, control-plane, backup) and
  # answers for the zones' gateway address .1 until a second gateway makes
  # .1 a VRRP address. Its platform-VRF address lives in a Linux VRF.
  role: gateway
  ip-forward: true
  platform-vrf:
    address: 10.4.144.2/32
  bridges:
    # br-fabric carries the physical trunk. The host's zone addresses are
    # OVS internal ports on it; the VLANs it only passes through to guests
    # get no host address.
    - name: br-fabric
      type: ovs
      interfaces:
        - bond0
      stp: false
      auto-start: true
  bonds:
    - name: bond0
      # OVS bond, created at runtime by platformd over native OVSDB (no
      # kernel bonding driver). The members are brought up as raw
      # interfaces so ovs-vswitchd can claim them.
      type: ovs
      bridge: br-fabric
      # OVS port bond_mode: balance-tcp with active LACP hashes on L4.
      mode: balance-tcp
      lacp: active
      interfaces:
        - ens2f0
        - ens2f1
      # Port class gateway (reference switch port model): the switch trunk
      # carries 400, 401, 404-406 and 408, tagged only, MTU 9216.
      vlans:
        - zone: transit
          ipv4-address: 10.4.0.2/24
          auto-start: true
        - zone: fabric
          ipv4-address: 10.4.1.2/24
          auto-start: true
        - zone: quarantine
          ipv4-address: 10.4.4.2/24
          auto-start: true
        - zone: provisioning
          ipv4-address: 192.0.2.2/24
          auto-start: true
        - zone: control-plane
          ipv4-address: 10.4.6.2/24
          auto-start: true
        - zone: backup
          ipv4-address: 10.4.8.2/24
          auto-start: true
      auto-start: true
  # The onboard 1G ports (eno1, eno2) are the WAN uplinks; gatewayd owns
  # their addresses, so the installer leaves them unconfigured here.
  vlans: []
  wait-online: true
  wait-timeout: 30

# UKI (Unified Kernel Image) configuration
uki:
  cmdline: "root=/dev/mapper/vg0-root ro quiet"
  kernel-path: /boot/vmlinuz-lts
  initramfs-path: /boot/initramfs-lts

# Secure Boot key management. PK/KEK are TPM-resident (store: tpm2); the DB key
# is CP-KMS software-backed and signs the UKI + kernel modules via remote
# hash-signing (resign-mode: remote) so the DB key never leaves the server. Key
# material is referenced by kms:// URI; the KMS picks the backend from `store`.
# See docs/firmware/secure-boot.md.
secure-boot:
  enabled: true
  enforce: false
  resign-mode: remote
  pk:  { cn: "Trusted Platform Secure Boot PK",  store: tpm2,     key-uri: kms://platform/secureboot/pk,  cert-uri: kms://platform/secureboot/pk-cert }
  kek: { cn: "Trusted Platform Secure Boot KEK", store: tpm2,     key-uri: kms://platform/secureboot/kek, cert-uri: kms://platform/secureboot/kek-cert }
  db:  { cn: "Trusted Platform Secure Boot DB",  store: software, key-uri: kms://platform/secureboot/db,  cert-uri: kms://platform/secureboot/db-cert }

# Enable TPM-based LUKS key sealing
enable-tpm-sealing: true

# PCR registers to seal LUKS keys against
seal-pcrs:
  - 7
  - 9

# FIDO2 configuration
enable-fido2-enrollment: false
fido2:
  relying-party-id: gw.example.com
  keyslot: 3
  user-presence-required: true
  timeout: 60


# =============================================================================
# TIME SYNCHRONIZATION (NTP)
# =============================================================================
#
# Time is a trust primitive on this platform: TPM attestation freshness, ACME
# (RFC 8555) issuance, DANE/DNSSEC signature windows, and JWT exp/nbf are all
# meaningless against a wrong clock. platformd does NOT implement NTP: chrony
# runs as a packaged OpenRC service and platformd renders chrony.conf, manages
# the service, and reads sync state from its control socket.
#
# Removing this section entirely makes platformd leave chrony alone.

ntp:
  enabled: true
  # Nodes consume time from the control plane over NTS.
  mode: consume
  consume:
    upstream:
      # The control plane by NAME, not by address. RFC 8915 key
      # establishment is a TLS handshake: chronyd verifies the NTS-KE
      # certificate against the name written here, and platform
      # certificates carry DNS SANs only — an IP address here cannot
      # validate, whatever the address is (#509).
      #
      # `cp.example.internal` resolves on every node through exactly the
      # mechanism the ACME directory URL already uses: the node's local
      # dnsmasq (127.0.0.1:53) forwards the internal zone to the control
      # plane's internal DNS server, whose zone carries the `cp` A record.
      # Nothing is written to /etc/hosts, and nothing here needs
      # re-rendering when the control plane's address changes.
      #
      # WHICH address that record publishes is a deployment decision, and
      # it matters twice over. The control plane must (a) list this same
      # name in ntp.serve.nts.server-names so its NTS-KE certificate is
      # issued with it, and (b) have a serve.listen-networks entry that
      # COVERS the address the name resolves to. Miss (b) and the node
      # completes the NTS-KE handshake and is then refused time — a
      # working-looking configuration whose clock never moves. The control
      # plane reports that mismatch on its own `ntp` health component at
      # bring-up and at every certificate renewal (nts-name-unreachable).
      #
      # The platform CA that signs the certificate is already in this
      # node's system trust store from the install ISO
      # (/usr/local/share/ca-certificates/), which is what makes the
      # handshake verify without any extra anchor.
      - address: cp.example.internal
        prefer: true
        iburst: true
        nts: true
    startup-gate:
      block-until-synced: true
      timeout: 120s
      on-timeout: warn-and-continue
  rtc:
    write-back: true


# =============================================================================
# ACME CLIENT CONFIGURATION
# =============================================================================

acme:
  client:
    directory: https://cp.example.internal:9443/api/v1/acme/directory
    system-cert-pool: true
    enrollment:
      challenge: enroll-01
      ip: ${PREFERRED_IP}
    account:
      email: hostmaster@gw.example.com
      key:
        algorithm: RSA
        cn: acme-account
        debug: true
        hash: SHA-256
        password: "kms://acme/client/account/key/password?ensure=true&len=32&enc=raw"
        platform-policy: true
        rsa:
          size: 2048
        signature-algorithm: SHA256-RSAPSS
        store: software
      register: true


# =============================================================================
# PLATFORM CA (gatewayd's platform anchor)
# =============================================================================

# The platform CA bundle, delivered by provisioning. Every platform service
# gatewayd talks to -- the platform secret store behind every kms://
# reference in this file, platformd over grpc, the proxy's mTLS
# callers, the control-plane reporter -- presents a certificate the platform
# CA issued and is verified against this bundle. gatewayd runs no CA of its
# own, so this file is its whole platform trust: not a strategy choice, and
# nothing else to configure. Without it the secret store refuses to
# assemble (secrets.ErrTrustRequired) and gatewayd does not start.
platform-ca-file: /etc/gatewayd/cp-ca.pem

# =============================================================================
# TRUST CONFIGURATION (BMC Trust Bootstrap)
# =============================================================================

# Verification policy for what the platform CA did NOT issue: BMC endpoints
# (Phase 3 -- BMC TLS lifecycle). Each strategy is attempted in order; the
# first to succeed is used.
trust:
  bmc:
    # BMC endpoint trust chain. First strategy to succeed wins.
    #
    # tofu is available here again. It was barred under #83 while it was a
    # CA-bundle fetch — a BMC serves Redfish, never a bundle — but
    # go-xkms#139 (v0.12.0-alpha) made the TLS path an endpoint verifier
    # that pins the leaf SPKI on first contact and enforces it afterwards,
    # with session tickets disabled so resumption cannot bypass the check.
    # Its changelog names this exact case.
    #
    # Prefer dane once TLSA records for <hostname>-bmc.<internal-zone> are
    # published (bmc enroll does this). Before that, tofu is the better
    # first-contact option than a hand-carried bmc_spki_pin: it captures and
    # PERSISTS the pin itself rather than requiring an operator to obtain
    # the fingerprint out of band.
    strategies: [dane, spki, tofu, ca-file]
    dane:
      dns-server: "10.4.6.10:8053"   # CP public DNS

# =============================================================================
# DATASTORE CONFIGURATION
# =============================================================================

bmc:
  address: 198.51.100.150  # management (VLAN 402) carries BMCs only
  port: 623
  username: admin
  password: "kms://bmc/password?ensure=true&len=16&enc=base64"
  protocol: ipmi

quicbaas:
  storage-backend: pebble
  data-dir: /var/lib/trusted-platform/quicbaas
  node-id: 1
  cache-size: 67108864
  log-level: warn
  consistency-level: linearizable
  # Required for qrdb first-boot to seed IAM (system tenant, roles, admin
  # certificate). The bootstrap seeder overwrites this placeholder with the
  # deployment's platform.internal_domain.
  spiffe-trust-domain: example.internal


# =============================================================================
# SDN CONFIGURATION
# =============================================================================

sdn:
  enabled: true
  controller: false
  # The environment numbers every zone (docs/architecture/reference-network.md):
  # the zone at offset n is VLAN E*100+n with IPv4 10.E.n.0/24 and IPv6
  # <ula>:<VLAN digits>::/64, and overlay network n is VNI E*100000+n.
  # Block 4 is the reference example. A non-reference site overrides single
  # zones under `overrides:` (vlan, subnet, subnet6) instead of renumbering.
  environment:
    id: 4
    base: 10.0.0.0/8
    # The deployment's RFC 4193 ULA /48. Generate your own random global
    # ID; this one is the reference document's example.
    ula: fd12:3456:789a::/48
  # zones: the built-in zones (transit, fabric, management, hypervisor,
  # quarantine, provisioning, control-plane, storage, backup) need no entry.
  # An entry tunes a built-in's policy or declares an owner-defined zone at
  # an offset from 09 to 99, for example:
  #   zones:
  #     - name: lab
  #       offset: 9
  #       port_classes: [hypervisor]
  #       isolate: true
  #       allow_to: [{zone: storage, services: [storage]}]
  # A path into control-plane or management beyond the reference defaults
  # also needs privileged_access: {reason: ..., approved_by: ...}, which is
  # logged as an audit record whenever the configuration loads.
  ovs:
    socket: /var/run/openvswitch/db.sock
    # br-fabric carries the physical trunk and the host's zone addresses.
    # Workload ports live on br-int, which never carries the trunk.
    bridge: br-fabric
    datapath: system
    protocols:
      - OpenFlow13
      - OpenFlow15
  ipam:
    backend: quicbaas
    pools: []
  dhcp:
    enabled: false
  overlay:
    enabled: true
    vxlan-port: 4789
    # The VTEP sits on the fabric zone (VLAN 401): its host address is the
    # zone401 internal port platformd creates on br-fabric for the bond0
    # fabric entry above. Without IPsec both keys are required; an overlay
    # missing either refuses to start (#93).
    underlay-interface: zone401
    vtep-address: 10.4.1.2
  gateway:
    enabled: true


# =============================================================================
# TPM CONFIGURATION
# =============================================================================

tpm:
  device: /dev/tpmrm0
  simulator: false
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  ek:
    debug: true
    handle: 0x81010001
    hash: SHA-256
    password:
    rsa:
      size: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    hierarchy-auth:
    password:
    platform-policy: false
    rsa:
      size: 2048
  iak:
    auth:
    debug: true
    hash: SHA-256
    handle: 0x81010002
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  idevid:
    model: r640
    serial: DELL-R640-EDGE-01
    cert-handle: 0x01C90000
    debug: true
    handle: 0x81020000
    hash: SHA-256
    pad: true
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  platform-pcr: 23
  platform-pcr-bank: sha256
  golden-pcrs: [7, 9]
  platform-srk:
    srk-handle: 0x81000002
    srk-auth: "kms://tpm/platform-srk/srk-auth?ensure=true&len=32&enc=raw"
    platform-policy: true


# =============================================================================
# CERTIFICATE AUTHORITY CONFIGURATION
# =============================================================================

certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: true
  default-validity: 365
  default-idevid-cn: default-device-id
  sans-include-localhost: true
  require-password: true
  quantum-safe: true
  identity:
    - # Root Certificate Authority
      is-root: true
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000003
          srk-auth: "kms://ca/root/tpm2/srk-auth?ensure=true&len=32&enc=raw"
          platform-policy: true
      keys:
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "kms://ca/root/keys/0/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "kms://ca/root/keys/1/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

      valid: 50
      subject:
        cn: root-ca.gw.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - root-ca.gw.example.com
        email:
          - hostmaster@gw.example.com

    - # Intermediate Certificate Authority
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000004
          srk-auth: "kms://ca/issuing/tpm2/srk-auth?ensure=true&len=32&enc=raw"
          platform-policy: true
      keys:
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "kms://ca/issuing/keys/0/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "kms://ca/issuing/keys/1/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true
      valid: 10
      subject:
        cn: ca01.gw.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - ca01.gw.example.com
        email:
          - hostmaster@gw.example.com


# =============================================================================
# GATEWAY CONFIGURATION
# =============================================================================

gateway:
  enabled: true
  id: gateway-standalone
  node-id: 1
  tier: datacenter
  min-reputation: 0.85
  min-age-days: 175
  min-uptime-pct: 95.0
  # The control-plane zone's gateway address (.1); a second gateway (#596)
  # makes it a VRRP address shared by the pair.
  anycast-ip: "10.4.6.1"
  ipv6-pool: ""
  ipv4-pool: ""
  # The onboard 1G WAN ports, one per ISP. The 10G ports are the bonded data
  # trunk on br-fabric (network.bonds).
  uplinks:
    - name: eno1
      mtu: 1500
    - name: eno2
      mtu: 1500
  edge:
    enabled: false
  nat:
    enabled: false
  load-balancer:
    enabled: true
    algorithm: round-robin
    health-check-interval: 5s
    health-check-timeout: 3s
    max-backends: 10


# =============================================================================
# GATEWAYD CONTROL-PLANE REPORTER (#66)
# =============================================================================
# platformd does not decode this section. Firstboot projects it — with the
# gateway:, sdn:, trust: and proxy: sections above — into
# /etc/gatewayd/config.yaml, which is what gatewayd reads. gateway-id MUST
# equal gateway.id and the Common Name of the client certificate the control
# plane issued for this gateway; the control plane binds telemetry to that
# CN. The identity files are not produced by the repo yet (#149, #431): when
# they are absent at firstboot the reporter is rendered disabled and the gap
# is logged; deliver them, set enabled: true and restart gatewayd.

control-plane:
  enabled: true
  base-url: https://cp.example.internal:8443
  gateway-id: gateway-standalone
  interval: 30s
  cert-file: /etc/gatewayd/client.pem
  key-file: /etc/gatewayd/client-key.pem
  ca-file: /etc/gatewayd/cp-ca.pem


# =============================================================================
# GATEWAYD SECRET STORE (#592)
# =============================================================================
# platformd does not decode this section; firstboot projects it into
# /etc/gatewayd/config.yaml with the sections above. It says where the
# platform secret store is, and it is what makes every kms://
# reference in this file resolvable — the gateway's BGP passwords and
# TCP-AO master keys, and its ipsec/wireguard tunnel keys. Configuration
# carries references; the values live in the store and are fetched at
# service start, handed to the kernel or the speaker, and wiped.
#
# It is NOT the `secrets:` section above: that one is platformd's resolver
# switchboard. The session is verified against the platform anchor, so a
# secret-store: without platform-ca-file: (set above) is refused
# (secrets.ErrTrustRequired) and the gateway does not start; if you remove
# platform-ca-file:, comment this section out too. The session is mutual:
# the gateway presents its node mTLS identity, the control-plane: cert-file
# and key-file pair (set above), and this section has no credential of its
# own; without that pair it is refused (secrets.ErrClientIdentityRequired).
# Without this section a service that references a secret fails closed at
# start rather than running with a reference where a key belongs.

secret-store:
  quicbaas-addr: cp.example.internal:9443
  # unix | rest | quic | mcp; empty (or grpc) auto-detects from the address
  quicbaas-transport: grpc
  timeout: 10s

# =============================================================================
# WEBSERVICES CONFIGURATION (Gateway - Reverse Proxy)
# =============================================================================

webservices:
  # Public webservice - internet facing with TLS termination
  - name: public
    # The internet-facing listener is an EDGE surface (#571): it carries the
    # virtual-host reverse proxies below and the HTTP->HTTPS redirect, and
    # nothing else -- no console, no /api/v1, no /v2. A request for a host
    # not named here is answered 421. Edge defaults apply (64 KiB headers,
    # 4096 connections per listener, 50 req/s per source, burst 100); set
    # max-header-bytes / max-connections / rate-limit to change them.
    surface: edge
    home: /var/lib/trusted-platform/public_html
    port: 80
    tls-port: 443
    index: index.html
    acme:
      enabled: true
      directory: https://cp.example.internal:9443/api/v1/acme/directory
      terms-of-service: /tos.html
      challenges:
        - http-01
        - dns-01
    jwt:
      expiration: 60
      issuer: trusted-platform
    cors:
      allowed-origins:
        - https://gw.example.com
        - https://cp.example.com
        - https://custom.example.com
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
      password: "kms://webservices/0/key/password?ensure=true&len=32&enc=raw"
      platform-policy: true
      debug: true
    certificate:
      # Public webservice TLS — issued by internal CP ACME via http-01,
      # then cross-signed via public ACME (Let's Encrypt staging) so
      # browsers trust the chain on the open internet. Operator owns
      # public DNS + upstream routing (see gw supermicro/x10 template for
      # the full reference-flow commentary).
      acme:
        challenge: http-01
        authz-type: dns
        authz-value: gw.example.com
        renew: 15
        cross-sign:
          directory: https://acme-staging-v02.api.letsencrypt.org/directory
          challenge: http-01
      subject:
        cn: gw.example.com
        organization: Trusted Platform
        country: US
        province: Florida
        locality: West Palm Beach
        address: 123 Automation Street
        postal-code: 12345
      sans:
        dns:
          - gw.example.com
          - "*.example.com"
        email:
          - hostmaster@gw.example.com
    # Virtual-host reverse proxying moved to the trusted proxy (#570, ruling R4):
    # routes and pools live in the control plane's top-level `proxy:` section
    # and reach gatewayd through the proxy sync loop. The webservice serves
    # only its own console, API and ACME surfaces here.

  # Internal webservice - internal network facing
  - name: internal
    home: /var/lib/trusted-platform/public_html
    port: 9080
    tls-port: 9443
    index: index.html
    jwt:
      expiration: 60
      issuer: trusted-platform
    cors:
      allowed-origins:
        - https://gw.example.internal
        - https://cp.example.internal
        - https://custom.example.internal
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
      password: "kms://webservices/1/key/password?ensure=true&len=32&enc=raw"
      platform-policy: true
      debug: true
    certificate:
      # The internal listener serves the node's CP-ISSUED identity, not a
      # certificate this node's own CA minted. A gateway is enrolled by the
      # control-plane CA (the enterprise/privacy CA) and already proves that
      # enrolment with its IDevID, so device-attest-01 is what issues this
      # listener's operational certificate — deployment-reference.md,
      # "auto-enroll with control-plane CA via custom ACME extensions
      # (enroll-01, device-attest-01)".
      #
      # The reporting collector and the bootstrap orchestrator's post-install
      # health probe both verify this listener against the platform anchor
      # (the control-plane CA) by the name below. A locally-issued certificate
      # cannot chain there, so without this the node fails both (#655).
      acme:
        challenge: device-attest-01
      subject:
        cn: gw.example.internal
        organization: Trusted Platform
        country: US
        province: Florida
        locality: West Palm Beach
        address: 123 Automation Street
        postal-code: 12345
      sans:
        dns:
          - gw.example.internal
          - "*.example.internal"
        email:
          - hostmaster@gw.example.com
    # Virtual-host reverse proxying moved to the trusted proxy (#570, ruling R4):
    # routes and pools live in the control plane's top-level `proxy:` section
    # and reach gatewayd through the proxy sync loop. The webservice serves
    # only its own console, API and ACME surfaces here.


# =============================================================================
# PASSWORD HASHING (Argon2)
# =============================================================================

argon2:
  memory: 65536
  iterations: 3
  parallelism: 2
  saltLen: 16
  keyLen: 32
