# gatewayd — dedicated profile, Supermicro X10, gateway role
#
# This is the EDGE daemon's own configuration (`gatewayd serve --config
# /etc/gatewayd/config.yaml`). It is not `gateway.yaml`: that one is the
# platformd config for a gateway-role node, whose `gateway:` block platformd
# does not decode. gatewayd reads the sections in
# pkg/sdn/gateway/commands/assembly.go LoadServeConfig — `gateway:`, `sdn:`,
# `control-plane:`, `proxy:`, `trust:` — and nothing else.
#
# The shape is the bring-up described in docs/operations/gateway-bringup.md:
# two WAN uplinks, one tunnel per uplink to an upstream relay, iBGP over the
# tunnels, announcing nothing until the operator adds prefixes. The gateway
# holds node address .2 on the zones it routes and answers for each zone's
# gateway address .1 (block 4 of the reference network, docs/architecture/
# reference-network.md).
#
# Every value below is a placeholder: the block-4 example of the reference
# network, RFC 5737 documentation ranges for public IPv4, 2001:db8::/32 for
# IPv6 and a private ASN. Tunnel inner addresses are /31s from the
# environment's tunnel point-to-point range (10.4.128.0/22; its first /31,
# 10.4.128.0/31, is the reserved gateway HA sync link). A deployment
# replaces them; nothing here is a default. Secrets are references only —
# `kms://` references resolve through the platform key store at start
# (handbook conventions/configuration.md §4).

gateway:
  enabled: true
  id: edge-01-gateway
  node-id: 1
  tier: datacenter

  # The gateway address this node answers for on the control-plane zone
  # (.1, the zone gateway). A second gateway (#596) turns it into a VRRP
  # address shared by both nodes.
  anycast-ip: "10.4.6.1"

  # WAN interfaces as the datapath sees them (NAT egress selection reads
  # these): the two 1G ports, one per ISP. The 10G ports are the bonded data
  # trunk on br-fabric (gateway.yaml).
  uplinks:
    - name: eth0
      mtu: 1500
      ip-addresses: ["198.51.100.6/29"]      # ISP A
    - name: eth1
      mtu: 1500
      ip-addresses: ["192.0.2.6/29"]         # ISP B

  # Per-ISP routing tables (#606): each tunnel below names one through
  # `uplink:`, which keeps its outer packets on the ISP they were sourced from
  # so the return path is symmetric without static host routes. Not the NAT/NIC
  # `uplinks:` above; tables are 100-252 and unique.
  routing-uplinks:
    - name: isp-a
      interface: eth0
      table: 101
      gateway-v4: 198.51.100.1
      addresses: ["198.51.100.6/29"]
    - name: isp-b
      interface: eth1
      table: 102
      gateway-v4: 192.0.2.1
      addresses: ["192.0.2.6/29"]

  # One tunnel per uplink to the upstream relay. `type: gre` is what a relay
  # typically speaks. A relay that terminates ESP takes `transport: ipsec` with
  # an `ipsec:` section whose `key-ref` names the key in the platform secret
  # store (kms://), never the key itself; see docs/gateway/user.md.
  tunnels:
    - name: gre-relay-ispa
      type: gre
      uplink: isp-a
      local: 198.51.100.6
      remote: 203.0.113.100
      tunnel-ip: 10.4.128.2/31
      tunnel-ipv6: "2001:db8:0:1::/127"
    - name: gre-relay-ispb
      type: gre
      uplink: isp-b
      local: 192.0.2.6
      remote: 203.0.113.100
      tunnel-ip: 10.4.128.4/31
      tunnel-ipv6: "2001:db8:0:2::/127"

  # The BGP speaker runs under the transit service; `enabledServices` starts
  # it whenever a `bgp:` section exists, and the speaker installs its policy
  # set during Start.
  transit:
    enabled: true

  bgp:
    asn: 64512
    router-id: 203.0.113.4
    listen-port: 179
    graceful-restart-time: 120

    # TCP-AO is the platform standard (ruling R1). GoBGP stores keychains but
    # has no field binding one to a neighbour, so a peer that asks for tcp-ao
    # is refused at start with a typed error rather than run unauthenticated;
    # until that lands upstream these sessions use the `!fips` MD5
    # compatibility path. A FIPS build refuses `auth-type: md5`.
    keychains:
      - name: relays
        keys:
          - send-id: 1
            receive-id: 1
            algorithm: hmac-sha256-128
            master-key-ref: kms://platform/bgp/relays-key-1

    peers:
      - name: relay-ispa
        address: 10.4.128.3
        asn: 64512
        description: "upstream relay over ISP A"
        auth-type: md5
        auth-key-ref: kms://platform/bgp/relay-ispa
        hold-time: 30
        keepalive-interval: 10
        max-prefixes: 10
        families: [ipv4-unicast, ipv6-unicast]
        bfd:
          enabled: true
          desired-min-tx-interval: 300ms
          required-min-rx-interval: 300ms
          detection-multiplier: 3
        policy:
          # RFC 8212 default-deny both directions is the speaker's default;
          # the relay sends a default route and nothing else.
          import-allow:
            - prefix: 0.0.0.0/0
            - prefix: "::/0"
          # local-pref on import ranks this session against the other one:
          # ISP A is the preferred default path here.
          import:
            local-pref: 200
      - name: relay-ispb
        address: 10.4.128.5
        asn: 64512
        description: "upstream relay over ISP B"
        auth-type: md5
        auth-key-ref: kms://platform/bgp/relay-ispb
        hold-time: 30
        keepalive-interval: 10
        max-prefixes: 10
        families: [ipv4-unicast, ipv6-unicast]
        bfd:
          enabled: true
          desired-min-tx-interval: 300ms
          required-min-rx-interval: 300ms
          detection-multiplier: 3
        policy:
          import-allow:
            - prefix: 0.0.0.0/0
            - prefix: "::/0"
          import:
            local-pref: 100

    # ANNOUNCE NOTHING. `announce:` is the export allow-list: empty plus the
    # RFC 8212 default-deny means these sessions establish, hold, and export
    # no path. The operator adds the public prefixes here when the gateway
    # takes over announcing them.
    announce:
      ipv4: []
      ipv6: []

  # The OVS zone firewall. The base pipeline the runtime installs (#567) is
  # what makes its verdicts reachable at all.
  firewall:
    enabled: true
    default-policy: deny

  # Overlay VTEP service (#709). The local VTEP is the node's address on the
  # fabric VLAN; the access port carries local workload VLANs into the overlay.
  # Enabling it requires disabling the firewall above (and NAT/load balancer):
  # the overlay owns the pipeline those services program.
  overlay:
    enabled: false
    local-vtep: 10.4.100.20
    underlay-interface: vtep0
    underlay-mtu: 9216
    access-port: patch-workloads
    overlay-asn: 65000
    vxlan-port: 4789
    # The L2VNIs joined at start, each on its own access-port VLAN. The
    # overlay is healthy only while it carries every one of them. A VNI
    # with a `subnet` is routed: every VTEP answers for the subnet's first
    # host (here 10.4.192.1) as its distributed anycast gateway. A VNI
    # without one is bridged only.
    vnis:
      - vni: 40100
        vlan: 401
        subnet: 10.4.192.0/24
    default-vni: 40100
    max-vnis: 16384
    # Symmetric IRB (RFC 9135). The anycast gateway MAC is shared by every
    # routed VNI and every VTEP; 02:00:xx:xx:xx:xx is reserved for the
    # router MACs, which each VTEP derives from local-vtep. Routed traffic
    # to another VTEP crosses the L3VNI, which needs rr-peers and must not
    # be one of vnis. Drop all three keys to bridge only.
    anycast-gateway-mac: "02:aa:aa:00:00:01"
    l3vni: 40999
    verdict-max-age: 15m
    verdict-clock-skew: 30s
    admission-sweep-interval: 30s
    rr-peers:
      - name: cp-01-rr
        address: 10.4.100.10
        asn: 65000
        families: [evpn]

  # The host packet filter. OVS cannot filter host-addressed traffic, so
  # this is what stands between the WAN and the daemon's own sockets.
  # `extra`/`peers`/`tunnels` are added to the listener inventory the
  # service derives; everything else on those interfaces is dropped.
  hostfw:
    enabled: true
    base-ruleset-path: /etc/nftables.d/tp-host.nft
    peers:
      # GRE (proto 47) only from the relay, only on the WAN links.
      - interface: eth0
        protocol: gre
        addresses: [203.0.113.100]
      - interface: eth1
        protocol: gre
        addresses: [203.0.113.100]
    # BGP (179) and BFD (3784) are allowed on the tunnel interfaces only,
    # never on the WAN links themselves.
    tunnels: [gre-relay-ispa, gre-relay-ispb]
    icmp:
      rate: 10
      burst: 20

  # IPv6-only clients: a Jool NAT64 translator (docs/gateway/user.md). To
  # enable it, uncomment the block below. gatewayd's init script then loads
  # the jool kernel module, which gateway.yaml installs (jool-modules-lts).
  # The module is built for one linux-lts release: a kernel upgrade that
  # outruns jool-modules-lts leaves the module unloadable, and gatewayd then
  # refuses this section. translator-port is an OVS internal port you create
  # on br-fabric (there is no default); pool4 is the uplink's own address on
  # ports the host does not use. client-zones names the zones that get
  # translation (here the `lab` zone from the sdn example below, VLAN 409);
  # an empty list translates for every zone.
  # nat64:
  #   enabled: true
  #   prefix: "64:ff9b::/96"
  #   translator-port: nat640
  #   pool4:
  #     addresses: ["198.51.100.6"]
  #     port-range-start: 61001
  #     port-range-end: 65535
  #   client-zones:
  #     - name: lab
  #       vlan: 409

# The OVS runtime the datapath services attach to. The environment and the
# bridge match the platformd config on the same node (x10/gateway.yaml).
sdn:
  enabled: true
  controller: false
  # The environment numbers every zone (docs/architecture/reference-network.md):
  # the zone at offset n is VLAN E*100+n with IPv4 10.E.n.0/24 and IPv6
  # <ula>:<VLAN digits>::/64, and overlay network n is VNI E*100000+n.
  # Block 4 is the reference example. A non-reference site overrides single
  # zones under `overrides:` (vlan, subnet, subnet6) instead of renumbering.
  environment:
    id: 4
    base: 10.0.0.0/8
    # The deployment's RFC 4193 ULA /48. Generate your own random global
    # ID; this one is the reference document's example.
    ula: fd12:3456:789a::/48
    # Management and provisioning use the documentation reference ranges.
    overrides:
      - {zone: management, subnet: 198.51.100.0/24}
      - {zone: provisioning, subnet: 192.0.2.0/24}
  # zones: the built-in zones (transit, fabric, management, hypervisor,
  # quarantine, provisioning, control-plane, storage, backup) need no entry.
  # An entry tunes a built-in's policy or declares an owner-defined zone at
  # an offset from 09 to 99, for example:
  #   zones:
  #     - name: lab
  #       offset: 9
  #       port_classes: [hypervisor]
  #       isolate: true
  #       allow_to: [{zone: storage, services: [storage]}]
  # A path into control-plane or management beyond the reference defaults
  # also needs privileged_access: {reason: ..., approved_by: ...}, which is
  # logged as an audit record whenever the configuration loads.
  ovs:
    socket: /var/run/openvswitch/db.sock
    bridge: br-fabric
    datapath: system
    protocols:
      - OpenFlow13
      - OpenFlow15

# Telemetry up, desired config down (#555). The client identity is the
# node's own; the CN is bound to the gateway id on the control-plane side.
control-plane:
  enabled: true
  base-url: https://cp.example.internal:8443
  gateway-id: edge-01-gateway
  interval: 30s
  reconcile-interval: 60s
  cert-file: /etc/gatewayd/client.pem
  key-file: /etc/gatewayd/client-key.pem
  ca-file: /etc/gatewayd/cp-ca.pem
