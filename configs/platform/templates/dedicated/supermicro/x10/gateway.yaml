# =============================================================================
# Supermicro X10 - Gateway Template (dedicated profile)
#
# Reusable hardware template for Supermicro X10-family motherboards
# (X10SDV-TP8F and variants) configured for the gateway role.
# These boards feature dual 10GbE SFP+, dual 1GbE RJ45, Intel Xeon D-1500
# series processors, and hardware TPM 2.0 (Nuvoton NPCT750 ATEN BMC).
#
# DEPLOYMENT PROFILE: dedicated
#   3-node layout: 1 control-plane, 1 gateway (this role), 1 compute.
#   Non-HA reference architecture -- QuicBaaS runs in standalone embedded
#   mode with storage-backend=file and no Raft consensus.
#
# GATEWAY SERVICES:
#   - TLS termination and reverse proxy
#   - Stateful firewall
#   - BGP routing and GRE tunnels
#   - NAT, load balancer
#   - DHCP/PXE on the provisioning VLAN (405)
#   - Virtual host routing
#
# TRUST MODEL: The platform CA bundle is baked into the install ISO and
#   installed to the system trust store via update-ca-certificates during
#   installation. Runtime trust bootstrap (DANE/Noise/SPKI) is intentionally
#   absent; acme.client.system-cert-pool=true means ACME uses the system
#   trust store established at install time.
#
# DEPLOYER: Before using this template, update the following for your environment:
#   - IP addresses (10.4.x.x: the block-4 example of the reference network
#     design, 10.4.0.0/16 with VLANs 400-408; also PREFERRED_IP)
#   - Domain names (gw.example.com, example.internal)
#   - TPM serial number (idevid.serial)
#   - ACME directory URL
#   - BGP ASN, peer IPs, and GRE tunnel endpoints
#   - WebAuthn origins and CORS origins
# =============================================================================

debug: false
debug-secrets: false
platform-dir: /var/lib/trusted-platform
config-dir: /etc/trusted-platform
log-dir: /var/log/trusted-platform
ca-dir: /var/lib/trusted-platform/ca
domain: gw.example.com
hostmaster: hostmaster@gw.example.com
tenant-id: platform
pin-seal-policy: true

secrets:
  enabled: true
  auto-generate: true
  local-kms: true
  migrate-to-kms: true
  update-config-file: true

platform:
  # Vault-style persistent auto-generation via QuicBaaS EnsureSecret.
  # First boot generates per spec (length + encoding) and persists at
  # the path; every subsequent boot returns the same stable bytes via
  # a distributed lock in the SecretsService. Paths are short-form —
  # tenant and node identifiers are implicitly prepended at resolution
  # time from platform.tenant_id and the node hostname.
  # TODO: revert to kms:// once firstboot seeds SecretsService pre-platformd.
  so-pin: "12345678"
  user-pin: "123456"


# =============================================================================
# INSTALLATION CONFIGURATION (System Manifest)
# =============================================================================

# Disk configuration for system installation
disk:
  device: ""
  partition-table: gpt
  efi-partition-size: 538
  root-filesystem: lvm
  lvm-volume-group: vg0
  lvm-logical-volume: root
  encryption:
    version: luks2
    cipher: aes-xts-plain64
    key-size: 512
    hash: sha256
    pbkdf: argon2id
    mapped-name: cryptroot
    tpm:
      enabled: true
      # See control-plane.yaml for the full rationale of this destructive
      # default. In short: fresh-hardware reference deploys assume the TPM
      # may be in a stuck state from a prior failed run, and platformd
      # cannot provision PIN seals against a TPM with non-empty hierarchy
      # auths. firstboot issues TPM2_Clear via LOCKOUT (empty auth)
      # BEFORE platformd starts so provisioning succeeds.
      # See: docs/installer/factory-reset.md
      factory-reset-on-firstboot: true

# Operating system configuration
os:
  os: alpine
  version: "3.22.2"
  architecture: x86_64
  hostname: gateway
  packages:
    - bash
    - vim
    - curl
    - wget
    - htop
    - lsblk
    - parted
    - e2fsprogs
    - lvm2
    - tpm2-tools
    - dracut
    - openvswitch
    - openvswitch-openrc
    - chrony
    - chrony-openrc
    # The NAT64 kernel translator gateway.nat64 drives (#603). The module
    # follows linux-lts: a kernel upgrade that outruns jool-modules-lts
    # leaves it unloadable, and gatewayd refuses the nat64: section.
    - jool-modules-lts
    - jool-tools
    - jool-tools-openrc
  kernel-modules:
    - igb
    - ixgbe
    - e1000e
    - i40e
    - ice
    - openvswitch
    - vxlan
  filesystem-type: lvm
  fips: false
  lockdown: true
  lockdown-mode: confidentiality
  tpm-auto-upgrade-seal: true
  enable-fido2: false
  ima:
    enabled: false
    policy: tcb
    hash-algorithm: sha256
    evm: false
    appraise-mode: off
    audit-enabled: true

# Network configuration for installed system
network:
  dns:
    nameservers:
      - 127.0.0.1
    search-domains:
      - example.internal
  dnsmasq:
    enabled: true
    upstream-servers:
      - "/example.internal/10.4.6.10#9053"
      - "10.4.6.10#8053"
    local-domain: example.internal
  # Host addressing by role (reference network, "Host addressing"): a
  # gateway routes and NATs by role, so it is exempt from the forwarding
  # and addressing rules. It holds node address .2 on every zone it routes
  # (transit, fabric, quarantine, provisioning, control-plane, backup) and
  # answers for the zones' gateway address .1 until a second gateway makes
  # .1 a VRRP address. Its platform-VRF address lives in a Linux VRF.
  role: gateway
  ip-forward: true
  platform-vrf:
    address: 10.4.144.2/32
  bridges:
    # br-fabric carries the physical trunk. The host's zone addresses are
    # OVS internal ports on it; the VLANs it only passes through to guests
    # get no host address.
    - name: br-fabric
      type: ovs
      interfaces:
        - bond0
      stp: false
      auto-start: true
  bonds:
    - name: bond0
      # OVS bond, created at runtime by platformd over native OVSDB (no
      # kernel bonding driver). The members are brought up as raw
      # interfaces so ovs-vswitchd can claim them.
      type: ovs
      bridge: br-fabric
      # OVS port bond_mode: balance-tcp with active LACP hashes on L4.
      mode: balance-tcp
      lacp: active
      interfaces:
        - eth6
        - eth7
      # Port class gateway (reference switch port model): the switch trunk
      # carries 400, 401, 404-406 and 408, tagged only, MTU 9216. It is the
      # only class that carries transit.
      vlans:
        - zone: transit
          ipv4-address: 10.4.0.2/24
          auto-start: true
        - zone: fabric
          ipv4-address: 10.4.1.2/24
          auto-start: true
        - zone: quarantine
          ipv4-address: 10.4.4.2/24
          auto-start: true
        - zone: provisioning
          ipv4-address: 192.0.2.2/24
          auto-start: true
        - zone: control-plane
          ipv4-address: 10.4.6.2/24
          auto-start: true
        - zone: backup
          ipv4-address: 10.4.8.2/24
          auto-start: true
      auto-start: true
  # The two 1G ports are the WAN uplinks (one per ISP); gatewayd owns their
  # addresses (gatewayd.yaml gateway.uplinks), so the installer leaves them
  # unconfigured here.
  vlans: []
  wait-online: true
  wait-timeout: 30

# UKI (Unified Kernel Image) configuration
uki:
  cmdline: "root=/dev/mapper/vg0-root ro quiet"
  kernel-path: /boot/vmlinuz-lts
  initramfs-path: /boot/initramfs-lts

# Secure Boot key management. PK/KEK are TPM-resident (store: tpm2); the DB key
# is CP-KMS software-backed and signs the UKI + kernel modules via remote
# hash-signing (resign-mode: remote) so the DB key never leaves the server. Key
# material is referenced by kms:// URI; the KMS picks the backend from `store`.
# See docs/firmware/secure-boot.md.
secure-boot:
  enabled: true
  enforce: false
  resign-mode: remote
  pk:  { cn: "Trusted Platform Secure Boot PK",  store: tpm2,     key-uri: kms://platform/secureboot/pk,  cert-uri: kms://platform/secureboot/pk-cert }
  kek: { cn: "Trusted Platform Secure Boot KEK", store: tpm2,     key-uri: kms://platform/secureboot/kek, cert-uri: kms://platform/secureboot/kek-cert }
  db:  { cn: "Trusted Platform Secure Boot DB",  store: software, key-uri: kms://platform/secureboot/db,  cert-uri: kms://platform/secureboot/db-cert }

# Enable TPM-based LUKS key sealing
enable-tpm-sealing: true

# PCR registers to seal LUKS keys against
# This is THE SINGLE SOURCE OF TRUTH for seal PCRs used by:
# - Installer (initial LUKS key sealing)
# - Initrd firstboot (writes to pcr-banks file)
# - Initrd boot (reads from config or pcr-banks file)
#
# Common PCRs:
#   0: BIOS/UEFI firmware
#   7: Secure Boot state
#   9: Kernel command line
#   10: Linux IMA - DON'T USE for LUKS (changes on every boot)
seal-pcrs:
  - 7
  - 9

# FIDO2 configuration
enable-fido2-enrollment: false
fido2:
  relying-party-id: gw.example.com
  keyslot: 3
  user-presence-required: true
  timeout: 60


# =============================================================================
# DNS CONFIGURATION
# =============================================================================

# Platform-wide DNS resolver configuration.
# Gateway nodes do not run CoreDNS but need a resolver pointing to the CP's
# public DNS. All DNS consumers (bootstrap, ACME, installer) use this as the
# platform-wide default.
dns:
  resolver:
    servers:
      - address: "10.4.6.10"
        port: 8053
    search-domains:
      - example.internal
    fallback:
      - "1.1.1.1:53"
      - "8.8.8.8:53"
    local-forwarder:
      enabled: true
      listen: "127.0.0.1:53"
      cache-size: 1000


# =============================================================================
# TIME SYNCHRONIZATION (NTP)
# =============================================================================
#
# Time is a trust primitive on this platform: TPM attestation freshness, ACME
# (RFC 8555) issuance, DANE/DNSSEC signature windows, and JWT exp/nbf are all
# meaningless against a wrong clock. platformd does NOT implement NTP: chrony
# runs as a packaged OpenRC service and platformd renders chrony.conf, manages
# the service, and reads sync state from its control socket.
#
# Removing this section entirely makes platformd leave chrony alone.

# Device liveness reporting: the node periodically POSTs
# /api/v1/device/heartbeat to the control plane over mTLS, driving the
# Devices dashboard's Online/Offline status. Default identity is the
# TPM-backed IDevID; fleets whose IDevID keys are RESTRICTED (which
# cannot sign a TLS handshake) set cert-file/key-file to a dedicated
# client certificate (CN = device serial) enrolled from the CP CA.
heartbeat:
  enabled: true
  interval: 60s
  # cert-file: /etc/trusted-platform/heartbeat/client.pem
  # key-file: /etc/trusted-platform/heartbeat/client-key.pem
  # ca-file: /etc/trusted-platform/heartbeat/cp-ca.pem

ntp:
  enabled: true
  # Nodes consume time from the control plane over NTS.
  mode: consume
  consume:
    upstream:
      # The control plane by NAME, not by address. RFC 8915 key
      # establishment is a TLS handshake: chronyd verifies the NTS-KE
      # certificate against the name written here, and platform
      # certificates carry DNS SANs only — an IP address here cannot
      # validate, whatever the address is (#509).
      #
      # `cp.example.internal` resolves on every node through exactly the
      # mechanism the ACME directory URL already uses: the node's local
      # dnsmasq (127.0.0.1:53) forwards the internal zone to the control
      # plane's internal DNS server, whose zone carries the `cp` A record.
      # Nothing is written to /etc/hosts, and nothing here needs
      # re-rendering when the control plane's address changes.
      #
      # WHICH address that record publishes is a deployment decision, and
      # it matters twice over. The control plane must (a) list this same
      # name in ntp.serve.nts.server-names so its NTS-KE certificate is
      # issued with it, and (b) have a serve.listen-networks entry that
      # COVERS the address the name resolves to. Miss (b) and the node
      # completes the NTS-KE handshake and is then refused time — a
      # working-looking configuration whose clock never moves. The control
      # plane reports that mismatch on its own `ntp` health component at
      # bring-up and at every certificate renewal (nts-name-unreachable).
      #
      # The platform CA that signs the certificate is already in this
      # node's system trust store from the install ISO
      # (/usr/local/share/ca-certificates/), which is what makes the
      # handshake verify without any extra anchor.
      - address: cp.example.internal
        prefer: true
        iburst: true
        nts: true
    startup-gate:
      block-until-synced: true
      timeout: 120s
      on-timeout: warn-and-continue
  rtc:
    write-back: true


# =============================================================================
# ACME CLIENT CONFIGURATION
# =============================================================================

acme:
  client:
    directory: https://cp.example.internal:9443/api/v1/acme/directory
    # Use OS system certificate pool for CA trust.
    # The platform CA is installed to the system trust store during ISO
    # installation via /usr/local/share/ca-certificates/ and
    # update-ca-certificates. This is more secure than insecure-bootstrap
    # which disables TLS verification.
    system-cert-pool: true
    enrollment:
      challenge: enroll-01
      ip: ${PREFERRED_IP}
    account:
      email: hostmaster@gw.example.com
      key:
        algorithm: RSA
        cn: acme-account
        debug: true
        hash: SHA-256
        password: "kms://acme/account-key/password?ensure=true&len=32&enc=raw"
        platform-policy: true
        rsa:
          size: 2048
        signature-algorithm: SHA256-RSAPSS
        store: software
      register: true


# =============================================================================
# PLATFORM CA (gatewayd's platform anchor)
# =============================================================================

# The platform CA bundle, delivered by provisioning. Every platform service
# gatewayd talks to -- the platform secret store behind every kms:// and
# secret:// reference in this file, platformd over grpc, the proxy's mTLS
# callers, the control-plane reporter -- presents a certificate the platform
# CA issued and is verified against this bundle. gatewayd runs no CA of its
# own, so this file is its whole platform trust: not a strategy choice, and
# nothing else to configure. Without it the secret store refuses to
# assemble (secrets.ErrTrustRequired) and gatewayd does not start.
platform-ca-file: /etc/gatewayd/cp-ca.pem

# =============================================================================
# TRUST CONFIGURATION (BMC Trust Bootstrap)
# =============================================================================

# Verification policy for what the platform CA did NOT issue: BMC endpoints
# (Phase 3 -- BMC TLS lifecycle). Each strategy is attempted in order; the
# first to succeed is used.
trust:
  bmc:
    # BMC endpoint trust chain. First strategy to succeed wins.
    #
    # tofu is available here again. It was barred under #83 while it was a
    # CA-bundle fetch — a BMC serves Redfish, never a bundle — but
    # go-xkms#139 (v0.12.0-alpha) made the TLS path an endpoint verifier
    # that pins the leaf SPKI on first contact and enforces it afterwards,
    # with session tickets disabled so resumption cannot bypass the check.
    # Its changelog names this exact case.
    #
    # Prefer dane once TLSA records for <hostname>-bmc.<internal-zone> are
    # published (bmc enroll does this). Before that, tofu is the better
    # first-contact option than a hand-carried bmc_spki_pin: it captures and
    # PERSISTS the pin itself rather than requiring an operator to obtain
    # the fingerprint out of band.
    strategies: [dane, spki, tofu, ca-file]
    dane:
      dns-server: "10.4.6.10:8053"   # CP public DNS

# =============================================================================
# DATASTORE CONFIGURATION
# =============================================================================

bmc:
  address: 10.4.2.22  # management (VLAN 402) carries BMCs only
  port: 623
  username: admin
  password: "kms://bmc/password?ensure=true&len=16&enc=base64"
  protocol: ipmi

# QuicBaaS runs in STANDALONE EMBEDDED MODE (non-HA reference architecture).
# storage-backend=file with node-id=1 and no join-addresses means Raft
# consensus is NOT engaged. For HA, switch to storage-backend=raft and
# populate join-addresses (see configs/platform/templates/high-availability/).
quicbaas:
  data-dir: /var/lib/trusted-platform/quicbaas
  storage-backend: file
  node-id: 1
  cache-size: 67108864
  log-level: warn
  consistency-level: linearizable
  request-timeout: 30s
  # Required for qrdb first-boot to seed IAM (system tenant, roles, admin
  # certificate). The bootstrap seeder overwrites this placeholder with the
  # deployment's platform.internal_domain.
  spiffe-trust-domain: example.internal


# =============================================================================
# SDN CONFIGURATION
# =============================================================================

sdn:
  enabled: true
  controller: false
  # The environment numbers every zone (docs/architecture/reference-network.md):
  # the zone at offset n is VLAN E*100+n with IPv4 10.E.n.0/24 and IPv6
  # <ula>:<VLAN digits>::/64, and overlay network n is VNI E*100000+n.
  # Block 4 is the reference example. A non-reference site overrides single
  # zones under `overrides:` (vlan, subnet, subnet6) instead of renumbering.
  environment:
    id: 4
    base: 10.0.0.0/8
    # The deployment's RFC 4193 ULA /48. Generate your own random global
    # ID; this one is the reference document's example.
    ula: fd12:3456:789a::/48
  # zones: the built-in zones (transit, fabric, management, hypervisor,
  # quarantine, provisioning, control-plane, storage, backup) need no entry.
  # An entry tunes a built-in's policy or declares an owner-defined zone at
  # an offset from 09 to 99, for example:
  #   zones:
  #     - name: lab
  #       offset: 9
  #       port_classes: [hypervisor]
  #       isolate: true
  #       allow_to: [{zone: storage, services: [storage]}]
  # A path into control-plane or management beyond the reference defaults
  # also needs privileged_access: {reason: ..., approved_by: ...}, which is
  # logged as an audit record whenever the configuration loads.
  ovs:
    socket: /var/run/openvswitch/db.sock
    # br-fabric carries the physical trunk and the host's zone addresses.
    # Workload ports live on br-int, which never carries the trunk.
    bridge: br-fabric
    datapath: system
    protocols:
      - OpenFlow13
      - OpenFlow15
  ipam:
    backend: quicbaas
    pools: []
  dhcp:
    enabled: false
  overlay:
    enabled: true
    vxlan-port: 4789
    # The VTEP sits on the fabric zone (VLAN 401): its host address is the
    # zone401 internal port platformd creates on br-fabric for the bond0
    # fabric entry above. Without IPsec both keys are required; an overlay
    # missing either refuses to start (#93).
    underlay-interface: zone401
    vtep-address: 10.4.1.2
  gateway:
    enabled: true


# =============================================================================
# TPM CONFIGURATION
# =============================================================================

tpm:
  # TPM target selection — resolved by the platform's single TPM resolver
  # (pkg/vtpm ResolveTPMTarget). Explicit configuration always wins and a
  # hardware target NEVER silently downgrades to a software TPM:
  #   device: /dev/tpmrm0    -> REAL HARDWARE TPM (X10 dTPM; fails closed if absent)
  #   device: /path/to.sock  -> swtpm software TPM socket (virtual hosts)
  #   device: auto           -> detect at runtime (swtpm socket, then /dev/tpmrm0, then /dev/tpm0)
  #   simulator: true        -> in-process simulator (development only; takes precedence over device)
  device: /dev/tpmrm0
  simulator: false
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  ek:
    debug: true
    handle: 0x81010001
    hash: SHA-256
    password:
    rsa:
      size: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    hierarchy-auth:
    password:
    platform-policy: false
    rsa:
      size: 2048
  iak:
    auth:
    debug: true
    hash: SHA-256
    handle: 0x81010002
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  idevid:
    model: SuperMicro X10
    serial: sm-gw-01
    cert-handle: 0x01C90000
    debug: true
    handle: 0x81020000
    hash: SHA-256
    pad: true
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  platform-pcr: 23
  platform-pcr-bank: sha256
  # Golden PCRs for platform policy (separate from seal-pcrs)
  # NOTE: PCR 10 (IMA) changes on every boot - DO NOT include for LUKS unlock!
  golden-pcrs: [7, 9]
  platform-srk:
    srk-handle: 0x81000002
    srk-auth: "kms://tpm/platform-srk/srk-auth?ensure=true&len=32&enc=raw"
    platform-policy: true


# =============================================================================
# CERTIFICATE AUTHORITY CONFIGURATION
# =============================================================================

certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: true
  default-validity: 365
  default-idevid-cn: default-device-id
  sans-include-localhost: true
  require-password: true
  quantum-safe: true
  identity:
    - # Root Certificate Authority
      is-root: true
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000003
          srk-auth: "kms://ca/root/tpm2/srk-auth?ensure=true&len=32&enc=raw"
          platform-policy: true
      keys:
        # PKCS #8 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "kms://ca/root/keys/0/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "kms://ca/root/keys/1/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

      valid: 50
      subject:
        cn: root-ca.gw.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - root-ca.gw.example.com
        email:
          - hostmaster@gw.example.com

    - # Intermediate Certificate Authority
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000004
          srk-auth: "kms://ca/issuing/tpm2/srk-auth?ensure=true&len=32&enc=raw"
          platform-policy: true
      keys:
        - # PKCS #8 RSA
          algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "kms://ca/issuing/keys/0/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "kms://ca/issuing/keys/1/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true
      valid: 10
      subject:
        cn: ca01.gw.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - ca01.gw.example.com
        email:
          - hostmaster@gw.example.com


# =============================================================================
# GATEWAY CONFIGURATION
# =============================================================================

gateway:
  enabled: true
  id: gateway-standalone
  node-id: 1
  tier: datacenter
  min-reputation: 0.85
  min-age-days: 175
  min-uptime-pct: 95.0
  # The control-plane zone's gateway address (.1); a second gateway (#596)
  # makes it a VRRP address shared by the pair.
  anycast-ip: "10.4.6.1"
  # The two 1G WAN ports, one per ISP. The 10G ports are the bonded data
  # trunk on br-fabric (network.bonds).
  uplinks:
    - name: eth0
      mtu: 1500
    - name: eth1
      mtu: 1500

  # Stateful firewall
  firewall:
    enabled: true
    default-policy: deny

  # BGP routing (placeholder ASN and peers)
  bgp:
    asn: 64512
    router-id: 10.4.6.2
    listen-port: 179
    peers:
      - name: relay-ispa
        address: 10.4.128.3
        asn: 64512
        families:
          - ipv4-unicast
          - ipv6-unicast
        # Session authentication is by reference, never by value. TCP-AO is
        # the standard (auth-type: tcp-ao with a keychain below); TCP-MD5
        # is a compatibility option that non-FIPS builds accept only:
        #   auth-type: md5
        #   auth-key-ref: kms://platform/gateway/bgp/relay-ispa
      - name: relay-ispb
        address: 10.4.128.5
        asn: 64512
        families:
          - ipv4-unicast
          - ipv6-unicast
    announce:
      ipv4: []
      ipv6: []
    # TCP-AO keychains carry their master keys by reference too. GoBGP
    # 4.9 stores a keychain but has no field binding one to a neighbour,
    # so a tcp-ao peer is refused with a typed error until upstream adds
    # it; the keychain shape is settled and the references are real.
    # keychains:
    #   - name: transit
    #     keys:
    #       - send-id: 1
    #         receive-id: 1
    #         algorithm: hmac-sha256-128
    #         master-key-ref: kms://platform/gateway/bgp/transit/1

  # Tunnels to the transit relays (placeholder endpoints). Inner addresses
  # are /31s from the environment's tunnel point-to-point range
  # (10.4.128.0/22; 10.4.128.0/31 is the reserved gateway HA sync link).
  # transport is
  # gre (plain), ipsec (the same carrier wrapped in ESP) or wireguard (not
  # available in FIPS builds). An ipsec or wireguard tunnel names its keys
  # by reference — kms:// or secret:// resolved through the secret-store:
  # section below — and never carries key material in this file. Key
  # material is fetched at start, given to the kernel, and wiped; a
  # reference that does not resolve refuses the tunnel.
  tunnels:
    - name: gre-primary
      type: gre
      local: 192.0.2.1
      remote: 198.51.100.1
      tunnel-ip: 10.4.128.2/31
    - name: gre-backup
      type: gre
      local: 192.0.2.2
      remote: 203.0.113.1
      tunnel-ip: 10.4.128.4/31
    # The same carrier under ESP. The two SA keys are 36 bytes each
    # (AES-256-GCM key plus its 4-byte salt), stored base64 and decoded on
    # the way out of the store.
    # - name: ipsec-primary
    #   type: gre
    #   transport: ipsec
    #   local: 192.0.2.1
    #   remote: 198.51.100.1
    #   tunnel-ip: 10.4.128.6/31
    #   ipsec:
    #     key-ref: kms://platform/gateway/tunnel/primary/out?enc=base64
    #     peer-key-ref: kms://platform/gateway/tunnel/primary/in?enc=base64
    #     spi-out: 0x1001
    #     spi-in: 0x1002

  # DHCP on the provisioning zone (VLAN 405): the gateway is the host
  # addressed there. zone405 is the OVS internal port platformd creates on
  # br-fabric for the provisioning address; the pool is the zone's derived
  # IPAM pool (.50-.254). Off: gatewayd has no DHCP or PXE service builder yet
  # (it refuses to start a section it cannot run), so bootstrap installs PXE
  # from the bootstrap container.
  dhcp:
    enabled: false
    interface: zone405
    zone: provisioning

  # PXE boot server (off for the same reason as DHCP)
  pxe:
    enabled: false
    http-port: 8069
    tftp-port: 69
    kernel-path: /var/lib/trusted-platform/pxe/vmlinuz
    initrd-path: /var/lib/trusted-platform/pxe/initramfs
    # The control plane's provisioning listener (a webservice with
    # surface: provisioning, bind-host in the provisioning zone), not its
    # general :8443 listener: only that listener serves
    # /api/v1/devices/config (#177, docs/web/user.md).
    config-server-url: "https://cp-provisioning.example.internal:9443/api/v1/devices/config"

  # NAT gateway
  nat:
    enabled: true
    external-ip: 192.0.2.1
    port-range-start: 1024
    port-range-end: 65535
    max-sessions: 65536

  # Load balancer (disabled by default)
  load-balancer:
    enabled: false
    algorithm: round-robin
    health-check-interval: 5s
    health-check-timeout: 3s
    max-backends: 10


# =============================================================================
# GATEWAYD CONTROL-PLANE REPORTER (#66)
# =============================================================================
# platformd does not decode this section. Firstboot projects it — with the
# gateway:, sdn:, trust: and proxy: sections above — into
# /etc/gatewayd/config.yaml, which is what gatewayd reads. gateway-id MUST
# equal gateway.id and the Common Name of the client certificate the control
# plane issued for this gateway; the control plane binds telemetry to that
# CN. The identity files are not produced by the repo yet (#149, #431): when
# they are absent at firstboot the reporter is rendered disabled and the gap
# is logged; deliver them, set enabled: true and restart gatewayd.

control-plane:
  enabled: true
  base-url: https://cp.example.internal:8443
  gateway-id: gateway-standalone
  interval: 30s
  cert-file: /etc/gatewayd/client.pem
  key-file: /etc/gatewayd/client-key.pem
  ca-file: /etc/gatewayd/cp-ca.pem


# =============================================================================
# GATEWAYD SECRET STORE (#592)
# =============================================================================
# platformd does not decode this section; firstboot projects it into
# /etc/gatewayd/config.yaml with the sections above. It says where the
# platform secret store is, and it is what makes every kms:// and secret://
# reference in this file resolvable — the gateway's BGP passwords and
# TCP-AO master keys, and its ipsec/wireguard tunnel keys. Configuration
# carries references; the values live in the store and are fetched at
# service start, handed to the kernel or the speaker, and wiped.
#
# It is NOT the `secrets:` section above: that one is platformd's resolver
# switchboard. The session is verified against the platform anchor, so a
# secret-store: without platform-ca-file: (set above) is refused
# (secrets.ErrTrustRequired) and the gateway does not start; if you remove
# platform-ca-file:, comment this section out too.
# Without this section a service that references a secret fails closed at
# start rather than running with a reference where a key belongs.

secret-store:
  quicbaas-addr: cp.example.internal:9443
  # unix | rest | quic | mcp; empty (or grpc) auto-detects from the address
  quicbaas-transport: grpc
  timeout: 10s

# =============================================================================
# WEBSERVICES CONFIGURATION (Gateway - Reverse Proxy)
# =============================================================================

webservices:
  # Public webservice - internet facing with TLS termination
  - name: public
    # The internet-facing listener is an EDGE surface (#571): it carries the
    # virtual-host reverse proxies below and the HTTP->HTTPS redirect, and
    # nothing else -- no console, no /api/v1, no /v2. A request for a host
    # not named here is answered 421. Edge defaults apply (64 KiB headers,
    # 4096 connections per listener, 50 req/s per source, burst 100); set
    # max-header-bytes / max-connections / rate-limit to change them.
    surface: edge
    home: /var/lib/trusted-platform/public_html
    port: 80
    tls-port: 443
    index: index.html
    acme:
      enabled: true
      directory: https://cp.example.internal:9443/api/v1/acme/directory
      terms-of-service: /tos.html
      challenges:
        - http-01
        - dns-01
    jwt:
      expiration: 60
      issuer: trusted-platform
    cors:
      allowed-origins:
        - https://gw.example.com
        - https://cp.example.com
        - https://custom.example.com
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
      password: "kms://webservices/0/key/password?ensure=true&len=32&enc=raw"
      platform-policy: true
      debug: true
    certificate:
      # Public webservice TLS — issued by the internal control-plane ACME
      # directory via http-01, then cross-signed by a public ACME directory
      # so browsers accept the chain on the open internet.
      #
      # Reference flow (legacy go-trusted-platform):
      #   1. platformd generates a CSR for cn=gw.example.com.
      #   2. The platform ACME client (pointing at the CP ACME directory)
      #      requests the cert via http-01 — the go-xkms ACME client stands
      #      up its own challenge responder on port 80.
      #   3. With the internal cert in hand, the same CSR is resubmitted
      #      to `cross-sign.directory` (Let's Encrypt staging here; switch
      #      to production when ready) using its own http-01 challenge.
      #      The result is a Let's Encrypt-chained cert served alongside
      #      the internal-signed chain.
      #
      # Operator prerequisites (out of platform scope, matching the
      # reference implementation — which also assumed the node had a
      # routable public IP):
      #   - Public DNS resolves gw.example.com to the gateway's public IP
      #     (managed with your external DNS provider).
      #   - Upstream router / ISP edge device either gives the gateway a
      #     routable public IP directly on its WAN interface, OR DNATs
      #     public:80 + public:443 to the gateway's internal IP.
      #   - Alpine ships with no host firewall, so inbound :80 reaches
      #     platformd's public webservice (bound to 0.0.0.0) without
      #     extra configuration.
      acme:
        challenge: http-01
        authz-type: dns
        authz-value: gw.example.com
        renew: 15
        cross-sign:
          directory: https://acme-staging-v02.api.letsencrypt.org/directory
          challenge: http-01
      subject:
        cn: gw.example.com
        organization: Trusted Platform
        country: US
        province: Florida
        locality: West Palm Beach
        address: 123 Automation Street
        postal-code: 12345
      sans:
        dns:
          - gw.example.com
          - "*.example.com"
        email:
          - hostmaster@gw.example.com
    # Virtual-host reverse proxying moved to the trusted proxy (#570, ruling R4):
    # routes and pools live in the control plane's top-level `proxy:` section
    # and reach gatewayd through the proxy sync loop. The webservice serves
    # only its own console, API and ACME surfaces here.

  # Internal webservice - internal network facing
  - name: internal
    home: /var/lib/trusted-platform/public_html
    port: 9080
    tls-port: 9443
    index: index.html
    jwt:
      expiration: 60
      issuer: trusted-platform
    cors:
      allowed-origins:
        - https://gw.example.internal
        - https://cp.example.internal
        - https://custom.example.internal
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
      password: "kms://webservices/1/key/password?ensure=true&len=32&enc=raw"
      platform-policy: true
      debug: true
    certificate:
      # The internal listener serves the node's CP-ISSUED identity, not a
      # certificate this node's own CA minted. A gateway is enrolled by the
      # control-plane CA (the enterprise/privacy CA) and already proves that
      # enrolment with its IDevID, so device-attest-01 is what issues this
      # listener's operational certificate — deployment-reference.md:173,
      # "auto-enroll with control-plane CA via custom ACME extensions
      # (enroll-01, device-attest-01)".
      #
      # This matters beyond tidiness. The reporting collector verifies a
      # node's certificate against the platform anchor (pkg/trust Anchor),
      # i.e. the control-plane CA and nothing else. A locally-issued
      # certificate cannot chain there, so without this the collector's mTLS
      # fails against every node and remote attestation produces no verdict
      # at all. The bootstrap
      # orchestrator's post-install health probe verifies against the same
      # captured CP bundle and fails for the identical reason.
      acme:
        challenge: device-attest-01
      subject:
        cn: gw.example.internal
        organization: Trusted Platform
        country: US
        province: Florida
        locality: West Palm Beach
        address: 123 Automation Street
        postal-code: 12345
      sans:
        dns:
          - gw.example.internal
          - "*.example.internal"
        email:
          - hostmaster@gw.example.com
    # Virtual-host reverse proxying moved to the trusted proxy (#570, ruling R4):
    # routes and pools live in the control plane's top-level `proxy:` section
    # and reach gatewayd through the proxy sync loop. The webservice serves
    # only its own console, API and ACME surfaces here.
