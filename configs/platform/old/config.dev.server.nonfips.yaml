# Trusted Platform Configuration File (non-FIPS server)

debug: true
debug-secrets: true
platform-dir: trusted-data
config-dir: trusted-data/etc
log-dir: trusted-data/log
domain: dev.example.com
hostmaster: hostmaster@dev.example.com
pin-seal-policy: true


acme:
  client:
    directory: https://dev.example.com/api/v1/acme/directory
    account:
      email: hostmaster@dev.example.com
      key:
        # PKCS #8 RSA w/ PSS
        algorithm: RSA
        cn: acme-account
        debug: true
        hash: SHA-256
        password: 123456
        platform-policy: true
        rsa:
          size: 2048
        signature-algorithm: SHA256-RSAPSS
        store: software
      register: true


dns:
  allow-registration: true
  allow-external-registration: true
  allow-internal-registration: true
  quicbaas:
    data-dir: trusted-data/quicbaas
    node-id: 1
    cache-size: 67108864
    log-level: warn
    consistency-level: linearizable
  default-ttl: 3600
  dnssec:
    enabled: true
    default-key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
    signature-expiry: 30d
    nsec-mode: nsec3
    nsec3-iterations: 1
    nsec3-salt: ""
    ksk:
      lifetime: 365d
      ttl: 86400
    zsk:
      lifetime: 30d
      ttl: 3600
  public:
    port: 8053
    forwarders:
      - 4.4.4.4
      - 8.8.8.8
    zone:
      description: Public zone for dev.example.com
      name: dev.example.com.
      ttl: 3600
      records:
        soa:
          name: dev.example.com.
          mname: ns1.dev.example.com.
          rname: hostmaster.dev.example.com.
          serial: 1
          refresh: 86400
          retry: 7200
          expire: 86400
          minimum_ttl: 3600
          ttl: 3600
        ns:
          - name: dev.example.com.
            value: ns1.dev.example.com.
            ttl: 3600
          - name: dev.example.com.
            value: ns2.dev.example.com.
            ttl: 3600
          - name: dev.example.com.
            value: ns3.dev.example.com.
            ttl: 3600
        a:
          - name: "@"
            value: ${PUBLIC_IPv4}
            ttl: 3600
          - name: ns1
            value: ${PUBLIC_IPv4}
            ttl: 3600
          - name: ns2
            value: ${PUBLIC_IPv4}
            ttl: 3600
          - name: ns3
            value: ${PUBLIC_IPv4}
            ttl: 3600
          - name: www
            value: ${PUBLIC_IPv4}
            ttl: 3600
        cname:
          - name: www
            value: dev.example.com.
            ttl: 3600
        mx:
          - name: dev.example.com.
            value: mail.dev.example.com.
            priority: 10
            ttl: 3600
        txt:
          - name: dev.example.com.
            value: v=spf1 include:_spf.google.com ~all
            ttl: 3600
  internal:
    port: 9053
    forwarders:
      - 192.168.1.1
      - 192.168.2.1
      - 192.168.3.1
    zone:
      description: Internal zone for dev.example.internal
      name: dev.example.internal.
      ttl: 3600
      internal: true
      records:
        soa:
          name: dev.example.internal.
          mname: ns1.dev.example.internal.
          rname: hostmaster.dev.example.internal.
          serial: 1
          refresh: 86400
          retry: 7200
          expire: 86400
          minimum_ttl: 3600
          ttl: 3600
        ns:
          - name: dev.example.internal.
            value: ns1.dev.example.internal.
            ttl: 3600
          - name: dev.example.internal.
            value: ns2.dev.example.internal.
            ttl: 3600
          - name: dev.example.internal.
            value: ns3.dev.example.internal.
            ttl: 3600
        a:
          - name: "@"
            value: ${PRIVATE_IPv4}
            ttl: 3600
          - name: ns1
            value: ${PRIVATE_IPv4}
            ttl: 3600
          - name: ns2
            value: 192.168.2.1
            ttl: 3600
          - name: ns3
            value: 192.168.3.1
            ttl: 3600
          - name: ${HOSTNAME}
            value: ${PRIVATE_IPv4}
            ttl: 3600
        cname:
          - name: www
            value: dev.example.internal.
            ttl: 3600

  

quicbaas:
  data-dir: trusted-data/quicbaas
  node-id: 1
  cache-size: 67108864
  log-level: warn
  consistency-level: linearizable


tpm:
  device: /dev/tpmrm0
  simulator: false
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  ek:
    debug: true
    handle: 0x81010001
    hash: SHA-256
    password:
    rsa:
      size: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    hierarchy-auth: 
    password: 
    platform-policy: false 
    rsa:
      size: 2048
  iak:
    auth:
    debug: true
    hash: SHA-256
    handle: 0x81010002
    password: 
    # platform-policy: true 
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  idevid:
    model: trusted-edge
    serial: att-tp-e001
    cert-handle: 0x01C90000
    debug: true
    handle: 0x81020000
    hash: SHA-256
    pad: true
    password: 
    # platform-policy: true 
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  platform-pcr: 23
  platform-pcr-bank: sha256
  # PCRs to include in golden integrity measurement for TPM-sealed secrets.
  # Leave empty to use ALL PCRs (0-23) for comprehensive boot chain measurement.
  # This includes BIOS/UEFI firmware, kernel command line, and IMA file measurements.
  # For specific PCRs only, use: [0, 7, 9, 10]
  golden-pcrs: []
  platform-srk:
    srk-handle: 0x81000002
    srk-auth: 123456
    platform-policy: true


certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: false
  default-validity: 365
  default-idevid-cn: default-device-id
  sans-include-localhost: true
  require-password: true
  quantum-safe: true
  identity:
    - 
      is-root: true
      keystores:
        software:
          platform-policy: true
        pkcs11:
          library: /usr/local/lib/softhsm/libsofthsm2.so
          config: trusted-data/etc/softhsm.conf
          slot: 0
          label: SoftHSM
          pin: 123456
          platform-policy: true
        tpm2:
          srk-handle: 0x81000003
          srk-auth: 123456
          platform-policy: true
      keys:
        # PKCS #8 RSA
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #11 RSA
        - algorithm: RSA
          rsa:
            size: 2048
            scheme: 
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: pkcs11
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 RSA
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #11 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: pkcs11
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 Ed25519
        - algorithm: Ed25519
          ecc:
            curve: P-256
          signature-algorithm: Ed25519
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

      valid: 50
      subject:
        cn: root-ca.dev.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns: 
          - root-ca.dev.example.com
        email:
          - hostmaster@dev.example.com

    - # Intermediate Certificate Authority
      keystores:
        software:
          platform-policy: true
        pkcs11:
          library: /usr/local/lib/softhsm/libsofthsm2.so
          config: trusted-data/etc/softhsm.conf
          slot: 0
          label: SoftHSM
          pin: 123456
          platform-policy: true
        tpm2:
          srk-handle: 0x81000004
          srk-auth: 123456
          platform-policy: true
      keys:
        - # PKCS #8 RSA
          algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #11 RSA
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: pkcs11
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 RSA
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #11 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: pkcs11
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 Ed25519
        - algorithm: Ed25519
          ecc:
            curve: P-256
          signature-algorithm: Ed25519
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true
      valid: 10
      subject:
        cn: ca01.dev.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - ca01.dev.example.com
          - ca.dev.example.com
        email:
          - hostmaster@dev.example.com


webservice:
  home: public_html
  port: 8080
  tls-port: 8443
  index: index.html
  rewrite:
  - pattern: "^/test.html$"
    target: /swagger/
  jwt:
    expiration: 60
    issuer: trusted-platform
  webauthn:
    display-name: Trusted Platform (Dev)
    #id: dev.example.com
    id: localhost
    origins:
      - https://dev.example.com
      - https://localhost
      - https://localhost:8443
  cors:
    allowed-origins:
      - https://dev.example.com
      - https://localhost
      - https://localhost:8443
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
  key:
    algorithm: ECDSA
    ecc:
      curve: P-256
    signature-algorithm: ECDSA-SHA256
    hash: SHA-256
    store: software
    password: 123456
    platform-policy: true
    debug: true
  certificate:
    acme:
      challenge: http-01
      renew: 15
      cross-sign:
        directory: https://acme-staging-v02.api.letsencrypt.org/directory
        challenge: http-01
    subject:
      cn: dev.example.com
      organization: Automate The Things, LLC
      country: US
      province: Florida
      locality: West Palm Beach
      address: 123 Automation Street
      postal-code: 12345
    sans:
      dns:
        - dev.example.com
        - www.dev.example.com
      email:
        - hostmaster@dev.example.com
  virtual-hosts:
    # Virtual host for edge01.dev.example.com
    - home: edge01.dev.example.com
      index: index.html
      hosts:
        - edge01.dev.example.com
      cors:
        allowed-origins:
          - https://edge01.dev.example.com
          - https://localhost
          - https://localhost:8443
        allowed-methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowed-headers:
          - "*"
        allow-credentials: true
      # Proxy requests to the client running on the local
      # system so public ACME cross-signing challenges are
      # routed to the correct host.
      proxy:
        backends:
          - https://localhost:9443
      key:
        algorithm: ECDSA
        ecc:
          curve: P-256
        signature-algorithm: ECDSA-SHA256
        hash: SHA-256
        store: software
        password: 123456
        platform-policy: true
      certificate:
        acme:
          challenge: http-01
          renew: 15
        valid: 365
        subject:
          cn: edge01.dev.example.com
          organization: Automate The Things, LLC
          country: US
          province: Kernel
          locality: Hypervisor
          address: 456 Virtual Street
          postal-code: 67890
        sans:
          dns:
            - edge01.dev.example.com
          email:
            - hostmaster@dev.example.com

    # Virtual host for dashboard.dev.example.com
    - home: dashboard.dev.example.com
      index: index.html
      hosts:
        - dashboard.dev.example.com
      cors:
        allowed-origins:
          - https://dashboard.dev.example.com
          - https://localhost
          - https://localhost:8443
        allowed-methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowed-headers:
          - "*"
        allow-credentials: true
      # Proxy requests to a 2nd instance of the platform software
      # running as a client on the same local system so public ACME
      # server http-01 challenges are routed to the correct host
      # during testing.
      proxy:
        backends:
          - http://localhost:8081
      key:
        algorithm: ECDSA
        ecc:
          curve: P-256
        signature-algorithm: ECDSA-SHA256
        hash: SHA-256
        store: software
        password: 123456
        platform-policy: true
      certificate:
        acme:
          challenge: http-01
          renew: 15
        valid: 365
        subject:
          cn: dashboard.dev.example.com
          organization: Automate The Things, LLC
          country: US
          province: Kernel
          locality: Hypervisor
          address: 456 Virtual Street
          postal-code: 67890
        sans:
          dns:
            - dashboard.dev.example.com
          email:
            - hostmaster@dashboard.dev.example.com

    # Virtual Host for 3 node docker HA cluster
    - home: cluster01.dev.example.com
      index: index.html
      hosts:
        - cluster01.dev.example.com
        - api01.dev.example.com
        - dashboard01.dev.example.com
      proxy:
        backends:
          - http://172.16.1.10:8080
          - http://172.16.2.10:8080
          - http://172.16.3.10:8080
      cors:
        allowed-origins:
          - https://dev.example.com
          - https://localhost
          - https://localhost:8443
        allowed-methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowed-headers:
          - "*"
        allow-credentials: true
      key:
        algorithm: ECDSA
        ecc:
          curve: P-256
        signature-algorithm: ECDSA-SHA256
        hash: SHA-256
        store: software
        password: 123456
        platform-policy: true
      certificate:
        acme:
          challenge: http-01
          renew: 15
        valid: 365
        subject:
          cn: cluster01.dev.example.com
          organization: Automate The Things, LLC
          country: US
          province: Kernel
          locality: Hypervisor
          address: 456 Virtual Street
          postal-code: 67890
        sans:
          dns:
            - cluster01.dev.example.com
            - api01.dev.example.com
            - dashboard01.dev.example.com
          email:
            - hostmaster@dev.example.com
    



# Argon2 Password Hashing
# https://github.com/P-H-C/phc-winner-argon2
# https://pkg.go.dev/golang.org/x/crypto/argon2
argon2:
  memory: 1
  iterations: 1
  parallelism: 1
  saltLen: 16
  keyLen: 32
