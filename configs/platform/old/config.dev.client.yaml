# Trusted Platform Configuration File (dev client)

# Configuration for the Trusted Platform
# dev.example.com environment, 
# running the platform software as a client
# connected to an "Enterprise Platform" running
# the platform software as a server. This client
# is integrated with Let's Encrypt staging to 
# cross-sign public TLS certifictes issued by the
# Enterprise CA.

# With this configuration, the client performs
# the following steps:

# 1. Start-up using TPM simulator
# 2. Provision the base platform, create local CA
#    and platform keys. Start the local CA.
# 3. Request an EK certificate via ACME endorse-01.
# 4. Perform device enrollment with the Enterprise CA
#    via ACME enroll-01. The server creates a device
#    record for the client, storing it's TCG-CSR-IDEVID
#    attestation data and generates DNS entries so the
#    device is discoverable and ready for communication
#    on the Enterprise Network. The device is issued an 
#    IAK and IDevID certificate. The IDevID is used to
#    authenticate the device to the network going forward,
#    and can also be used as a permanent-identifier in 
#    privacy focused environments where binding to the EK
#    serial is undesirable.
# 5. Request a TLS certificate from the Enterprise / Privacy
#    CA via ACME device-attest-01 and cross-sign the certificate
#    with Let's Encrypt staging for public use. This allows
#    clients / browsers to chain up to either the Enterprise CA
#    or Let's Encrypt Root certificates (or both) depending on the
#    certificates trusted by that client / browser. This allows
#    internal services who trust the Enterprise CA to chain up to
#    the Enterprise / Privacy CA using a certificate that contains
#    TCG and Trusted Platform specific OIDs, while public clients
#    who may not trust it, or interested in the "Trust OIDs" to
#    chain up to Let's Encrypt, who they do trust. Cross-signing
#    features work with any ACME RFC 8555 compliant server.
# 6. Start the client web services using the issued TLS certificates

debug: true
debug-secrets: true
platform-dir: trusted-data
config-dir: trusted-data/etc
log-dir: trusted-data/log
domain: dashboard.dev.example.com
hostmaster: hostmaster@dashboard.dev.example.com
pin-seal-policy: true


acme:
  client:
    directory: https://dev.example.com/api/v1/acme/directory
    enrollment:
      challenge: enroll-8081
      ip: ${PREFERRED_IP}
    request-server-bundle: false
    account:
      email: hostmaster@dashboard.dev.example.com
      key:
        # PKCS #8 RSA w/ PSS
        algorithm: RSA
        cn: acme-account
        debug: true
        hash: SHA-256
        password: 123456
        platform-policy: true
        rsa:
          size: 2048
        signature-algorithm: SHA256-RSAPSS
        store: software
      register: true


quicbaas:
  storage-backend: pebble
  data-dir: trusted-data/quicbaas
  wal-dir: trusted-data/quicbaas/wal
  node-id: 1
  cache-size: 67108864
  log-level: warn
  consistency-level: linearizable


tpm:
  device: /dev/tpmrm0
  simulator: true
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  ek:
    debug: true
    handle: 0x81010001
    hash: SHA-256
    password:
    rsa:
      size: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    hierarchy-auth: 
    password: 
    platform-policy: false 
    rsa:
      size: 2048
  iak:
    auth:
    debug: true
    hash: SHA-256
    handle: 0x81010002
    password: 
    # platform-policy: true 
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSAPSS
  idevid:
    model: edge
    serial: mfg-serial-e002
    cert-handle: 0x01C90000
    debug: true
    handle: 0x81020000
    hash: SHA-256
    pad: true
    password: 
    # platform-policy: true 
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSAPSS
  platform-pcr: 23
  platform-pcr-bank: sha256
  # PCRs to include in golden integrity measurement for TPM-sealed secrets.
  # Leave empty to use ALL PCRs (0-23) for comprehensive boot chain measurement.
  # This includes BIOS/UEFI firmware, kernel command line, and IMA file measurements.
  # For specific PCRs only, use: [0, 7, 9, 10]
  golden-pcrs: []
  platform-srk:
    srk-handle: 0x81000002
    srk-auth: 123456
    platform-policy: true


certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: false
  default-validity: 365
  default-idevid-cn: default-device-id
  sans-include-localhost: true
  require-password: true
  quantum-safe: true
  identity:
    - 
      is-root: true
      keystores:
        software:
          platform-policy: true
        pkcs11:
          library: /usr/local/lib/softhsm/libsofthsm2.so
          config: trusted-data/etc/softhsm.conf
          slot: 0
          label: SoftHSM
          pin: 123456
          platform-policy: true
        tpm2:
          srk-handle: 0x81000003
          srk-auth: 123456
          platform-policy: true
      keys:
        # PKCS #8 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSAPSS
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #11 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
            scheme: 
          signature-algorithm: SHA256-RSAPSS
          hash: SHA-256
          store: pkcs11
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSAPSS
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #11 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: pkcs11
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 Ed25519
        - algorithm: Ed25519
          ecc:
            curve: P-256
          signature-algorithm: Ed25519
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

      valid: 50
      subject:
        cn: root-ca.dashboard.dev.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns: 
          - root-ca.dashboard.dev.example.com
        email:
          - hostmaster@dashboard.dev.example.com

    - # Intermediate Certificate Authority
      keystores:
        software:
          platform-policy: true
        pkcs11:
          library: /usr/local/lib/softhsm/libsofthsm2.so
          config: trusted-data/etc/softhsm.conf
          slot: 0
          label: SoftHSM
          pin: 123456
          platform-policy: true
        tpm2:
          srk-handle: 0x81000004
          srk-auth: 123456
          platform-policy: true
      keys:
        - # PKCS #8 RSA w/ PSS
          algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSAPSS
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #11 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSAPSS
          hash: SHA-256
          store: pkcs11
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSAPSS
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #11 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: pkcs11
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 Ed25519
        - algorithm: Ed25519
          ecc:
            curve: P-256
          signature-algorithm: Ed25519
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true
      valid: 10
      subject:
        cn: ca01.dashboard.dev.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - ca01.dashboard.dev.example.com
        email:
          - hostmaster@dashboard.dev.example.com


webservice:
  home: public_html
  port: 9080
  tls-port: 9443
  index: index.html
  jwt:
    expiration: 60
    issuer: dashboard.dev.example.com
  webauthn:
    display-name: Trusted Platform (Dev)
    #id: dashboard.dev.example.com
    id: localhost
    origins:
      - https://dashboard.dev.example.com
      - https://dashboard.dev.example.com:8443
      - https://localhost
      - https://localhost:8443
  cors:
    allowed-origins:
      - https://dashboard.dev.example.com
      - https://localhost
      - https://localhost:8443
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
  key:
    algorithm: ECDSA
    ecc:
      curve: P-256
    signature-algorithm: ECDSA-SHA256
    hash: SHA-256
    store: software
    password: 123456
    platform-policy: true
    debug: true
  certificate:
    acme:
      challenge: device-attest-01
      renew: 15
      cross-sign:
        directory: https://acme-staging-v02.api.letsencrypt.org/directory
        challenge: http-01
    subject:
      cn: dashboard.dev.example.com
      organization: Automate The Things, LLC
      country: US
      province: Florida
      locality: West Palm Beach
      address: 123 Automation Street
      postal-code: 12345
    sans:
      dns:
        - dashboard.dev.example.com
      email:
        - hostmaster@dashboard.dev.example.com
  virtual-hosts:

    # Virtual Host for API gateway running on the client
    - home: api.dashboard.dev.example.com
      index: index.html
      hosts:
        - api.dashboard.dev.example.com
        - vhost1.dashboard.dev.example.com
        - vhost2.dashboard.dev.example.com
      key:
        algorithm: ECDSA
        ecc:
          curve: P-256
        signature-algorithm: ECDSA-SHA256
        hash: SHA-256
        store: software
        password: 123456
        platform-policy: true
        debug: true
      certificate:
        acme:
          challenge: http-01
          renew: 15
          cross-sign:
            directory: https://acme-staging-v02.api.letsencrypt.org/directory
            challenge: http-01
        valid: 365
        subject:
          cn: api.dashboard.dev.example.com
          organization: Automate The Things, LLC
          country: US
          province: Kernel
          locality: Hypervisor
          address: 456 Virtual Street
          postal-code: 67890
        sans:
          dns:
            - api.dashboard.dev.example.com
            - vhost1.dashboard.dev.example.com
            - vhost2.dashboard.dev.example.com
          email:
            - hostmaster@dashboard.dev.example.com

    # Virtual Host for 3 node docker HA cluster running on the client
    - home: cluster01.dev.example.com
      index: index.html
      hosts:
        - cluster01.dashboard.dev.example.com
        - cluster01.dashboard.dev.example.com
      proxy:
        backends:
          - http://172.16.1.10:8080
          - http://172.16.2.10:8080
          - http://172.16.3.10:8080
      key:
        algorithm: ECDSA
        ecc:
          curve: P-256
        signature-algorithm: ECDSA-SHA256
        hash: SHA-256
        store: software
        password: 123456
        platform-policy: true
        debug: true
      certificate:
        acme:
          challenge: http-01
          renew: 15
          cross-sign:
            directory: https://acme-staging-v02.api.letsencrypt.org/directory
            challenge: http-01
        valid: 365
        subject:
          cn: cluster01.dashboard.dev.example.com
          organization: Automate The Things, LLC
          country: US
          province: Kernel
          locality: Hypervisor
          address: 456 Virtual Street
          postal-code: 67890
        sans:
          dns:
            - cluster01.dashboard.dev.example.com
          email:
            - hostmaster@cluster01.dashboard.dev.example.com


# Argon2 Password Hashing
# https://github.com/P-H-C/phc-winner-argon2
# https://pkg.go.dev/golang.org/x/crypto/argon2
argon2:
  memory: 65536
  iterations: 3
  parallelism: 2
  saltLen: 16
  keyLen: 32
