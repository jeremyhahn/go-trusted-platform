# Trusted Platform System Manifest Configuration (Client)
# This is the SINGLE SOURCE OF TRUTH for all platform configuration:
# - Installation (disk, OS, network, TPM sealing)
# - Provisioning (TPM, CA, keys)
# - Runtime (webservice, ACME enrollment)

debug: true
debug-secrets: true
platform-dir: /var/lib/trusted-platform
config-dir: /etc/trusted-platform
log-dir: /var/log/trusted-platform
ca-dir: /var/lib/trusted-platform/ca
domain: client.example.com
hostmaster: hostmaster@client.example.com
tenant-id: platform
pin-seal-policy: true


# =============================================================================
# INSTALLATION CONFIGURATION (System Manifest)
# =============================================================================

# Disk configuration for system installation
disk:
  device: ""
  partition-table: gpt
  efi-partition-size: 538
  root-filesystem: lvm
  lvm-volume-group: vg0
  lvm-logical-volume: root
  encryption:
    version: luks2
    cipher: aes-xts-plain64
    key-size: 512
    hash: sha256
    pbkdf: argon2id
    mapped-name: cryptroot

# Operating system configuration
os:
  os: alpine
  version: "3.22.2"
  architecture: x86_64
  hostname: client
  packages:
    - bash
    - vim
    - curl
    - wget
    - htop
    - lsblk
    - parted
    - e2fsprogs
    - lvm2
    - tpm2-tools
    - dracut
  filesystem-type: lvm
  fips: false
  lockdown: true
  lockdown-mode: confidentiality
  tpm-auto-upgrade-seal: true
  enable-fido2: false
  ima:
    enabled: false
    policy: tcb
    hash-algorithm: sha256
    evm: false
    appraise-mode: off
    audit-enabled: true

# Network configuration for installed system
# DNS resolution: dnsmasq (127.0.0.1:53) forwards to server's internal DNS
# NOTE: upstream-servers MUST use IP address - hostname would create chicken-and-egg problem
# The ${SERVER_IP} variable should be replaced during installation with actual server IP
network:
  dns:
    nameservers:
      - 127.0.0.1
    search-domains:
      - example.internal
  dnsmasq:
    enabled: true
    upstream-servers:
      - 10.99.99.2:9053
    local-domain: example.internal
  interfaces: []
  bridges: []
  bonds: []
  vlans: []
  wait-online: true
  wait-timeout: 30

# UKI (Unified Kernel Image) configuration
uki:
  cmdline: "root=/dev/mapper/vg0-root ro quiet"
  kernel-path: /boot/vmlinuz-lts
  initramfs-path: /boot/initramfs-lts

# Secure Boot configuration
secure-boot:
  key-path: /boot/efi/secure-boot/db.key
  cert-path: /boot/efi/secure-boot/db.crt

# Enable TPM-based LUKS key sealing
enable-tpm-sealing: true

# PCR registers to seal LUKS keys against
# This is THE SINGLE SOURCE OF TRUTH for seal PCRs used by:
# - Installer (initial LUKS key sealing)
# - Initrd firstboot (writes to pcr-banks file)
# - Initrd boot (reads from config or pcr-banks file)
#
# Common PCRs:
#   0: BIOS/UEFI firmware
#   7: Secure Boot state
#   9: Kernel command line
#   10: Linux IMA - DON'T USE for LUKS (changes on every boot)
seal-pcrs:
  - 7
  - 9

# FIDO2 configuration
enable-fido2-enrollment: false
fido2:
  relying-party-id: client.example.com
  keyslot: 3
  user-presence-required: true
  timeout: 60



# =============================================================================
# DNS CONFIGURATION
# =============================================================================

# Platform-wide DNS resolver configuration.
# Clients do not run CoreDNS but need a resolver pointing to the server's
# public DNS. All DNS consumers (bootstrap, ACME, installer) use this as the
# platform-wide default.
dns:
  resolver:
    servers:
      - address: "10.99.99.2"
        port: 8053
    search-domains:
      - example.internal
    fallback:
      - "1.1.1.1:53"
      - "8.8.8.8:53"
    local-forwarder:
      enabled: true
      listen: "127.0.0.1:53"
      cache-size: 1000


# =============================================================================
# TRUST CONFIGURATION (Client-side Trust Bootstrap)
# =============================================================================

# Client-side trust resolution configures how the platform establishes TLS
# trust before the CA certificate is available. The default scope is used for
# control-plane endpoints (CA bundle fetch, ACME directory, provisioning server).
#
# strategies: ordered fallback chain — the resolver tries each in turn and
# returns the first success. "auto" in the old schema maps to [dane, noise, spki].
#
# NOTE: trust.default.dane.dns-server is optional when dns.resolver is configured.
# When omitted, the bootstrap client derives the DNS server from
# dns.resolver.servers[0].
trust:
  default:
    strategies: [dane]
    server-url: "https://10.99.99.2:8443"
    # hostname is required for DANE when server-url uses an IP address,
    # because TLSA records are published under the hostname, not the IP.
    hostname: "server.example.com"
    bundle-path: "/api/v1/ca/bootstrap"
    per-method-timeout: 15s
    install-to-system-trust: true
    dane:
      # dns-server is optional here; derived from dns.resolver.servers[0] when omitted.
      dns-server: "10.99.99.2:8053"

# =============================================================================
# ACME CLIENT CONFIGURATION
# =============================================================================

acme:
  client:
    directory: https://10.99.99.2:9443/api/v1/acme/directory
    # Use OS system certificate pool for CA trust.
    # The platform CA is installed to the system trust store during ISO installation
    # via /usr/local/share/ca-certificates/ and update-ca-certificates.
    # This is more secure than insecure-bootstrap which disables TLS verification.
    system-cert-pool: true
    enrollment:
      challenge: enroll-01
      ip: ${PREFERRED_IP}
    account:
      email: hostmaster@client.example.com
      key:
        # PKCS #8 RSA w/ PSS (for initial enrollment before TPM is provisioned)
        algorithm: RSA
        cn: acme-account
        debug: true
        hash: SHA-256
        password: 123456
        platform-policy: true
        rsa:
          size: 2048
        signature-algorithm: SHA256-RSAPSS
        store: software
      register: true


# =============================================================================
# DATASTORE CONFIGURATION
# =============================================================================

quicbaas:
  data-dir: /var/lib/trusted-platform/quicbaas
  storage-backend: file
  node-id: 1
  cache-size: 67108864
  log-level: warn
  consistency-level: linearizable


# =============================================================================
# TPM CONFIGURATION
# =============================================================================

tpm:
  device: /dev/tpmrm0
  simulator: false
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  ek:
    debug: true
    handle: 0x81010001
    hash: SHA-256
    password:
    rsa:
      size: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    hierarchy-auth:
    password:
    platform-policy: false
    rsa:
      size: 2048
  iak:
    auth:
    debug: true
    hash: SHA-256
    handle: 0x81010002
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  idevid:
    model: edge
    serial: tp-client-01
    cert-handle: 0x01C90000
    debug: true
    handle: 0x81020000
    hash: SHA-256
    pad: true
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  platform-pcr: 23
  platform-pcr-bank: sha256
  # Golden PCRs for platform policy (separate from seal-pcrs)
  # NOTE: PCR 10 (IMA) changes on every boot - DO NOT include for LUKS unlock!
  golden-pcrs: [7, 9]
  platform-srk:
    srk-handle: 0x81000002
    srk-auth: 123456
    platform-policy: true


# =============================================================================
# CERTIFICATE AUTHORITY CONFIGURATION
# =============================================================================

certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: true
  default-validity: 365
  default-idevid-cn: default-device-id
  sans-include-localhost: true
  require-password: true
  quantum-safe: true
  identity:
    - # Root Certificate Authority
      is-root: true
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000003
          srk-auth: 123456
          platform-policy: true
      keys:
        # PKCS #8 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 RSA
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 Ed25519
        - algorithm: Ed25519
          ecc:
            curve: P-256
          signature-algorithm: Ed25519
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

      valid: 50
      subject:
        cn: root-ca.client.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - root-ca.client.example.com
        email:
          - hostmaster@client.example.com

    - # Intermediate Certificate Authority
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000004
          srk-auth: 123456
          platform-policy: true
      keys:
        - # PKCS #8 RSA
          algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 RSA
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 Ed25519
        - algorithm: Ed25519
          ecc:
            curve: P-256
          signature-algorithm: Ed25519
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true
      valid: 10
      subject:
        cn: ca01.client.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - ca01.client.example.com
        email:
          - hostmaster@client.example.com


# =============================================================================
# WEBSERVICE CONFIGURATION (Client-side, minimal)
# =============================================================================

webservice:
  home: /var/lib/trusted-platform/public_html
  port: 9080
  tls-port: 9443
  index: index.html
  jwt:
    expiration: 525960
    issuer: client.example.internal
  webauthn:
    display-name: Trusted Platform Client
    id: client.example.internal
    origins:
      - https://client.example.internal
      - https://client.example.internal:9443
      - http://client.example.internal
      - http://client.example.internal:9080
      - https://localhost
      - https://localhost:9443
      - http://localhost
      - http://localhost:9080
  cors:
    allowed-origins:
      - https://client.example.internal
      - https://client.example.internal:9443
      - http://client.example.internal
      - http://client.example.internal:9080
      - https://localhost
      - https://localhost:9443
      - http://localhost
      - http://localhost:9080
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
  key:
    algorithm: ECDSA
    ecc:
      curve: P-256
    signature-algorithm: ECDSA-SHA256
    hash: SHA-256
    store: software
    password: 123456
    platform-policy: true
    debug: true
  certificate:
    subject:
      cn: client.example.internal
      organization: Trusted Platform
      country: US
      province: Florida
      locality: West Palm Beach
      address: 123 Automation Street
      postal-code: 12345
    sans:
      dns:
        - client.example.com
        - client.example.internal
      email:
        - hostmaster@client.example.com


# =============================================================================
# PASSWORD HASHING (Argon2)
# =============================================================================

argon2:
  memory: 65536
  iterations: 3
  parallelism: 2
  saltLen: 16
  keyLen: 32
