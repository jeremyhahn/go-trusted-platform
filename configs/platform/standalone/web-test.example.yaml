# Web test platformd (example)
#
# The platformd the web console flows start in the devcontainer:
#   - make integration-test-web, make integration-test-web-shell (via
#     make config) and entrypoint.sh web-dev / e2e-shell copy it to
#     /workspace/pkg/config.yaml,
#   - web/Makefile start-backend copies it to /workspace/config.yaml.
#
# Every flow wipes trusted-data/ first and starts with --init, so each run
# is a fresh platform:
#   - the TPM is the devcontainer's swtpm on /tmp/swtpm/swtpm.sock,
#   - quicbaas is embedded on the in-memory backend,
#   - REST and the console API are the public webservice on :8443, with a
#     WebAuthn relying party for localhost and CORS for the Next.js dev
#     server on https://localhost:3000.
#
# Every secret is a kms:// reference the embedded quicbaas SecretsService
# generates on first resolve (ensure=true). Paths are relative to the
# directory platformd runs in.
# =============================================================================

debug: true
debug-secrets: false
platform-dir: trusted-data
config-dir: trusted-data/etc
log-dir: trusted-data/log
domain: localhost
hostmaster: hostmaster@localhost

secrets:
  enabled: true
  auto-generate: true
  local-kms: true

platform:
  so-pin:   "kms://platform/so-pin?ensure=true&len=8&enc=numeric"
  user-pin: "kms://platform/user-pin?ensure=true&len=6&enc=numeric"


# =============================================================================
# QUICBAAS (embedded, in memory)
# =============================================================================

quicbaas:
  transport: embedded
  storage-backend: memory
  data-dir: trusted-data/quicbaas
  log-level: warn
  # Required for qrdb first-boot to seed IAM (system tenant, roles, admin
  # certificate).
  spiffe-trust-domain: example.internal


# =============================================================================
# TPM CONFIGURATION (swtpm)
# =============================================================================

tpm:
  device: /tmp/swtpm/swtpm.sock
  simulator: false
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  ek:
    debug: true
    handle: 0x81010001
    hash: SHA-256
    rsa:
      size: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    platform-policy: false
    rsa:
      size: 2048
  iak:
    debug: true
    hash: SHA-256
    handle: 0x81010002
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  idevid:
    model: web-test
    serial: web-test-01
    cert-handle: 0x01C90000
    debug: true
    handle: 0x81020000
    hash: SHA-256
    pad: true
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  platform-pcr: 23
  platform-pcr-bank: sha256
  platform-srk:
    srk-handle: 0x81000002
    srk-auth: "kms://tpm/platform-srk/srk-auth?ensure=true&len=32&enc=raw"
    platform-policy: true


# =============================================================================
# CERTIFICATE AUTHORITY CONFIGURATION
# =============================================================================

certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: false
  default-validity: 365
  default-idevid-cn: default-device-id
  sans-include-localhost: true
  require-password: true
  identity:
    - # Root Certificate Authority
      is-root: true
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000001
          srk-auth: "kms://ca/root/tpm2/srk-auth?ensure=true&len=32&enc=raw"
          platform-policy: true
      keys:
        # PKCS #8 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "kms://ca/root/keys/0/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: "kms://ca/root/keys/1/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "kms://ca/root/keys/2/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: "kms://ca/root/keys/3/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

      valid: 50
      subject:
        cn: root-ca.localhost
        organization: Trusted Platform
        country: US
      sans:
        dns:
          - root-ca.localhost
        email:
          - hostmaster@localhost

    - # Intermediate Certificate Authority
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000001
          srk-auth: "kms://ca/issuing/tpm2/srk-auth?ensure=true&len=32&enc=raw"
          platform-policy: true
      keys:
        # PKCS #8 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "kms://ca/issuing/keys/0/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: "kms://ca/issuing/keys/1/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "kms://ca/issuing/keys/2/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: "kms://ca/issuing/keys/3/password?ensure=true&len=32&enc=base64"
          platform-policy: true
          debug: true
      valid: 10
      subject:
        cn: ca.localhost
        organization: Trusted Platform
        country: US
      sans:
        dns:
          - ca.localhost
        email:
          - hostmaster@localhost


# =============================================================================
# WEBSERVICES CONFIGURATION
# =============================================================================

webservices:
  - name: public
    home: trusted-data/www
    # TLS only: the console API the web flows health-check on :8443.
    port: 0
    tls-port: 8443
    index: index.html
    jwt:
      expiration: 60
      issuer: trusted-platform
    webauthn:
      display-name: Trusted Platform
      id: localhost
      origins:
        - https://localhost:8443
        - https://localhost:3000
    cors:
      allowed-origins:
        - https://localhost:3000
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
      password: "kms://webservices/0/key/password?ensure=true&len=32&enc=raw"
      platform-policy: true
      debug: true
    certificate:
      subject:
        cn: localhost
        organization: Trusted Platform
        country: US
      sans:
        dns:
          - localhost
        email:
          - hostmaster@localhost
