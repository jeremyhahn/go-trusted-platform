    command: ["bash", "-c", "echo 'Building platformd...' && cd /workspace && make build 2>&1 | tail -20 && echo 'Starting client3...' && /workspace/bin/platformd serve --config /workspace/configs/platform/cluster/client3.example.com.yaml --platform-dir /var/lib/trusted-platform --log-dir /var/lib/trusted-platform/log --ca-dir /var/lib/trusted-platform/ca --init --debug --raw-so-pin test --raw-pin test --enable-mtls"]
