# Trusted Platform Cluster Reference Architecture
#
# Deploys a full HA cluster:
#   - 2 Gateway nodes (stateless, anycast VIP)
#   - 3 Server nodes (Raft consensus)
#   - 3 Client nodes (application servers)
#
# Prerequisites:
#   docker build -t go-trusted-platform-dev:latest build/docker/devcontainer/
#
# Usage:
#   docker compose up -d                    # Start entire cluster
#   docker compose up -d server1 server2 server3  # Start server cluster only
#   docker compose logs -f server1          # Follow server1 logs
#   docker compose down                     # Stop all services
#   docker compose down -v                  # Stop and remove volumes
#
# Network Layout:
#   Gateways:  10.0.0.10, 10.0.0.11 (VIP: 10.0.0.1)
#   Servers:   10.0.1.1, 10.0.1.2, 10.0.1.3
#   Clients:   10.0.2.1, 10.0.2.2, 10.0.2.3
#
# Deployment Order:
#   1. server1 (Raft bootstrap)
#   2. server2, server3 (join Raft cluster)
#   3. gateway1, gateway2 (stateless, any order)
#   4. client1, client2, client3 (any order)

networks:
  # Gateway network (public-facing)
  gateway-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.254

  # Server network (controller cluster)
  server-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.1.0/24
          gateway: 10.0.1.254

  # Client network (application servers)
  client-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.2.0/24
          gateway: 10.0.2.254

  # Internal network (connects all tiers)
  internal-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.100.0/24
          gateway: 10.0.100.254

volumes:
  gateway1-data:
  gateway2-data:
  server1-data:
  server2-data:
  server3-data:
  client1-data:
  client2-data:
  client3-data:
  go-mod-cache:
  go-build-cache:

x-common-env: &common-env
  TZ: UTC
  PASSWORD: test
  TPM_SIMULATOR: "true"
  GOPATH: /go
  GOCACHE: /root/.cache/go-build
  GOMODCACHE: /go/pkg/mod
  CGO_ENABLED: "1"

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 60s

services:
  # ==========================================================================
  # SERVER CLUSTER (Raft Consensus)
  # ==========================================================================

  server1:
    image: go-trusted-platform-dev:latest
    container_name: tp-server1
    hostname: server1
    domainname: example.com
    networks:
      server-net:
        ipv4_address: 10.0.1.1
      internal-net:
        ipv4_address: 10.0.100.1
    ports:
      - "8443:8443"     # Public HTTPS
      - "9443:9443"     # Internal HTTPS
      - "8053:8053"     # Public DNS
      - "9053:9053"     # Internal DNS
      - "63000:63000"   # Raft
    volumes:
      - ../../../:/workspace:cached
      - /home/jhahn/sources/go-trusted-ca:/home/jhahn/sources/go-trusted-ca:cached
      - /home/jhahn/sources/go-quicbaas:/home/jhahn/sources/go-quicbaas:cached
      - /home/jhahn/sources/go-xkms:/home/jhahn/sources/go-xkms:cached
      - /home/jhahn/sources/go-objstore:/home/jhahn/sources/go-objstore:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - server1-data:/var/lib/trusted-platform
    environment:
      <<: *common-env
      HOSTNAME: server1
      PUBLIC_IPv4: 10.0.1.1
      PRIVATE_IPv4: 10.0.1.1
      NODE_ID: 1
    working_dir: /workspace
    command: ["bash", "-c", "echo 'Building platformd...' && cd /workspace && make build 2>&1 | tail -20 && echo 'Starting server1 (Raft bootstrap)...' && /workspace/bin/platformd serve --config /workspace/configs/platform/cluster/server1.example.com.yaml --platform-dir /var/lib/trusted-platform --log-dir /var/lib/trusted-platform/log --ca-dir /var/lib/trusted-platform/ca --init --debug --raw-so-pin test --raw-pin test --enable-mtls"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sfk", "https://localhost:8443/api/v1/status"]
    restart: unless-stopped

  server2:
    image: go-trusted-platform-dev:latest
    container_name: tp-server2
    hostname: server2
    domainname: example.com
    networks:
      server-net:
        ipv4_address: 10.0.1.2
      internal-net:
        ipv4_address: 10.0.100.2
    ports:
      - "8444:8443"     # Public HTTPS
      - "9444:9443"     # Internal HTTPS
      - "63001:63000"   # Raft
    volumes:
      - ../../../:/workspace:cached
      - /home/jhahn/sources/go-trusted-ca:/home/jhahn/sources/go-trusted-ca:cached
      - /home/jhahn/sources/go-quicbaas:/home/jhahn/sources/go-quicbaas:cached
      - /home/jhahn/sources/go-xkms:/home/jhahn/sources/go-xkms:cached
      - /home/jhahn/sources/go-objstore:/home/jhahn/sources/go-objstore:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - server2-data:/var/lib/trusted-platform
    environment:
      <<: *common-env
      HOSTNAME: server2
      PUBLIC_IPv4: 10.0.1.2
      PRIVATE_IPv4: 10.0.1.2
      NODE_ID: 2
    working_dir: /workspace
    command: ["bash", "-c", "echo 'Building platformd...' && cd /workspace && make build 2>&1 | tail -20 && echo 'Starting server2 (Raft follower)...' && /workspace/bin/platformd serve --config /workspace/configs/platform/cluster/server2.example.com.yaml --platform-dir /var/lib/trusted-platform --log-dir /var/lib/trusted-platform/log --ca-dir /var/lib/trusted-platform/ca --init --debug --raw-so-pin test --raw-pin test --enable-mtls"]
    depends_on:
      server1:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sfk", "https://localhost:8443/api/v1/status"]
    restart: unless-stopped

  server3:
    image: go-trusted-platform-dev:latest
    container_name: tp-server3
    hostname: server3
    domainname: example.com
    networks:
      server-net:
        ipv4_address: 10.0.1.3
      internal-net:
        ipv4_address: 10.0.100.3
    ports:
      - "8445:8443"     # Public HTTPS
      - "9445:9443"     # Internal HTTPS
      - "63002:63000"   # Raft
    volumes:
      - ../../../:/workspace:cached
      - /home/jhahn/sources/go-trusted-ca:/home/jhahn/sources/go-trusted-ca:cached
      - /home/jhahn/sources/go-quicbaas:/home/jhahn/sources/go-quicbaas:cached
      - /home/jhahn/sources/go-xkms:/home/jhahn/sources/go-xkms:cached
      - /home/jhahn/sources/go-objstore:/home/jhahn/sources/go-objstore:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - server3-data:/var/lib/trusted-platform
    environment:
      <<: *common-env
      HOSTNAME: server3
      PUBLIC_IPv4: 10.0.1.3
      PRIVATE_IPv4: 10.0.1.3
      NODE_ID: 3
    working_dir: /workspace
    command: ["bash", "-c", "echo 'Building platformd...' && cd /workspace && make build 2>&1 | tail -20 && echo 'Starting server3 (Raft follower)...' && /workspace/bin/platformd serve --config /workspace/configs/platform/cluster/server3.example.com.yaml --platform-dir /var/lib/trusted-platform --log-dir /var/lib/trusted-platform/log --ca-dir /var/lib/trusted-platform/ca --init --debug --raw-so-pin test --raw-pin test --enable-mtls"]
    depends_on:
      server1:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sfk", "https://localhost:8443/api/v1/status"]
    restart: unless-stopped

  # ==========================================================================
  # GATEWAY CLUSTER (Stateless Load Balancers)
  # ==========================================================================

  gateway1:
    image: go-trusted-platform-dev:latest
    container_name: tp-gateway1
    hostname: gateway1
    domainname: example.com
    networks:
      gateway-net:
        ipv4_address: 10.0.0.10
      internal-net:
        ipv4_address: 10.0.100.10
    ports:
      - "80:80"         # HTTP
      - "443:443"       # HTTPS
    volumes:
      - ../../../:/workspace:cached
      - /home/jhahn/sources/go-trusted-ca:/home/jhahn/sources/go-trusted-ca:cached
      - /home/jhahn/sources/go-quicbaas:/home/jhahn/sources/go-quicbaas:cached
      - /home/jhahn/sources/go-xkms:/home/jhahn/sources/go-xkms:cached
      - /home/jhahn/sources/go-objstore:/home/jhahn/sources/go-objstore:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - gateway1-data:/var/lib/trusted-platform
    environment:
      <<: *common-env
      HOSTNAME: gateway1
      PUBLIC_IPv4: 10.0.0.10
      PRIVATE_IPv4: 10.0.0.10
      ANYCAST_VIP: 10.0.0.1
    working_dir: /workspace
    command: ["bash", "-c", "echo 'Building gatewayd...' && cd /workspace && make build-gatewayd 2>&1 | tail -20 && echo 'Starting gateway1...' && /workspace/bin/gatewayd serve --config /workspace/configs/platform/cluster/gateway1.example.com.yaml --data-dir /var/lib/trusted-platform --debug --modes transit"]
    depends_on:
      server1:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
    restart: unless-stopped

  gateway2:
    image: go-trusted-platform-dev:latest
    container_name: tp-gateway2
    hostname: gateway2
    domainname: example.com
    networks:
      gateway-net:
        ipv4_address: 10.0.0.11
      internal-net:
        ipv4_address: 10.0.100.11
    ports:
      - "81:80"         # HTTP (mapped to 81 to avoid conflict)
      - "444:443"       # HTTPS (mapped to 444 to avoid conflict)
    volumes:
      - ../../../:/workspace:cached
      - /home/jhahn/sources/go-trusted-ca:/home/jhahn/sources/go-trusted-ca:cached
      - /home/jhahn/sources/go-quicbaas:/home/jhahn/sources/go-quicbaas:cached
      - /home/jhahn/sources/go-xkms:/home/jhahn/sources/go-xkms:cached
      - /home/jhahn/sources/go-objstore:/home/jhahn/sources/go-objstore:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - gateway2-data:/var/lib/trusted-platform
    environment:
      <<: *common-env
      HOSTNAME: gateway2
      PUBLIC_IPv4: 10.0.0.11
      PRIVATE_IPv4: 10.0.0.11
      ANYCAST_VIP: 10.0.0.1
    working_dir: /workspace
    command: ["bash", "-c", "echo 'Building gatewayd...' && cd /workspace && make build-gatewayd 2>&1 | tail -20 && echo 'Starting gateway2...' && /workspace/bin/gatewayd serve --config /workspace/configs/platform/cluster/gateway2.example.com.yaml --data-dir /var/lib/trusted-platform --debug --modes transit"]
    depends_on:
      server1:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
    restart: unless-stopped

  # ==========================================================================
  # CLIENT CLUSTER (Application Servers)
  # ==========================================================================

  client1:
    image: go-trusted-platform-dev:latest
    container_name: tp-client1
    hostname: client1
    domainname: example.com
    networks:
      client-net:
        ipv4_address: 10.0.2.1
      internal-net:
        ipv4_address: 10.0.100.21
    ports:
      - "9080:9080"     # HTTP
      - "9543:9443"     # HTTPS
    volumes:
      - ../../../:/workspace:cached
      - /home/jhahn/sources/go-trusted-ca:/home/jhahn/sources/go-trusted-ca:cached
      - /home/jhahn/sources/go-quicbaas:/home/jhahn/sources/go-quicbaas:cached
      - /home/jhahn/sources/go-xkms:/home/jhahn/sources/go-xkms:cached
      - /home/jhahn/sources/go-objstore:/home/jhahn/sources/go-objstore:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - client1-data:/var/lib/trusted-platform
    environment:
      <<: *common-env
      HOSTNAME: client1
      PUBLIC_IPv4: 10.0.2.1
      PRIVATE_IPv4: 10.0.2.1
      PREFERRED_IP: 10.0.2.1
    working_dir: /workspace
    command: ["bash", "-c", "echo 'Building platformd...' && cd /workspace && make build 2>&1 | tail -20 && echo 'Starting client1...' && /workspace/bin/platformd serve --config /workspace/configs/platform/cluster/client1.example.com.yaml --platform-dir /var/lib/trusted-platform --log-dir /var/lib/trusted-platform/log --ca-dir /var/lib/trusted-platform/ca --init --debug --raw-so-pin test --raw-pin test --enable-mtls"]
