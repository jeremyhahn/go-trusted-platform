        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sfk", "https://localhost:9443/api/v1/status"]
    restart: unless-stopped

  client3:
    image: go-trusted-platform-dev:latest
    container_name: tp-client3
    hostname: client3
    domainname: example.com
    networks:
      client-net:
        ipv4_address: 10.0.2.3
      internal-net:
        ipv4_address: 10.0.100.23
    ports:
      - "9082:9080"     # HTTP
      - "9545:9443"     # HTTPS
    volumes:
      - ../../../:/workspace:cached
      - /home/jhahn/sources/go-trusted-ca:/home/jhahn/sources/go-trusted-ca:cached
      - /home/jhahn/sources/go-quicbaas:/home/jhahn/sources/go-quicbaas:cached
      - /home/jhahn/sources/go-xkms:/home/jhahn/sources/go-xkms:cached
      - /home/jhahn/sources/go-objstore:/home/jhahn/sources/go-objstore:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - client3-data:/var/lib/trusted-platform
    environment:
      <<: *common-env
      HOSTNAME: client3
      PUBLIC_IPv4: 10.0.2.3
      PRIVATE_IPv4: 10.0.2.3
