        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sfk", "https://localhost:9443/api/v1/status"]
    restart: unless-stopped

  client2:
    image: go-trusted-platform-dev:latest
    container_name: tp-client2
    hostname: client2
    domainname: example.com
    networks:
      client-net:
        ipv4_address: 10.0.2.2
      internal-net:
        ipv4_address: 10.0.100.22
    ports:
      - "9081:9080"     # HTTP
      - "9544:9443"     # HTTPS
    volumes:
      - ../../../:/workspace:cached
      - /home/jhahn/sources/go-trusted-ca:/home/jhahn/sources/go-trusted-ca:cached
      - /home/jhahn/sources/go-quicbaas:/home/jhahn/sources/go-quicbaas:cached
      - /home/jhahn/sources/go-xkms:/home/jhahn/sources/go-xkms:cached
      - /home/jhahn/sources/go-objstore:/home/jhahn/sources/go-objstore:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - client2-data:/var/lib/trusted-platform
    environment:
      <<: *common-env
      HOSTNAME: client2
      PUBLIC_IPv4: 10.0.2.2
      PRIVATE_IPv4: 10.0.2.2
      PREFERRED_IP: 10.0.2.2
    working_dir: /workspace
    command: ["bash", "-c", "echo 'Building platformd...' && cd /workspace && make build 2>&1 | tail -20 && echo 'Starting client2...' && /workspace/bin/platformd serve --config /workspace/configs/platform/cluster/client2.example.com.yaml --platform-dir /var/lib/trusted-platform --log-dir /var/lib/trusted-platform/log --ca-dir /var/lib/trusted-platform/ca --init --debug --raw-so-pin test --raw-pin test --enable-mtls"]
    depends_on:
