# Trusted Platform Configuration (Server Cluster Node 3 - Follower)
# - Installation (disk, OS, network, TPM sealing)
# - Provisioning (TPM, CA, keys)
# - Runtime (webservice, DNS, ACME)
# - Raft Consensus Cluster Configuration

debug: true
debug-secrets: true
platform-dir: /var/lib/trusted-platform
config-dir: /etc/trusted-platform
log-dir: /var/log/trusted-platform
ca-dir: /var/log/trusted-platform/ca
domain: server3.example.com
hostmaster: hostmaster@server3.example.com
tenant-id: platform
pin-seal-policy: true


# =============================================================================
# INSTALLATION CONFIGURATION (System Manifest)
# =============================================================================

# Disk configuration for system installation
disk:
  device: ""
  partition-table: gpt
  efi-partition-size: 538
  root-filesystem: lvm
  lvm-volume-group: vg0
  lvm-logical-volume: root
  encryption:
    version: luks2
    cipher: aes-xts-plain64
    key-size: 512
    hash: sha256
    pbkdf: argon2id
    mapped-name: cryptroot

# Operating system configuration
os:
  os: alpine
  version: "3.22.2"
  architecture: x86_64
  hostname: server3
  packages:
    - bash
    - vim
    - curl
    - wget
    - htop
    - lsblk
    - parted
    - e2fsprogs
    - lvm2
    - tpm2-tools
    - dracut
    - softhsm
  filesystem-type: lvm
  fips: false
  lockdown: true
  lockdown-mode: confidentiality
  tpm-auto-upgrade-seal: true
  enable-fido2: false
  ima:
    enabled: false
    policy: tcb
    hash-algorithm: sha256
    evm: false
    appraise-mode: off
    audit-enabled: true

# Network configuration for installed system
network:
  dns:
    nameservers:
      - 127.0.0.1
    search-domains:
      - example.com
  interfaces:
    - name: eth0
      type: static
      address: 10.0.1.3
      netmask: 255.255.255.0
      gateway: 10.0.1.254
  bridges: []
  bonds: []
  vlans: []
  wait-online: true
  wait-timeout: 30

# UKI (Unified Kernel Image) configuration
uki:
  cmdline: "root=/dev/mapper/vg0-root ro quiet"
  kernel-path: /boot/vmlinuz-lts
  initramfs-path: /boot/initramfs-lts

# Secure Boot configuration
secure-boot:
  key-path: /boot/efi/secure-boot/db.key
  cert-path: /boot/efi/secure-boot/db.crt

# Enable TPM-based LUKS key sealing
enable-tpm-sealing: true

# PCR registers to seal LUKS keys against
seal-pcrs:
  - 0
  - 7
  - 9

# FIDO2 configuration
enable-fido2-enrollment: false
fido2:
  relying-party-id: server3.example.com
  keyslot: 3
  user-presence-required: true
  timeout: 60


# =============================================================================
# ACME CLIENT CONFIGURATION
# =============================================================================

acme:
  client:
    directory: https://server3.example.internal:9443/api/v1/acme/directory
    account:
      email: hostmaster@server3.example.com
      key:
        # TPM 2.0 ECDSA
        algorithm: ECDSA
        cn: acme-account
        debug: true
        hash: SHA-256
        password: 123456
        platform-policy: true
        ecc:
          curve: P-256
        signature-algorithm: ECDSA-SHA256
        store: tpm2
      register: true


# =============================================================================
# DNS CONFIGURATION
# =============================================================================

dns:
  allow-registration: true
  allow-external-registration: true
  allow-internal-registration: true
  quicbaas:
    data-dir: /var/lib/trusted-platform/quicbaas/dns
    storage-backend: raft
    node-id: 3
    raft-address: "10.0.1.3:63000"
    join-addresses:
      - "10.0.1.1:63000"
    cache-size: 67108864
    log-level: warn
    consistency-level: linearizable
  default-ttl: 3600
  dnssec:
    enabled: true
    default-key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
    signature-expiry: 30d
    nsec-mode: nsec3
    nsec3-iterations: 1
    nsec3-salt: ""
    ksk:
      lifetime: 365d
      ttl: 86400
    zsk:
      lifetime: 30d
      ttl: 3600
  dnsmasq:
    enabled: true
    upstream-servers:
      - 127.0.0.1:9053
  public:
    port: 8053
    forwarders:
      - 1.1.1.1
      - 8.8.8.8
    zone:
      description: Public zone for server3.example.com
      name: example.com.
      ttl: 3600
      records:
        soa:
          name: server3.example.com.
          mname: ns1.server3.example.com.
          rname: hostmaster.server3.example.com.
          serial: 1
          refresh: 86400
          retry: 7200
          expire: 86400
          minimum_ttl: 3600
          ttl: 3600
        # Every zone carries its NS records at the apex (RFC 1034
        # §4.2.1). The owner used to read server3.example.com., which the
        # resolver ignored back when it matched no owner names at all;
        # now that it matches them, an apex NS query needs the record
        # to actually sit at the apex.
        ns:
          - name: "@"
            value: ns1.server3.example.com.
            ttl: 3600
        a:
          - name: "@"
            value: ${PUBLIC_IPv4}
            ttl: 3600
          - name: ns1
            value: ${PUBLIC_IPv4}
            ttl: 3600
          - name: www
            value: ${PUBLIC_IPv4}
            ttl: 3600
        cname:
          - name: www
            value: server3.example.com.
            ttl: 3600
        mx:
          - name: server3.example.com.
            value: mail.server3.example.com.
            priority: 10
            ttl: 3600
        txt:
          - name: server3.example.com.
            value: v=spf1 include:_spf.google.com ~all
            ttl: 3600
  internal:
    port: 9053
    forwarders:
      - 127.0.0.1:8053
    zone:
      description: Internal zone for example.internal
      name: example.internal.
      ttl: 3600
      internal: true
      records:
        soa:
          name: example.internal.
          mname: ns1.example.internal.
          rname: hostmaster.example.internal.
          serial: 1
          refresh: 86400
          retry: 7200
          expire: 86400
          minimum_ttl: 3600
          ttl: 3600
        ns:
          - name: example.internal.
            value: ns1.example.internal.
            ttl: 3600
        a:
          - name: "@"
            value: 10.0.1.3
            ttl: 3600
          - name: ns1
            value: 10.0.1.3
            ttl: 3600
          - name: server1
            value: 10.0.1.1
            ttl: 3600
          - name: server2
            value: 10.0.1.2
            ttl: 3600
          - name: server3
            value: 10.0.1.3
            ttl: 3600
        cname:
          - name: www
            value: example.internal.
            ttl: 3600



# =============================================================================
# DATASTORE CONFIGURATION (Raft Cluster)
# =============================================================================

quicbaas:
  data-dir: /var/lib/trusted-platform/quicbaas
  storage-backend: raft
  node-id: 3
  raft-address: "10.0.1.3:63000"
  join-addresses:
    - "10.0.1.1:63000"
  spiffe-trust-domain: example.internal
  cache-size: 67108864
  log-level: warn
  consistency-level: linearizable


# =============================================================================
# TPM CONFIGURATION
# =============================================================================

tpm:
  device: /dev/tpmrm0
  simulator: false
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  ek:
    debug: true
    handle: 0x81010001
    hash: SHA-256
    password:
    rsa:
      size: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    hierarchy-auth:
    password:
    platform-policy: false
    rsa:
      size: 2048
  iak:
    auth:
    debug: true
    hash: SHA-256
    handle: 0x81010002
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  idevid:
    model: edge
    serial: tp-server3-01
    cert-handle: 0x01C90000
    debug: true
    handle: 0x81020000
    hash: SHA-256
    pad: true
    password:
    rsa:
      size: 2048
    signature-algorithm: SHA256-RSA
  platform-pcr: 23
  platform-pcr-bank: sha256
  golden-pcrs: [7, 9]
  platform-srk:
    srk-handle: 0x81000002
    srk-auth: 123456
    platform-policy: true


# =============================================================================
# CERTIFICATE AUTHORITY CONFIGURATION
# =============================================================================

certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: false
  default-validity: 365
  default-idevid-cn: default-device-id
  sans-include-localhost: true
  require-password: true
  quantum-safe: true
  identity:
    - # Root Certificate Authority
      is-root: true
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000001
          srk-auth: 123456
          platform-policy: true
      keys:
        # PKCS #8 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 Ed25519
        - algorithm: Ed25519
          ecc:
            curve: P-256
          signature-algorithm: Ed25519
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

      valid: 50
      subject:
        cn: root-ca.server3.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - root-ca.server3.example.com
        email:
          - hostmaster@server3.example.com

    - # Intermediate Certificate Authority
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
        tpm2:
          srk-handle: 0x81000001
          srk-auth: 123456
          platform-policy: true
      keys:
        - # PKCS #8 RSA w/ PSS
          algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 RSA w/ PSS
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true

        # TPM 2.0 ECDSA
        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: tpm2
          password: 123456
          platform-policy: true
          debug: true

        # PKCS #8 Ed25519
        - algorithm: Ed25519
          ecc:
            curve: P-256
          signature-algorithm: Ed25519
          hash: SHA-256
          store: software
          password: 123456
          platform-policy: true
          debug: true
      valid: 10
      subject:
        cn: ca01.server3.example.com
        organization: Trusted Platform
        country: US
        province: Kernel
        locality: Hypervisor
        address: 123 Example Street
        postal-code: 12345
      sans:
        dns:
          - ca01.server3.example.com
          - ca.server3.example.com
        email:
          - hostmaster@server3.example.com


# =============================================================================
# WEBSERVICES CONFIGURATION
# =============================================================================

webservices:
  # Public webservice - external/internet facing
  - name: public
    home: /var/lib/trusted-platform/public_html
    port: 8080
    tls-port: 8443
    index: index.html
    acme:
      enabled: true
      directory: https://server3.example.com/api/v1/acme/directory
      terms-of-service: /tos.html
      challenges:
        - enroll-01
        - device-attest-01
        - dns-01
        - endorse-01
        - http-01
        - http-8080
        - http-8081
        - enroll-8080
        - enroll-8081
    rewrite:
    - pattern: "^/test.html$"
      target: /swagger/
    jwt:
      expiration: 60
      issuer: trusted-platform
    webauthn:
      display-name: Trusted Platform
      id: localhost
      origins:
        - https://server3.example.com
        - https://localhost
        - https://localhost:8443
    cors:
      allowed-origins:
        - https://server3.example.com
        - https://localhost
        - https://localhost:8443
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
      password: 123456
      platform-policy: true
      debug: true
    certificate:
      acme:
        challenge: http-01
        renew: 15
      subject:
        cn: server3.example.com
        organization: ACME Corporation
        country: US
        province: Florida
        locality: West Palm Beach
        address: 123 Automation Street
        postal-code: 12345
      sans:
        dns:
          - server3.example.com
          - www.server3.example.com
        email:
          - hostmaster@server3.example.com

  # Internal webservice - local network facing
  - name: internal
    home: /var/lib/trusted-platform/public_html
    port: 9080
    tls-port: 9443
    index: index.html
    acme:
      enabled: true
      directory: https://server3.example.internal:9443/api/v1/acme/directory
      terms-of-service: /tos.html
      challenges:
        - enroll-01
        - device-attest-01
        - dns-01
        - endorse-01
        - http-01
        - http-8080
        - http-8081
        - enroll-8080
        - enroll-8081
    jwt:
      expiration: 60
      issuer: trusted-platform
    cors:
      allowed-origins:
        - https://server3.example.internal
        - https://localhost
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
    key:
      algorithm: ECDSA
      ecc:
        curve: P-256
      signature-algorithm: ECDSA-SHA256
      hash: SHA-256
      store: software
      password: 123456
      platform-policy: true
      debug: true
    certificate:
      subject:
        cn: server3.example.internal
        organization: ACME Corporation
        country: US
        province: Florida
        locality: West Palm Beach
        address: 123 Automation Street
        postal-code: 12345
      sans:
        dns:
          - server3.example.internal
        email:
          - hostmaster@server3.example.com


# =============================================================================
# PASSWORD HASHING (Argon2)
# =============================================================================

argon2:
  memory: 1
  iterations: 1
  parallelism: 1
  saltLen: 16
  keyLen: 32
