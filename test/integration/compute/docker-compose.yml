version: '3.8'

services:
  compute-test:
    # Built by `make build-devcontainer`, never here.
    image: trusted-platform-dev:latest
    pull_policy: never
    container_name: go-trusted-platform-compute-test
    hostname: compute-test
    privileged: true
    network_mode: host

    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - SYS_MODULE
      - IPC_LOCK
      - SETFCAP

    devices:
      - /dev/net/tun:/dev/net/tun
      - /dev/kvm:/dev/kvm

    volumes:
      - ../../../:/workspace
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ovs-db:/var/run/openvswitch
      - ovs-log:/var/log/openvswitch
      - swtpm-data:/var/lib/swtpm
      - qemu-images:/var/lib/qemu

    environment:
      - CGO_ENABLED=1
      - GOCACHE=/tmp/go-cache
      - GOPATH=/go
      - AUTO_START_OVS=true
      - QEMU_ENABLE_KVM=true
      # Optional override; unset, the command derives the tags from make.
      - BUILD_TAGS

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

    shm_size: '4gb'

    working_dir: /workspace/test/integration/compute

    command: >
      sh -c "
        echo 'Waiting for OVS to start...';
        start=$$(date +%s);
        until ovs-appctl -t ovs-vswitchd version >/dev/null 2>&1; do
          if [ $$(( $$(date +%s) - start )) -ge 30 ]; then
            echo 'ovs-vswitchd control socket not ready after 30s' >&2;
            exit 1;
          fi;
          sleep 0.2;
        done;
        echo 'Running compute integration tests...';
        TAGS=$${BUILD_TAGS:-integration $$(make -s -C /workspace print-build-tags)};
        go test -v -tags \"$$TAGS\" -timeout 30m ./...
      "

volumes:
  ovs-db:
  ovs-log:
  swtpm-data:
  qemu-images:
