# Integration Test Configuration
#
# Minimal production-style config for integration tests.
# Used by run-integration-tests.sh to start a real platformd instance.
# No webservices section (daemon-only mode with all protocol APIs). The
# daemon REST server also mounts the gatewayd-facing control-plane routes.

debug: true
debug-secrets: true
platform-dir: /tmp/platformd-integration
config-dir: /etc/trusted-platform
log-dir: /tmp/platformd-integration/log
ca-dir: /tmp/platformd-integration/ca

# Domain for test certificates
domain: localhost

# =============================================================================
# QUICBAAS CONFIGURATION (Embedded, PebbleDB backend)
# =============================================================================

quicbaas:
  data-dir: /tmp/platformd-integration/quicbaas
  node-id: 1
  # Required by the embedded server: qrdb first-boot cannot seed IAM (system
  # tenant, roles, admin certificate) without a trust domain, so platformd
  # refuses to start when it is absent. Every shipped template carries the
  # same placeholder, which the seeder overwrites with the deployment's
  # internal domain.
  spiffe-trust-domain: example.internal
  cache-size: 67108864
  log-level: warn
  consistency-level: linearizable

# =============================================================================
# CERTIFICATE AUTHORITY CONFIGURATION (Software-only, no TPM)
# =============================================================================

certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: false
  default-validity: 365
  default-idevid-cn: test-device-id
  sans-include-localhost: true
  require-password: true
  identity:
    - # Root Certificate Authority
      is-root: true
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
      keys:
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "123456"
          platform-policy: true
          debug: true

        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "123456"
          platform-policy: true
          debug: true

      valid: 50
      subject:
        cn: root-ca.localhost
        organization: Trusted Platform Integration Tests
        country: US
        province: Test
        locality: Test
        address: 123 Test Street
        postal-code: 12345
      sans:
        dns:
          - root-ca.localhost
        email:
          - test@localhost

    - # Intermediate Certificate Authority
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
      keys:
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "123456"
          platform-policy: true
          debug: true

        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "123456"
          platform-policy: true
          debug: true

      valid: 10
      subject:
        cn: ca01.localhost
        organization: Trusted Platform Integration Tests
        country: US
        province: Test
        locality: Test
        address: 123 Test Street
        postal-code: 12345
      sans:
        dns:
          - ca01.localhost
          - ca.localhost
        email:
          - test@localhost

# =============================================================================
# TPM 2.0 CONFIGURATION
# =============================================================================
# Required for CA identities that set platform-policy: true. The platform
# PCR + bank are needed when the CA is configured to use TPM-bound platform
# policy. Integration tests run against swtpm started by the test harness:
# device is the socket start_swtpm in run-integration-tests.sh serves. The
# integration container is privileged and sees the host's /dev/tpmrm0, so a
# hardware path here would provision the CI host's own TPM.

tpm:
  device: /tmp/swtpm/swtpm.sock
  simulator: false
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  ek:
    debug: true
    handle: 0x81010001
    # Where provision_swtpm_state writes the harness EK certificate, the
    # TCG EK Credential Profile 2.1 §2.2.1.4 RSA 2048 index. Without it
    # go-xkms reads the EK certificate only from the certificate store.
    cert-handle: 0x01C00002
    hash: SHA-256
    rsa:
      size: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    platform-policy: false
    rsa:
      size: 2048
  platform-pcr: 23
  platform-pcr-bank: sha256
  # Empty golden-pcrs list keeps the policy permissive — fine for tests
  # where every reboot of swtpm yields different boot-time PCR values.
  golden-pcrs: []
  platform-srk:
    srk-handle: 0x81000002
    srk-auth: "kms://tpm/platform-srk/srk-auth?ensure=true&len=32&enc=base64"
    platform-policy: true

# =============================================================================
# vTPM CONFIGURATION
# =============================================================================

vtpm:
  base-dir: /tmp/platformd-integration/vtpm
  pcr-banks:
    - sha256
  ek-algorithm: RSA
  secure-boot-key-size: 2048
  secure-boot-valid-years: 10
  secure-boot-common-name: Trusted Platform Integration Tests
  secure-boot-organization: Trusted Platform Integration Tests
  debug: true

# =============================================================================
# PASSWORD HASHING (Argon2) - Fast settings for tests
# =============================================================================

argon2:
  memory: 1
  iterations: 1
  parallelism: 1
  saltLen: 16
  keyLen: 32

# =============================================================================
# DNS CONFIGURATION
# =============================================================================
#
# An internal server gives platformd a DNS backend (pkg/app/app.go
# newDNSService and StartDNS run only when dns.HasServer() is true), so the
# dns suite's REST, QUIC, MCP, Unix and CLI adapters reach real zone and
# record storage. CoreDNS listens on an unprivileged port; the suite creates
# and deletes its own zones, so the configured zone only seeds the server.
# DNSSEC and DANE stay off, and with no webservices nothing would publish
# TLSA records anyway; the bootstrap suite, whose DANE tests need them, is
# out of the runner's default set for that reason.

dns:
  default-ttl: 300
  internal:
    port: 9053
    zone:
      name: integration.internal.
      description: Internal zone for the integration platformd
      ttl: 300
      internal: true
      records:
        soa:
          name: integration.internal.
          mname: ns1.integration.internal.
          rname: hostmaster.integration.internal.
          serial: 1
          refresh: 86400
          retry: 7200
          expire: 86400
          min_ttl: 300
          ttl: 300
        ns:
          - name: "@"
            value: ns1.integration.internal.
            ttl: 300

# =============================================================================
# TIME SYNCHRONIZATION
# =============================================================================
# Enables the NTP service the ntp suite drives on every transport. Without
# an ntp: section platformd never touches chrony and every NTP call answers
# "not configured" (docs/ntp/user.md).
#
# platformd renders /etc/chrony/chrony.conf from this section. The
# devcontainer has no OpenRC, so run-integration-tests.sh starts chronyd on
# the rendered file itself, with -x: chronyd never adjusts the system clock,
# which the container shares with the CI host.
#
# The one upstream is the loopback, where nothing serves NTP (a consume-only
# node renders port 0), so no source ever becomes reachable: a step is always
# the documented refusal, never a clock change. No startup gate: there is
# nothing to wait for.
ntp:
  enabled: true
  mode: consume
  consume:
    upstream:
      - address: 127.0.0.1
        iburst: true
    startup-gate:
      block-until-synced: false

# =============================================================================
# SDN CONFIGURATION
# =============================================================================
# Enables the overlay controller so TestOverlayMultiProtocol and
# TestOverlayCLIOperations pass against real in-process services.
#
# OVS socket: the devcontainer starts ovsdb-server at /var/run/openvswitch/db.sock
# before platformd; run-integration-tests.sh creates the br-platform-int bridge.
#
# Overlay: controller is wired into the gRPC/REST/QUIC/MCP/Unix overlay service
# by daemon.go when sdn.overlay.enabled=true. VTEP IP is derived at runtime from
# App.PublicIPv4 (or loopback when not available). Underlay interface defaults to
# "lo" so no kernel VXLAN device is required in the container.
#
# IPAM: memory backend is explicit here so the zone/IPAM test suites that were
# passing WITHOUT an sdn section continue to use the same in-memory allocator
# (the daemon always initialised a defaultIPAM memory backend regardless).
#
# Networks: intentionally absent — no VLAN seeding is triggered, preserving the
# existing behaviour of the zone/network integration test suites.

sdn:
  enabled: true
  controller: true
  # Every zone is numbered from the environment (reference block 4).
  environment:
    id: 4
  ovs:
    socket: /var/run/openvswitch/db.sock
    bridge: br-platform-int
  ipam:
    backend: memory
  overlay:
    enabled: true
    vxlan-port: 4789
    underlay-interface: lo
    # A single-node test overlay: the loopback VTEP is explicit (#93).
    vtep-address: 127.0.0.1
