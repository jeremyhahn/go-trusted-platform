[supervisord]
nodaemon=true
user=root

[program:ovsdb-server]
command=/usr/share/openvswitch/scripts/ovs-ctl start --system-id=random --no-ovs-vswitchd
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/openvswitch/ovsdb-server-stdout.log
stderr_logfile=/var/log/openvswitch/ovsdb-server-stderr.log

[program:ovs-vswitchd]
command=/usr/share/openvswitch/scripts/ovs-ctl start --system-id=random --no-ovsdb-server
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/openvswitch/ovs-vswitchd-stdout.log
stderr_logfile=/var/log/openvswitch/ovs-vswitchd-stderr.log
