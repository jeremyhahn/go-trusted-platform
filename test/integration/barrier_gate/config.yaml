# Barrier-Gate Integration Test Configuration
#
# Minimal production-style config for the M6 barrier-gate integration tests.
# Drives platformd with seal_strategy=software so the
# init-only gate listener (127.0.0.1:9446) stays bound until the test calls
# POST /init or POST /unseal.

debug: true
debug-secrets: true
platform-dir: /tmp/platformd-barrier-gate
config-dir: /etc/trusted-platform
log-dir: /tmp/platformd-barrier-gate/log
ca-dir: /tmp/platformd-barrier-gate/ca

# Domain for test certificates
domain: localhost

# =============================================================================
# BARRIER CONFIGURATION (M6 gate prerequisite)
# =============================================================================
#
# A non-nil barrier section is REQUIRED for the M6 init-only gate to bind.
# When pkg/app/initBarrier sees barrier=nil, the gate's waitForUnseal exits
# immediately ("nothing to wait for") and production transports bind right
# away, defeating the purpose of this test.

barrier:
  seal_strategy: software

# =============================================================================
# QUICBAAS CONFIGURATION (Embedded, PebbleDB backend)
# =============================================================================

quicbaas:
  data-dir: /tmp/platformd-barrier-gate/quicbaas
  node-id: 1
  # Required for qrdb first-boot to seed IAM (system tenant, roles, admin
  # certificate). The bootstrap seeder overwrites this placeholder with the
  # deployment's platform.internal_domain.
  spiffe-trust-domain: example.internal
  cache-size: 67108864
  log-level: warn
  consistency-level: linearizable

# =============================================================================
# CERTIFICATE AUTHORITY CONFIGURATION (Software-only, no TPM)
# =============================================================================

certificate-authority:
  platform-ca: 1
  auto-import-issuing-ca: true
  system-cert-pool: false
  default-validity: 365
  default-idevid-cn: test-device-id
  sans-include-localhost: true
  require-password: true
  identity:
    - # Root Certificate Authority
      is-root: true
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
      keys:
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "123456"
          platform-policy: true
          debug: true

        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "123456"
          platform-policy: true
          debug: true

      valid: 50
      subject:
        cn: root-ca.localhost
        organization: Trusted Platform Integration Tests
        country: US
        province: Test
        locality: Test
        address: 123 Test Street
        postal-code: 12345
      sans:
        dns:
          - root-ca.localhost
        email:
          - test@localhost

    - # Intermediate Certificate Authority
      key-algorithm: RSA
      key-size: 2048
      keystore-type: software
      keystores:
        software:
          platform-policy: true
      keys:
        - algorithm: RSA
          rsa:
            size: 2048
          signature-algorithm: SHA256-RSA
          hash: SHA-256
          store: software
          password: "123456"
          platform-policy: true
          debug: true

        - algorithm: ECDSA
          ecc:
            curve: P-256
          signature-algorithm: ECDSA-SHA256
          hash: SHA-256
          store: software
          password: "123456"
          platform-policy: true
          debug: true

      valid: 10
      subject:
        cn: ca01.localhost
        organization: Trusted Platform Integration Tests
        country: US
        province: Test
        locality: Test
        address: 123 Test Street
        postal-code: 12345
      sans:
        dns:
          - ca01.localhost
          - ca.localhost
        email:
          - test@localhost

# =============================================================================
# TPM 2.0 CONFIGURATION
# =============================================================================
# Required for CA identities that set platform-policy: true. Integration tests
# run against swtpm started by the devcontainer harness.

tpm:
  device: /dev/tpmrm0
  simulator: false
  encrypt-sessions: false
  entropy: false
  hash: SHA-256
  ek:
    debug: true
    handle: 0x81010001
    hash: SHA-256
    rsa:
      size: 2048
  ssrk:
    debug: true
    handle: 0x81000001
    platform-policy: false
    rsa:
      size: 2048
  platform-pcr: 23
  platform-pcr-bank: sha256
  golden-pcrs: []
  platform-srk:
    srk-handle: 0x81000002
    srk-auth: "kms://tpm/platform-srk/srk-auth?ensure=true&len=32&enc=base64"
    platform-policy: true

# =============================================================================
# vTPM CONFIGURATION
# =============================================================================

vtpm:
  base-dir: /tmp/platformd-barrier-gate/vtpm
  pcr-banks:
    - sha256
  ek-algorithm: RSA
  secure-boot-key-size: 2048
  secure-boot-valid-years: 10
  secure-boot-common-name: Trusted Platform Integration Tests
  secure-boot-organization: Trusted Platform Integration Tests
  debug: true

# =============================================================================
# PASSWORD HASHING (Argon2) - Fast settings for tests
# =============================================================================

argon2:
  memory: 1
  iterations: 1
  parallelism: 1
  saltLen: 16
  keyLen: 32
