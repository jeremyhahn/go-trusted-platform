# Floci EC2 emulator for the AWS compute lifecycle test (TestAWSCompute_Floci).

services:
  floci:
    image: floci/floci:latest
    container_name: gtp-compute-floci
    environment:
      - FLOCI_DEFAULT_REGION=us-east-1
      - FLOCI_STORAGE_MODE=memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_floci/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "4566:4566"

networks:
  default:
    name: gtp-compute-aws-test
