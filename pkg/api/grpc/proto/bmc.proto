syntax = "proto3";

package platform.v1;

option go_package = "github.com/jeremyhahn/go-trusted-platform/sdk/go/gen;platformv1";

import "google/protobuf/timestamp.proto";

// BMCService provides baseboard management controller operations for
// bare metal provisioning via IPMI 2.0 and Redfish.
service BMCService {
  // Power management
  rpc PowerOn(BMCPowerRequest) returns (BMCPowerResponse);
  rpc PowerOff(BMCPowerRequest) returns (BMCPowerResponse);
  rpc PowerReset(BMCPowerRequest) returns (BMCPowerResponse);
  rpc PowerCycle(BMCPowerRequest) returns (BMCPowerResponse);
  rpc PowerStatus(BMCPowerStatusRequest) returns (BMCPowerStatusResponse);

  // Boot device control
  rpc SetBootDevice(BMCSetBootDeviceRequest) returns (BMCSetBootDeviceResponse);
  rpc GetBootDevice(BMCGetBootDeviceRequest) returns (BMCGetBootDeviceResponse);

  // Virtual media
  rpc MountISO(BMCMountISORequest) returns (BMCMountISOResponse);
  rpc UnmountISO(BMCUnmountISORequest) returns (BMCUnmountISOResponse);
  rpc VirtualMediaStatus(BMCVirtualMediaStatusRequest) returns (BMCVirtualMediaStatusResponse);

  // Monitoring
  rpc GetSensors(BMCGetSensorsRequest) returns (BMCGetSensorsResponse);
  rpc GetSystemInfo(BMCGetSystemInfoRequest) returns (BMCGetSystemInfoResponse);

  // Orchestrated provisioning
  rpc Provision(BMCProvisionRequest) returns (BMCProvisionResponse);
  rpc ProvisionStatus(BMCProvisionStatusRequest) returns (BMCProvisionStatusResponse);

  // Certificate management
  rpc GetWebCertificate(BMCGetWebCertificateRequest) returns (BMCGetWebCertificateResponse);
  rpc ReplaceWebCertificate(BMCReplaceWebCertificateRequest) returns (BMCReplaceWebCertificateResponse);

  // Enrollment ceremony
  rpc EnrollBMC(BMCEnrollRequest) returns (BMCEnrollResponse);
  // Factory certificate restore
  rpc RestoreFactoryCert(BMCRestoreRequest) returns (BMCRestoreResponse);

  // User management
  rpc ListUsers(BMCListUsersRequest) returns (BMCListUsersResponse);
  rpc CreateUser(BMCCreateUserRequest) returns (BMCCreateUserResponse);
  rpc DeleteUser(BMCDeleteUserRequest) returns (BMCDeleteUserResponse);
  rpc SetUserPassword(BMCSetUserPasswordRequest) returns (BMCSetUserPasswordResponse);
  rpc SetUserPrivilege(BMCSetUserPrivilegeRequest) returns (BMCSetUserPrivilegeResponse);
}

// BMCPowerState represents the power state of a BMC-managed system.
enum BMCPowerState {
  BMC_POWER_STATE_UNSPECIFIED = 0;
  BMC_POWER_STATE_ON = 1;
  BMC_POWER_STATE_OFF = 2;
  BMC_POWER_STATE_UNKNOWN = 3;
}

// BMCBootDevice represents the boot device for a BMC-managed system.
enum BMCBootDevice {
  BMC_BOOT_DEVICE_UNSPECIFIED = 0;
  BMC_BOOT_DEVICE_PXE = 1;
  BMC_BOOT_DEVICE_DISK = 2;
  BMC_BOOT_DEVICE_CDROM = 3;
  BMC_BOOT_DEVICE_VIRTUAL_MEDIA = 4;
  BMC_BOOT_DEVICE_NONE = 5;
}

// BMCProvisioningStatus represents the provisioning workflow state.
enum BMCProvisioningStatus {
  BMC_PROVISIONING_STATUS_UNSPECIFIED = 0;
  BMC_PROVISIONING_STATUS_PENDING = 1;
  BMC_PROVISIONING_STATUS_CONNECTING = 2;
  BMC_PROVISIONING_STATUS_SETTING_BOOT = 3;
  BMC_PROVISIONING_STATUS_MOUNTING_ISO = 4;
  BMC_PROVISIONING_STATUS_POWERING_ON = 5;
  BMC_PROVISIONING_STATUS_INSTALLING = 6;
  BMC_PROVISIONING_STATUS_FINALIZING = 7;
  BMC_PROVISIONING_STATUS_COMPLETE = 8;
  BMC_PROVISIONING_STATUS_FAILED = 9;
}

// BMCUserPrivilege represents the IPMI 2.0 user privilege level.
enum BMCUserPrivilege {
  BMC_USER_PRIVILEGE_UNSPECIFIED = 0;
  BMC_USER_PRIVILEGE_CALLBACK = 1;
  BMC_USER_PRIVILEGE_USER = 2;
  BMC_USER_PRIVILEGE_OPERATOR = 3;
  BMC_USER_PRIVILEGE_ADMINISTRATOR = 4;
  BMC_USER_PRIVILEGE_NO_ACCESS = 15;
}

// Power messages

// BMCPowerRequest identifies the device profile for a power operation.
message BMCPowerRequest {
  uint64 profile_id = 1;
}

// BMCPowerResponse reports the previous and current power states.
message BMCPowerResponse {
  BMCPowerState previous_state = 1;
  BMCPowerState current_state = 2;
}

// BMCPowerStatusRequest identifies the device profile for a power status query.
message BMCPowerStatusRequest {
  uint64 profile_id = 1;
}

// BMCPowerStatusResponse reports the current power state.
message BMCPowerStatusResponse {
  BMCPowerState state = 1;
}

// Boot device messages

// BMCSetBootDeviceRequest sets the boot device for a device profile.
message BMCSetBootDeviceRequest {
  uint64 profile_id = 1;
  BMCBootDevice device = 2;
  bool persistent = 3;
}

// BMCSetBootDeviceResponse confirms the boot device was set.
message BMCSetBootDeviceResponse {
  BMCBootDevice device = 1;
}

// BMCGetBootDeviceRequest queries the current boot device for a device profile.
message BMCGetBootDeviceRequest {
  uint64 profile_id = 1;
}

// BMCGetBootDeviceResponse reports the current boot device.
message BMCGetBootDeviceResponse {
  BMCBootDevice device = 1;
}

// Virtual media messages

// BMCMountISORequest mounts an ISO image via virtual media.
message BMCMountISORequest {
  uint64 profile_id = 1;
  string iso_url = 2;
}

// BMCMountISOResponse confirms the ISO was mounted.
message BMCMountISOResponse {
  bool mounted = 1;
}

// BMCUnmountISORequest unmounts virtual media from a device profile.
message BMCUnmountISORequest {
  uint64 profile_id = 1;
}

// BMCUnmountISOResponse confirms the ISO was unmounted.
message BMCUnmountISOResponse {}

// BMCVirtualMediaStatusRequest queries virtual media status for a device profile.
message BMCVirtualMediaStatusRequest {
  uint64 profile_id = 1;
}

// BMCVirtualMediaStatusResponse reports the current virtual media status.
message BMCVirtualMediaStatusResponse {
  bool mounted = 1;
  string image_url = 2;
  string media_type = 3;
}

// Sensor messages

// BMCSensorReading represents a single sensor reading from the BMC.
message BMCSensorReading {
  string name = 1;
  double value = 2;
  string units = 3;
  string status = 4;
}

// BMCGetSensorsRequest queries sensor readings for a device profile.
message BMCGetSensorsRequest {
  uint64 profile_id = 1;
}

// BMCGetSensorsResponse reports all sensor readings.
message BMCGetSensorsResponse {
  repeated BMCSensorReading sensors = 1;
}

// System info messages

// BMCGetSystemInfoRequest queries system information for a device profile.
message BMCGetSystemInfoRequest {
  uint64 profile_id = 1;
}

// BMCGetSystemInfoResponse reports hardware and firmware information.
message BMCGetSystemInfoResponse {
  string manufacturer = 1;
  string product = 2;
  string serial_number = 3;
  string firmware_version = 4;
  string bios_version = 5;
  BMCPowerState power_state = 6;
}

// Provisioning messages

// BMCProvisionRequest initiates an orchestrated bare metal provisioning workflow.
message BMCProvisionRequest {
  uint64 profile_id = 1;
  string iso_url = 2;
}

// BMCProvisionResponse reports the provisioning workflow status.
message BMCProvisionResponse {
  string provision_id = 1;
  BMCProvisioningStatus status = 2;
}

// BMCProvisionStatusRequest queries the provisioning status for a device profile.
message BMCProvisionStatusRequest {
  uint64 profile_id = 1;
}

// BMCProvisionStatusResponse reports the current provisioning workflow status.
message BMCProvisionStatusResponse {
  BMCProvisioningStatus status = 1;
  string message = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// Certificate management messages

// BMCGetWebCertificateRequest queries the BMC web certificate for a device profile.
message BMCGetWebCertificateRequest {
  uint64 profile_id = 1;
}

// BMCGetWebCertificateResponse reports the current BMC web certificate details.
message BMCGetWebCertificateResponse {
  // Subject is the certificate subject distinguished name.
  string subject = 1;
  // Issuer is the certificate issuer distinguished name.
  string issuer = 2;
  // SerialNumber is the certificate serial number in hex.
  string serial_number = 3;
  // NotBefore is the certificate validity start time.
  google.protobuf.Timestamp not_before = 4;
  // NotAfter is the certificate validity end time.
  google.protobuf.Timestamp not_after = 5;
  // DaysRemaining is the number of days until the certificate expires.
  int32 days_remaining = 6;
  // SubjectAlternativeNames contains the DNS and IP SANs.
  repeated string subject_alternative_names = 7;
  // Fingerprint is the SHA-256 fingerprint of the certificate.
  string fingerprint = 8;
}

// BMCReplaceWebCertificateRequest replaces the BMC web certificate.
message BMCReplaceWebCertificateRequest {
  uint64 profile_id = 1;
  // CertPem is the PEM-encoded certificate (leaf, optionally with chain).
  bytes cert_pem = 2;
  // KeyPem is the PEM-encoded private key.
  bytes key_pem = 3;
}

// BMCReplaceWebCertificateResponse confirms the certificate was replaced.
message BMCReplaceWebCertificateResponse {
  // Message is a human-readable status message.
  string message = 1;
}

// BMCEnrollRequest initiates the BMC enrollment ceremony for the device profile.
message BMCEnrollRequest {
  // ProfileId identifies the device profile whose BMC config drives enrollment.
  uint64 profile_id = 1;
  // ReplaceCertificate overrides the profile's enrollment.replace_certificate flag.
  // Absent means "use the profile default".
  optional bool replace_certificate = 2;
  // RotatePassword overrides the profile's enrollment.rotate_password flag.
  optional bool rotate_password = 3;
  // DnsRegister overrides the profile's enrollment.dns_register flag.
  optional bool dns_register = 4;
  // DanePublish overrides the profile's enrollment.dane_publish flag.
  optional bool dane_publish = 5;
}

// BMCFactoryCertMeta carries auditable metadata from the factory TLS certificate
// that existed on the BMC at enrollment time. No secret material is included.
message BMCFactoryCertMeta {
  // Subject is the certificate subject distinguished name.
  string subject = 1;
  // Issuer is the certificate issuer distinguished name.
  string issuer = 2;
  // SerialNumber is the certificate serial in decimal string form.
  string serial_number = 3;
  // NotBefore is the certificate validity start time.
  google.protobuf.Timestamp not_before = 4;
  // NotAfter is the certificate validity end time.
  google.protobuf.Timestamp not_after = 5;
  // SpkiSha256 is the hex-encoded SHA-256 of the SPKI block.
  string spki_sha256 = 6;
  // Sha256 is the hex-encoded SHA-256 of the entire certificate DER.
  string sha256 = 7;
  // CapturedAt is when the metadata was collected.
  google.protobuf.Timestamp captured_at = 8;
}

// BMCEnrollStep records the outcome of a single ceremony step.
message BMCEnrollStep {
  // Name is a short identifier for the step (e.g. "trust", "factory-cert").
  string name = 1;
  // Ok is true when the step completed successfully or was intentionally skipped.
  bool ok = 2;
  // Detail is a human-readable message (success detail, skip reason, or error summary).
  string detail = 3;
}

// BMCEnrollResponse is the full outcome of a BMC enrollment ceremony.
message BMCEnrollResponse {
  // DeviceId is the platform device entity ID.
  uint64 device_id = 1;
  // Endpoint is the host:port used for the Redfish/HTTPS connection.
  string endpoint = 2;
  // Hostname is the bare hostname of the BMC address (no port).
  string hostname = 3;
  // DnsName is the FQDN registered in internal DNS, e.g. "node-01-bmc.internal.".
  // Empty when dns-register was skipped.
  string dns_name = 4;
  // PinSpkiSha256 is the hex-encoded SHA-256 of the pinned SPKI of the
  // BMC's effective TLS leaf certificate after the ceremony.
  string pin_spki_sha256 = 5;
  // FactoryCertPem holds the factory TLS certificate PEM.
  bytes factory_cert_pem = 6;
  // FactoryCertMeta holds auditable metadata from the factory certificate.
  BMCFactoryCertMeta factory_cert_meta = 7;
  // NewCertPem holds the platform-issued leaf certificate PEM when
  // replace-certificate ran successfully. Empty otherwise.
  bytes new_cert_pem = 8;
  // CaCertPem holds the issuing CA certificate PEM when replace-certificate
  // ran successfully. Empty otherwise.
  bytes ca_cert_pem = 9;
  // Steps records the ordered ceremony steps and their outcomes.
  repeated BMCEnrollStep steps = 10;
}

// BMCRestoreRequest initiates the BMC factory-certificate restore ceremony.
message BMCRestoreRequest {
  // ProfileId identifies the device profile whose BMC config drives the restore.
  uint64 profile_id = 1;
}

// BMCRestoreResponse is the full outcome of a BMC factory-certificate restore ceremony.
message BMCRestoreResponse {
  // DeviceId is the platform device entity ID.
  uint64 device_id = 1;
  // Endpoint is the host:port used for the BMC HTTPS connection.
  string endpoint = 2;
  // Hostname is the bare hostname of the BMC address (no port).
  string hostname = 3;
  // NewCertMeta holds auditable metadata from the new self-signed certificate
  // that the BMC generated during the restore.
  BMCFactoryCertMeta new_cert_meta = 4;
  // NewCertPem is the PEM-encoded new self-signed certificate for client-side
  // inspection. Never written to disk server-side.
  bytes new_cert_pem = 5;
  // Steps records the ordered ceremony steps and their outcomes.
  repeated BMCEnrollStep steps = 6;
}

// User management messages

// BMCUser represents a BMC user account.
message BMCUser {
  // Slot is the IPMI user slot (1-based).
  uint32 slot = 1;
  // Username is the account name.
  string username = 2;
  // Enabled indicates whether the user can authenticate.
  bool enabled = 3;
  // Privilege is the user's access privilege level.
  BMCUserPrivilege privilege = 4;
  // Channel is the IPMI channel index.
  uint32 channel = 5;
}

// BMCListUsersRequest queries the BMC user list for a device profile.
message BMCListUsersRequest {
  uint64 profile_id = 1;
}

// BMCListUsersResponse reports all BMC users.
message BMCListUsersResponse {
  repeated BMCUser users = 1;
}

// BMCCreateUserRequest creates a new BMC user.
message BMCCreateUserRequest {
  uint64 profile_id = 1;
  // User is the user account to create.
  BMCUser user = 2;
  // Password is the initial password for the user.
  string password = 3;
}

// BMCCreateUserResponse confirms the user was created.
message BMCCreateUserResponse {
  // Slot is the IPMI user slot assigned to the new user.
  uint32 slot = 1;
}

// BMCDeleteUserRequest deletes a BMC user.
message BMCDeleteUserRequest {
  uint64 profile_id = 1;
  // Slot is the IPMI user slot to delete.
  uint32 slot = 2;
}

// BMCDeleteUserResponse confirms the user was deleted.
message BMCDeleteUserResponse {}

// BMCSetUserPasswordRequest updates a BMC user password.
message BMCSetUserPasswordRequest {
  uint64 profile_id = 1;
  // Slot is the IPMI user slot.
  uint32 slot = 2;
  // Password is the new password.
  string password = 3;
}

// BMCSetUserPasswordResponse confirms the password was updated.
message BMCSetUserPasswordResponse {}

// BMCSetUserPrivilegeRequest updates a BMC user privilege level.
message BMCSetUserPrivilegeRequest {
  uint64 profile_id = 1;
  // Slot is the IPMI user slot.
  uint32 slot = 2;
  // Channel is the IPMI channel index.
  uint32 channel = 3;
  // Privilege is the new privilege level.
  BMCUserPrivilege privilege = 4;
}

// BMCSetUserPrivilegeResponse confirms the privilege was updated.
message BMCSetUserPrivilegeResponse {}
