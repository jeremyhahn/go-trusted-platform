syntax = "proto3";

package platform.v1;

option go_package = "github.com/jeremyhahn/go-trusted-platform/sdk/go/gen;platformv1";

import "google/protobuf/timestamp.proto";
import "common.proto";

// DeviceService provides device management operations
service DeviceService {
  // Device CRUD operations
  rpc CreateDevice(CreateDeviceRequest) returns (CreateDeviceResponse);
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse);
  rpc UpdateDevice(UpdateDeviceRequest) returns (UpdateDeviceResponse);
  rpc DeleteDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);

  // Device lookup operations
  rpc FindDeviceBySerial(FindDeviceBySerialRequest) returns (FindDeviceBySerialResponse);
  rpc CountDevices(CountDevicesRequest) returns (CountDevicesResponse);

  // Profile CRUD operations
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);

  // Profile lookup operations
  rpc FindProfileByMACAddress(FindProfileByMACAddressRequest) returns (FindProfileByMACAddressResponse);
  rpc FindProfileBySerial(FindProfileBySerialRequest) returns (FindProfileBySerialResponse);
  rpc FindMatchingProfile(FindMatchingProfileRequest) returns (FindMatchingProfileResponse);
  rpc CountProfiles(CountProfilesRequest) returns (CountProfilesResponse);

  // Device activation
  rpc ActivateDevice(ActivateDeviceRequest) returns (ActivateDeviceResponse);

  // Device attestation. Verifies a TPM quote submitted for a device against
  // the device's ENROLLED attestation key and expected PCR policy. This is
  // the verifier half only: it checks evidence the caller supplies, it does
  // not ask a device for a fresh quote (see #226).
  rpc AttestDevice(AttestDeviceRequest) returns (AttestDeviceResponse);

  // Device-template CRUD lives on the REST surface only (see
  // pkg/webservice/v1/device/template_handlers.go). The Create/Get/Update/
  // Delete/List/FindByName Template RPCs that used to be declared here
  // collided with vtpm.proto's identically-named messages, never got
  // generated into device.pb.go, and were not referenced from any Go code.
  // They have been removed; if a gRPC device-template service is needed
  // in the future, define it with `DeviceTemplate…` message prefixes so
  // the names cannot collide with vtpm.

  // Template operations
  rpc CreateProfileFromTemplate(CreateProfileFromTemplateRequest) returns (CreateProfileResponse);

  // Profile lookup by device identity
  rpc FindConfigForDevice(FindConfigForDeviceRequest) returns (FindConfigForDeviceResponse);

  // Profile assignment
  rpc AssignProfileToDevice(AssignProfileToDeviceRequest) returns (AssignProfileToDeviceResponse);
  rpc UnassignProfileFromDevice(UnassignProfileFromDeviceRequest) returns (UnassignProfileFromDeviceResponse);
}

// DeviceRole represents the role or function of a device
enum DeviceRole {
  DEVICE_ROLE_UNSPECIFIED = 0;
  DEVICE_ROLE_UNKNOWN = 1;
  DEVICE_ROLE_SERVER = 2;
  DEVICE_ROLE_CLIENT = 3;
  DEVICE_ROLE_WORKSTATION = 4;
  DEVICE_ROLE_EDGE = 5;
  DEVICE_ROLE_IOT = 6;
  DEVICE_ROLE_GATEWAY = 7;
  DEVICE_ROLE_LOAD_BALANCER = 8;
  DEVICE_ROLE_CONTROL_PLANE = 9;
  DEVICE_ROLE_WORKER = 10;
}

// AuthMethod represents the authentication method for network access
enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED = 0;
  AUTH_METHOD_NONE = 1;
  AUTH_METHOD_802_1X = 2;
}

// Device represents a registered device
message Device {
  uint64 id = 1;
  string attest_pub = 2;
  string ek_cert = 3;
  bytes event_log = 4;
  uint32 hash_algo_id = 5;
  string model = 6;
  string serial = 7;
  string signing_pub = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Physical switch managing this device's port.
  string switch_name = 11;
  // Physical port identifier on the switch (e.g., "Eth1/3").
  string switch_port = 12;
  // OVS port (tap/interface name) the device's NIC is attached to, stamped at
  // SDN enrollment activation. Distinct from switch_port (physical switch port).
  string network_port_id = 13;
  // PEM-encoded attestation (IAK/AK) certificate issued by the platform CA at
  // enrollment. It is the trust anchor for quote verification: it must chain
  // to the platform CA and carry tcg-cap-verifiedTPMRestricted (TCG DevID v1
  // r12 §8.2). A bare attest_pub is not accepted as an anchor (#374, #404).
  string attest_cert = 14;
}

// DHCPPoolConfig defines DHCP pool configuration
message DHCPPoolConfig {
  string network = 1;
  string range_start = 2;
  string range_end = 3;
  int32 lease_time = 4;
}

// ACLConfig defines access control list configuration
message ACLConfig {
  int32 priority = 1;
  string protocol = 2;
  string src_ip = 3;
  string dst_ip = 4;
  uint32 src_port = 5;
  uint32 dst_port = 6;
  string action = 7;
}

// NetworkPhaseConfig defines network configuration for a provisioning phase.
// Field 11 (firewall_zone) is reserved; use zone (field 12) instead.
message NetworkPhaseConfig {
  uint32 vlan = 1;
  DHCPPoolConfig dhcp_pool = 2;
  string static_ip = 3;
  string gateway = 4;
  repeated string dns = 5;
  AuthMethod auth_method = 6;
  repeated ACLConfig acls = 7;
  string subnet = 8;
  repeated string dns_servers = 9;
  bool dhcp = 10;
  reserved 11;
  reserved "firewall_zone";
  // zone is the SDN zone name for this network phase (e.g. "trusted",
  // "provisioning", "quarantine").
  string zone = 12;
}

// PlatformdConfigRef represents a reference to platformd configuration
message PlatformdConfigRef {
  string config_type = 1;
  bytes inline = 2;
  string reference = 3;
  string config_name = 4;
  string config_path = 5;
  string version = 6;
}

// ProfileMatchRules defines rules for matching devices to profiles
message ProfileMatchRules {
  string mac_prefix = 1;
  string serial_prefix = 2;
  string model = 3;
  string model_pattern = 4;
  string serial_pattern = 5;
  string manufacturer_match = 6;
  string tpm_vendor = 7;
  map<string, string> custom_attributes = 8;
}

// BMCConfig holds baseboard management controller connection configuration
// for bare metal provisioning via IPMI or Redfish.
message BMCConfig {
  string address = 1;
  int32 port = 2;
  string username = 3;
  string password = 4;
  string protocol = 5;
}

// DeviceProfile represents a device profile configuration.
// Fields 6, 7, 8 (provisioning_network / production_network / quarantine_network)
// are reserved; use the networks map + enrollment_network / post_enrollment_network /
// failure_network instead.
message DeviceProfile {
  uint64 id = 1;
  string name = 2;
  string model = 3;
  DeviceRole role = 4;
  bytes event_log = 5;
  reserved 6, 7, 8;
  reserved "provisioning_network", "production_network", "quarantine_network";
  PlatformdConfigRef platformd_config = 9;
  ProfileMatchRules match_rules = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  bytes config = 13;
  string ek_serial = 14;
  string mac_address = 15;
  bool assigned = 16;
  google.protobuf.Timestamp assigned_at = 17;
  BMCConfig bmc = 18;
  // zone is the profile-level SDN zone. Individual network phase configs may
  // override this value with their own zone field.
  string zone = 19;
  // networks maps logical network names (e.g. "provisioning", "trusted",
  // "quarantine") to their phase configurations.
  map<string, NetworkPhaseConfig> networks = 20;
  // enrollment_network is the key into networks used during device enrollment.
  // Defaults to "provisioning" when empty.
  string enrollment_network = 21;
  // post_enrollment_network is the key into networks the device transitions to
  // after successful enrollment. Defaults to "trusted" when empty.
  string post_enrollment_network = 22;
  // failure_network is the key into networks the device is placed in on
  // enrollment or attestation failure. Defaults to "quarantine" when empty.
  string failure_network = 23;
  string tenant_id = 24;
  // ek_cert is the PEM-encoded TPM Endorsement Key certificate prestaged for
  // this device (paradigm B pre-enrollment config delivery). When set, the
  // config-delivery resolver cryptographically binds direct delivery and
  // remote UKI signing to the hardware EK by comparing this certificate's
  // public key against the EK certificate the booting device presents.
  // The field is intentionally readable as well as writable: an EK
  // certificate is public key material (an X.509 certificate carrying no
  // secrets), so echoing it back in profile reads leaks nothing and lets
  // operators audit which certificate is prestaged.
  string ek_cert = 25;
  // tls_server_name is the certificate name the attestation collector
  // verifies a node of this profile against when it dials the node for a
  // quote. Empty means the device's own FQDN (hostname + internal zone).
  // Set it for fleets whose node webservice certificates carry a role name
  // rather than the device name (the shipped worker templates issue
  // compute.<domain>.internal to every worker). Writable on create and
  // update; an update that omits it keeps the stored value.
  string tls_server_name = 26;
  // pcr_baseline is the expected measured state devices on this profile are
  // verified against (#373). It is READ-ONLY on every transport: the
  // verifier records it on the first fully verified quote (trust on first
  // use) or a signed manifest supplies it, never a caller. Servers ignore
  // this field on CreateProfile and UpdateProfile — a caller-supplied
  // expected state is the defect #373 removed from the attest path — and
  // an update that omits it keeps the stored baseline (#446).
  PCRBaseline pcr_baseline = 27;
}

// PCRBaseline is the expected PCR state recorded for a device profile. See
// DeviceProfile.pcr_baseline for the read-only contract.
message PCRBaseline {
  // values maps a PCR index (0-23) to the expected digest of that register.
  map<uint32, bytes> values = 1;
  // source is how the baseline was established: "signed" (a reference
  // manifest published by the build) or "tofu" (captured from the first
  // fully verified quote of a device on this profile).
  string source = 2;
  // recorded_at is when the baseline was established.
  google.protobuf.Timestamp recorded_at = 3;
  // recorded_from_device_id names the device whose quote seeded a TOFU
  // baseline. Zero for a signed baseline, which has no seeding device.
  uint64 recorded_from_device_id = 4;
}

// DeviceTemplate is a reusable configuration blueprint for device provisioning
message DeviceTemplate {
  uint64 id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  DeviceRole role = 5;
  bytes config = 6;
  ProfileMatchRules match_rules = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  BMCConfig bmc = 10;
}

// Device CRUD messages

message CreateDeviceRequest {
  Device device = 1;
}

message CreateDeviceResponse {
  Status status = 1;
  Device device = 2;
}

message GetDeviceRequest {
  uint64 id = 1;
}

message GetDeviceResponse {
  Device device = 1;
}

message UpdateDeviceRequest {
  Device device = 1;
}

message UpdateDeviceResponse {
  Status status = 1;
  Device device = 2;
}

message DeleteDeviceRequest {
  uint64 id = 1;
}

message DeleteDeviceResponse {
  Status status = 1;
}

message ListDevicesRequest {
  PaginationRequest pagination = 1;
  LabelSelector selector = 2;
}

message ListDevicesResponse {
  repeated Device devices = 1;
  PaginationResponse pagination = 2;
}

message FindDeviceBySerialRequest {
  string serial = 1;
}

message FindDeviceBySerialResponse {
  Device device = 1;
}

message CountDevicesRequest {}

message CountDevicesResponse {
  int32 count = 1;
}

// Profile CRUD messages

message CreateProfileRequest {
  DeviceProfile profile = 1;
}

message CreateProfileResponse {
  Status status = 1;
  DeviceProfile profile = 2;
}

message GetProfileRequest {
  uint64 id = 1;
}

message GetProfileResponse {
  DeviceProfile profile = 1;
}

message UpdateProfileRequest {
  DeviceProfile profile = 1;
}

message UpdateProfileResponse {
  Status status = 1;
  DeviceProfile profile = 2;
}

message DeleteProfileRequest {
  uint64 id = 1;
}

message DeleteProfileResponse {
  Status status = 1;
}

message ListProfilesRequest {
  PaginationRequest pagination = 1;
  LabelSelector selector = 2;
}

message ListProfilesResponse {
  repeated DeviceProfile profiles = 1;
  PaginationResponse pagination = 2;
}

message FindProfileByMACAddressRequest {
  string mac_address = 1;
}

message FindProfileByMACAddressResponse {
  DeviceProfile profile = 1;
}

message FindProfileBySerialRequest {
  string serial = 1;
}

message FindProfileBySerialResponse {
  DeviceProfile profile = 1;
}

message FindMatchingProfileRequest {
  string mac_address = 1;
  string serial = 2;
  string model = 3;
}

message FindMatchingProfileResponse {
  DeviceProfile profile = 1;
}

message CountProfilesRequest {}

message CountProfilesResponse {
  int32 count = 1;
}

// Device activation messages

message ActivateDeviceRequest {
  string serial = 1;
  string mac_address = 2;
}

message ActivateDeviceResponse {
  Status status = 1;
  string activation_status = 2;
  uint32 vlan = 3;
  google.protobuf.Timestamp transitioned_at = 4;
}

// AttestDeviceRequest carries the device identity and its TPM quote evidence.
//
// evidence is the JSON encoding of the platform's DeviceQuoteEvidence: the
// marshaled TPMS_ATTEST quote, the AK signature over it, the anti-replay
// nonce embedded in the quote, an optional expected-PCR policy, and an
// optional AK public key. It is carried as an opaque payload rather than
// modeled field-by-field so that every transport frames the evidence
// identically -- QUIC and the MCP device_attest tool already do -- and so a
// change to the evidence shape does not fork the wire contract per transport.
message AttestDeviceRequest {
  string device_id = 1;
  bytes evidence = 2;
}

// AttestDeviceResponse reports what was verified, not merely whether the
// call succeeded. The individual checks are reported separately from the
// overall verdict so a caller can tell a bad signature from a PCR mismatch
// without parsing a message string.
message AttestDeviceResponse {
  Status status = 1;
  uint64 device_id = 2;
  string serial = 3;
  string model = 4;
  // verified is the overall verdict: true only when every check that ran
  // passed.
  bool verified = 5;
  bool signature_valid = 6;
  bool nonce_valid = 7;
  bool pcrs_valid = 8;
  string attestation_status = 9;
  string message = 10;
  google.protobuf.Timestamp attested_at = 11;
  // ak_certificate_verified is true when the device's enrolled attestation
  // certificate chains to the platform CA and carries
  // tcg-cap-verifiedTPMRestricted (TCG DevID v1 r12 §8.2).
  bool ak_certificate_verified = 12;
  // pcr_baseline_source is where the baseline the quote was compared
  // against came from ("signed" or "tofu"); empty when none was evaluated.
  string pcr_baseline_source = 13;
  // pcr_baseline_recorded_at is when that baseline was recorded.
  google.protobuf.Timestamp pcr_baseline_recorded_at = 14;
  // pcr_baseline_captured is true when this verification recorded the
  // profile's trust-on-first-use baseline from the device's reported values.
  bool pcr_baseline_captured = 15;
}

// Template CRUD messages were removed from this proto to resolve a
// fully-qualified-name collision with vtpm.proto. Device-template CRUD is
// served from the REST surface only — see pkg/webservice/v1/device/
// template_handlers.go. The DeviceTemplate message itself (used as a
// nested field on other RPCs) remains defined below.

// Template operation messages

message CreateProfileFromTemplateRequest {
  uint64 template_id = 1;
  DeviceProfile overrides = 2;
}

// Config delivery messages

message FindConfigForDeviceRequest {
  string ek_serial = 1;
  string mac_address = 2;
}

message FindConfigForDeviceResponse {
  DeviceProfile profile = 1;
}

// Profile assignment messages

message AssignProfileToDeviceRequest {
  uint64 profile_id = 1;
  string ek_serial = 2;
  string mac_address = 3;
  // ek_cert optionally prestages the device's PEM-encoded TPM Endorsement
  // Key certificate on the profile during assignment. The certificate is
  // source-agnostic (swtpm-backed vTPM or physical hardware TPM). When
  // empty, any previously prestaged certificate is left untouched.
  string ek_cert = 4;
}

message AssignProfileToDeviceResponse {
  DeviceProfile profile = 1;
}

message UnassignProfileFromDeviceRequest {
  uint64 profile_id = 1;
}

message UnassignProfileFromDeviceResponse {
  DeviceProfile profile = 1;
}
