syntax = "proto3";

package platform.v1;

option go_package = "github.com/jeremyhahn/go-trusted-platform/sdk/go/gen;platformv1";

import "google/protobuf/timestamp.proto";
import "common.proto";

// Gateway service for multi-mode gateway operations
service GatewayService {
  // Gateway node operations
  rpc GetGatewayStatus(GetGatewayStatusRequest) returns (GetGatewayStatusResponse);
  rpc SetGatewayMode(SetGatewayModeRequest) returns (SetGatewayModeResponse);

  // Telemetry snapshot operations. The snapshot is the whole datapath
  // picture one gatewayd reports: BGP sessions and their BFD state,
  // tunnels, uplink policy routes, the host filter, NAT and the base OVS
  // pipeline. A control plane serves it from the telemetry it has
  // received; a node running its own gateway serves its live state.
  rpc GetGatewaySnapshot(GetGatewaySnapshotRequest) returns (GetGatewaySnapshotResponse);
  rpc ListGatewaySnapshots(ListGatewaySnapshotsRequest) returns (ListGatewaySnapshotsResponse);
  rpc GetGatewayAdmittedVTEP(GetGatewayAdmittedVTEPRequest) returns (GetGatewayAdmittedVTEPResponse);
  rpc ListGatewayAdmittedVTEPs(ListGatewayAdmittedVTEPsRequest) returns (ListGatewayAdmittedVTEPsResponse);

  // BGP operations (transit mode)
  rpc GetBGPStatus(GetBGPStatusRequest) returns (GetBGPStatusResponse);
  rpc ListBGPPeers(ListBGPPeersRequest) returns (ListBGPPeersResponse);
  rpc AnnouncePrefix(AnnouncePrefixRequest) returns (AnnouncePrefixResponse);
  rpc WithdrawPrefix(WithdrawPrefixRequest) returns (WithdrawPrefixResponse);
  rpc ListAnnouncedPrefixes(ListAnnouncedPrefixesRequest) returns (ListAnnouncedPrefixesResponse);

  // IPAM pool CRUD operations
  rpc CreateIPAMPool(CreateIPAMPoolRequest) returns (CreateIPAMPoolResponse);
  rpc GetIPAMPool(GetIPAMPoolRequest) returns (GetIPAMPoolResponse);
  rpc UpdateIPAMPool(UpdateIPAMPoolRequest) returns (UpdateIPAMPoolResponse);
  rpc DeleteIPAMPool(DeleteIPAMPoolRequest) returns (DeleteIPAMPoolResponse);
  rpc ListIPAMPools(ListIPAMPoolsRequest) returns (ListIPAMPoolsResponse);

  // IPAM allocation operations
  rpc AllocateIP(AllocateIPRequest) returns (AllocateIPResponse);
  rpc ReleaseIP(ReleaseIPRequest) returns (ReleaseIPResponse);
  rpc ListAllocations(ListAllocationsRequest) returns (ListAllocationsResponse);

  // Load balancer VIP operations (OVS group-select + conntrack datapath)
  rpc AddVIP(AddVIPRequest) returns (AddVIPResponse);
  rpc RemoveVIP(RemoveVIPRequest) returns (RemoveVIPResponse);
  rpc GetVIP(GetVIPRequest) returns (GetVIPResponse);
  rpc ListVIPs(ListVIPsRequest) returns (ListVIPsResponse);
  rpc SetVIPBackends(SetVIPBackendsRequest) returns (SetVIPBackendsResponse);
  rpc GetLBStatus(GetLBStatusRequest) returns (GetLBStatusResponse);

  // GetNAT64Status reports the stateful NAT64 translator's health: whether
  // the kernel instance is present, and what it holds.
  rpc GetNAT64Status(GetNAT64StatusRequest) returns (GetNAT64StatusResponse);

  // Performance verification operations. These report REAL datapath
  // measurements only: GetPerfFlows times an actual flow install /
  // teardown cycle against a live bridge, GetPerfDatapath and
  // GetPerfConntrack read live ovs-vswitchd counters.
  rpc GetPerfFlows(GetPerfFlowsRequest) returns (GetPerfFlowsResponse);
  rpc GetPerfDatapath(GetPerfDatapathRequest) returns (GetPerfDatapathResponse);
  rpc GetPerfConntrack(GetPerfConntrackRequest) returns (GetPerfConntrackResponse);
}

// Telemetry snapshot request. gateway_id names the reporting gateway; an
// empty id means this node's own gateway.
message GetGatewaySnapshotRequest {
  string gateway_id = 1;
}

message GetGatewaySnapshotResponse {
  GatewaySnapshot snapshot = 1;
}

message ListGatewaySnapshotsRequest {}

message ListGatewaySnapshotsResponse {
  repeated GatewaySnapshot snapshots = 1;
}

message GetGatewayAdmittedVTEPRequest {
  string gateway_id = 1;
  string vtep = 2;
}

message GetGatewayAdmittedVTEPResponse {
  GatewayAdmittedVTEP vtep = 1;
}

message ListGatewayAdmittedVTEPsRequest {
  string gateway_id = 1;
}

message ListGatewayAdmittedVTEPsResponse {
  repeated GatewayAdmittedVTEP vteps = 1;
}

message GatewayAdmittedVTEP {
  string vtep = 1;
  uint64 device_id = 2;
  string host_id = 3;
  string serial = 4;
  string hostname = 5;
  string allocation_id = 6;
  string baseline_source = 7;
  uint64 profile_id = 8;
  google.protobuf.Timestamp verdict_at = 9;
}

// GatewaySnapshot is one gateway's telemetry: what its services programmed,
// as those services report it.
message GatewaySnapshot {
  string gateway_id = 1;
  string hostname = 2;
  string mode = 3;
  google.protobuf.Timestamp reported_at = 4;
  google.protobuf.Timestamp received_at = 5;
  SnapshotHealth health = 6;
  SnapshotBGP bgp = 7;
  repeated SnapshotService services = 8;
  repeated SnapshotTunnel tunnels = 9;
  repeated SnapshotUplink uplinks = 10;
  SnapshotHostFirewall host_firewall = 11;
  SnapshotFirewall firewall = 12;
  SnapshotNAT nat = 13;
  SnapshotPipeline pipeline = 14;
  map<string, string> annotations = 15;
  SnapshotOverlay overlay = 16;
}

message SnapshotOverlay {
  bool running = 1;
  string local_vtep = 2;
  uint32 vni_count = 3;
  uint32 remote_vtep_count = 4;
  uint32 local_mac_count = 5;
  uint32 remote_mac_count = 6;
  uint32 prefix_count = 7;
  uint64 refused_bindings = 8;
  uint32 l3_vni = 9;
  bool arp_suppression_enabled = 10;
  bool anycast_gateway_configured = 11;
  google.protobuf.Timestamp started_at = 12;
  int64 uptime_seconds = 13;
  repeated GatewayAdmittedVTEP admitted_vteps = 14;
  SnapshotOverlayNDCounters nd_counters = 15;
}

message SnapshotOverlayNDCounters {
  uint64 punted = 1;
  uint64 answered = 2;
  uint64 meter_dropped = 3;
  uint64 queue_dropped = 4;
  uint64 fell_through = 5;
}

message SnapshotHealth {
  string status = 1;
  map<string, string> components = 2;
  string message = 3;
}

message SnapshotBGP {
  uint32 local_asn = 1;
  string router_id = 2;
  uint32 peer_count = 3;
  uint32 established_peers = 4;
  repeated string announced_prefixes = 5;
  uint32 received_prefixes = 6;
  repeated SnapshotBGPPeer peers = 7;
}

message SnapshotBGPPeer {
  string address = 1;
  uint32 asn = 2;
  string description = 3;
  string state = 4;
  uint64 uptime_seconds = 5;
  bool admin_down = 6;
  int64 prefixes_received = 7;
  int64 prefixes_accepted = 8;
  int64 prefixes_sent = 9;
  int64 messages_received = 10;
  int64 messages_sent = 11;
  string local_address = 12;
  string remote_router_id = 13;
  uint32 hold_time_seconds = 14;
  repeated string families = 15;
  string last_error = 16;
  SnapshotBFD bfd = 17;
}

message SnapshotBFD {
  string state = 1;
  string remote_state = 2;
  uint64 failure_transitions = 3;
  google.protobuf.Timestamp last_failure = 4;
  string diagnostic = 5;
  string remote_diagnostic = 6;
  int64 tx_interval_ms = 7;
  int64 rx_interval_ms = 8;
  uint32 detection_multiplier = 9;
}

message SnapshotService {
  string name = 1;
  bool active = 2;
  bool healthy = 3;
  string refused_reason = 4;
}

message SnapshotTunnel {
  string name = 1;
  string transport = 2;
  string type = 3;
  string state = 4;
  string uplink = 5;
  bool bound = 6;
  string local_ip = 7;
  string remote_ip = 8;
  string tunnel_ip = 9;
  uint64 rx_bytes = 10;
  uint64 tx_bytes = 11;
  uint64 rx_packets = 12;
  uint64 tx_packets = 13;
  int64 rekey_seconds = 14;
  google.protobuf.Timestamp last_rekey = 15;
}

message SnapshotUplink {
  string name = 1;
  string interface = 2;
  int32 table = 3;
  string gateway_v4 = 4;
  string gateway_v6 = 5;
  repeated string addresses = 6;
  int32 priority = 7;
  int32 rule_count = 8;
  repeated string tunnels = 9;
}

message SnapshotHostFirewall {
  bool active = 1;
  bool installed = 2;
  string fingerprint = 3;
  int32 rule_count = 4;
  google.protobuf.Timestamp last_reconcile = 5;
  string last_error = 6;
}

message SnapshotFirewall {
  bool active = 1;
  int32 flow_count = 2;
  google.protobuf.Timestamp last_reconcile = 3;
  map<string, uint32> ct_zones = 4;
}

message SnapshotNAT {
  bool active = 1;
  bool snat_enabled = 2;
  int32 dnat_rules = 3;
  uint32 ct_zone = 4;
  repeated SnapshotNATUplink uplinks = 5;
}

message SnapshotNATUplink {
  string name = 1;
  bool is_default = 2;
  int32 pool_addresses = 3;
  int32 ports = 4;
  int32 static_translations = 5;
}

message SnapshotPipeline {
  bool installed = 1;
  string bridge = 2;
  string owner = 3;
  string terminal = 4;
  string fail_mode = 5;
}

// Gateway mode
enum GatewayModeEnum {
  GATEWAY_MODE_UNSPECIFIED = 0;
  GATEWAY_MODE_OVERLAY = 1;
  GATEWAY_MODE_EDGE = 2;
  GATEWAY_MODE_TRANSIT = 4;
}

// Gateway status
message GatewayStatus {
  string id = 1;
  string node_id = 2;
  uint32 modes = 3; // Bitmask of GatewayModeEnum
  string tier = 4;  // backbone, datacenter, coordinator
  double reputation = 5;
  uint64 uptime_seconds = 6;
  bool healthy = 7;
  google.protobuf.Timestamp started_at = 8;
}

// BGP peer information
message BGPPeer {
  string address = 1;
  uint32 asn = 2;
  string state = 3;
  string description = 4;
  uint32 prefixes_received = 5;
  uint32 prefixes_sent = 6;
  google.protobuf.Timestamp uptime = 7;
}

// BGP status
message BGPStatus {
  uint32 local_asn = 1;
  string router_id = 2;
  uint32 peer_count = 3;
  uint32 established_peers = 4;
  uint32 prefixes_announced = 5;
  bool running = 6;
}

// Announced prefix
message AnnouncedPrefix {
  string prefix = 1;
  string next_hop = 2;
  google.protobuf.Timestamp announced_at = 3;
}

// IPAMPool represents a managed IP address pool.
message IPAMPool {
  // Unique pool identifier.
  string id = 1;
  // Human-readable display name.
  string name = 2;
  // CIDR range for the pool (immutable after creation).
  string cidr = 3;
  // Optional gateway address within the CIDR.
  string gateway = 4;
  // Underlay zone of a zone pool (e.g. "control-plane", "provisioning");
  // empty for overlay and IPAM-range pools.
  string zone = 5;
  // Optional description of the pool's purpose.
  string description = 6;
  // Total allocatable IP count (usable addresses less reserved ones).
  uint64 total = 7;
  // Currently allocated IP count.
  uint64 allocated = 8;
  // Currently available IP count.
  uint64 available = 9;
  // Default lease duration in nanoseconds (0 = never expire).
  int64 default_lease_duration_nanos = 10;
  // Inactivity timeout in nanoseconds before an allocation expires.
  int64 inactivity_timeout_nanos = 11;
  // When this pool was created.
  google.protobuf.Timestamp created_at = 12;
  // When this pool was last modified.
  google.protobuf.Timestamp updated_at = 13;
  // Prefixes inside the CIDR that are never allocatable (CIDR notation).
  // The gateway is always reserved as well.
  repeated string reserved = 14;
  // First and last address of the dynamic allocation window; both empty
  // means the whole CIDR.
  string range_start = 15;
  string range_end = 16;
}

// IP allocation
message IPAllocation {
  string ip = 1;
  string pool_id = 2;
  string device_id = 3;
  string hostname = 4;
  google.protobuf.Timestamp allocated_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// Request/Response messages — Gateway

message GetGatewayStatusRequest {}
message GetGatewayStatusResponse {
  GatewayStatus status = 1;
}

message SetGatewayModeRequest {
  uint32 modes = 1; // Bitmask of GatewayModeEnum
}
message SetGatewayModeResponse {
  Status status = 1;
  GatewayStatus gateway_status = 2;
}

message GetBGPStatusRequest {}
message GetBGPStatusResponse {
  BGPStatus status = 1;
}

message ListBGPPeersRequest {}
message ListBGPPeersResponse {
  repeated BGPPeer peers = 1;
}

message AnnouncePrefixRequest {
  string prefix = 1;
  string next_hop = 2;
}
message AnnouncePrefixResponse {
  Status status = 1;
}

message WithdrawPrefixRequest {
  string prefix = 1;
}
message WithdrawPrefixResponse {
  Status status = 1;
}

message ListAnnouncedPrefixesRequest {}
message ListAnnouncedPrefixesResponse {
  repeated AnnouncedPrefix prefixes = 1;
}

// Request/Response messages — IPAM Pool CRUD

// CreateIPAMPoolRequest creates a new IP address pool.
message CreateIPAMPoolRequest {
  // Pool ID; generated server-side when empty.
  string id = 1;
  // Human-readable display name (required).
  string name = 2;
  // CIDR range (required; immutable after creation).
  string cidr = 3;
  // Optional gateway address within the CIDR.
  string gateway = 4;
  // Optional underlay zone for the pool (e.g. "control-plane").
  string zone = 5;
  // Optional description.
  string description = 6;
  // Default lease duration in nanoseconds (0 = never expire).
  int64 default_lease_duration_nanos = 7;
  // Inactivity timeout in nanoseconds.
  int64 inactivity_timeout_nanos = 8;
  // Prefixes inside the CIDR that are never allocatable (CIDR notation).
  repeated string reserved = 9;
  // Dynamic allocation window; set both or neither.
  string range_start = 10;
  string range_end = 11;
}

message CreateIPAMPoolResponse {
  Status status = 1;
  IPAMPool pool = 2;
}

// GetIPAMPoolRequest retrieves a pool by ID.
message GetIPAMPoolRequest {
  string id = 1;
}

message GetIPAMPoolResponse {
  IPAMPool pool = 1;
}

// UpdateIPAMPoolRequest updates mutable pool fields.
// CIDR is immutable and will be rejected if changed.
message UpdateIPAMPoolRequest {
  string id = 1;
  // Updated display name.
  string name = 2;
  // Updated gateway address.
  string gateway = 3;
  // Updated zone.
  string zone = 4;
  // Updated description.
  string description = 5;
  // Updated default lease duration in nanoseconds.
  int64 default_lease_duration_nanos = 6;
  // Updated inactivity timeout in nanoseconds.
  int64 inactivity_timeout_nanos = 7;
  // When true, reserved, range_start and range_end replace the pool's
  // allocation window (empty values clear it); when false they are ignored.
  bool update_window = 8;
  // Replacement reserved prefixes (CIDR notation).
  repeated string reserved = 9;
  // Replacement dynamic allocation window; set both or neither.
  string range_start = 10;
  string range_end = 11;
}

message UpdateIPAMPoolResponse {
  Status status = 1;
  IPAMPool pool = 2;
}

// DeleteIPAMPoolRequest deletes a pool by ID.
// Returns NOT_FOUND when the pool does not exist (idempotent on repeat calls
// after the pool is gone is acceptable — callers should treat NOT_FOUND as
// success on a delete).  Returns FAILED_PRECONDITION when active allocations
// exist.
message DeleteIPAMPoolRequest {
  string id = 1;
}

message DeleteIPAMPoolResponse {
  Status status = 1;
}

// ListIPAMPoolsRequest lists pools with optional zone filter.
message ListIPAMPoolsRequest {
  // Optional zone filter; empty returns all pools.
  string zone = 1;
}
message ListIPAMPoolsResponse {
  repeated IPAMPool pools = 1;
}

// Request/Response messages — IPAM Allocations

message AllocateIPRequest {
  string pool_id = 1;
  string device_id = 2;
  string hostname = 3;
}
message AllocateIPResponse {
  Status status = 1;
  IPAllocation allocation = 2;
}

message ReleaseIPRequest {
  string ip = 1;
}
message ReleaseIPResponse {
  Status status = 1;
}

message ListAllocationsRequest {
  string pool_id = 1; // Empty for all pools
}
message ListAllocationsResponse {
  repeated IPAllocation allocations = 1;
}

// =============================================================================
// Load balancer VIP messages
// =============================================================================

// VIPBackend is one load-balanced endpoint behind a VIP.
message VIPBackend {
  // Backend IPv4 address.
  string address = 1;
  // Backend L4 port (1-65535).
  uint32 port = 2;
  // Relative selection weight; zero means 1.
  uint32 weight = 3;
}

// VIPConfig defines a load-balanced virtual IP.
message VIPConfig {
  // Virtual IPv4 address.
  string address = 1;
  // Virtual L4 port (1-65535).
  uint32 port = 2;
  // "tcp" or "udp".
  string protocol = 3;
  // "hash" or "round-robin" (both hash-based select-group balancing);
  // empty inherits the service default.
  string algorithm = 4;
  // Load-balanced endpoints.
  repeated VIPBackend backends = 5;
}

// VIPBackendStatus reports one backend and its probed health.
message VIPBackendStatus {
  VIPBackend backend = 1;
  bool healthy = 2;
}

// VIPStatus is a point-in-time snapshot of one VIP.
message VIPStatus {
  VIPConfig vip = 1;
  // Conntrack zone carrying the VIP's connection state.
  uint32 ct_zone = 2;
  // OpenFlow select group distributing the VIP.
  uint32 group_id = 3;
  // Per-backend health.
  repeated VIPBackendStatus backends = 4;
}

// LBStatus is a point-in-time snapshot of the load balancer service.
message LBStatus {
  bool active = 1;
  uint32 vip_count = 2;
  uint32 healthy_backends = 3;
  uint32 total_backends = 4;
  google.protobuf.Timestamp last_reconcile = 5;
}

// Request/Response messages — Load balancer VIPs

message AddVIPRequest {
  VIPConfig vip = 1;
}
message AddVIPResponse {
  Status status = 1;
  VIPStatus vip = 2;
}

message RemoveVIPRequest {
  // "tcp" or "udp".
  string protocol = 1;
  // Virtual IPv4 address.
  string address = 2;
  // Virtual L4 port.
  uint32 port = 3;
}
message RemoveVIPResponse {
  Status status = 1;
}

message GetVIPRequest {
  string protocol = 1;
  string address = 2;
  uint32 port = 3;
}
message GetVIPResponse {
  VIPStatus vip = 1;
}

message ListVIPsRequest {}
message ListVIPsResponse {
  repeated VIPStatus vips = 1;
}

message SetVIPBackendsRequest {
  string protocol = 1;
  string address = 2;
  uint32 port = 3;
  // Replacement backend set.
  repeated VIPBackend backends = 4;
}
message SetVIPBackendsResponse {
  Status status = 1;
  VIPStatus vip = 2;
}

message GetLBStatusRequest {}
message GetLBStatusResponse {
  LBStatus status = 1;
}

// Request/Response messages — NAT64 translator

// NAT64Status is a point-in-time snapshot of the NAT64 translator. Every
// field except the identity pair is what the kernel reported, not what the
// configuration asked for: a started service whose instance has gone
// reports instance_present false.
message NAT64Status {
  // active reports whether the service is started.
  bool active = 1;
  // instance_present reports whether the kernel held the instance at the
  // last check.
  bool instance_present = 2;
  // prefix is the RFC 6052 translation prefix in use.
  string prefix = 3;
  // instance is the kernel instance name.
  string instance = 4;
  // sessions is the live translation session count.
  uint64 sessions = 5;
  // pool4_used is the number of allocated address:port pairs.
  uint64 pool4_used = 6;
  // module_version is the translator's reported version.
  string module_version = 7;
  // flow_count is the number of pipeline flows the service holds.
  uint32 flow_count = 8;
  // last_reconcile is when the translator and flows were last converged.
  google.protobuf.Timestamp last_reconcile = 9;
  // last_error is the last reconcile failure, empty when the last
  // succeeded.
  string last_error = 10;
}

message GetNAT64StatusRequest {}
message GetNAT64StatusResponse {
  NAT64Status status = 1;
}

// Request/Response messages — Performance verification

// GetPerfFlowsRequest configures one measured flow-programming run.
message GetPerfFlowsRequest {
  // Number of ephemeral flows to install (1-100000; default 1000).
  uint32 count = 1;
  // Install with a single batched barrier instead of one-by-one.
  bool batch = 2;
  // Target bridge; empty selects the daemon's default bridge.
  string bridge = 3;
}

// GetPerfFlowsResponse reports the measured flow-programming results.
message GetPerfFlowsResponse {
  // Number of flows actually installed.
  uint32 installed = 1;
  // Measured install duration (monotonic clock) in nanoseconds.
  int64 duration_ns = 2;
  // installed / duration.
  double flows_per_second = 3;
  // Whether the run used the batched install path.
  bool batched = 4;
  // Bridge the flows were installed on.
  string bridge = 5;
}

// GetPerfDatapathRequest selects the bridge whose datapath type is
// inspected; the lookup counters are per-datapath, not per-bridge.
message GetPerfDatapathRequest {
  string bridge = 1;
}

// GetPerfDatapathResponse reports live datapath counters.
message GetPerfDatapathResponse {
  // Datapath flow-cache hit counter.
  uint64 hits = 1;
  // Upcall (cache miss) counter.
  uint64 misses = 2;
  // Dropped-upcall counter.
  uint64 lost = 3;
  // Number of datapath flows currently offloaded to hardware.
  uint64 offloaded_flow_count = 4;
  // Open_vSwitch other_config hw-offload switch state.
  bool hw_offload_enabled = 5;
  // Bridge datapath type ("system" or "netdev").
  string datapath_type = 6;
  // Bridge whose datapath_type was inspected.
  string bridge = 7;
}

// GetPerfConntrackRequest optionally restricts the summary to one zone.
message GetPerfConntrackRequest {
  // Conntrack zone filter; absent summarizes every zone.
  optional uint32 zone = 1;
}

// GetPerfConntrackResponse summarizes the connection tracking table.
message GetPerfConntrackResponse {
  // Total conntrack entries in the dump.
  uint64 total_entries = 1;
  // Per-zone entry counts.
  map<uint32, uint64> per_zone = 2;
}
