# SPDX-License-Identifier: Apache-2.0
#
# The gatewayd supervisor <-> service-process IPC contract (#557). Generated
# into pkg/sdn/gateway/ipc/gen, beside the contract, not into the public SDK
# tree: the contract is internal to one gatewayd binary.

version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: gen
    opt:
      - paths=source_relative
inputs:
  - directory: proto
