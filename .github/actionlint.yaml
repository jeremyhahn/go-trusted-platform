# actionlint configuration, read by `make lint`.
#
# The custom labels of our Gitea runners:
#
# - `ci-gate` is the reserved label of the 1-CPU gate runners the CI Gate job
#   in ci.yml runs on (DS-2273); that job takes no checkout and no `uses:`.
# - `batch` is the self-hosted label of the batch runners batch.yml runs on
#   (#860); nothing else uses it.
# - `bigdisk` is the label of the Dell/omega runners with the large disks; the
#   Devcontainer image and Integration jobs in ci.yml run on it on Gitea
#   (DS-2467, DS-3381); on github.com they fall back to ubuntu-latest.
# - `codex` and `qwen` are the review runners code-review.yml runs on: Codex
#   on `codex`, the advisory opencode review on `qwen` (ci-node-2), handbook
#   code-review template v5.3 (m826).
self-hosted-runner:
  labels:
    - ci-gate
    - batch
    - bigdisk
    - codex
    - qwen

# The ignore is deliberate and scoped to one file and one message:
paths:
  # Gitea's act runner implements the v3 artifact protocol only; v4 needs the
  # GitHub artifact service and fails on this runner (#776).
  .github/workflows/nightly.yml:
    ignore:
      - 'the runner of "actions/upload-artifact@v3" action is too old'
