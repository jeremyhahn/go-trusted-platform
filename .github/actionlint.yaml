# actionlint configuration, read by `make lint`.
#
# The ignore is deliberate and scoped to one file and one message:
paths:
  # Gitea's act runner implements the v3 artifact protocol only; v4 needs the
  # GitHub artifact service and fails on this runner (#776).
  .github/workflows/nightly.yml:
    ignore:
      - 'the runner of "actions/upload-artifact@v3" action is too old'
