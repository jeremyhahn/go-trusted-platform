# actionlint configuration, read by `make lint`.
#
# Both ignores are deliberate and scoped to one file and one message:
paths:
  # The gonext job is PARKED with `if: false` until Go 1.28 ships (see the
  # comment on the job); restoring it deletes that line.
  .github/workflows/ci.yml:
    ignore:
      - 'constant expression "false" in condition'
  # Gitea's act runner implements the v3 artifact protocol only; v4 needs the
  # GitHub artifact service and fails on this runner (#776).
  .github/workflows/nightly.yml:
    ignore:
      - 'the runner of "actions/upload-artifact@v3" action is too old'

self-hosted-runner:
  labels:
    - qwen
