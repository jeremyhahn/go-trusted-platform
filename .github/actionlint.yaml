# actionlint-template: v7. Self-hosted runner labels for actionlint.
self-hosted-runner:
  labels:
    - ubuntu-latest
    - ubuntu-22.04
    # 2026-11-10, m2406: the bigdisk runner's set [self-hosted, linux, x64, bigdisk] (ci.yml race).
    - self-hosted
    - linux
    - x64
    - codex
    - codex-task
    - claude
    - code-review
    - batch
    - bigdisk
    # scans.yml runs `make vuln` on this label.
    - bigdisk-docker
    - ci-gate
    - qwen
    - dells
    - release

# CUSTOMIZE (this project): the ignore is deliberate and scoped to one file and one message:
paths:
  # Some forges' runners implement only the v3 artifact protocol.
  .github/workflows/nightly.yml:
    ignore:
      - 'the runner of "actions/upload-artifact@v3" action is too old'
