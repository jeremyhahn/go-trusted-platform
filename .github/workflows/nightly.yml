# nightly-template: v1.0 — the known-red and long-horizon jobs, off the push path.
#
# Owner ruling 2026-08-20 (fail-fast pipeline for iteration speed): jobs that
# are known-red with tracked issues, or that verify a slow-moving property, do
# NOT run per push — a known-red job burning runner-minutes per push produces
# information we already have. They run here nightly, plus on demand via
# workflow_dispatch, and are NOT in any merge gate. When their tracked issues
# land, a job may move back to ci.yml — that move is deliberate, not automatic.
#
# Repo-specific notes for go-trusted-platform:
#
#   fips  — STILL RED, on causes this repo cannot close. Retriaged 2026-09-03
#           (#209), which fixed three of the four causes below plus the
#           registry envelope. Read the corrections: the previous note here was
#           wrong about which repository owns the Noise guard, and it
#           undercounted, because a panicking test aborts the whole test binary
#           and hides every test after it.
#
#           REMAINING, all owned elsewhere: pkg/api/noise (upstream, xkms #269),
#           pkg/store/certstore (upstream, xkms #270), pkg/dns (#249, owner
#           decision). Nothing in this repo will turn them green.
#
#           READ THIS BEFORE SIZING WORK FROM THIS JOB'S LOG: a failure count
#           taken from it is a LOWER BOUND whenever a panic is involved. Go
#           aborts the whole test binary on an unrecovered panic, so every test
#           after it in that package never runs and never reports. Under
#           fips140=only the enforcement is by PANIC, not by error — short HMAC
#           keys, SHA-1, MD5 all panic — so this job hides failures far more
#           than an ordinary suite does. pkg/bmc reported one failing test and
#           had three (#209). Fix the first panic, re-run, and expect more.
#
#             pkg/dns          1 test, A FIFTH CAUSE, found 2026-09-03 and not
#                              present in the run #209 was filed from.
#                              `crypto/sha1: use of SHA-1 is not allowed`, via
#                              miekg/dns.HashName from generateNSEC3Chain.
#                              RFC 5155 defines exactly one NSEC3 hash and it is
#                              SHA-1, so there is no approved option to select:
#                              a FIPS deployment either falls back to NSEC or
#                              refuses to sign. Ruling 7 territory, owner call.
#                              Tracked as #249.
#
#           FIXED in #209, kept here as the record of what these were:
#
#             pkg/api/noise    11 tests. `noise: X25519 is unavailable in FIPS
#                              build`. NOT this repo's guard — pkg/api/noise
#                              contains no build-tagged file at all. The
#                              refusal is go-truststrap's
#                              pkg/noiseproto/dh_fips.go, reached through
#                              quicbaas sdk/go/xkms/trust/bootstrap. It is what
#                              docs/04 ruling 4 intends, and the approved-curve
#                              variant ruling 4 anticipated now EXISTS upstream
#                              (truststrap p256proto,
#                              TSBOOT1_P256_AESGCM_SHA256, v0.3.0-alpha) but has
#                              not propagated: xkms still pins truststrap
#                              v0.2.0-alpha, so no released quicbaas carries it.
#                              Tracked upstream; nothing to fix in this repo.
#             pkg/crypto/aesgcm
#                              3 tests. Seal/Open moved to
#                              NewGCMWithRandomNonce. The "drops the TPM/HSM
#                              entropy seam — owner call" note that stood here
#                              was moot: Seal and Open had NO production caller
#                              (pkg/app calls only GenerateKey, which never
#                              built a GCM), so there was no seam in use to
#                              drop. The reader now feeds GenerateKey, which
#                              had silently ignored it.
#             pkg/registry     Both AES-GCM sites moved. LocalKMSClient was a
#                              PRODUCTION fix the nightly never showed: it had
#                              no test at all, so a path registry init wires up
#                              (registry_init.go) was broken under FIPS and
#                              invisible. Its wire format — nonce || ciphertext
#                              || tag — is byte-identical before and after,
#                              pinned by a checked-in vector. The layer envelope
#                              moved to v2 (nonce inside the ciphertext) with NO
#                              migration and no v1 decoder: the owner confirmed
#                              on 2026-09-03 that no registry had been deployed,
#                              so no v1 envelope has ever existed outside a
#                              test. The absence of a migration is the correct
#                              outcome, not an oversight.
#             pkg/bmc          1 test reported, THREE actually broken. The
#                              panic in TestDeriveKeys_HMACSHA256 aborted the
#                              binary before TestComputeAuthHMAC_SHA256 and
#                              TestHMACSHA256_KnownVector could run. RMCP+ now
#                              refuses a credential below the 112-bit HMAC floor
#                              at session open with a typed error instead of
#                              panicking mid-handshake — the check is a RUNTIME
#                              one, because ruling 1 makes FIPS activation a
#                              deployment decision, so an untagged binary run
#                              under fips140=only would otherwise still crash.
#                              RFC 4231's vectors moved behind !fips: their keys
#                              are 4 bytes and cannot be lengthened.
#             pkg/store/certstore
#                              1 test. go-xkms certstore.ToString calls sha1.Sum
#                              for a thumbprint. Upstream, tracked; this repo
#                              only adapts the type.
#
#           Do NOT weaken this to fips140=on to make it green — see the
#           template's reasoning: `on` permits non-approved algorithms, so the
#           gate would report success while a regulated path used prohibited
#           cryptography.
#
#           The earlier note here blamed go-quicbaas reaching uuid.NewSHA1
#           through go-qrdb's deterministicUUID in package init (issue #15).
#           That no longer reproduces. What DID reproduce for weeks was a
#           harness defect: this job overrode BUILD_TAGS on the make command
#           line, and a command-line variable beats every `BUILD_TAGS +=` in
#           the Makefile, so the FIPS suite silently ran without codec_json,
#           codec_msgpack, codec_cbor, raft, pkcs8, frost or objstore. Nineteen
#           tests failed with `no codec available for encoding` and were read
#           as FIPS findings. The job now sets WITH_FIPS=1, which appends.
#
#   trivy — deliberately NOT moved here, unlike ci-template v1.9. devops.md §8
#           is normative: `trivy fs` is BLOCKING on CRITICAL/HIGH and the gate
#           job must include the security jobs in its needs. The template's
#           reason for moving it — known-red from an undiagnosed install
#           failure — does not hold in this repo: trivy is green here and caught
#           two live HIGH CVEs on 2026-08-19. It stays in ci.yml, gating.

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.26.7"
  # Builds never resolve through a workspace: first-party modules come from
  # Gitea tags (conventions/dependency-resolution.md §2).
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"

jobs:
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone; build health is ci.yml's job.
    timeout-minutes: 60
    env:
      GOFIPS140: latest
      # STRICT mode, not `on` (ratified 2026-08-17). `fips140=on` loads the Go
      # Cryptographic Module but still PERMITS non-approved algorithms, so a
      # path using MD5 or SHA-1 succeeds and the gate reports green while a
      # regulated path uses prohibited cryptography. `fips140=only` makes those
      # operations error or panic, which is what a FedRAMP / PCI DSS / HIPAA
      # compliance gate has to do.
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # BOTH halves matter and they do different jobs:
      #   -tags fips        selects the FIPS implementations at COMPILE time,
      #                     so MD5/SHA-1 are not linked in at all.
      #   GODEBUG=fips140=only  enforces at RUNTIME, and is what proves the
      #                     compile-time gate was complete.
      # Without the tag this job would verify the NON-FIPS code paths, which is
      # exactly the trap Codex caught on PR for #24.
      # `make print-build-tags WITH_FIPS=1` is the same tag list every other
      # make target compiles with, plus `fips`. Hand-writing `-tags fips` here
      # compiled the stub halves of every tag-gated package instead.
      - name: Build all packages (FIPS mode)
        run: go build -tags "$(make print-build-tags WITH_FIPS=1)" ./...

      # CUSTOMIZE (template v1.4.1): this MUST mirror the repo's own unit-test
      # invocation — same build tags, same package scope, same exclusions —
      # with ONLY the FIPS env changed. This repo's Test job is `make test`,
      # which carries BUILD_TAGS, TEST_SKIP and TEST_EXCLUDE; a bare
      # `go test ./...` would drag in hardware/root/daemon suites and fail for
      # reasons that have nothing to do with FIPS.
      #
      # WITH_FIPS=1, never BUILD_TAGS="...": the second form does not mirror
      # `make test`, it replaces its tag list.
      - name: Unit tests (FIPS mode)
        run: make test WITH_FIPS=1

  # A `schedule` run publishes no commit status of its own, so before this job
  # a red nightly turned nothing red anywhere and nobody found out. This puts
  # the result on the commit that produced it.
  #
  # It is deliberately NOT named `CI / ...`. The nightly jobs are not in any
  # merge gate (owner ruling 2026-08-20) and `main`'s branch protection
  # requires exactly one context, `CI / CI Gate (pull_request)`. This adds a
  # context nothing requires: visibility, not gating.
  #
  # Why a separate job rather than a step inside `fips`: measured on this
  # Gitea (1.27.1, probe matrix on run 9586), the statuses API is gated on the
  # token holding repository WRITE, and `permissions:` understands `contents`
  # but not `statuses` — `contents: read` + `statuses: write` returns 403
  # ("user should have a permission to write to a repo"), a bare `contents:
  # write` returns 201, and omitting the block entirely also returns 403
  # because the default is read-only. So publishing a status costs
  # `contents: write`. Confining that to a job that checks out nothing and
  # runs one curl keeps the write token away from the job that compiles and
  # runs the suite.
  publish-status:
    name: Publish FIPS status
    needs: fips
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # BOTH are needed, one per host. Gitea gates the statuses API on
      # repository write and does not understand a `statuses` scope; GitHub
      # does understand it and, once `permissions:` is declared explicitly,
      # withholds status creation without it.
      contents: write
      statuses: write
    steps:
      # GITHUB_API_URL is the API root on both hosts — Gitea's `<root>/api/v1`,
      # GitHub's `https://api.github.com` — and POST
      # /repos/{owner}/{repo}/statuses/{sha} takes the same body on each, so no
      # `github.server_url` guard is needed (devops.md §1). GITHUB_RUN_ID, never
      # GITHUB_RUN_NUMBER: a run's id and its number are different identifiers.
      - name: Publish commit status
        env:
          CI_TOKEN: ${{ github.token }}
          STATE: ${{ needs.fips.result == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "fips=${{ needs.fips.result }} state=${STATE} target=${target}"
          curl -sS -f -X POST \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"Nightly / FIPS\",\"description\":\"nightly FIPS suite (not a merge gate)\",\"target_url\":\"${target}\"}"
