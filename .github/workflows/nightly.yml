# nightly-template: v1.0. Known-red and long-horizon jobs, off the push path.

name: Nightly

# Nightly schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: '5 6 * * *'

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.27.4"
  # Builds never resolve through a workspace.
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"

jobs:
  # The same job runs in ci.yml on push to main.
  fips:
    name: FIPS (shard ${{ matrix.shard }}/4)
    # Hosted runners: four shards of `make test-fips` (Makefile SHARD/SHARDS).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # needs: none — nightly runs standalone; build health is ci.yml's job.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # pkg/diskimage/netboot repacks its installer initramfs with cpio.
      - name: Install cpio for the netboot media tests
        run: sudo apt-get update && sudo apt-get install -y cpio

      # libssl-dev: go-tpm-tools' simulator compiles the reference TPM against OpenSSL.
      - name: Install OpenSSL headers for the TPM simulator
        run: sudo apt-get install -y libssl-dev

      # `make test-fips` is `make test` with the FIPS build tag and environment.
      - name: FIPS build and unit tests
        run: make test-fips SHARD=${{ matrix.shard }} SHARDS=4

  # rpi-image: the Raspberry Pi factory image (docs/factory-image/).
  rpi-image:
    name: Raspberry Pi image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # binfmt for the arm64 containers, with the F flag so a chroot inside the assemble container can exec.
      - name: Register binfmt handlers
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      # The job container shares the runner host's kernel, where loop and dm_crypt are normally loaded.
      - name: Load kernel modules the assemble container relies on
        run: |
          for m in loop dm_crypt; do
            if [ ! -d "/sys/module/$m" ]; then
              command -v modprobe >/dev/null || { sudo apt-get update && sudo apt-get install -y kmod; }
              sudo modprobe "$m"
            fi
            test -d "/sys/module/$m"
          done

      # swtpm runs on the runner: it cannot create its sockets in a qemu-user container.
      - name: Install swtpm for the userspace suite
        run: sudo apt-get update && sudo apt-get install -y swtpm

      # Alpine's aarch64 kernels lack the memory-mapped TIS TPM driver, so the QEMU stand-in boots a platform-built kernel, cached by its inputs' digests.
      - name: Build the virt kernel
        run: make virt-kernel-build

      - name: Build the QEMU virt image
        run: make image-rpi-qemu

      - name: Build the Raspberry Pi image
        run: make image-rpi

      - name: Inspect the images
        run: |
          bin/platformctl diskimage inspect bin/trusted-platform-qemu-virt.img
          bin/platformctl diskimage inspect bin/trusted-platform-rpi.img

      - name: aarch64 userspace suite (platformd + swtpm in an arm64 container)
        run: make integration-test-diskimage-userspace

      - name: Emulated first boot
        run: make integration-test-diskimage

      - name: Keep the images
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: rpi-images
          retention-days: 7
          path: |
            bin/trusted-platform-rpi.img
            build/docker/uboot-builder/output/manifest.json
            build/docker/uboot-builder/output/*/u-boot.config
            build/docker/uboot-builder/output/*/SHA256SUMS
            build/docker/virt-kernel-builder/output/manifest.json
            build/docker/virt-kernel-builder/output/*/config-*
            build/docker/virt-kernel-builder/output/*/SHA256SUMS

  # A workflow_dispatch run publishes no commit status, so this job publishes one.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone; build health is ci.yml's job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Scan flags match ci.yml's gate.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples,vbmc,web/node_modules
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs-nightly

      - name: Trivy scan (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples,vbmc,web/node_modules
          trivyignores: .trivyignore

      # Off github.com, install the trivy CLI and run the same scan.
      - name: Install Trivy CLI
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy scan (fail on CRITICAL/HIGH)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --skip-dirs test --skip-dirs examples --skip-dirs vbmc --skip-dirs web/node_modules .

  publish-status:
    timeout-minutes: 10
    name: Publish nightly status
    needs: [fips, trivy, rpi-image]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # Both are needed, one per host.
      contents: write
      statuses: write
    steps:
      # POST /repos/{owner}/{repo}/statuses/{sha} works the same on every forge.
      - name: Publish commit status
        env:
          CI_TOKEN: ${{ github.token }}
          STATE: ${{ needs.fips.result == 'success' && 'success' || 'failure' }}
          TRIVY_STATE: ${{ needs.trivy.result == 'success' && 'success' || 'failure' }}
          RPI_STATE: ${{ needs.rpi-image.result == 'success' && 'success' || 'failure' }}
        run: |
          set -uo pipefail
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Each status is posted independently; the exit codes are collected at the end.
          publish() {
            local state="$1" context="$2" description="$3"
            echo "publishing ${context}: ${state}"
            curl -sS -f -X POST \
              -H "Authorization: token ${CI_TOKEN}" \
              -H "Content-Type: application/json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "{\"state\":\"${state}\",\"context\":\"${context}\",\"description\":\"${description}\",\"target_url\":\"${target}\"}"
          }

          rc=0
          echo "fips=${{ needs.fips.result }} state=${STATE}"
          publish "${STATE}" "Nightly / FIPS" "FIPS suite (not a merge gate)" || rc=1

          # A separate context, never folded into the FIPS one.
          echo "trivy=${{ needs.trivy.result }} state=${TRIVY_STATE}"
          publish "${TRIVY_STATE}" "Nightly / Trivy" "CVEs published since the last push (not a merge gate)" || rc=1

          # Its own context: the image build, the U-Boot build and the arm64 userspace suite.
          echo "rpi-image=${{ needs.rpi-image.result }} state=${RPI_STATE}"
          publish "${RPI_STATE}" "Nightly / Raspberry Pi image" "factory image build, U-Boot and the aarch64 userspace suite (not a merge gate)" || rc=1

          exit "$rc"
