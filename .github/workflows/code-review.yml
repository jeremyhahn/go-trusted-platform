# Label-triggered peer review, with auto-merge on approval.
#
# TRIGGER: apply the `code-review` label when the PR is ready. On-push review
# spent a reviewer on every intermediate commit, including branches the author
# knew were unfinished.
#
# MODEL SELECTION IS BY LABEL, and the label namespace is `model:`:
#   code-review                  trigger; qwen on the GPU host by default
#   code-review + model:codex    route to Codex instead
#   code-review + model:qwen-122b / model:coder-next   a different local model
# `review:codex` is still honoured so PRs labelled before this change work.
# The two jobs are mutually exclusive by construction, so one head can never
# collect two conflicting verdicts.
# Fallback rule: ../handbook/software/conventions/model-usage.md §5.
#
# GITEA IS NOT GITHUB. GitHub sends action=labeled with a top-level `label`
# object; Gitea 1.27 sends action=label_updated and NO label object, so
# `github.event.label.name` is always empty and every job SKIPS — a green run
# with no review, the worst shape for a gate. Match on pull_request.labels.
#
# RUNNER LABEL: the `runs-on:` value below must also be listed in
# .github/actionlint.yaml if the repo has one, or actionlint fails Lint and —
# because Lint gates the staged pipeline — Security/Test/Integration skip and
# CI Gate fails closed. That is exactly how go-truststrap went red on
# 2026-09-05.
name: Code Review

on:
  pull_request:
    types: [labeled]

jobs:
  qwen:
    name: Code Review (qwen)
    if: >-
      github.server_url != 'https://github.com' &&
      contains(github.event.pull_request.labels.*.name, 'code-review') &&
      !contains(github.event.pull_request.labels.*.name, 'model:codex') &&
      !contains(github.event.pull_request.labels.*.name, 'review:codex')
    # Model-agnostic capability label: "this runner holds the review assets and
    # can reach Ollama". The MODEL is chosen below by the PR's `model:` label,
    # NOT by which runner the job lands on — baking a model name into the runner
    # label meant every new model needed a whole new registered runner, which
    # defeats the point of label-driven selection.
    runs-on: code-review
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run qwen peer review
        env:
          REPO: ${{ github.event.repository.name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          GITEA_URL: ${{ github.server_url }}
          GITEA_CODEX_TOKEN: ${{ secrets.OPENCODE_BOT_TOKEN }}
          REVIEW_BOT_USER: opencode
          REVIEW_ENGINE: qwen
          OLLAMA_URL: http://198.51.100.91:11434
          # Label -> model. Every candidate is a LITERAL in this file, so a
          # repository can pick from the company-authored set but can never
          # supply a model name; adding one is a line here, not a new runner.
          # No `model:` label means the default.
          OLLAMA_MODEL: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'model:qwen-122b') && 'qwen3.5:122b'
             || contains(github.event.pull_request.labels.*.name, 'model:coder-next') && 'qwen3-coder-next:latest'
             || 'qwen3.6:27b-coding-64k' }}
        run: /opt/qwen-review/pr-review.sh

      # Only reached when the review APPROVED — pr-review.sh exits 1 on
      # request_changes and 2 on pipeline error, either of which fails the step
      # above and skips this one. Arming is therefore never a way to merge
      # something the reviewer objected to.
      # Gitea still enforces required checks and approvals; this only schedules
      # the merge for when they are satisfied.
      - name: Arm auto-merge (squash, delete branch) now that it is approved
        if: success()
        env:
          BOT: ${{ secrets.OPENCODE_BOT_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/merge
        run: |
          code=$(curl -sS -o /tmp/merge.json -w '%{http_code}' -X POST \
            -H "Authorization: token $BOT" -H 'Content-Type: application/json' \
            -d '{"Do":"squash","merge_when_checks_succeed":true,"delete_branch_after_merge":true}' \
            "$API")
          case "$code" in
            200|201) echo "auto-merge armed — merges when required checks pass" ;;
            # Already merged, already scheduled, or not currently mergeable.
            # None of these mean the review failed, so do not fail the job.
            405|409|422) echo "not armable right now (code $code): $(cat /tmp/merge.json)" ;;
            *) echo "unexpected $code: $(cat /tmp/merge.json)"; exit 1 ;;
          esac

  codex:
    name: Code Review (codex)
    if: >-
      github.server_url != 'https://github.com' &&
      contains(github.event.pull_request.labels.*.name, 'code-review') &&
      (contains(github.event.pull_request.labels.*.name, 'model:codex') ||
       contains(github.event.pull_request.labels.*.name, 'review:codex'))
    runs-on: codex
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run codex peer review
        env:
          REPO: ${{ github.event.repository.name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          GITEA_URL: ${{ github.server_url }}
          GITEA_CODEX_TOKEN: ${{ secrets.CODEX_BOT_TOKEN }}
        run: /opt/codex-review/pr-review.sh
