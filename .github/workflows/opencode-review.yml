# code-review-template: v22 — automated peer review on EVERY pull request.
# v2 gated the job on a `code-review` label and could skip itself green;
# see the note on the job below. v4 added a guard step and a concurrency
# change; v5 keeps the guard and reverts the concurrency — measured, below.
#
# v6 (automatethethings#127) makes three changes, all about a verdict being
# real rather than about how the review is produced:
#   - the guard checks `.merged`/`.state` from the read it already makes, so a
#     closed PR costs no GPU. That check used to live in review-agent.md, where
#     it could only run after the 27B model had loaded.
#   - the guard IGNORES PENDING reviews when it looks for a standing verdict. A
#     draft is not an approval and not a rejection; treating it as one made two
#     heads permanently unreviewable.
#   - a new final step FAILS the job unless a submitted, non-PENDING verdict
#     from the bot exists on this exact head. opencode exiting 0 is not a
#     verdict, and on 2026-09-09 a job went green over a review that Gitea had
#     filed as a draft.
#
# NOTE ON THE STAMP. There were briefly TWO different files stamped v3: the
# 17 deployed copies (carrying the skip-itself-green fix) and this template
# (which did not). They differed in the one line deciding whether an
# unreviewed PR can merge, and a drift check comparing STAMPS reports two
# such files as in agreement. This file is now built FROM the deployed
# copies rather than from its own previous contents. See automatethethings#88.
# Source of truth: software/templates/github-actions/opencode-review.yml in
# the company repo -- INTENT, not a measurement. On 2026-09-07 this file was
# the stalest copy of itself in the fleet while saying exactly this line.
# Before editing it, diff it against a deployed copy (automatethethings#89).
# Gitea-only by design.
#
# ONE REVIEWER: opencode, running a LOCAL model on gpu-host's GPU. Owner ruling
# 2026-09-06, in his words: "i dont want any CODEX tokens minted or any api
# usage for frontier models. when the codex subscription is expired then we
# dont use it! we use opencode with whatever model is specified in the gitea
# labels or we default to the qwen 3.6 model!" The v1 `model:codex` branch is
# removed: no frontier-model API is called from CI, and no Codex credential is
# published to any repository.
#
# THERE IS NO MODEL SELECTION. One model, one configuration: `review-q8`, named
# once on the opencode invocation below. Labels select nothing.
#
# This block used to document a label map (`model:qwen3.6`, `model:qwen-122b`,
# `model:coder-next`) resolved by a "Select the review model" step. That step is
# gone, every model it offered is DELETED from the GPU host, and the owner ruled
# on 2026-09-08: "i only want qwen 3.8 with the optimal configs". The text
# outlived all three facts and still said the default was qwen3.6 — a comment
# nobody had reason to distrust, describing a step that no longer existed, in a
# file whose executable line was already correct. That is the qwen3.6 incident
# repeating as documentation; see automatethethings#127.
#
# WHY THE LABEL MAP WENT, since that part is worth keeping: `model:qwen3.6`
# selected a STOCK tag carrying temperature 0.1 and num_ctx 65536 — Qwen
# specifies 1.0 for thinking mode against a native 262144 — which is exactly the
# configuration that produced three days of bad reviews. `model:qwen-122b` and
# `model:coder-next` named models that were never downloaded, so those labels
# were a guaranteed failure that read as a pipeline bug.
#
# review-q8 is qwen3.8 Q8_0 built from infra/gpu/models/review.Modelfile with
# Qwen's published thinking-mode parameters. CHANGING THE REVIEWER MEANS EDITING
# THAT MODELFILE — not this file, not 25 workflows, and not a label.
#
# RUNNER LABEL: `code-review` means "this runner holds the review assets and
# can reach Ollama" — it carries no model name, so adding a model is one
# literal here rather than a whole new registered runner.
name: Code Review

on:
  # Every pull_request event reviews the head it names. `labeled` is kept so
  # that adding a `model:*` label re-reviews under the model just chosen;
  # `synchronize` is what stops a new commit from inheriting the previous
  # head's verdict.
  pull_request:
    types: [opened, reopened, synchronize, labeled]

# Creating a PR that already carries the label fires `opened` AND `labeled`, so
# TWO runs exist for ONE head. One is cancelled, and Gitea maps a cancelled job
# to commit status `failure` under the SAME context name the survivor will use
# -- so a healthy PR carries a red required check meaning "superseded", not
# "broken" (go-sysmon PR#122, runs 13001/13002, same head, one second apart).
# Note for anyone reducing these to one verdict: a status whose run ended
# `cancelled` is SUPERSEDED, not a verdict, and "newest per context" does NOT
# resolve it -- the newest IS the cancelled run's `failure`.
#
# v4 TRIED TO FIX THAT HERE AND COULD NOT. It keyed the group on the head sha
# and OMITTED `cancel-in-progress`, intending the spec default of `false` so the
# twins would queue. MEASURED on go-sysmon PR#137 (2026-09-07, head a9e50c0):
# Gitea 1.27.1 cancelled the older run anyway, both runs carrying the same
# head-sha group, and wrote `failure` to the context exactly as before.
#
#   06:22:11 pending runs/13316 | 06:22:12 failure "Canceled after 0s" runs/13316
#   06:22:12 pending runs/13317 | 06:23:33 success "Successful in 1m17s" runs/13317
#
# So: OMITTING `cancel-in-progress` DOES NOT GIVE YOU `false` on this Gitea.
# That extends the asymmetry already known here -- the group key evaluates
# expressions and this field does not -- with: it is not consulted for its
# default either. Do not spend another canary rediscovering it.
#
# Worse, head-sha keying REMOVED a cancellation that was doing real work: under
# a PR-number key a new push cancels the previous head's review, and under a
# head-sha key that superseded 45-minute GPU review runs to completion on a
# runner with capacity 2. The guard below cannot prevent it -- the guard runs
# once, at start, and a run already past it keeps going.
#
# v5 therefore reverts to the v3 concurrency and keeps the guard. The transient
# red is accepted: it is self-healing (80s on the canary) and is not fixable at
# the workflow level. What IS fixable -- a wasted duplicate review, and a
# duplicate overwriting a verdict -- the guard fixes. automatethethings#94.
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Code Review (opencode)
    # NO job-level `if:` HERE, DELIBERATELY. A job-level condition that
    # evaluates false concludes the job `skipped`, and Gitea counts a `skipped`
    # commit status as SUCCESS when it combines the required checks
    # (modules/commitstatus/commit_status.go, CommitStatusStates.Combine). The
    # required `Code Review / Code Review (opencode)` context was therefore
    # SATISFIED by a review that never ran.
    #
    # MEASURED, go-trusted-platform #536 (2026-09-06): the PR was pushed at
    # 13:00:36 and labelled one second later, so run 12729 stored a payload
    # with no `code-review` label on it. Its genuine sibling went red. At
    # 13:32:17 run 12729 was re-run; a re-run replays that run's OWN stored
    # payload, the label was still absent from it, the job skipped in zero
    # seconds, and that `skipped` became the last status on the context. The
    # PR merged at 13:34:04 with zero reviews at any commit.
    #
    # The label is no longer a condition on reviewing at all: EVERY pull
    # request is reviewed, which is also what "run the review automatically
    # whenever one is needed" requires. `model:*` labels still select the
    # model. The mirror guard moved onto the STEPS, where a false condition
    # skips a step but leaves the job's own conclusion real.
    # ROUTED BY LABEL, from ONE job. `model:codex` needs a different runner --
    # the codex OAuth session reaches a job only through the `codex` label's
    # volume mount, and that credential must never be handed to the container
    # that reads untrusted pull-request code.
    #
    # Two jobs with a job-level `if:` would be the obvious way to do this and it
    # is the documented fail-open: a false job-level condition concludes
    # `skipped`, which Gitea counts as SUCCESS when it combines required checks.
    # That is how go-trusted-platform #536 merged with zero reviews.
    #
    # A single job with an expression here avoids that, and Gitea 1.27.1 DOES
    # evaluate it -- verified rather than assumed, because this file already
    # records Gitea ignoring `cancel-in-progress` as specified. Probe on
    # automatethethings branch probe/runs-on-expression: the jobs API reported
    # `"labels": ["ubuntu-latest"]` for `runs-on: ${{ ... || 'ubuntu-latest' }}`
    # and the job ran. `contains()` over `labels.*.name` compares ARRAY ELEMENTS,
    # so this is an exact whole-label test, not a substring one (#113).
    # ROUTED BY AGENT, because each image carries exactly one CLI: qwen-review
    # has opencode, codex-review has codex, neither has claude. The agent is
    # therefore the runner, and it has to be derivable from label TEXT because
    # runs-on is evaluated before the container exists.
    #
    # THREE tests: `agent:codex` is the current vocabulary; `model:codex` and
    # `model:codex:<model>` are the OLD one, still live on open pull requests
    # and accepted for one transition. Element-equality catches the bare forms;
    # the substring on the JOINED list catches `model:codex:<model>`, which
    # element-equality cannot see. join() is implemented here -- verified by
    # probe, run 15378, not assumed.
    #
    # `agent:claude` now ROUTES TO A REAL RUNNER. Until 2026-09-10 it deliberately
    # landed on code-review and failed there with a named error, because the
    # `omega-claude` registration pointed at 198.51.100.91:3001 -- the dead
    # pre-move Gitea -- so a `claude` label was one nothing would ever claim.
    # Owner, 2026-09-10: "agent:claude should have somewhere to go, it should be
    # going to a claude agent just like codex is going to the codex agent!"
    #
    # A MODEL LABEL ALONE ALSO ROUTES, BY FAMILY PREFIX -- never by an enumerated
    # list of model names. Owner requirement, same day: opencode "shouldnt be
    # running when a model is tagged with codex or claude agents or models". A bare
    # `model:gpt-6` therefore goes to codex and `model:fable-5.1` to claude,
    # and `model:gpt-7` will route the day it ships without editing 25 workflows.
    # Adding a FAMILY is the only edit this line should ever need; families change
    # far more rarely than models, which is the whole point of matching prefixes.
    #
    # An explicit `agent:*` is tested FIRST, so it always beats an inferred family:
    # `agent:opencode` + `model:gpt-6` runs opencode and fails in opencode's own
    # validation with a message about providers, rather than being silently
    # rerouted to an engine the labels did not ask for.
    #
    # THE TWO EXPRESSIONS -- here and ROUTED_AGENT below -- are generated from one
    # template and differ in exactly one token ('code-review' is the runner LABEL,
    # 'opencode' the agent NAME). They must agree; the job asserts it at runtime
    # rather than trusting that, because a router and a parser that disagree would
    # otherwise run the wrong CLI on the wrong machine.
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'agent:codex') && 'codex' || contains(github.event.pull_request.labels.*.name, 'agent:claude') && 'claude' || contains(github.event.pull_request.labels.*.name, 'agent:opencode') && 'code-review' || contains(github.event.pull_request.labels.*.name, 'model:codex') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:codex:') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:gpt-') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:o3') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:o4') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:opus') && 'claude' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:sonnet') && 'claude' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:haiku') && 'claude' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:fable') && 'claude' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:claude-') && 'claude' || 'code-review' }}
    timeout-minutes: 45
    steps:
      # Runs BEFORE checkout so a stale or duplicate run costs a few API calls
      # rather than a clone and a 45-minute review. Cancellation handles the
      # common superseded case; this handles what cancellation cannot -- a run
      # that reaches a runner after the head moved, and the second of a twin
      # pair when both survive (PR#122 and PR#113 each carry TWO opencode
      # APPROVED reviews on one commit, 11 and 19 minutes apart).
      #
      # This is a STEP, not a job-level condition, for the same reason the job
      # carries no `if:` -- see the note above. A step that skips leaves the
      # job's own conclusion real; a job that skips is counted as success.
      #
      # It must never turn a rejection into a pass. A run that finds an existing
      # verdict for this exact head exits WITH that verdict -- 0 for an approval,
      # non-zero for anything else -- so the required context keeps saying what
      # the real review said. Exiting 0 unconditionally would let a duplicate
      # overwrite a rejection with green, which is strictly worse than the red
      # check this guard exists to remove.
      - name: Skip if this head is stale or already reviewed
        id: guard
        if: github.server_url != 'https://github.com'
        env:
          # READS ONLY, so opencode's credential is used regardless of which agent
          # will run: all three bots have repo read, and selecting one here would
          # mean a third copy of the routing expression for no gain.
          BOT: ${{ secrets.OPENCODE_BOT_TOKEN }}
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          # THE ACTING BOT, not a constant. Until v21 this was hardcoded
          # `opencode` in all three steps while the ROUTING already sent 79% of
          # reviews to codex -- so codex's verdicts were POSTED AS OPENCODE, and
          # the owner reasonably read that as "opencode is reviewing PRs tagged
          # for codex" and as codex not contributing. Neither was true; only the
          # byline was wrong. CLAUDE.md has said since 2026-08-17 that Codex
          # posts as the `codex` Gitea user.
          #
          # This is the same expression as ROUTED_AGENT below, generated from one
          # template, because the bot username and the agent name are the same
          # string by design: opencode | codex | claude.
          BOT_USER: ${{ contains(github.event.pull_request.labels.*.name, 'agent:codex') && 'codex' || contains(github.event.pull_request.labels.*.name, 'agent:claude') && 'claude' || contains(github.event.pull_request.labels.*.name, 'agent:opencode') && 'opencode' || contains(github.event.pull_request.labels.*.name, 'model:codex') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:codex:') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:gpt-') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:o3') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:o4') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:opus') && 'claude' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:sonnet') && 'claude' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:haiku') && 'claude' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:fable') && 'claude' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:claude-') && 'claude' || 'opencode' }}
          ALL_BOTS: '["opencode","codex","claude"]'
        run: |
          set -euo pipefail

          # ONE read of the pull request; every precondition below is a field of
          # it, so none of them costs an extra API call -- and none of them costs
          # a model.
          pr=$(curl -sS -H "Authorization: token $BOT" "$REPO_API/pulls/$PR_NUM")

          # Fail closed: an unreadable head must not be treated as "unchanged".
          head=$(printf '%s' "$pr" | jq -r '.head.sha // empty')
          [ -n "$head" ] || { echo "::error::could not read the head of PR $PR_NUM"; exit 1; }

          # A PR that is merged or closed cannot receive a review: Gitea answers
          # the POST with HTTP 422, so everything spent getting there is thrown
          # away. This was checked by the MODEL, in step 2 of review-agent.md,
          # which means it was checked after the container started, the 27B model
          # loaded and the prompt ran -- 31 GPU-minutes in three days by the
          # prompt's own count. It is a field of the read above. Check it here.
          #
          # Fail closed on an unreadable state as well: `// empty` distinguishes
          # absent from "closed", and only a state we actually read may skip.
          pr_state=$(printf '%s' "$pr" | jq -r '.state // empty')
          merged=$(printf '%s' "$pr" | jq -r '.merged // false')
          [ -n "$pr_state" ] || { echo "::error::could not read the state of PR $PR_NUM"; exit 1; }

          # DRAFT STATE IS EMITTED HERE, from THIS step, because this is the step
          # whose id the reviewer reads it from.
          #
          # It was previously written by the final confirmation step -- which runs
          # AFTER the review -- so `steps.guard.outputs.is_draft` resolved to the
          # empty string on every run, IS_DRAFT was never "true", and the draft
          # branch in the review step never executed. The v8 draft policy was
          # present, correct and INERT, and worse than absent: a draft pull request
          # was handed the instruction that approval was available, so the approval
          # was POSTED and VISIBLE before the confirmation step could fail the job.
          # Fail-open, from a guard that could not fire.
          #
          # Two steps read `.draft` and I added the output to the wrong one. The
          # confirmation step keeps its OWN read deliberately -- a gate should
          # re-derive the fact it enforces rather than trust an earlier step's
          # output. Found by codex on a live review; see automatethethings#127 and
          # software/scripts/check-workflow-outputs.py, which now checks
          # mechanically that every steps.X.outputs.Y read has a write in step X.
          echo "is_draft=$(printf '%s' "$pr" | jq -r '.draft // false')" >> "$GITHUB_OUTPUT"

          if [ "$merged" = "true" ] || [ "$pr_state" != "open" ]; then
            echo "PR $PR_NUM is state=$pr_state merged=$merged -- a review"
            echo "on it is rejected with HTTP 422, so there is nothing to spend a"
            echo "GPU on. Stopping before checkout."
            echo "skip=closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$head" != "$EVENT_SHA" ]; then
            echo "Head has moved to ${head} since this run was created for ${EVENT_SHA}."
            echo "This run would review an abandoned commit, and its status lands on"
            echo "that commit -- not on the PR head, so it gates nothing. Stopping."
            echo "skip=stale" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Adding a label that CHANGES THE REVIEWER INVOCATION is a deliberate
          # request to review this same head again under the configuration just
          # chosen -- it is the entire reason `labeled` is a trigger (see the
          # note on `on:` above). It must therefore bypass the already-reviewed
          # check below, which would otherwise see the previous run's verdict
          # and skip, silently defeating the feature the trigger exists for.
          #
          # THREE PREFIXES, NOT ONE. This matched `model:*` alone, which was
          # correct when the model was the only axis. It is not any more: the
          # resolver below selects on three, and each is a real label in this
          # repository, not a hypothetical.
          #
          #   agent:*   picks the CLI and therefore the runner and the image
          #             (`runs-on` above, and ROUTED_AGENT below)
          #   model:*   picks the model within that agent
          #   effort:*  picks reasoning effort where the agent supports it
          #
          # With only `model:*` matched, adding `agent:codex` to an
          # already-reviewed head fell through to the existing-review check and
          # exited `skip=reviewed` before the resolver ever saw the new label:
          # the PR stayed gated by the OLD reviewer's verdict while the board
          # showed the new label, and nothing said the request had been
          # dropped. Found by the reviewer itself on go-qrdb PR #378.
          #
          # `effort:*` is deliberately included even though it also serves as
          # this repository's issue-sizing vocabulary (effort:low..xhigh). The
          # cost of the overlap is one redundant review when someone sizes a
          # PR; the cost of omitting it is a silently ignored re-review
          # request, and those are not comparable.
          #
          # `code-review` is NOT such a label: it is the other half of the
          # opened/labeled pair this guard exists to de-duplicate.
          case "${EVENT_ACTION}:${EVENT_LABEL}" in
            # v19 propagates go-qrdb#379 fleet-wide. That PR fixed this line in
            # go-qrdb alone; the template and 24 other mains still matched only
            # `labeled:model:*`, so adding `agent:codex` to an already-reviewed
            # head hit the already-reviewed check and SKIPPED — defeating the
            # entire reason `labeled` is a trigger. Invisible because every
            # codex review driven by hand used the older `model:codex` form,
            # which still matched.
            #
            # The stamp is bumped because #379 did NOT bump it: the file changed
            # while still calling itself v18, so the stamp stopped distinguishing
            # fixed from unfixed and a roller could not tell them apart. A
            # version marker that does not move when the file does is worse than
            # no marker.
            labeled:agent:*|labeled:model:*|labeled:effort:*)
              echo "A ${EVENT_LABEL} label was just added. Re-reviewing $EVENT_SHA"
              echo "under the reviewer it selects, which is what \`labeled\` is for."
              exit 0
              ;;
          esac

          # A REJECTION IS NOT ORDER-DEPENDENT. The previous version took the
          # `last` review on this head and switched on it, which meant a COMMENT
          # written after a REQUEST_CHANGES read as "commented" and went green --
          # newest-wins silently discarding the one verdict this guard exists to
          # defend. Ask the two questions separately instead:
          #
          #   1. does ANY rejection exist on this head?   -> keep it, exit 1
          #   2. otherwise, is there a recorded verdict?  -> do not review twice
          #
          # Order cannot change the answer to either.
          #
          # PENDING is excluded from both: a draft is visible to its author alone
          # and is no verdict at all. Without that exclusion a draft reached the
          # rejection arm and made the head permanently unreviewable, which is how
          # go-codec #15 and go-luks2 #137 got stuck on 2026-09-09.
          reviews=$(curl -sS -H "Authorization: token $BOT" "$REPO_API/pulls/$PR_NUM/reviews")
          # THE TWO QUESTIONS NOW HAVE DIFFERENT SCOPES, deliberately.
          #
          # A REJECTION BY ANY REVIEWER BOT BLOCKS. Scoping this to the acting bot
          # would have created a bypass the moment identities became per-agent:
          # relabel a PR carrying a standing opencode REQUEST_CHANGES to
          # agent:codex, and codex -- which has never seen that rejection -- could
          # approve it into a mergeable state. The guard exists to stop a pass
          # overwriting a rejection; whose rejection it is does not matter.
          #
          # The DEDUP question below stays scoped to the acting bot, which is what
          # makes relabelling produce a genuinely new review rather than skipping.
          n_rejected=$(printf '%s' "$reviews" | jq -r --argjson bots "$ALL_BOTS" --arg s "$EVENT_SHA" '
              [ .[] | select((.user.login | IN($bots[])) and .commit_id == $s and .state == "REQUEST_CHANGES") ] | length')
          rejected_by=$(printf '%s' "$reviews" | jq -r --argjson bots "$ALL_BOTS" --arg s "$EVENT_SHA" '
              [ .[] | select((.user.login | IN($bots[])) and .commit_id == $s and .state == "REQUEST_CHANGES") | .user.login ] | unique | join(", ")')
          state=$(printf '%s' "$reviews" | jq -r --arg u "$BOT_USER" --arg s "$EVENT_SHA" '
              [ .[] | select(.user.login == $u and .commit_id == $s)
                    | select(.state == "APPROVED" or .state == "COMMENT") ] | last | .state // ""')

          if [ "$n_rejected" != "0" ]; then
            echo "::error::${rejected_by:-a reviewer} has REQUEST_CHANGES standing on $EVENT_SHA."
            echo "Failing so that verdict stands: a duplicate must not overwrite"
            echo "a rejection with a pass, and a later comment does not retract one."
            exit 1
          fi

          case "$state" in
            "")
              echo "No $BOT_USER verdict on $EVENT_SHA yet. Reviewing."
              ;;
            APPROVED|COMMENT)
              # A COMMENT is a recorded verdict, not a rejection. It used to fall
              # through to the rejection arm, so every re-run of an
              # already-commented head exited 1 and the head carried a permanently
              # red required check FOR HAVING BEEN REVIEWED -- indistinguishable
              # from a review that failed. Measured on go-quicbaas #735: a real
              # 2579-character COMMENT on 5a331b01, and the only status on that
              # head is `failure` after 2s. v8 makes this reachable by design,
              # since an approval on a draft is refused and COMMENT is then the
              # correct verdict. Merging stays gated: a COMMENT is not an
              # approving review and branch protection requires one.
              echo "$BOT_USER already recorded $state on $EVENT_SHA -- this is the"
              echo "duplicate run from the opened/labeled pair. Not reviewing it twice."
              echo "skip=reviewed" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::unexpected review state '$state' on $EVENT_SHA."
              exit 1
              ;;
          esac

      # ONE PLACE resolves the reviewer, from two INDEPENDENT axes and against
      # LIVE state. Owner correction 2026-09-09: the agent (which CLI) and the
      # model it drives are separate things; `model:codex` conflated them, which
      # is why "any model" kept coming out as a switch between two engines.
      - name: Resolve the reviewer from labels
        id: reviewer
        if: github.server_url != 'https://github.com' && steps.guard.outputs.skip == ''
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ROUTED_AGENT: ${{ contains(github.event.pull_request.labels.*.name, 'agent:codex') && 'codex' || contains(github.event.pull_request.labels.*.name, 'agent:claude') && 'claude' || contains(github.event.pull_request.labels.*.name, 'agent:opencode') && 'opencode' || contains(github.event.pull_request.labels.*.name, 'model:codex') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:codex:') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:gpt-') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:o3') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:o4') && 'codex' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:opus') && 'claude' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:sonnet') && 'claude' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:haiku') && 'claude' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:fable') && 'claude' || contains(join(github.event.pull_request.labels.*.name, ','), 'model:claude-') && 'claude' || 'opencode' }}
        run: |
          set -euo pipefail

          # AGENT AND MODEL ARE SEPARATE AXES. Owner correction 2026-09-09: "codex is the
          # openai codex agent, its its own thing, just like claude code and opencode have
          # their own agents/cli. im referring to the /codex agent!"
          #
          #   agent:opencode | agent:codex | agent:claude   which CLI, therefore which image
          #   model:<name>                                  which model that agent drives
          #   effort:low|medium|high                        reasoning effort, where supported
          #   (no labels)                                   agent:opencode + review-q8
          #
          # The previous scheme wrote `model:codex`, which literally says "the model is
          # codex". That conflation is why every attempt to express "any model" came out as
          # a switch between two engines.
          #
          # The OLD forms are still accepted for one transition, with a deprecation warning
          # naming the replacement -- `model:codex` is applied to live pull requests right
          # now and breaking them mid-flight would be worse than carrying two vocabularies
          # for a day.

          OPENCODE_DEFAULT_MODEL="review-q8"
          CODEX_DEFAULT_MODEL="gpt-5.5"
          OLLAMA="${OLLAMA_URL:-http://198.51.100.91:11434}"

          ollama_models() { curl -sS --max-time 10 "$OLLAMA/api/tags" | jq -r '.models[].name' | sort -u; }
          label_exists() { printf '%s' "$LABELS" | jq -e --arg n "$1" 'index($n) != null' >/dev/null 2>&1; }

          agent=""; model=""; deprecated=""

          # --- new vocabulary -----------------------------------------------------------
          agent_labels=$(printf '%s' "$LABELS" | jq -r '.[] | select(startswith("agent:"))')
          model_labels=$(printf '%s' "$LABELS" | jq -r '.[] | select(startswith("model:"))')
          n_agent=$(printf '%s' "$agent_labels" | grep -c . || true)
          n_model=$(printf '%s' "$model_labels" | grep -c . || true)

          [ "$n_agent" -le 1 ] || { echo "::error::more than one agent: label: $(printf '%s' "$agent_labels" | tr '\n' ' ')"; exit 1; }
          [ "$n_model" -le 1 ] || { echo "::error::more than one model: label: $(printf '%s' "$model_labels" | tr '\n' ' ')"; exit 1; }

          [ "$n_agent" -eq 1 ] && agent=${agent_labels#agent:}

          # --- old vocabulary, accepted with a warning ----------------------------------
          if [ "$n_model" -eq 1 ]; then
            raw=${model_labels#model:}
            case "$raw" in
              codex|codex:*|local|local:*)
                old_agent=${raw%%:*}
                old_model=""; [ "$raw" != "$old_agent" ] && old_model=${raw#*:}
                new_agent=$([ "$old_agent" = local ] && echo opencode || echo codex)
                deprecated="yes"
                echo "::warning::'$model_labels' uses the OLD label vocabulary, where agent and model were one axis. Use 'agent:$new_agent'$([ -n "$old_model" ] && echo " plus 'model:$old_model'"). Accepted for now; it will stop working once the old labels are removed."
                [ -z "$agent" ] && agent="$new_agent"
                [ -z "$old_model" ] || model="$old_model"
                ;;
              *) model="$raw" ;;
            esac
          fi

          # --- infer the agent from the model FAMILY when no agent label is given -------
          #
          # Owner requirement 2026-09-10: opencode "shouldnt be running when a model is
          # tagged with codex or claude agents or models. it should only run if we dont
          # have any agent or model labels or unless the labels call out opencode with
          # models specifically."
          #
          # Resolved by FAMILY PREFIX, never by an enumerated model list, so a model
          # released tomorrow routes without a workflow edit. This table and the runs-on
          # expression must agree -- the ROUTED_AGENT check above is what catches it if
          # they ever stop agreeing.
          #
          # An explicit agent: label always wins; inference only fills a blank.
          if [ -z "$agent" ] && [ -n "$model" ]; then
            # ONLY the two hosted families are enumerated; everything else falls to
            # opencode, which then validates the name against the GPU host's LIVE tag
            # list and errors with the actual choices if it is wrong.
            #
            # A first version of this listed opencode's families too (qwen*, llama*,
            # deepseek*, ...) and refused anything unmatched. Testing it rejected
            # `model:GLM-4.5-Air` -- a model the GPU host is serving right now -- which
            # is the same trap the codex branch refuses: an enumeration that has to be
            # edited in 25 files whenever the fleet gains a model. Inverting it also
            # makes agreement with the runs-on expression STRUCTURAL rather than two
            # tables kept in sync by hand, since that expression falls through to
            # opencode for exactly the names this falls through on.
            case "$model" in
              gpt-*|o3*|o4*)                        agent=codex ;;
              opus*|sonnet*|haiku*|fable*|claude-*)  agent=claude ;;
              *)                                     agent=opencode ;;
            esac
            echo "No agent: label; inferred agent '$agent' from the family of model '$model'."
          fi

          # No agent AND no model label at all -- the fleet default.
          agent=${agent:-opencode}

          # --- the router and the parser must agree -------------------------------------
          if [ -n "${ROUTED_AGENT:-}" ] && [ "$agent" != "$ROUTED_AGENT" ]; then
            echo "::error::labels routed this job to the '$ROUTED_AGENT' runner but resolve to agent '$agent'."
            echo "::error::Labels: $(printf '%s' "$LABELS" | jq -rc '.')"
            echo "::error::Refusing to run the wrong CLI on this machine."
            exit 1
          fi

          effort=medium
          for e in low medium high; do label_exists "effort:$e" && effort=$e; done
          bad_effort=$(printf '%s' "$LABELS" | jq -r '.[] | select(startswith("effort:")) | select((.=="effort:low" or .=="effort:medium" or .=="effort:high")|not)')
          [ -z "$bad_effort" ] || { echo "::error::unknown effort label(s): $(printf '%s' "$bad_effort" | tr '\n' ' ')"; echo "::error::Known: effort:low, effort:medium, effort:high."; exit 1; }

          case "$agent" in
            opencode)
              model=${model:-$OPENCODE_DEFAULT_MODEL}
              avail=$(ollama_models || true)
              [ -n "$avail" ] || { echo "::error::could not read the model list from $OLLAMA."; echo "::error::Refusing to run: an unvalidated model fails 20 minutes later inside the reviewer."; exit 1; }

              # FRIENDLY NAME -> CONCRETE TAG. The owner asks for `model:qwen3.8`, and
              # 2026-09-10 that label resolved to NOTHING: ollama carries the family as
              # `qwen3.8:27b-q8_0`/`-bf16`/`-q4_K_M`, so an exact-match check rejected the
              # one name a person would actually write, and the message blamed the label.
              #
              # A bare family name maps to the REVIEW-TUNED build, not the raw weights.
              # The review-* tags are the same 27B weights wrapped by
              # infra/gpu/models/review.Modelfile, which fixes the thinking-mode
              # parameters the reviewer was measured with; the raw tag would silently
              # review at different settings. Ask for a raw tag by its full name and it
              # still passes through untouched.
              case "$model" in
                qwen3.8|qwen3.8:q8|qwen-3.8|qwen3.8:27b-q8)   alias_to=review-q8 ;;
                qwen3.8:bf16|qwen3.8:27b-bf16-review)          alias_to=review-bf16 ;;
                qwen3.8:q4|qwen3.8:q4_K_M)                     alias_to=review-q4_K_M ;;
                *)                                             alias_to="" ;;
              esac
              if [ -n "$alias_to" ] && printf '%s\n' "$avail" | grep -qx "${alias_to}\(:latest\)\?"; then
                echo "Model '$model' resolves to the review-tuned build '$alias_to'."
                model="$alias_to"
              elif ! printf '%s\n' "$avail" | grep -qx "${model}\(:latest\)\?"; then
                # UNIQUE PREFIX, or nothing. `model:llama3.3` matches both `llama3.3:70b`
                # and `llama3.3:70b-32k`, and picking either would be a coin toss that
                # reads like a decision -- so ambiguity is an error that names the
                # candidates, and only a single match is accepted.
                matches=$(printf '%s\n' "$avail" | grep "^${model}:" || true)
                n_match=$(printf '%s' "$matches" | grep -c . || true)
                if [ "$n_match" -eq 1 ]; then
                  echo "Model '$model' resolves to the only tag in its family: '$matches'."
                  model="$matches"
                elif [ "$n_match" -gt 1 ]; then
                  echo "::error::model '$model' is ambiguous -- $n_match tags share that prefix:"
                  printf '%s\n' "$matches" | sed 's/^/::error::  /'
                  echo "::error::Name one exactly, so the verdict can be attributed to a model."
                  exit 1
                fi
              fi
              if ! printf '%s\n' "$avail" | grep -qx "${model}\(:latest\)\?"; then
                echo "::error::agent opencode has no provider configured for model '$model'."
                echo "::error::Its only configured provider is ollama, which offers:"
                printf '%s\n' "$avail" | sed 's/^/::error::  /'
                echo "::error::This is a CONFIGURATION BOUNDARY, not a label bug: opencode could"
                echo "::error::drive gpt-5.6 or opus, but only with that provider declared and its"
                echo "::error::credential present -- and a frontier credential in the container that"
                echo "::error::reads untrusted pull-request diffs is exactly what the codex runner's"
                echo "::error::isolation exists to avoid. Use agent:codex for those."
                exit 1
              fi
              # GENERATE THE CONFIG FROM LIVE STATE. opencode does NOT discover models from
              # the server -- it offers only what its config DECLARES -- which is how
              # `ProviderModelNotFoundError: Model not found: ollama/review-q8` happened
              # when the config still named the pre-rename tags. A hand-maintained models
              # block is that defect waiting to recur, and it would also mean every
              # `ollama pull` needed a config edit and an image rebuild.
              #
              # So the models block is built here from /api/tags. The provider block and
              # permissions come from the image's config; only the model map is replaced.
              # /tmp, NOT the workspace. This step runs BEFORE actions/checkout, and
              # checkout deletes the contents of the workspace -- a config written there
              # would be gone before opencode ever read it.
              #
              # And unlike the PR diff, /tmp is safe for this file: OPENCODE_CONFIG is read
              # by the opencode PROCESS at startup, not by a model tool call, so the
              # external_directory permission that governs the model's file access does not
              # apply to it. The diff stays in the workspace because the MODEL reads that.
              # Do not "consolidate" these two paths; they are governed by different things.
              GEN_CONFIG=/tmp/opencode.generated.json
              printf '%s\n' "$avail" | jq -R . | jq -s \
                --slurpfile base /opt/review/opencode.json \
                '. as $models
                 | $base[0]
                 | .provider.ollama.models = (
                     $models
                     | map(. as $t
                           | [{key: $t, value: {name: $t, tools: true}}]
                             + (if ($t | endswith(":latest"))
                                then [{key: ($t | sub(":latest$"; "")), value: {name: $t, tools: true}}]
                                else [] end))
                     | flatten | from_entries)' \
                > "$GEN_CONFIG"
              # BOTH SPELLINGS ARE DECLARED. Ollama reports `review-q8:latest`; the label,
              # the Modelfile and every existing config say `review-q8`. Declaring only what
              # /api/tags returns made the DEFAULT path fail its own validation -- caught
              # only because the guard below checks that the requested model is declared
              # rather than that the map is non-empty. A `length > 0` check passed this
              # happily and would have taken the busiest path in the fleet down.
              #
              # ASSERT THE PROPERTY THAT MATTERS, not that the map is non-empty. A first
              # version of this generated three entries from the CONFIG's own top-level
              # keys ($schema, permission, provider) and a `length > 0` check passed it
              # happily -- a guard that confirmed something adjacent to the thing it was
              # protecting. What must be true is that the model we are about to ask for is
              # declared, and that the provider block survived.
              jq -e --arg m "$model" '
                  (.provider.ollama.models | has($m))
                  and (.provider.ollama.options.baseURL | type == "string")
                  and (.permission.external_directory == "allow")' \
                "$GEN_CONFIG" >/dev/null || {
                echo "::error::generated opencode config does not declare '$model', or lost the provider block."
                echo "::error::Declared: $(jq -r '.provider.ollama.models | keys | join(", ")' "$GEN_CONFIG" 2>/dev/null)"
                exit 1; }
              echo "Generated an opencode config declaring $(jq -r '.provider.ollama.models|length' "$GEN_CONFIG") model(s) from live state."
              resolved="ollama/$model"
              echo "Reviewer: agent opencode driving $resolved."
              printf '%s' "$LABELS" | jq -e 'any(.[]; startswith("effort:"))' >/dev/null 2>&1 && \
                echo "::warning::effort:* has NO effect on agent opencode -- the review-* tags carry fixed thinking-mode parameters from infra/gpu/models/review.Modelfile. It applies to codex."
              ;;
            codex)
              model=${model:-$CODEX_DEFAULT_MODEL}
              # Pass through: the codex CLI and the subscription are the authority, and an
              # invalid name fails at call time with codex's own named error. Enumerating
              # here would mean editing 25 workflows whenever OpenAI ships a model.
              resolved="$model"
              echo "Reviewer: agent codex driving $resolved at $effort reasoning effort."
              ;;
            claude)
              # Aliases resolve to current release ids; anything already spelled
              # `claude-*` passes straight through, so a model released tomorrow works
              # without an edit here -- same reasoning as the codex branch below.
              #
              # THE FLOOR IS NOT THIS FILE'S RULE. conventions/model-usage.md, which the
              # owner set, says substantive work never runs below Opus 5 and that Haiku
              # and stale versions are prohibited. A code review is substantive, so a
              # below-floor label is refused HERE, loudly, instead of quietly producing a
              # cheaper verdict that reads exactly like a real one.
              case "${model:-}" in
                ""|opus|opus-5|claude-opus-5)                 resolved=claude-opus-5 ;;
                fable|fable-5.1|fable-5-1|claude-fable-5-1)   resolved=claude-fable-5-1 ;;
                sonnet|sonnet-5|claude-sonnet-5)
                  echo "::error::model '$model' is below the Opus 5 floor for review work."
                  echo "::error::conventions/model-usage.md reserves Sonnet for quick, trivial,"
                  echo "::error::mechanical tasks; judging a pull request is not one. Use"
                  echo "::error::model:opus or model:fable-5.1, or change the convention first."
                  exit 1 ;;
                haiku*|claude-haiku*)
                  echo "::error::model '$model' is prohibited by conventions/model-usage.md."
                  exit 1 ;;
                claude-*)                                     resolved="$model" ;;
                *)
                  echo "::error::agent claude does not recognise model '$model'."
                  echo "::error::Known: opus (default), fable-5.1, or any full claude-* id."
                  exit 1 ;;
              esac
              echo "Reviewer: agent claude driving $resolved, effort $effort."
              ;;
            *)
              echo "::error::unknown agent '$agent' (from label 'agent:$agent')."
              echo "::error::Known agents: opencode, codex, claude."
              exit 1 ;;
          esac

          { echo "agent=$agent"; echo "model=$resolved"; echo "effort=$effort"
            echo "deprecated=${deprecated:-no}"
            # Empty for codex, which has no opencode config; the review step falls back to
            # the image's own when this is empty.
            echo "config=${GEN_CONFIG:-}"; } >> "$GITHUB_OUTPUT"


      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.server_url != 'https://github.com' && steps.guard.outputs.skip == ''
        with:
          fetch-depth: 0

      # THE MODEL SELECTS ITS OWN MODEL, from the PR's labels, and posts its own
      # review. There is no script: opencode gives the model bash/read/grep and
      # it reaches the Gitea API itself (issue #120, owner-directed).
      #
      # Model routing stays label-driven and stays OUT of this file, which is the
      # #109 lesson: an env: expression duplicated across 32 workflows is how 26
      # repos came to default to qwen3.8 while three defaulted to qwen3.6, with a
      # `code-review-template: vN` stamp that had drifted from the file it
      # stamped. One resolution step, in one place, reached by every repo.
      # NO MODEL SELECTION STEP. Owner ruling 2026-09-08: "i only want qwen 3.8
      # with the optimal configs". One model, one configuration, one place to
      # change it.
      #
      # The label map is gone because every option it offered was a liability:
      # model:qwen3.6 selected a STOCK tag carrying temperature 0.1 and num_ctx
      # 65536 -- the exact configuration that produced three days of bad reviews
      # -- and model:qwen-122b / model:coder-next selected models that were never
      # downloaded, so those labels were a guaranteed failure that read as a
      # pipeline bug. The stock and 3.6 tags are now DELETED from the GPU host, so
      # a degraded configuration cannot be loaded even by accident.
      #
      # review-q8 is qwen3.8 Q8_0 with Qwen's published thinking-mode parameters
      # (infra/gpu/models/review.Modelfile): temperature 1.0, top_p 0.95, top_k 20,
      # min_p 0, num_ctx 262144, num_predict 65536. Changing the reviewer means
      # editing that one Modelfile -- not 25 workflow files, and not a label.

      - name: Review the pull request
        if: github.server_url != 'https://github.com' && steps.guard.outputs.skip == ''
        env:
          REPO: ${{ github.event.repository.name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          GITEA_API: ${{ github.server_url }}/api/v1
          # THE CREDENTIAL OF THE AGENT THAT ACTUALLY RUNS. Keyed on the resolved
          # agent from the previous step rather than on the routing expression, so
          # there is exactly ONE selection here and no chance of the byline and the
          # token disagreeing.
          #
          # ONLY ONE token reaches the environment. Passing all three and choosing
          # in the shell would put two unused write-scoped credentials beside a
          # model that has bash and is reading an untrusted diff; a reviewer bot
          # has `write` on the repository, so that is three bots' blast radius
          # instead of one.
          GITEA_TOKEN: ${{ steps.reviewer.outputs.agent == 'codex' && secrets.CODEX_BOT_TOKEN || steps.reviewer.outputs.agent == 'claude' && secrets.CLAUDE_BOT_TOKEN || secrets.OPENCODE_BOT_TOKEN }}
          # The config GENERATED by the resolver from live state, so opencode's
          # declared models can never drift from what the server actually has --
          # which is what ProviderModelNotFoundError was. Falls back to the
          # image's own for the codex path, where it is unused.
          OPENCODE_CONFIG: ${{ steps.reviewer.outputs.config || '/opt/review/opencode.json' }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          BOT_USER: ${{ steps.reviewer.outputs.agent }}
          AGENT: ${{ steps.reviewer.outputs.agent }}
          MODEL: ${{ steps.reviewer.outputs.model }}
          EFFORT: ${{ steps.reviewer.outputs.effort }}
          IS_DRAFT: ${{ steps.guard.outputs.is_draft }}
        run: |
          set -euo pipefail

          # GITEA ALREADY COMPUTED THE DIFF. Owner ruling 2026-09-09: "the
          # fucking gitea server already has a diff, the model shouldn't need to
          # diff it again! the PR has the diff!"
          #
          # He is right, and it is the single largest cost in a review. Timed on
          # job 65391 (go-xkms#452, 19.1m): 18.1 of those minutes were model
          # generation, and SIX of about seventeen turns -- roughly seven minutes
          # -- went to rediscovering which files are in scope. The largest gaps in
          # that log are all the same thing: "The two-dot diff was misleading",
          # "the base SHA is older than the branch's merge base", "PR has exactly
          # 13 files (per Gitea)". It arrived at exactly the 13 files this one
          # call returns.
          #
          # `.diff`, NOT `.patch`. `.patch` is the commit series and returned 16
          # files for that PR; `.diff` is the merge diff and returns 13, matching
          # what `/pulls/{n}/files` reports. Verified on go-xkms#452 and on two
          # PRs whose base is not `main`.
          #
          # FAIL CLOSED. review-agent.md no longer tells the model how to derive a
          # diff, so a missing one would mean reviewing blind or silently going
          # back to git merge-base -- exactly the cost this removes. An
          # unreadable diff is not a degraded review, it is no review.
          # INSIDE THE WORKSPACE, not /tmp. Two engines now read this file and
          # each has its own filesystem policy: opencode auto-rejects paths
          # outside the project directory unless `permission.external_directory`
          # allows it, and codex runs its own sandbox (read-only /
          # workspace-write / danger-full-access, defaulting to `auto`). Whether
          # codex can read /tmp is a property I did not verify -- so rather than
          # depend on it, the file goes where BOTH engines are unconditionally
          # allowed to look. Removing the dependency beats testing it.
          #
          # `.review/` is untracked and outside the diff, so it cannot be
          # mistaken for part of the change under review.
          # THE REVIEWER GOES TO GITEA ITSELF. Owner instruction 2026-09-11:
          # "remove the pr.diff bullshit and allow the agent to work directly
          # against gitea, view the entire codebase, etc."
          #
          # This step used to download the whole `.diff` into `.review/pr.diff`
          # and the prompt pointed the model at it. Two problems, and the owner
          # named the important one:
          #
          #   1. It framed the DIFF as the unit of review, so the reviewer
          #      stayed inside the changed lines and could not see into the
          #      layers below -- the library a service drives, the caller that
          #      assumed the old behaviour -- which is where the defects are.
          #   2. It does not scale. MEASURED on go-quicbaas#821: `.diff` is
          #      8.4 MB and `.patch` 15.7 MB, while `/pulls/N/files` is 2.9 KB.
          #      Handing a model an 8 MB blob crowds out the reading that finds
          #      bugs.
          #
          # So nothing is prefetched into the checkout now. We only ASSERT that
          # the PR names files -- refusing to spend a reviewer on nothing -- and
          # the prompt tells the model the exact API calls. The anti-derivation
          # rule survives in the prompt, because reconstructing the file list
          # with git merge-base cost ~7 minutes of a 19-minute review and landed
          # on the same list Gitea already reports.
          files_json=$(curl -sS -H "Authorization: token $GITEA_TOKEN" \
                       "$GITEA_API/repos/jeremyhahn/$REPO/pulls/$PR_NUM/files?limit=100" 2>/dev/null || true)
          n_files=$(printf '%s' "$files_json" | jq -r 'if type=="array" then length else 0 end' 2>/dev/null || echo 0)
          if [ "${n_files:-0}" -eq 0 ]; then
            echo "::error::PR $PR_NUM reports no changed files from $GITEA_API/repos/jeremyhahn/$REPO/pulls/$PR_NUM/files."
            echo "::error::Refusing to run a review with nothing to review."
            exit 1
          fi
          echo "PR $PR_NUM changes $n_files file(s) (Gitea's own list; the reviewer queries it directly)."

          # Does a SUBMITTED verdict exist on this exact head? PENDING is a
          # draft and does not count -- see the guard above.
          verdict_state() {
            curl -sS -H "Authorization: token $GITEA_TOKEN" \
                 "$GITEA_API/repos/jeremyhahn/$REPO/pulls/$PR_NUM/reviews" \
            | jq -r --arg u "$BOT_USER" --arg s "$EVENT_SHA" '
                [ .[]
                  | select(.user.login == $u and .commit_id == $s)
                  | select(.state == "APPROVED" or .state == "REQUEST_CHANGES" or .state == "COMMENT")
                ] | last | .state // ""'
          }

          # --print-logs so a failure inside opencode reaches the job log rather
          # than vanishing. Exit status is opencode's, so a crash fails the job
          # and the required check stays unsatisfied: an unreviewed PR must not
          # become mergeable because the reviewer died.
          # FACTS THE WORKFLOW ALREADY KNOWS, handed down rather than rederived.
          # Same reasoning as fetching the diff: 250.9s of go-xkms#452 went to
          # working out that a draft may not be approved, which the guard read
          # from `.draft` before opencode started.
          if [ "$IS_DRAFT" = "true" ]; then
            draft_fact="This pull request IS A DRAFT. You may post COMMENT or REQUEST_CHANGES.
          You may NOT post APPROVED -- the author has said it is not ready, and the
          job will fail if you approve it. Do not spend turns deciding this."
          else
            draft_fact="This pull request is NOT a draft. Any verdict is available to you."
          fi
          facts="FACTS ABOUT THIS PULL REQUEST -- already established, do not re-derive:
          - This pull request changes $n_files file(s). Gitea's own list is at
            \$GITEA_API/repos/jeremyhahn/\$REPO/pulls/\$PR_NUM/files -- authoritative,
            so do not reconstruct it with git diff or merge-base.
          - The repository is checked out at the head commit with full history, and
            you may read ANY file in it, and any file in any other repository in the
            portfolio, to judge whether this change is correct.
          - $draft_fact
          "

          # THE CLAUDE AGENT'S CREDENTIAL, resolved through the broker baked into the
          # image (/opt/review/agent-account.sh). Five Claude subscriptions back this
          # agent; which one is healthy, and which are parked on a limit, is the
          # broker's job and not this workflow's -- otherwise limit handling would
          # exist in 25 diverging copies.
          #
          # SUBSCRIPTION AUTH, NEVER AN API KEY (owner's standing rule). These are
          # long-lived `claude setup-token` values with no rotating refresh lineage,
          # which is why -- unlike a codex session -- they are safe to use from any
          # host. ANTHROPIC_API_KEY is explicitly unset: if one were ever present in
          # the environment the CLI would prefer it and bill per token, silently, while
          # every log line still said "subscription".
          #
          # ONLY THE SELECTED ACCOUNT'S TOKEN IS EXPORTED. tokens.env holds all five,
          # and this step is about to hand a model bash access over an untrusted pull
          # request diff, so the file is never sourced -- that would put four
          # credentials the job has no use for into the reviewer's environment.
          if [ "$AGENT" = claude ]; then
            TOKENS=/accounts-tokens/tokens.env
            [ -r "$TOKENS" ] || {
              echo "::error::agent claude needs $TOKENS, which the claude runner mounts read-only."
              echo "::error::It is absent or unreadable, so this job is on a runner that was not"
              echo "::error::configured for claude. Not falling back to an API key."
              exit 1; }

            acct=$(/opt/review/agent-account.sh resolve "$REPO" | cut -f1) || {
              echo "::error::no healthy Claude account: every account is limited or absent."
              echo "::error::/opt/review/agent-account.sh health says which and until when."
              exit 1; }
            # An EMPTY string read as a legitimate value is the failure mode that has
            # cost the most time in this pipeline, so assert the shape, not the exit code.
            case "$acct" in
              ""|*[!a-z0-9._-]*)
                echo "::error::the account broker returned '$acct', which is not an account name."
                exit 1 ;;
            esac

            tok=$(sed -n "s/^CLAUDE_OAUTH_TOKEN_$(printf '%s' "$acct" | tr 'a-z.-' 'A-Z__')=//p" "$TOKENS" \
                  | tr -d "\"'" | head -1)
            [ -n "$tok" ] || {
              echo "::error::account '$acct' is healthy per the broker but has no token in $TOKENS."
              exit 1; }
            case "$tok" in
              sk-ant-oat*) : ;;
              sk-ant-api*)
                echo "::error::the value for '$acct' is an API KEY, not a subscription token."
                echo "::error::Refusing to use it: that would bill per token against the standing"
                echo "::error::rule that claude and codex auth is subscription/device only."
                exit 1 ;;
              *) echo "::error::the value for '$acct' does not look like a setup-token."; exit 1 ;;
            esac
            export CLAUDE_CODE_OAUTH_TOKEN="$tok"
            unset ANTHROPIC_API_KEY
            echo "Reviewer account: $acct (subscription token, ${#tok} chars, no API key)."

            # claude has no --reasoning-effort. A thinking budget is the nearest real
            # control, so effort: maps onto it -- which keeps effort meaningful on all
            # three agents rather than being silently ignored on one of them.
            case "$EFFORT" in
              low)    export MAX_THINKING_TOKENS=4000 ;;
              medium) export MAX_THINKING_TOKENS=16000 ;;
              high)   export MAX_THINKING_TOKENS=32000 ;;
            esac
          fi

          # ONE code path for all three engines and for the retry below. The prompt is
          # identical: whichever model runs, it reads the same instructions and
          # posts its own review.
          run_reviewer() {
            case "$AGENT" in
              codex)
                # Reasoning effort is the dominant cost -- codex returned 4081
                # tokens for a one-word answer at LOW. medium is the owner's
                # default, explicitly to hold token spend down; do not raise it
                # here. `$1` is empty on the first run and the resume prompt on
                # the retry, since codex has no --continue.
                # -s danger-full-access, on the owner's ruling 2026-09-09: "yes set
                # the danger-full-access flag, the agent is already sandboxed in our
                # container!"
                #
                # codex routes every model-generated command through bubblewrap, and
                # bubblewrap cannot create a user namespace inside the job container:
                #
                #     bwrap: No permissions to create a new namespace, likely because
                #     the kernel does not allow non-privileged user namespaces
                #
                # So on the first real codex review (go-xkms#500, job 67780) NOTHING
                # it tried to run could execute -- not reading .review/pr.diff, not
                # the PR metadata, not the curl that posts the review. It spent 38,090
                # tokens discovering that and reported the failure honestly. Measured
                # in the deployed image: without the flag `echo HELLO-FROM-SHELL`
                # dies at bwrap; with it, the command runs.
                #
                # The job container IS the isolation boundary -- throwaway, one PR,
                # destroyed after. codex's internal sandbox is a second layer that
                # cannot function there, so it buys nothing and costs everything.
                #
                # `-s danger-full-access` changes the SANDBOX POLICY only. Not
                # `--dangerously-bypass-approvals-and-sandbox`, which also skips
                # approval prompts and is broader than what was asked for. Installing
                # the bubblewrap package does NOT fix this: the package was never
                # missing in the way that mattered, the kernel namespace permission is.
                codex exec --model "$MODEL" -c model_reasoning_effort="$EFFORT" \
                  -s danger-full-access \
                  "$facts

          $(cat /opt/review/review-agent.md)${1:+

          $1}"
                ;;
              claude)
                # Same shape as the opencode branch: `--continue` resumes the session on
                # the retry, so `$1` is the resume prompt and replaces the full prompt
                # rather than being appended to it.
                #
                # --permission-mode bypassPermissions for the same reason codex gets
                # -s danger-full-access (owner ruling 2026-09-09: "the agent is already
                # sandboxed in our container!"). The job container IS the boundary:
                # throwaway, one pull request, destroyed after. Without it the CLI
                # prompts for approval on its first tool call, no one answers, and the
                # review burns its 45 minutes waiting on a terminal that does not exist.
                # shellcheck disable=SC2086
                claude -p ${1:+--continue} \
                  --model "$MODEL" \
                  --permission-mode bypassPermissions \
                  "${1:-$facts

          $(cat /opt/review/review-agent.md)}"
                ;;
              *)
                # shellcheck disable=SC2086
                opencode run ${1:+--continue} \
                  --model "$MODEL" \
                  --print-logs --log-level ERROR \
                  "${1:-$facts

          $(cat /opt/review/review-agent.md)}"
                ;;
            esac
          }

          run_reviewer

          # THE MODEL CAN END ITS TURN WITHOUT FINISHING. opencode treats an
          # assistant message carrying no tool call as the end of the run and
          # exits 0 -- so a model that narrates its next action instead of taking
          # it ends the review, mid-investigation, successfully.
          #
          # MEASURED, run 14527 job 64096 (go-trusted-platform, 2026-09-09), the
          # last four lines of an 11m30s run against a 45m timeout:
          #
          #     -> Read pkg/dns/dns64.go
          #     -> Read pkg/dns/plugin.go [offset=40, limit=120]
          #     -> Read pkg/dns/dns64_test.go
          #     Now let me read the surrounding context in plugin.go and the tests.
          #
          # It stopped talking. No review existed, and the job would have been
          # green without the confirm step below.
          #
          # review-agent.md now forbids ending a turn on narration, but a prompt
          # cannot guarantee a turn-ending behaviour, so this does not rely on it.
          # `--continue` RESUMES THE SAME SESSION with its context intact
          # (verified: a token stored in one invocation was recalled in the next),
          # so the retry costs the remaining work rather than a second review --
          # it picks up immediately after the sentence above.
          #
          # ONE retry. Two coin flips, not a loop: a model that stops twice is a
          # real failure and must reach the confirm step and go red.
          if [ -z "$(verdict_state)" ]; then
            echo "::warning::opencode exited 0 with no verdict on $EVENT_SHA. Resuming the session once."
            run_reviewer "You ended your turn without posting a review on $EVENT_SHA, so no
               review exists and the pull request is still ungated. Do not
               summarise what you were going to do. Finish the review and POST it
               now via the Gitea API, exactly as your instructions describe. If
               you cannot complete the investigation, post REQUEST_CHANGES with
               what you have established so far and say what is unfinished --
               that is worth more than nothing, which is what currently exists."
          else
            echo "A verdict is already recorded on $EVENT_SHA; no retry needed."
          fi

      # THE JOB'S EXIT STATUS IS NOT THE VERDICT. opencode exits 0 when the model
      # finished talking, which says nothing about whether a review was recorded.
      # MEASURED, go-luks2 #137 (2026-09-09, task 53362): the model wrote a real
      # 1620-character review, POSTed it correctly, checked that the POST was
      # accepted -- exactly as instructed -- and the job went GREEN with the
      # review filed as a PENDING draft. review-agent.md told it `event` must be
      # `APPROVE`; Gitea's enum is `APPROVED` (swagger CreatePullReviewOptions),
      # and Gitea does not reject an unrecognised event, it accepts the POST with
      # HTTP 200 and degrades the review to PENDING. A draft is visible to its
      # author alone and counts as no verdict, so the required context said
      # "reviewed" over a review nobody could read.
      #
      # The prompt is fixed. This step exists so that class of failure cannot be
      # silent again, whatever causes it next: an unreviewed PR must not become
      # mergeable because the reviewer died, and "died" includes "returned 0
      # having recorded nothing".
      #
      # It cannot run earlier -- it asserts an effect of the review -- but it
      # costs one API call and no GPU.
      - name: Confirm a verdict was actually recorded
        if: github.server_url != 'https://github.com' && steps.guard.outputs.skip == ''
        env:
          BOT: ${{ secrets.OPENCODE_BOT_TOKEN }}
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          BOT_USER: ${{ steps.reviewer.outputs.agent }}
        run: |
          set -euo pipefail

          # A PR closed or merged while the review ran gates nothing, and the
          # model is told to stop without posting in that case. Do not fail a
          # job over a missing verdict on a pull request that no longer wants
          # one -- but read the state, never assume it.
          pr=$(curl -sS -H "Authorization: token $BOT" "$REPO_API/pulls/$PR_NUM")
          pr_state=$(printf '%s' "$pr" | jq -r '.state // empty')
          [ -n "$pr_state" ] || { echo "::error::could not read the state of PR $PR_NUM"; exit 1; }
          if [ "$pr_state" != "open" ]; then
            echo "PR $PR_NUM is $pr_state now; it gates nothing. Not requiring a verdict."
            exit 0
          fi
          is_draft=$(printf '%s' "$pr" | jq -r '.draft // false')
          pr_title=$(printf '%s' "$pr" | jq -r '.title // ""')
          # Hand the draft status DOWN rather than making the reviewer work it
          # out. Measured on go-xkms#452 (job 65849): 250.9 seconds -- four
          # minutes of a twenty-seven minute review -- spent on "PR 452 is open
          # and DRAFT, so I may only post REQUEST_CHANGES or COMMENT". The
          # workflow already knows; the same reasoning as fetching the diff.
          echo "is_draft=$is_draft" >> "$GITHUB_OUTPUT"

          # ONE jq, TWO LINES: the state, then a marker for whether the body has
          # any non-whitespace in it. The body itself is never read into a shell
          # variable -- it is multi-line prose and would break a line-based read,
          # and nothing here needs its content, only whether it exists.
          verdict=$(curl -sS -H "Authorization: token $BOT" "$REPO_API/pulls/$PR_NUM/reviews" \
                    | jq -r --arg u "$BOT_USER" --arg s "$EVENT_SHA" '
                        [ .[] | select(.user.login == $u and .commit_id == $s) ] | last
                        | if . == null then ["", "EMPTY"]
                          else [ (.state // ""),
                                 (if ((.body // "") | gsub("\\s"; "")) == "" then "EMPTY" else "NONEMPTY" end) ]
                          end
                        | .[]')
          state=$(printf '%s\n' "$verdict" | sed -n 1p)
          body_state=$(printf '%s\n' "$verdict" | sed -n 2p)

          case "$state" in
            APPROVED|REQUEST_CHANGES|COMMENT)
              # A VERDICT MUST SAY SOMETHING. Gitea refuses REQUEST_CHANGES with
              # an empty body (422 "review event REQUEST_CHANGES requires a
              # body") but ACCEPTS an empty APPROVED -- so emptiness survives
              # only on the permissive outcome, the same shape as the draft bug
              # this step was written for. Observed as a len=0 review on
              # go-quicbaas #711.
              #
              # This is the minimum bar -- non-empty -- not a quality gate. It
              # does not judge content, count citations or check line numbers;
              # it only refuses to call "" a review.
              if [ "$body_state" != "NONEMPTY" ]; then
                echo "::error::$BOT_USER recorded $state on $EVENT_SHA with an EMPTY body."
                echo "::error::An approval that says nothing is indistinguishable from a"
                echo "::error::review that never read the change. Not accepting it."
                exit 1
              fi

              # AN APPROVAL CONTRADICTS THE AUTHOR ON A DRAFT. The old
              # pr-review.sh refused to post one ("refusing to APPROVE a pull
              # request its author has marked unfinished"); deleting the script
              # left that as prose in review-agent.md and nothing enforcing it.
              # This restores it as a check. REQUEST_CHANGES and COMMENT on a
              # draft are fine and wanted -- only the approval is refused.
              case "$state" in
                APPROVED)
                  wip=no
                  [ "$is_draft" = "true" ] && wip=yes
                  case "$pr_title" in
                    WIP:*|wip:*|Draft:*|draft:*|"DO NOT MERGE"*) wip=yes ;;
                  esac
                  if [ "$wip" = yes ]; then
                    echo "::error::$BOT_USER APPROVED $EVENT_SHA, but PR $PR_NUM is marked"
                    echo "::error::unfinished (draft=$is_draft, title '$pr_title')."
                    echo "::error::An approval says the change is ready to merge, which"
                    echo "::error::contradicts its author. Take the PR out of draft and"
                    echo "::error::re-run, or expect COMMENT rather than an approval."
                    exit 1
                  fi
                  ;;
              esac
              echo "$BOT_USER recorded $state on $EVENT_SHA."
              ;;
            PENDING)
              echo "::error::$BOT_USER's review on $EVENT_SHA is a PENDING draft, not a"
              echo "::error::verdict: nobody can read it and it approves nothing. The event"
              echo "::error::value was almost certainly wrong -- Gitea wants APPROVED, not"
              echo "::error::APPROVE, and answers an unknown event with 200 and a draft."
              exit 1
              ;;
            "")
              echo "::error::opencode exited 0 but there is no $BOT_USER review on"
              echo "::error::$EVENT_SHA at all. The reviewer produced nothing; this PR is"
              echo "::error::unreviewed and must not read as reviewed."
              exit 1
              ;;
            *)
              echo "::error::unexpected review state '$state' on $EVENT_SHA."
              exit 1
              ;;
          esac

      # Auto-merge is NOT armed here. It is armed once, when the PR opens
      # (automerge.yml), so a failed review cannot leave a PR unarmed and
      # forgotten. Gitea merges when its required checks pass -- and this
      # review is one of them.
