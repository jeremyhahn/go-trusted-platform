# ci-template: v1.29.5 (customized)
#
# Template ref: handbook f9730b11f, software/templates/github-actions/ci.yml
# at f9730b11f (v1.29.5), adopted over v1.29.3 (handbook fb7fa19ac), itself
# adopted over v1.29.2 (handbook bcff2e22a) and v1.28.0 (handbook 0d451ec).
# v1.29.4 and v1.29.5, adopted here (#1353) in one CI-file PR (Company
# Agent rulings 261(c) and 262(a); handbook f9730b11f): each image build
# passes GO_BUILD_PROXY=<DEVCACHE_GOPROXY>|https://proxy.golang.org|direct when
# the runner sets DEVCACHE_GOPROXY and the cache answers a 5-second probe, as
# one quoted make argument, and the Makefile quotes it on its docker build
# line, where an unquoted `|` is a shell pipe; the schedule guard reads
# waiting before in_progress; scripts/in-toolchain-image.sh v4. This repository's
# copy kept its memory bound and takes the scratch volume and the Athens-first
# bridge GOPROXY; its five image builds take GO_BUILD_PROXY.
# v1.29.3 (Company Agent ruling 255(10)/(11)(c), 2026-10-29): one schedule
# run per repository, skipped when a main run is in flight. A schedule run's
# concurrency group is `schedule-{repository}`, with no sha. A new
# `schedule-guard` job (ubuntu-latest, `actions: read`, no checkout) asks the
# Gitea API on a schedule run only whether ci.yml has a push run on main in
# progress or waiting, and sets `verdict`: `run`, `busy` or `unreadable`; off
# schedule, and on the github.com mirror, it sets `run` without a call. On a
# schedule run every bigdisk job here (image, lint-gates, integration, vuln, soak)
# runs only on `run`. On `busy` CI Gate skips too, so the schedule's Gate
# posts `skipped`, never a green nightly; on `unreadable` it fails, naming
# the guard. The guard is a `pr` job in the gate: it runs on every event and
# only reads the API.
# v1.29.2 (Company Agent ruling 239(8), 2026-10-28): comments only. A
# CUSTOMIZE job gated on a changes output needs the image job too and tests
# an image job output in its `if:` (the comment above arch-gates). This repo
# has no such job, so no job, gate or tier changes.
# v1.29.1 (Company Agent ruling 226(15), 108 repair, 2026-10-27): lint fails
# fast. lint-gates runs `make lint-gates` without `-k`, so the first failing
# gate ends the step; the gates after it run on the next push.
# v1.29.0 (Company Agent rulings 220(5) and 221(4), 2026-10-27): the Alpine
# package index checksum joins the integration image's tag hash.
# v1.28.0 (Company Agent ruling 219(3), 2026-10-26):
# `make deps-check` joins the PR tier as a lint-class gate. Its step in the
# image job drops the CI_FULL_TIER condition and runs on every event, as
# `make lint` does, a docs-only PR included (the image job runs there), so a
# module behind its dependency floor fails the PR, not main after the merge.
# It keeps IN_IMAGE_NETWORK=bridge for the module proxy and stays on the full
# tier too. The image job is already `pr` in ci-gate, so no needs or check
# line changes. The body is the template's: changes, image (lint,
# releasability, build, test, security, deps-check, trivy image), lint-gates,
# arch-gates, integration, soak and ci-gate. Deviations, each with its reason
# (the CUSTOMIZE line at each site repeats it):
#   - The integration image family follows ci-standard.md §9 (#1272): every
#     job names IT_IMAGE with `make -s it-image`, a content tag reused while
#     the daemon holds it; reaper v5; the template's lease (a container named
#     by run) taken under the image lock; no teardown removes a tag. The image
#     job's lease spans only the integration build and the `docker save` its
#     trivy step scans, and is released before the toolchain build, lint and
#     the suites. CUSTOMIZE: the base is Debian bookworm (golang), so
#     APK_INDEX_SUM is `none` and APT_REFRESH (scripts/apt-refresh-key.sh),
#     read once per job beside it, is the package key the tag hashes. The
#     image job names the integration stage (IT_WARM_CACHE=0) and the legs
#     the integration-legs stage, so the two tags differ.
#   - No trim-ci-caches.sh: scripts/in-toolchain-image.sh mounts no cache
#     volumes, so there is nothing to trim.
#   - make lint is three targets here: fmt-check (gofmt), vet, lint
#     (golangci-lint and actionlint).
#   - No assert-build-tags.sh and no GO_BUILD_TAGS env: the Makefile derives
#     the tag set (`make -s print-build-tags`), and `make test` runs
#     `make check-go-build-tags`, which fails if any CI target drops it.
#   - The test stage is make test, make test-sdk-go and make test-race, not
#     make coverage: coverage has no -race and no threshold, and the repo is
#     at 80.9% against the 90% gate #965 waits on. COVERAGE_THRESHOLD is
#     absent until #965 lands.
#   - make build is followed by the CGO build (build-no-web), the untagged
#     `go build ./...`, the Raspberry Pi cross-build and the sdk/go module.
#   - lint-gates runs on the runner with setup-go: its gates are greps that
#     need no toolchain image.
#   - sdkjs and web run on the runner with setup-node: the toolchain image
#     has no Node (the Dockerfile installs it in the integration stage only).
#   - The jobs that need no Docker daemon (race, lint-gates, arch-gates,
#     sdkjs, web; #1589 and its follow-up) take race's runs-on: a push to main
#     and a pull_request from this repository run on the bigdisk runner
#     [self-hosted, linux, x64, bigdisk], everything else on ubuntu-latest.
#     Each needs schedule-guard and carries the guard in its `if:`, its
#     checkout persists no token, and any apt step is hosted-only. fips stays
#     hosted: its main-tier `if:` has no guarded form yet (see there).
#   - The gate's check lines are `check <tier> <job> "$RESULT"` with a docs
#     tier (pkg/arch/citiers_test.go holds the format).
#   - integration needs image (isolation, see there) and applies the
#     foreign-failure baseline (ruling 125); soak applies it per iteration.
#   - FIPS is kept and gated in the `main` tier (#853, #1411, see its comment).
#   - The image job's security step runs make security-novuln; govulncheck
#     runs as the full-tier vuln job at 20g, which builds its own toolchain
#     image (#1425, see there).
#   - trivy image keeps --ignore-unfixed, --skip-dirs /gomodcache and its
#     ignorefile. The SARIF upload is gone with the runner security job:
#     Gitea has no code-scanning ingest.
#
# Stage order. lint-gates, arch-gates, web, fips, vuln and soak start at once
# (ci-template v1.14; vuln after schedule-guard, #1425; arch-gates and web
# after it too, as bigdisk jobs). image and sdkjs (the docs tier, v1.24) start after the
# seconds-long `changes` job. integration starts after image (isolation, see
# there) and runs as five parallel legs, one job per leg of the suite runner
# (#1119). A run takes as long as changes, image and the slowest integration
# leg. ci-gate, the one required check, needs every gated job and fails
# closed on any result but success. push runs on main only: automerge.yml's
# merge trains are PRs from merge-train/* and get their CI from pull_request.
#
# The five CI-standard stages (handbook ci-standard.md §1) run in this
# project's devcontainer image (§2): `image` runs lint, build and test in the
# toolchain image, plus deps-check (v1.28, every event) and security (without
# govulncheck) and trivy in the full tier; `vuln` runs govulncheck in its own
# toolchain container (#1425);
# `integration` and `soak` run the integration suite in the integration image.
#
# Tiers (handbook ci-standard.md §8):
#
#   PR tier       every ready PR. changes, image (its lint steps and, from
#                 v1.28, deps-check run on every event, a docs-only PR
#                 included), lint-gates, arch-gates, and the docs tier:
#                 sdkjs, and the image job's build and test steps.
#   Full tier     push to main, workflow_dispatch, the schedule, or a PR
#                 labelled `ci:full`. web, integration, fips, vuln, and the
#                 image job's security and trivy steps.
#   Nightly tier  the schedule and workflow_dispatch (v1.24). soak.
#
# CI_FULL_TIER (workflow env) is the full-tier selection; a job-level `if:`
# cannot read env on Gitea 1.27.1, so each full-tier job spells it out, and
# steps and the gate read the env.
#
# Docs-only PRs (v1.24, ci-standard.md §10 (a)): a PR whose every changed file
# is markdown or under docs/ runs the lint steps, the releasability test and
# the gates only. `ci:full` overrides it.
#
# Draft PRs run no CI (v1.26): every PR-reachable job's `if:` carries
# `!github.event.pull_request.draft` and CI Gate fails on a draft. There is no
# `ready_for_review` trigger: mark the PR ready, then push.
#
# Each tier's `if:` is spelled out per job because Gitea's workflow parser
# does not expand YAML anchors. ci-gate passes a job that its tier skipped and
# nothing else that skipped. A full-tier job may need a PR-tier one; never the
# reverse, and no job outside the nightly tier needs a nightly one.
# pkg/arch/citiers_test.go fails `make test` when the tiers, the gate's needs
# and its check lines disagree.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # No `labeled` (#853): adding `ci:full` takes effect on the next push, not
    # on the label event, so a label never re-runs the PR tier on the same
    # commit. pkg/arch/citiers_test.go holds the list.
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  # v1.23: main's full tier nightly as well as after every merge, and the
  # soak (ruling 135: ci.yml is the one scheduler; nightly.yml and batch.yml
  # are dispatch-only since #852). Scheduled runs are on the default branch.
  # CUSTOMIZE: the hour. nightly.yml has no schedule to stay off.
  # v1.29.3: one schedule run per repository (the concurrency group below),
  # and its bigdisk jobs skip while a main push run is in flight (the
  # schedule-guard job).
  schedule:
    - cron: '0 4 * * *'

# Cancel superseded runs. Keyed on the ref so a branch only supersedes itself,
# and set at workflow level so the whole superseded pipeline goes. ci-gate
# treats `cancelled` as a failure, which never blocks a merge: only a
# superseded PR commit gets cancelled (#510).
#
# On main the group is the event and the commit instead (DS-3465, ci-template
# v1.26.2, ruling 145): every main commit needs its own Gate result, so the
# next push to main is a new group and never cancels the run in progress, and
# a dispatch or the schedule never cancels the push run of the same commit.
# Gitea 1.27.1 evaluates expressions in `group` but not in
# `cancel-in-progress`, which stays the literal true.
# v1.29.3 (ruling 255(10)/(11)(c)): a schedule run's group is
# `schedule-{repository}`, with no sha, so a repository has one schedule run
# at a time. It is tested first, so a schedule run never takes a main group.
# The push, pull_request and workflow_dispatch groups do not change.
# pkg/arch/citiers_test.go holds the policy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && format('schedule-{0}', github.repository) || github.ref == 'refs/heads/main' && format('main-{0}-{1}', github.event_name, github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CUSTOMIZE: Go on the runner, for the jobs that run there (lint-gates,
  # sdkjs and web for the Makefile's parse-time `go env`, fips, and
  # scripts/foreignfailures in integration and soak). An exact patch release,
  # never "stable". The `go` directive in every go.mod must not exceed it.
  GO_VERSION: "1.27.3"
  # Modules resolve from tags, never from a workspace (the Makefile and
  # release.yml set the same).
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"
  # The full-tier selection (v1.23): every event but pull_request, and a PR
  # labelled ci:full. Steps and ci-gate read it; a job-level `if:` cannot.
  CI_FULL_TIER: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  # v1.24: the files a docs-only PR may touch.
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'
  # CUSTOMIZE: the docs/ pages unit tests read; a PR that changes one runs
  # every PR-tier step. They are the doc-contract tests in pkg/config
  # (docs/daemon/*.md), cmd/platformd (docs/daemon/cli.md) and pkg/webservice
  # (docs/web/user.md). No go:embed reads docs/ or markdown.
  DOCS_TESTED_PATTERN: '^docs/(daemon|web)/'
  # v1.26.1: the `go test` arguments of the test that proves a release still
  # builds, run alone on a docs-only PR. CUSTOMIZE: empty, this repo has no
  # releasability test yet, so the step skips.
  RELEASABILITY_TEST: ""

jobs:
  # v1.24: a PR whose every changed file matches DOCS_ONLY_PATTERN, and none
  # DOCS_TESTED_PATTERN, is docs-only: the docs-tier jobs and steps skip, and
  # ci-gate passes their skip only when docs_only reads exactly `true`. Off
  # pull_request, or on a ci:full PR, docs_only is always false. Any doubt (a
  # failed diff, an empty list) reads as false.
  # Routing (m2475): a push to main and a pull_request from this repository
  # run on the bigdisk pool; fork PRs, dispatch and the schedule stay on
  # ubuntu-latest. The job needs git, curl and jq only.
  changes:
    name: Changed files
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ github.event_name == 'pull_request' && env.CI_FULL_TIER != 'true' }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Is every changed file docs or markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ] && [ "$CI_FULL_TIER" != true ]; then
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$DOCS_ONLY_PATTERN" \
                && ! printf '%s\n' "$files" | grep -qE "$DOCS_TESTED_PATTERN"; then
                docs_only=true
              fi
              printf '%s\n' "$files"
            fi
          fi
          echo "docs only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # v1.29.3 (Company Agent ruling 255(10)/(11)(c)): one nightly per
  # repository, and none while main is busy. On a schedule run only, this job
  # asks the API whether this workflow has a push run on main in progress or
  # waiting, and sets `verdict`: `run` (none, or not a schedule run), `busy`
  # (one is) or `unreadable` (no count came back). On a schedule run every
  # bigdisk job runs only on `run`; CI Gate skips on `busy` and fails on
  # `unreadable`. The job runs on every event, not on schedule alone, so no
  # bigdisk job's `needs` meets a skipped job off schedule; off schedule it
  # makes no call. It checks nothing out, so no repository code runs beside
  # the tokens.
  # Routing (m2475): a push to main and a pull_request from this repository
  # run on the bigdisk pool; fork PRs, dispatch and the schedule stay on
  # ubuntu-latest. The job needs git, curl and jq only.
  schedule-guard:
    name: Schedule guard
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    # v1.26: a draft PR runs no CI (as the changes job).
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      actions: read
      contents: read
    outputs:
      verdict: ${{ steps.guard.outputs.verdict }}
    steps:
      - name: Is a main push run of this workflow in flight?
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          SERVER: ${{ github.server_url }}
          # This workflow's own file: the route counts its runs only.
          RUNS_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/workflows/ci.yml/runs
          JOB_TOKEN: ${{ github.token }}
          BOT: ${{ github.event_name == 'schedule' && secrets.AGENT_TOKEN || '' }}
        run: |
          set -uo pipefail
          # runs <token>: sets N to the number of this workflow's push runs
          # on main in progress or waiting. It returns 1, with the answer in
          # CODE, when a reply is not 200 with a count. The token reaches
          # curl as a header from a file descriptor, never on its command line.
          runs() {
            local st n
            N=0
            # v1.29.4: waiting is read before in_progress. A run only moves
            # waiting, then in_progress, then done, so the other order lets a
            # run start between the two queries and be counted by neither.
            for st in waiting in_progress; do
              CODE=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/runs.json" -w '%{http_code}' \
                -H @<(printf 'Authorization: token %s\n' "$1") \
                "$RUNS_API?event=push&branch=main&status=$st&limit=1") || CODE="curl exit $?"
              [ "$CODE" = 200 ] || return 1
              n=$(jq -er '.total_count | numbers' "$RUNNER_TEMP/runs.json") || { CODE="200 with no count"; return 1; }
              echo "$st: $n"
              N=$((N + n))
            done
          }
          verdict=run N=0
          if [ "$EVENT" != schedule ]; then
            echo "not a schedule run: no check"
          elif [ "$SERVER" = https://github.com ]; then
            echo "the github.com mirror has no bigdisk runner: no check"
          elif [ -n "$JOB_TOKEN" ] && runs "$JOB_TOKEN"; then
            echo "read with the job token"
          elif job="${CODE:-no job token}"; [ -n "$BOT" ] && runs "$BOT"; then
            echo "read with AGENT_TOKEN; the job token got: $job"
          else
            bot="not set"; [ -z "$BOT" ] || bot="$CODE"
            verdict=unreadable
            echo "::error::the Actions API gave no count (job token: $job; AGENT_TOKEN: $bot), so every bigdisk job skips and CI Gate fails"
          fi
          if [ "$verdict" = run ] && [ "$N" -gt 0 ]; then
            verdict=busy
            echo "::notice::$N push run(s) of this workflow on main in flight: this schedule run skips its bigdisk jobs, and CI Gate posts skipped"
          fi
          echo "verdict: $verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

  # The template's image job: builds the devcontainer images from
  # build/docker/devcontainer/Dockerfile at this commit and runs the toolchain
  # stages in the toolchain image (ci-standard.md §1-§2). The checkout is
  # copied into each toolchain container (scripts/in-toolchain-image.sh): the
  # daemon is reached through a socket, so a bind mount would resolve on its
  # host. Every step but make security, make deps-check and trivy runs
  # without a network. PR tier: a docs-only PR runs its lint, deps-check
  # (v1.28) and releasability steps; the build and test steps skip on
  # docs_only.
  image:
    name: Devcontainer image [lint, build, test, security, deps-check, trivy image]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    # v1.26: never on a draft. v1.29.3: on a schedule run, only on the
    # schedule guard's `run`.
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}
    needs: [changes, schedule-guard]   # v1.29.3
    # CUSTOMIZE: lint (up to GOLANGCI_LINT_TIMEOUT, 45m, #426) and the unit
    # suite run one after another here; the race suite is the race job.
    timeout-minutes: 240
    env:
      # CUSTOMIZE (ruling 108 (b)): the project's own BuildKit builder
      # (Makefile BUILDX_BUILDER). Its cache is this project's alone:
      # `docker buildx prune --builder` trims what the build left behind,
      # never another project's cache. Shared by
      # every job and run, so the tools, modules and apt layers stay warm up
      # to BUILDKIT_KEEP_STORAGE.
      BUILDX_BUILDER: go-trusted-platform-ci
      BUILDKIT_KEEP_STORAGE: 40gb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # v1.27: mask the forge credential, and the token inside a credentialed
      # URL, before any step can echo it.
      - name: Mask the module credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh go-trusted-platform-ci-

      # ci-standard.md §9: the content tag hashes the package indexes the
      # build resolves against. CUSTOMIZE: the Dockerfile's FROM names
      # GO_IMAGE, which has no global ARG default, so the base comes from
      # scripts/tool-pins.sh; it is Debian, so the sum is `none`. APT_REFRESH
      # (scripts/apt-refresh-key.sh) is the Debian refresh key the base
      # stage's apt layer takes. Read once here, so the tag and the build
      # hash and build the same key.
      - name: Read the package indexes
        id: index
        run: |
          base=$(sed -n 's/^GO_IMAGE=//p' scripts/tool-pins.sh)
          sum=$(APK_BASE_IMAGES="$base" scripts/apk-index-sum.sh)
          refresh=$(scripts/apt-refresh-key.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"
          echo "APT_REFRESH=$refresh" >> "$GITHUB_ENV"
          echo "apk_index_sum=$sum" >> "$GITHUB_OUTPUT"
          echo "apt_refresh=$refresh" >> "$GITHUB_OUTPUT"

      # CUSTOMIZE: IT_WARM_CACHE=0 names the integration stage, the image
      # `trivy image` scans (make docker-build-integration).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image IT_WARM_CACHE=0)" >> "$GITHUB_ENV"

      # Creates the builder once per daemon and reuses it after; a second
      # create or bootstrap racing a concurrent job's is retried. The prune
      # also bounds what a cancelled run, whose teardown never ran, left.
      - name: Prepare the project's BuildKit builder
        run: |
          docker buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1 ||
            docker buildx create --name "$BUILDX_BUILDER" --driver docker-container >/dev/null ||
            docker buildx inspect "$BUILDX_BUILDER" >/dev/null
          docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null ||
            docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE"

      # The forge credentials reach the build only as the gomodauth BuildKit
      # secret, from a file outside the context.
      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      # ci-standard.md §9: an image the daemon already holds under this
      # content tag is reused; a missing one is built once. The lease, a
      # created container on the image id, spans only that build and the
      # `docker save` trivy scans: the release step below ends it before the
      # toolchain build, lint and the suites, so the reaper is never kept
      # from an image for the hours they take.
      - name: Lease the integration image
        run: |
          lease="go-trusted-platform-ci-lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          image_lock() {
            local lock="go-trusted-platform-ci-image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          take_lease() {
            id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null) || return 1
            docker create --pull never --name "$lease" "$id" true >/dev/null || return 1
            [ "$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null)" = "$id" ] && return 0
            docker rm "$lease" >/dev/null 2>&1 || true
            return 1
          }
          declare -f image_lock image_unlock take_lease > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          image_lock || exit 1
          if ! take_lease; then
            image_unlock
            echo "integration image $IT_IMAGE is missing or went before its lease; building it once"
            # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
            # and the cache answers, `|` so any error falls through to the public
            # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
            bp=
            if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
              bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct"
            fi
            make docker-build-integration ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE"
            image_lock || exit 1
            if ! take_lease; then
              echo "::error::the integration image $IT_IMAGE is missing after one rebuild, so this job holds no lease on it"
              exit 1
            fi
          fi
          image_unlock
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"

      # Full tier: saved under the lease, scanned by the trivy step after
      # lint. The tag is pointed at the leased id under the image lock first.
      - name: Save the integration image for trivy
        if: ${{ env.CI_FULL_TIER == 'true' }}
        run: |
          source "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          image_lock || exit 1
          docker tag "$IT_LEASE_ID" "$IT_IMAGE"
          image_unlock
          docker save -o "$RUNNER_TEMP/it-image.tar" "$IT_IMAGE"

      - name: Release the integration image lease
        if: always()
        run: |
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null
          echo "IT_LEASE=" >> "$GITHUB_ENV"

      - name: Build the toolchain image
        run: |
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # Lint: gofmt, vet, golangci-lint and actionlint with shellcheck
      # (devops.md §4). CUSTOMIZE: three targets. golangci-lint and actionlint
      # build from build/tools-src, whose modules the image bakes. vet
      # compiles the cgo TPM simulator against the image's OpenSSL headers.
      # v1.27: `make lint-gates` runs in its own job, never here.
      - name: make fmt-check
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_MEMORY: 4g
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make fmt-check

      - name: make vet
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_MEMORY: 12g
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make vet

      - name: make lint
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_MEMORY: 16g
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make lint

      # v1.26.1: a docs-only PR skips the test stage, so it runs the
      # releasability test alone; any other run gets it from the test stage.
      - name: Releasability test (docs-only PR)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.RELEASABILITY_TEST != '' && needs.changes.outputs.docs_only == 'true' }}
        env:
          IN_IMAGE_MEMORY: 8g
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "go test -count=1 -tags \"\$(make -s print-build-tags)\" $RELEASABILITY_TEST"

      # CUSTOMIZE (build): this repository is build-tag driven. `make build`
      # is the static CGO_ENABLED=0 build with the Makefile's tag set;
      # build-no-web the CGO_ENABLED=1 platformd, platformctl and gatewayd;
      # rpi-binaries the aarch64 binaries the Raspberry Pi factory image ships
      # (docs/factory-image/engineering.md).
      - name: make build, build-no-web, rpi-binaries
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.changes.outputs.docs_only != 'true' }}
        env:
          IN_IMAGE_MEMORY: 12g
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make build build-no-web rpi-binaries

      - name: Build all packages (default tags)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.changes.outputs.docs_only != 'true' }}
        env:
          IN_IMAGE_MEMORY: 12g
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" go build ./...

      # CUSTOMIZE (sdk/go module): a separate module that `./...` from the
      # root never enters. A consumer gets only the sdk/go tree from the
      # module's tag, so sdk-consumer-check builds every SDK package from a
      # throwaway module and fails if it reaches a root-module package (#840).
      - name: Build sdk/go, and as a module consumer
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.changes.outputs.docs_only != 'true' }}
        env:
          IN_IMAGE_MEMORY: 8g
        run: |
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "cd sdk/go && go build ./..."
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make sdk-consumer-check

      # CUSTOMIZE (test stage): make test, not make coverage. `make test` is
      # `go test -tags "$(BUILD_TAGS)"` over ./pkg/... ./cmd/... minus
      # TEST_EXCLUDE, whose every entry carries its reason in the Makefile,
      # and it runs check-go-build-tags first. test-sdk-go is the sdk/go
      # module, which a package list does not cross into. Unbounded (-p 80 on
      # the 80-thread hosts) it passed 24.2 GB; GOMAXPROCS 16 is go test's
      # -p inside the container and keeps it under 16g (#1178).
      - name: make test, test-sdk-go
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.changes.outputs.docs_only != 'true' }}
        env:
          IN_IMAGE_MEMORY: 16g
          IN_IMAGE_GOMAXPROCS: 16
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make test test-sdk-go

      # make security-novuln: make security (devops.md §8) without
      # govulncheck, i.e. gosec, go mod verify and `trivy fs`, with
      # GOSEC_EXCLUDE single-sourced in the Makefile. govulncheck runs in the
      # vuln job at 20g: its symbol scan reached 16.7 GB under this step's 16g
      # (#1425). security and trivy are full-tier steps (v1.23,
      # ci-standard.md §8), with a network for the vulnerability databases.
      # Unbounded it reached 17.0 GB; GOMAXPROCS 8 (the go list compiles gosec
      # loads through) and GOSEC_CONCURRENCY 2 keep it under 16g (#1178).
      - name: make security-novuln
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
          IN_IMAGE_MEMORY: 16g
          IN_IMAGE_GOMAXPROCS: 8
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make security-novuln GOSEC_CONCURRENCY=2

      # Fails when a library, first-party or third-party, is behind its latest
      # release without devops.md §9's documented reason (ci-standard.md §1).
      # v1.28: a lint-class gate of seconds on the PR tier, every event, a
      # docs-only PR included (ruling 219(3)); it was full tier only from v1.23.
      # It keeps a network for the module proxy.
      - name: make deps-check
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
          IN_IMAGE_MEMORY: 4g
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make deps-check

      # Blocks on CRITICAL/HIGH findings that have a fix (#933). CUSTOMIZE:
      # --ignore-unfixed is the handbook's rule for image scans (devops.md §8);
      # Debian's unfixed advisories have no package to move to.
      # --skip-dirs /gomodcache: the baked module cache is third-party source,
      # and its test fixtures are not credentials; module vulnerabilities stay
      # gated by govulncheck and `trivy fs` in make security. --ignorefile:
      # dated, path-scoped suppressions for advisories in the dependencies npm
      # bundles, with the reason per entry in the file.
      - name: trivy image (integration image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
          IN_IMAGE_MEMORY: 8g
        run: |
          IN_IMAGE_COPY="$RUNNER_TEMP/it-image.tar:/src/integration-image.tar" \
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
            trivy image --input /src/integration-image.tar --severity CRITICAL,HIGH --exit-code 1 \
              --ignore-unfixed --skip-dirs /gomodcache \
              --ignorefile build/docker/devcontainer/trivyignore-image.yaml

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env" "$RUNNER_TEMP/it-image.tar"
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null 2>&1 || true
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE" || true

  # CUSTOMIZE (#1425): govulncheck, the `vuln` part of make security, as its
  # own full-tier job. Its symbol scan of the root module reached 16.7 GB and
  # was OOM-killed under the image job's 16g security step (run 370010), and
  # GOVULN_MODULES cannot split the root module. Here it runs alone at 20g
  # with GOMEMLIMIT 18GiB below the cap, so the GC works before the cgroup
  # kills it. The job builds the toolchain image as the image job does: a
  # TOOLCHAIN_IMAGE lives only on its builder's daemon, and the project's
  # BuildKit cache keeps a second build warm. It runs beside the image job,
  # not after it, so the scan never waits on lint and the suites.
  vuln:
    name: Vulnerability scan (govulncheck)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    # Full tier only, as the security step was (v1.23); a job-level `if:`
    # cannot read CI_FULL_TIER, so it repeats the selection. v1.29.3: on a
    # schedule run, only on the schedule guard's `run`.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}
    needs: schedule-guard     # v1.29.3
    timeout-minutes: 120
    env:
      # The image job's builder (see there).
      BUILDX_BUILDER: go-trusted-platform-ci
      BUILDKIT_KEEP_STORAGE: 40gb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Mask the module credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh go-trusted-platform-ci-

      # The package keys the toolchain build hashes, as in the image job.
      - name: Read the package indexes
        run: |
          base=$(sed -n 's/^GO_IMAGE=//p' scripts/tool-pins.sh)
          echo "APK_INDEX_SUM=$(APK_BASE_IMAGES="$base" scripts/apk-index-sum.sh)" >> "$GITHUB_ENV"
          echo "APT_REFRESH=$(scripts/apt-refresh-key.sh)" >> "$GITHUB_ENV"

      - name: Prepare the project's BuildKit builder
        run: |
          docker buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1 ||
            docker buildx create --name "$BUILDX_BUILDER" --driver docker-container >/dev/null ||
            docker buildx inspect "$BUILDX_BUILDER" >/dev/null
          docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null ||
            docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE"

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      - name: Build the toolchain image
        run: |
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # make vuln: govulncheck over GOVULN_MODULES with GOVULN_ALLOW, both
      # single-sourced in the Makefile, with a network for the database.
      - name: make vuln
        env:
          IN_IMAGE_NETWORK: bridge
          IN_IMAGE_MEMORY: 20g
          IN_IMAGE_GOMEMLIMIT: 18GiB
          IN_IMAGE_GOMAXPROCS: 8
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make vuln

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE" || true

  # v1.27 (lint-gates): the repo's grep gates (`make lint-gates`; today the
  # InsecureSkipVerify allowlist) run beside lint, not after it, so a gate's
  # verdict never waits on golangci-lint. A repo without the target passes.
  # CUSTOMIZE: on the runner, not the toolchain image (no gate compiles).
  # 108 repair (DS-4142, Company Agent ruling 226(6)): the job runs on the
  # bigdisk label, as the template places it, after it wrote 10.6 GB into its
  # container layer on a small worker node and filled that disk.
  # v1.29.1 (ruling 226(15), 108 repair): the step fails fast. `make
  # lint-gates` runs without `-k`, so the first failing gate ends the step
  # and the job; the gates after it run on the next push.
  lint-gates:
    name: Lint Gates
    needs: schedule-guard     # v1.29.3
    # v1.26: never on a draft. v1.29.3: on a schedule run, only on the
    # schedule guard's `run`.
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}
    # Race's runs-on (#1589 follow-up): the bigdisk runner for a push to main
    # and a same-repository PR, ubuntu-latest otherwise.
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Is there a lint-gates target?
        id: probe
        run: |
          mapfile -t mk < <(git ls-files -- Makefile '*.mk')
          if [ "${#mk[@]}" -gt 0 ] && grep -qE '^lint-gates[[:space:]]*:([^=]|$)' "${mk[@]}"; then
            echo "lint-gates target found"; echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: no lint-gates target in the Makefile; nothing to run"; echo "has_target=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        with:
          go-version: ${{ env.GO_VERSION }}

      # v1.29.1: no -k; the first failing gate ends the step (ruling 226(15)).
      - name: make lint-gates
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        # InfoSec O-2: the public proxy alone, no direct fallback, and
        # read-only module mode, as go-quicbaas's pool test jobs set them.
        # -buildvcs=false is kept from the workflow env this GOFLAGS replaces.
        env:
          GOFLAGS: -mod=readonly -buildvcs=false
          GOPROXY: https://proxy.golang.org
        run: make lint-gates

      # v1.32 (2026-11-08, Company Agent m2098 item 2, InfoSec finding): the
      # internal-name gate. Its patterns are internal values, so they never
      # live in this repository: the Actions secret RELEASABILITY_PATTERNS
      # carries the private pattern file (source in platform-configs). Blank
      # and `#` lines are skipped; every other line is `class<TAB>regex`, a
      # class of coord-host, internal-email, lab-address, lab-host or
      # owner-path (v1.33; an `/i` suffix is allowed) and a POSIX extended regex. A malformed line, an unknown
      # class or a regex grep -E refuses fails the step, which prints the line
      # number only. v1.31 grepped whole lines with -F, so no line matched and
      # the gate was green for a false reason. The step prints path and line
      # of a match, never the value. A run without the secret (a fork PR)
      # skips with a notice; a push to main without it fails. A matched line
      # that carries the InfoSec waiver marker with its reason,
      # "lab-string-ok: <reason>", is not reported (DS-7563, CA m2110); a bare
      # marker without the colon and a reason still fails (CA m2113 (3)).
      - name: Releasability (private patterns)
        if: ${{ !cancelled() }}
        env:
          RELEASABILITY_PATTERNS: ${{ secrets.RELEASABILITY_PATTERNS }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$RELEASABILITY_PATTERNS" ]; then
            if [ "$EVENT" = push ]; then
              echo "::error::RELEASABILITY_PATTERNS is not set; the gate needs the private pattern file (public-hygiene.md)"
              exit 1
            fi
            echo "::notice::RELEASABILITY_PATTERNS is not available to this run; pushes to main run the gate"
            exit 0
          fi
          pf=$(mktemp)
          chmod 600 "$pf"
          trap 'rm -f "$pf"' EXIT
          tab=$(printf '\t')
          n=0 bad=0 count=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            line=${line%$'\r'}
            trimmed=${line#"${line%%[![:space:]]*}"}
            case $trimmed in ''|'#'*) continue ;; esac
            case $line in
              *"$tab"*) ;;
              *) echo "::error::pattern line $n is not class<TAB>regex"; bad=1; continue ;;
            esac
            class=${line%%"$tab"*}
            re=${line#*"$tab"}
            case $class in
              coord-host|internal-email|lab-address|lab-host|owner-path) ;;
              coord-host/i|internal-email/i|lab-address/i|lab-host/i|owner-path/i) ;;
              *) echo "::error::pattern line $n has an unknown class"; bad=1; continue ;;
            esac
            if [ -z "$re" ]; then
              echo "::error::pattern line $n has an empty regex"; bad=1; continue
            fi
            rc=0
            grep -E -e "$re" /dev/null > /dev/null 2>&1 || rc=$?
            if [ "$rc" -ge 2 ]; then
              echo "::error::pattern line $n has a regex grep -E refuses"; bad=1; continue
            fi
            printf '%s\n' "$re" >> "$pf"
            count=$((count + 1))
          done <<< "$RELEASABILITY_PATTERNS"
          if [ "$bad" != 0 ]; then
            echo "::error::the private pattern file is malformed (line numbers above; the values are not shown)"
            exit 1
          fi
          if [ "$count" = 0 ]; then
            echo "::error::RELEASABILITY_PATTERNS holds no class<TAB>regex line"
            exit 1
          fi
          rc=0
          out=$(git grep -n -I -i -E -f "$pf" -- .) || rc=$?
          case $rc in
            0|1) ;;
            *)
              echo "::error::git grep failed (rc $rc)"
              exit 1 ;;
          esac
          hits=$(printf '%s\n' "$out" | grep -v -E 'lab-string-ok:[[:space:]]*[[:alnum:]]' | grep -v '^$' | cut -d: -f1,2 || true)
          if [ -n "$hits" ]; then
            echo "::error::internal names in the tracked tree (path:line; the values are not shown):"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "releasability: $count private patterns, 0 matches"

  # v1.29.2 (ruling 239(8)): a CUSTOMIZE job that runs only when certain
  # paths change (the changes job gains an output for them, `optee` here)
  # needs the image job as well, and its `if:` tests an image job output
  # that its build step sets (here `built`, which the image job declares in
  # `outputs:` when a repository adds such a job), never `needs.<job>.result`
  # and never the changes job's outputs alone. Reading `needs.changes.outputs.*`
  # in the same `if:` is fine:
  #   needs: [changes, image]
  #   if: ${{ !cancelled() && needs.image.outputs.built == 'true' && !github.event.pull_request.draft && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.optee == 'true')) }}
  # v1.29.3 (ruling 255(10)/(11)(c)): a CUSTOMIZE job on bigdisk adds
  # `schedule-guard` to its needs and
  # `(github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run')`
  # to its `if:`, so it skips on a schedule run while main is busy. One that
  # needs the image job skips with it already. pkg/arch/citiers_test.go
  # fails `make test` for a bigdisk job without both.

  # v1.26 (arch-gates): go-objstore is imported only in the storage seam.
  # This repo has no seam and no import, so OBJSTORE_SEAMS is empty and any
  # import fails.
  # Race's runs-on (#1589 follow-up): a grep needs no Docker and no Go. As a
  # bigdisk job it needs schedule-guard and its if: carries the guard.
  arch-gates:
    name: Architecture Gates
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}
    needs: schedule-guard
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    env:
      OBJSTORE_SEAMS: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: No direct go-objstore import outside the storage seam
        run: |
          if [ "$(sed -n 's/^module //p' go.mod)" = github.com/jeremyhahn/go-objstore ]; then
            echo "OK: this is go-objstore"; exit 0
          fi
          hits=$(grep -rln --include='*.go' '"github.com/jeremyhahn/go-objstore' . \
                 | grep -v '_test\.go$' \
                 | { if [ -n "$OBJSTORE_SEAMS" ]; then grep -vE "$OBJSTORE_SEAMS"; else cat; fi; } || true)
          if [ -n "$hits" ]; then
            echo "go-objstore may be imported only in the storage seam (OBJSTORE_SEAMS='$OBJSTORE_SEAMS'):"
            echo "$hits"; exit 1
          fi
          echo "OK: no go-objstore import outside the storage seam"

  # CUSTOMIZE (SDK JavaScript): sdk/javascript's vitest suite and eslint, both
  # zero-baseline gates (#211, #231). Typecheck is not gated until #246. On
  # the runner: the toolchain image has no Node.
  #
  # Job id is `sdkjs`, deliberately without a hyphen: ci-gate dereferences it
  # as `needs.sdkjs.result`. Do not "tidy" this to `sdk-js`.
  #
  # Race's runs-on (#1589 follow-up): npm needs no Docker. As a bigdisk job it
  # needs schedule-guard and its if: carries the guard.
  sdkjs:
    name: SDK JavaScript
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    if: ${{ needs.changes.outputs.docs_only != 'true' && !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}
    needs: [changes, schedule-guard]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Go is not used by the tests: the root Makefile evaluates `go env` at
      # parse time for every target, and without a toolchain the log opens
      # with noise that gets misread as the cause when something else breaks.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Pinned, like GO_VERSION. sdk/javascript declares only
      # `engines: >=18.0.0`; 22 is the active LTS line.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: JavaScript SDK unit tests
        # InfoSec O-3: on the pool, npm ci runs no install script (npm's
        # ignore-scripts config, the --ignore-scripts flag as an environment
        # setting). npm test and npm run still run the script they name.
        env:
          npm_config_ignore_scripts: ${{ runner.environment == 'self-hosted' }}
        run: make test-sdk-js

      - name: JavaScript SDK lint
        # InfoSec O-3: as in the sdkjs job.
        env:
          npm_config_ignore_scripts: ${{ runner.environment == 'self-hosted' }}
        run: make lint-sdk-js

  # CUSTOMIZE (race): the unit suite under the race detector, minus
  # RACE_EXCLUDE (#37). Race detection is sampling, not proof: a ratchet
  # against reintroduction. Hosted runners (CA m2061): four shards, each a
  # round-robin quarter of test-race's package list (Makefile SHARD/SHARDS),
  # to fit a hosted job's 4 cores and 6 hours. The one exception to the
  # hosted runners (m2403 (2), m2406 (1), 2026-11-10): a push to main and a
  # pull_request from this repository run on the bigdisk runner
  # [self-hosted, linux, x64, bigdisk]; fork PRs, other branches,
  # workflow_dispatch and the schedule stay on ubuntu-latest. As on every
  # bigdisk job, it needs schedule-guard and its if: carries the guard. The
  # runner image carries cpio and libssl-dev, so the apt step is hosted-only,
  # and the checkout token is not persisted.
  race:
    name: Race (shard ${{ matrix.shard }}/4)
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    if: ${{ needs.changes.outputs.docs_only != 'true' && !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}
    needs: [changes, schedule-guard]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # cpio: pkg/diskimage/netboot repacks an initramfs with it. libssl-dev:
      # pkg/app's IDevID mTLS tests run go-tpm-tools' simulator, which
      # compiles the reference TPM with cgo against OpenSSL (#149). The
      # bigdisk runner's image carries both: hosted runners only.
      - name: Install cpio and the OpenSSL headers
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y cpio libssl-dev

      - name: make test-race
        # InfoSec O-2: the public proxy alone, no direct fallback, and
        # read-only module mode, as go-quicbaas's pool test jobs set them.
        # -buildvcs=false is kept from the workflow env this GOFLAGS replaces.
        env:
          GOFLAGS: -mod=readonly -buildvcs=false
          GOPROXY: https://proxy.golang.org
        run: make test-race SHARD=${{ matrix.shard }} SHARDS=4

  # ==========================================================================
  # The full tier. These gate every push to main, the schedule, and a PR
  # labelled `ci:full`.
  # ==========================================================================

  # CUSTOMIZE (web console): `make web-deps` installs both lockfiles and builds
  # the SDK dist/ the console resolves, then the console's vitest suite (#450),
  # typecheck and `next build` (#396, #438). `make web-lint` is not gated
  # until #419 clears its baseline. On the runner: the toolchain image has no
  # Node.
  #
  # Job id is `web`, one word, for the same reason `sdkjs` is.
  #
  # Race's runs-on (#1589 follow-up): npm and next build need no Docker. As a
  # bigdisk job it needs schedule-guard and its if: carries the guard.
  web:
    name: Web Console
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}
    needs: schedule-guard
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install from lockfiles and build the SDK the console consumes
        # InfoSec O-3: as in the sdkjs job.
        env:
          npm_config_ignore_scripts: ${{ runner.environment == 'self-hosted' }}
        run: make web-deps

      - name: Web console unit tests
        run: make web-test-unit

      - name: Web console typecheck
        run: make web-typecheck

      - name: Web console build
        run: make web-build-check

  # One integration image per run for every leg (#1119). Each leg used to build
  # it itself: five `docker buildx build --load` runs of 6.5 to 7.3 minutes on
  # main run 67833, the same image five times. This job builds and loads it
  # once on the project's builder and hands its image id to the legs, which
  # run in it by that id (see the integration job's lease step).
  integration-image:
    name: Integration image
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}
    # As the legs had: nothing is built for a run whose image job failed, so
    # no image is left for legs that never run. v1.29.3: schedule-guard as
    # the template has it, as on every bigdisk job.
    needs: [image, schedule-guard]
    # A cold build on a loaded runner (#1299, run 72198): `make
    # docker-build-it` 47.5 min + `docker save` 3.5 min + the 3.2 GB upload
    # at about 5.7 MB/s, about 9.5 min, is about 61 min. 90 leaves margin
    # for a slower runner; a warm runner reuses the image (#1292).
    timeout-minutes: 90
    outputs:
      image_id: ${{ steps.build.outputs.image_id }}
      # The image's identity on any daemon: a hash of its layers' diff ids,
      # which `docker save` / `docker load` keep whatever the image store.
      image_identity: ${{ steps.build.outputs.image_identity }}
      # The artifact a leg on another runner's daemon loads the image from.
      # An output, so a re-run of the legs alone finds the attempt's artifact
      # that built the image they lease.
      artifact: integration-image-${{ github.run_attempt }}
      # The package keys this job's tag hashed, so each leg names the same
      # tag with `make -s it-image` (ci-standard.md §9).
      apk_index_sum: ${{ steps.index.outputs.apk_index_sum }}
      apt_refresh: ${{ steps.index.outputs.apt_refresh }}
    env:
      # The image job's builder (see there).
      BUILDX_BUILDER: go-trusted-platform-ci
      BUILDKIT_KEEP_STORAGE: 40gb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh go-trusted-platform-ci-

      # ci-standard.md §9: the content tag hashes the package indexes the
      # build resolves against. CUSTOMIZE: the Dockerfile's FROM names
      # GO_IMAGE, which has no global ARG default, so the base comes from
      # scripts/tool-pins.sh; it is Debian, so the sum is `none`. APT_REFRESH
      # (scripts/apt-refresh-key.sh) is the Debian refresh key the base
      # stage's apt layer takes. Read once here, so the tag and the build
      # hash and build the same key.
      - name: Read the package indexes
        id: index
        run: |
          base=$(sed -n 's/^GO_IMAGE=//p' scripts/tool-pins.sh)
          sum=$(APK_BASE_IMAGES="$base" scripts/apk-index-sum.sh)
          refresh=$(scripts/apt-refresh-key.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"
          echo "APT_REFRESH=$refresh" >> "$GITHUB_ENV"
          echo "apk_index_sum=$sum" >> "$GITHUB_OUTPUT"
          echo "apt_refresh=$refresh" >> "$GITHUB_OUTPUT"

      # The integration-legs stage, the image every leg runs in.
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      - name: Prepare the project's BuildKit builder
        run: |
          docker buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1 ||
            docker buildx create --name "$BUILDX_BUILDER" --driver docker-container >/dev/null ||
            docker buildx inspect "$BUILDX_BUILDER" >/dev/null
          docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null ||
            docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE"

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      # ci-standard.md §9: an image the daemon already holds under this
      # content tag is reused; a missing one is built once. The image stays
      # on the daemon for the legs; no teardown removes it, and the reaper
      # does once it is unused and older than its image min-age. The build
      # streams the image to this step's `docker load` (BUILDX_CLIENT_LOAD), as
      # a leg's fallback build does: --load imports into the daemon of the
      # builder's node, which need not be the one this job's `docker save`
      # asks, so a build that left no image here fails this step.
      - name: Lease the integration image
        id: build
        run: |
          lease="go-trusted-platform-ci-lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          image_lock() {
            local lock="go-trusted-platform-ci-image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          take_lease() {
            id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null) || return 1
            docker create --pull never --name "$lease" "$id" true >/dev/null || return 1
            [ "$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null)" = "$id" ] && return 0
            docker rm "$lease" >/dev/null 2>&1 || true
            return 1
          }
          declare -f image_lock image_unlock take_lease > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          image_lock || exit 1
          if ! take_lease; then
            image_unlock
            echo "integration image $IT_IMAGE is missing or went before its lease; building it once"
            # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
            # and the cache answers, `|` so any error falls through to the public
            # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
            bp=
            if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
              bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct"
            fi
            make docker-build-it ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE" BUILDX_CLIENT_LOAD=1
            image_lock || exit 1
            if ! take_lease; then
              echo "::error::the build finished but $IT_IMAGE is not on the daemon this job uses (context $(docker context show), DOCKER_HOST=${DOCKER_HOST:-unset}); builder $BUILDX_BUILDER:"
              docker buildx inspect "$BUILDX_BUILDER" || true
              exit 1
            fi
          fi
          image_unlock
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"
          image_id=$id
          image_identity=$(docker image inspect -f '{{json .RootFS.Layers}}' "$image_id" | sha256sum | cut -d' ' -f1)
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "image_identity=$image_identity" >> "$GITHUB_OUTPUT"

      # The legs share this job's runner label, not its daemon (#1119): a leg
      # placed on another runner loads the image from this artifact. Gitea
      # uploads with v3 and github.com with v6 (see batch.yml, ARTIFACTS).
      - name: Save the integration image
        run: |
          source "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          image_lock || exit 1
          docker tag "$IT_LEASE_ID" "$IT_IMAGE"
          image_unlock
          docker save -o "$RUNNER_TEMP/it-image.tar" "$IT_IMAGE"

      - name: Upload the integration image (Gitea)
        if: github.server_url != 'https://github.com'
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: integration-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/it-image.tar
          retention-days: 1

      - name: Upload the integration image (GitHub)
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: integration-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/it-image.tar
          retention-days: 1

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env" "$RUNNER_TEMP/it-image.tar"
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null 2>&1 || true

  # The suite runs in the devcontainer `integration` image built at this
  # commit, under the compose service in build/docker/devcontainer/
  # compose.yaml (ci-standard.md §2). That service is privileged, not
  # hardened: the suite starts OVS, swtpm, qemu and loopback LUKS2 volumes
  # (docs/test/integration.md). Each leg's compose project is
  # go-trusted-platform-ci-<run>-<attempt>-leg<n>, the reaper runs first, and
  # the teardown runs last under if: always().
  integration:
    name: Integration [build tag integration]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    # v1.26: never on a draft PR, ci:full or not. v1.29.3: on a schedule run,
    # only on the schedule guard's `run`.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}
    # CUSTOMIZE (isolation, not staging): the privileged integration suite and
    # the image job's unit suite starve a shared runner when they
    # overlap. Neither consumes the other's output. `needs: image` holds
    # through integration-image, whose image every leg runs in. v1.29.3:
    # schedule-guard as the template has it; the image job skips with the
    # guard already.
    needs: [integration-image, schedule-guard]
    # One job per leg of the suite runner's INTEGRATION_LEGS, in parallel
    # (#1119, ruling 211 (4)): no leg is to run over 20 minutes. Each leg is
    # its own compose project, so its platformd, OVS and swtpm sit in their
    # own container and network namespace, on the fixed ports, beside the
    # other legs'. pkg/arch/integration_legs_test.go fails `make test` when
    # this list and the runner's legs disagree. A failed leg does not cancel
    # the others; ci-gate reads the job's combined result.
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5]
    # Backstop above the 20-minute target, for a leg that hangs. A leg whose
    # daemon lacks the image also downloads and `docker load`s the 3.2 GB
    # artifact: about 9.5 min at the 5.7 MB/s of #1299 (run 72198) plus the
    # load, about 13 min, rounded up to 15 above the old 60.
    timeout-minutes: 75
    env:
      IT_PROJECT: go-trusted-platform-ci-${{ github.run_id }}-${{ github.run_attempt }}-leg${{ matrix.leg }}
      IT_IMAGE_ID: ${{ needs.integration-image.outputs.image_id }}
      IT_IMAGE_IDENTITY: ${{ needs.integration-image.outputs.image_identity }}
      # The package keys the integration-image job's tag hashed, so `make -s
      # it-image` names that job's tag here (ci-standard.md §9).
      APK_INDEX_SUM: ${{ needs.integration-image.outputs.apk_index_sum }}
      APT_REFRESH: ${{ needs.integration-image.outputs.apt_refresh }}
      # The integration container's memory limit, swap included (Makefile
      # IT_MEMORY; compose.yaml mem_limit). The legs peaked at 12.9 GB (#1178).
      IT_MEMORY: 16g
      # The image job's builder (see there).
      BUILDX_BUILDER: go-trusted-platform-ci
      BUILDKIT_KEEP_STORAGE: 40gb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Mask the module credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh go-trusted-platform-ci-

      # The integration-image job's content tag (ci-standard.md §9), which
      # its artifact's `docker load` restores too. Every leg shares it: no
      # teardown removes a tag, and each leg's lease keeps the image.
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      - name: Prepare the project's BuildKit builder
        run: |
          docker buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1 ||
            docker buildx create --name "$BUILDX_BUILDER" --driver docker-container >/dev/null ||
            docker buildx inspect "$BUILDX_BUILDER" >/dev/null
          docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null ||
            docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE"

      # The forge credentials the runner injects (dependency-resolution.md §6)
      # reach the image build only as the gomodauth BuildKit secret, from a
      # file outside the build context.
      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      # Holds the integration-image job's image by its id for this leg: a
      # created, never-started container names it, so the reaper keeps it.
      # Under the image lock, the tag is pointed at that id, so the leg runs
      # in exactly the image the job built.
      - name: Lease the integration image on this runner's daemon
        id: lease
        run: |
          lease="go-trusted-platform-ci-lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          image_lock() {
            local lock="go-trusted-platform-ci-image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          take_lease() {
            id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null) || return 1
            docker create --pull never --name "$lease" "$id" true >/dev/null || return 1
            [ "$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null)" = "$id" ] && return 0
            docker rm "$lease" >/dev/null 2>&1 || true
            return 1
          }
          declare -f image_lock image_unlock take_lease > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          image_lock || exit 1
          if docker create --pull never --name "$lease" "$IT_IMAGE_ID" true >/dev/null; then
            docker tag "$IT_IMAGE_ID" "$IT_IMAGE"
            echo "IT_LEASE_ID=$IT_IMAGE_ID" >> "$GITHUB_ENV"
            echo "leased=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the integration image $IT_IMAGE_ID is not on this runner's daemon; loading it from the run's artifact"
          fi
          image_unlock

      # A leg placed on another runner's daemon (run 68296, legs 1, 2 and 4)
      # loads the image job's `docker save` of the image.
      - name: Download the integration image (Gitea)
        if: steps.lease.outputs.leased != 'true' && github.server_url != 'https://github.com'
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59 # v3.1.0
        with:
          name: ${{ needs.integration-image.outputs.artifact }}
          path: ${{ runner.temp }}/it-image

      - name: Download the integration image (GitHub)
        if: steps.lease.outputs.leased != 'true' && github.server_url == 'https://github.com'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ needs.integration-image.outputs.artifact }}
          path: ${{ runner.temp }}/it-image

      # The load keeps the image, not its id (run 70938): the id is the
      # config digest on the classic store and the manifest digest on the
      # containerd store, so the image job's id names nothing on a daemon
      # whose store differs. The leg leases, under the image lock, the id of
      # the tag the load restored, IT_IMAGE, and checks it against the image
      # job's identity, a hash of the layers' diff ids, which every store
      # keeps. Only a load that fails or restores another image makes the leg
      # build, with a warning: the same commit and build arguments, another
      # image. That build skips the warm build cache (IT_WARM_CACHE=0): the
      # warm took a leg past its timeout (run 70938), and a leg compiles
      # from an empty cache in less. It is the integration stage, so it is
      # named for that stage's content tag, and a daemon that holds that tag
      # already reuses it. It streams the image to this step's `docker load`
      # (BUILDX_CLIENT_LOAD): --load imports into the daemon of the builder's
      # node, which on run 68044 was not the daemon `docker create` asked.
      - name: Load the integration image
        if: steps.lease.outputs.leased != 'true'
        run: |
          source "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          # shellcheck disable=SC2034 # read by take_lease, sourced above
          lease=$IT_LEASE
          leased=false
          if docker load -i "$RUNNER_TEMP/it-image/it-image.tar"; then
            image_lock || exit 1
            if loaded_id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE") &&
              docker create --pull never --name "$IT_LEASE" "$loaded_id" true >/dev/null; then
              loaded_identity=$(docker image inspect -f '{{json .RootFS.Layers}}' "$loaded_id" | sha256sum | cut -d' ' -f1)
              if [ "$loaded_identity" = "$IT_IMAGE_IDENTITY" ]; then
                echo "IT_LEASE_ID=$loaded_id" >> "$GITHUB_ENV"
                leased=true
              else
                echo "::warning::the run's artifact restored $IT_IMAGE as layers $loaded_identity, not the image job's $IT_IMAGE_IDENTITY"
                docker container rm "$IT_LEASE" >/dev/null
              fi
            fi
            image_unlock
          fi
          if [ "$leased" != true ]; then
            IT_IMAGE=$(make -s it-image IT_WARM_CACHE=0)
            echo "::warning::loading the run's artifact left no image with the image job's layers on this runner's daemon; running this leg in $IT_IMAGE"
            image_lock || exit 1
            if ! take_lease; then
              image_unlock
              # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
              # and the cache answers, `|` so any error falls through to the public
              # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
              bp=
              if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
                bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct"
              fi
              make docker-build-it ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE" BUILDX_CLIENT_LOAD=1 IT_WARM_CACHE=0
              image_lock || exit 1
              if ! take_lease; then
                echo "::error::the fallback build finished but $IT_IMAGE is not on the daemon this leg uses (context $(docker context show), DOCKER_HOST=${DOCKER_HOST:-unset}); builder $BUILDX_BUILDER:"
                docker buildx inspect "$BUILDX_BUILDER" || true
                exit 1
              fi
            fi
            image_unlock
            echo "IT_IMAGE=$IT_IMAGE" >> "$GITHUB_ENV"
            echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"
          fi
          rm -rf "$RUNNER_TEMP/it-image"

      # CUSTOMIZE (ruling 125): Go on the runner for scripts/foreignfailures.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # This leg's share of the runner's ALL_TARGETS
      # (build/docker/devcontainer/run-integration-tests.sh, INTEGRATION_LEGS).
      # CUSTOMIZE (ruling 125): IT_FOREIGN_BASELINE=1 keeps the suites' output
      # in IT_LOG and, when they fail, makes scripts/foreignfailures the step's
      # verdict: every failed leaf test must be a row of
      # .github/foreign-failures.tsv, and anything the checker cannot attribute
      # to a listed test (a build failure, a panic or timeout, an unreadable
      # log) fails the step. ci-gate reads this job's result unchanged.
      - name: Run integration suite leg ${{ matrix.leg }} in the integration image
        run: make integration-test-leg LEG="${{ matrix.leg }}" IT_PREBUILT=1 IT_PROJECT="$IT_PROJECT" IT_IMAGE="$IT_IMAGE" IT_FOREIGN_BASELINE=1 IT_LOG="$RUNNER_TEMP/integration-leg${{ matrix.leg }}.log"

      - name: Tear down
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/gomodauth.env" "$RUNNER_TEMP/it-image"
          GO_TRUSTED_PLATFORM_IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$IT_PROJECT" down --volumes --remove-orphans ||
            echo "::warning::teardown of $IT_PROJECT failed; the next job's reaper removes what is left"
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null 2>&1 || true
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE" || true

  # ==========================================================================
  # The nightly tier
  # ==========================================================================

  # Soak (v1.23, owner item 101): the integration suite looped in the
  # integration image until SOAK_MINUTES have passed, each iteration its own
  # compose stack, torn down before the next; the first red iteration fails
  # the job. v1.24: the schedule and workflow_dispatch only, off main pushes
  # and off ci:full; the Gate marks it `nightly`. batch.yml's soak stays a
  # dispatch. CUSTOMIZE (no lease, ruling 145): the job builds its own
  # per-run image, as the integration job does, instead of leasing the image
  # job's.
  soak:
    name: Soak [integration image]
    # v1.29.3: on a schedule run, only on the schedule guard's `run`.
    needs: schedule-guard
    if: ${{ (github.event_name == 'schedule' && needs.schedule-guard.outputs.verdict == 'run') || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    timeout-minutes: 90       # CUSTOMIZE: SOAK_MINUTES plus one iteration
    env:
      SOAK_MINUTES: 30        # CUSTOMIZE
      SOAK_TARGET: integration-test   # CUSTOMIZE: a make target of the integration image
      IT_PROJECT: go-trusted-platform-ci-${{ github.run_id }}-${{ github.run_attempt }}-soak
      # The integration container's memory limit, swap included (Makefile
      # IT_MEMORY; compose.yaml mem_limit). The legs peaked at 12.9 GB (#1178).
      IT_MEMORY: 16g
      # The image job's builder (see there).
      BUILDX_BUILDER: go-trusted-platform-ci
      BUILDKIT_KEEP_STORAGE: 40gb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Mask the module credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh go-trusted-platform-ci-

      # ci-standard.md §9: the content tag hashes the package indexes the
      # build resolves against. CUSTOMIZE: the Dockerfile's FROM names
      # GO_IMAGE, which has no global ARG default, so the base comes from
      # scripts/tool-pins.sh; it is Debian, so the sum is `none`. APT_REFRESH
      # (scripts/apt-refresh-key.sh) is the Debian refresh key the base
      # stage's apt layer takes. Read once here, so the tag and the build
      # hash and build the same key.
      - name: Read the package indexes
        id: index
        run: |
          base=$(sed -n 's/^GO_IMAGE=//p' scripts/tool-pins.sh)
          sum=$(APK_BASE_IMAGES="$base" scripts/apk-index-sum.sh)
          refresh=$(scripts/apt-refresh-key.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"
          echo "APT_REFRESH=$refresh" >> "$GITHUB_ENV"
          echo "apk_index_sum=$sum" >> "$GITHUB_OUTPUT"
          echo "apt_refresh=$refresh" >> "$GITHUB_OUTPUT"

      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      - name: Prepare the project's BuildKit builder
        run: |
          docker buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1 ||
            docker buildx create --name "$BUILDX_BUILDER" --driver docker-container >/dev/null ||
            docker buildx inspect "$BUILDX_BUILDER" >/dev/null
          docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null ||
            docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE"

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      # ci-standard.md §9: the soak runs every iteration in one leased image,
      # reused when the daemon holds its content tag and built once otherwise.
      - name: Lease the integration image
        run: |
          lease="go-trusted-platform-ci-lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          image_lock() {
            local lock="go-trusted-platform-ci-image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          take_lease() {
            id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null) || return 1
            docker create --pull never --name "$lease" "$id" true >/dev/null || return 1
            [ "$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null)" = "$id" ] && return 0
            docker rm "$lease" >/dev/null 2>&1 || true
            return 1
          }
          declare -f image_lock image_unlock take_lease > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          image_lock || exit 1
          if ! take_lease; then
            image_unlock
            echo "integration image $IT_IMAGE is missing or went before its lease; building it once"
            # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
            # and the cache answers, `|` so any error falls through to the public
            # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
            bp=
            if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
              bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct"
            fi
            make docker-build-it ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE" BUILDX_CLIENT_LOAD=1
            image_lock || exit 1
            if ! take_lease; then
              echo "::error::the integration image $IT_IMAGE is missing after one rebuild, so this job holds no lease on it"
              exit 1
            fi
          fi
          image_unlock
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"

      # CUSTOMIZE (ruling 125): Go on the runner for scripts/foreignfailures.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # CUSTOMIZE (ruling 125): each iteration applies the foreign-failure
      # baseline with its own IT_LOG, as the integration job does. Every
      # iteration runs in the leased image (IT_PREBUILT=1).
      - name: Soak (integration suite, looped)
        run: |
          deadline=$(( $(date +%s) + SOAK_MINUTES * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            p="$IT_PROJECT-$i"
            echo "$p" > "$RUNNER_TEMP/soak-project"
            echo "soak iteration $i"
            rc=0
            make "$SOAK_TARGET" MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PREBUILT=1 IT_PROJECT="$p" IT_IMAGE="$IT_IMAGE" IT_FOREIGN_BASELINE=1 IT_LOG="$RUNNER_TEMP/soak-$i.log" || rc=$?
            GO_TRUSTED_PLATFORM_IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$p" down --volumes --remove-orphans || true
            if [ "$rc" -ne 0 ]; then
              echo "::error::soak iteration $i failed (exit $rc)"
              exit "$rc"
            fi
          done
          echo "soak: $i iterations in $SOAK_MINUTES min, all green"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          if [ -s "$RUNNER_TEMP/soak-project" ]; then
            GO_TRUSTED_PLATFORM_IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$(cat "$RUNNER_TEMP/soak-project")" down --volumes --remove-orphans || true
          fi
          rm -f "$RUNNER_TEMP/soak-project"
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null 2>&1 || true
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE" || true

  # CUSTOMIZE (FIPS 140-3, #853): the one `main`-tier job. It runs on push to
  # main, the schedule and workflow_dispatch, and never on a pull request,
  # `ci:full` or not (m1355 / DS-3878, DS-4613): its `if:` is not the full tier's.
  #
  # It is in ci-gate's `needs` (#1411, ruling 297): a push whose FIPS fails
  # (any of its four shards) reads CI Gate failure, and its skip passes only on
  # a pull request.
  # pkg/arch/citiers_test.go fails `make test` if it leaves the gate, if a
  # non-main job needs it, or if its `if:` is not exactly the one below. Its steps match nightly.yml's `fips` job;
  # change the suite in the Makefile (`make test-fips`), not here. That target
  # also applies the FIPS foreign-failure baseline (ruling 125,
  # .github/foreign-failures-fips.tsv); nightly.yml's header lists what it
  # tolerates.
  fips:
    name: FIPS (shard ${{ matrix.shard }}/4)
    # Hosted runners (CA m2061): four shards of `make test-fips`, each a
    # round-robin quarter of the package list (Makefile SHARD/SHARDS), to fit
    # a hosted job's 4 cores and 6 hours. The job carries no module
    # credential and no proxy setting.
    # Routing (m2475): a push to main runs on the bigdisk pool, which has
    # cpio and libssl-dev, so the apt step is hosted-only; the schedule and
    # workflow_dispatch stay on ubuntu-latest. A bigdisk job carries the
    # schedule guard, so the if: is the guarded main tier
    # (pkg/arch/citiers_test.go mainOnlyGuardedIf).
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    needs: schedule-guard
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install cpio and the OpenSSL headers
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y cpio libssl-dev

      - name: FIPS build and unit tests
        run: make test-fips SHARD=${{ matrix.shard }} SHARDS=4

  # ==========================================================================
  # The gate
  #
  # Branch protection requires a single status context, and this job speaks
  # for the whole pipeline. `if: always()` makes it report when a dependency
  # fails instead of being skipped. Anything other than `success`, including
  # `cancelled`, is a failure, with three exceptions: `skipped` passes for a
  # `full` job when this run did not select the full tier, for a `docs` job
  # on a docs-only PR, and for a `nightly` job off the schedule and dispatch.
  #
  # A new job must be added to `needs`, to the env block and to a tagged
  # `check` line; pkg/arch/citiers_test.go asserts all three.
  # `join(needs.*.result)` is a GitHub extension that is empty on Gitea, so
  # every result is named. The one exception is `fips`: it is in none of the
  # three.
  # ==========================================================================

  ci-gate:
    name: CI Gate
    # The reserved 1-CPU ci-gate runners (DS-2273), so the gate does not queue
    # behind ubuntu-latest jobs: never add a checkout or a `uses:` step here.
    # CA m2475 (2h): the gate runs on the self-hosted bigdisk pool (main pushes
    # and same-repo PRs), so it never waits in the hosted queue and always
    # reports; it needs no Docker. Fork PRs stay on ubuntu-latest.
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    # v1.29.3: on a schedule run the schedule guard decides. `busy` skips the
    # gate, so `CI / CI Gate (schedule)` posts `skipped` (Gitea 1.27.1 posts a
    # skipped job as `skipped`, not `success`), never a green nightly. Every
    # other verdict, an empty one included, runs it.
    if: ${{ always() && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict != 'busy') }}
    needs: [changes, schedule-guard, image, lint-gates, arch-gates, sdkjs, race, web, integration-image, integration, soak, vuln, fips]
    steps:
      - name: Verify every job succeeded
        env:
          # v1.29.3: the schedule guard's verdict on a schedule run.
          SCHEDULE: ${{ github.event_name == 'schedule' }}
          SCHEDULE_GUARD: ${{ needs.schedule-guard.outputs.verdict }}
          FULL_TIER: ${{ env.CI_FULL_TIER }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          # v1.24: a `nightly` job runs on schedule and workflow_dispatch only.
          NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          # #1411 (ruling 297): a `main` job runs on every event but a pull request.
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_SCHEDULE_GUARD: ${{ needs.schedule-guard.result }}
          RESULT_IMAGE: ${{ needs.image.result }}
          RESULT_LINT_GATES: ${{ needs.lint-gates.result }}
          RESULT_ARCH_GATES: ${{ needs.arch-gates.result }}
          RESULT_SDK_JS: ${{ needs.sdkjs.result }}
          RESULT_RACE: ${{ needs.race.result }}
          RESULT_WEB: ${{ needs.web.result }}
          RESULT_INTEGRATION_IMAGE: ${{ needs.integration-image.result }}
          RESULT_INTEGRATION: ${{ needs.integration.result }}
          RESULT_SOAK: ${{ needs.soak.result }}
          RESULT_VULN: ${{ needs.vuln.result }}
          RESULT_FIPS: ${{ needs.fips.result }}
        run: |
          # skipped != failed, and a skipped job fails the gate: it means the
          # job did not run (go-qrdb#42). The exceptions: a `full` job skipped
          # on a run that did not select the full tier (#852), FULL_TIER
          # reading exactly `false`; a `docs` job skipped on a docs-only PR
          # (v1.24), DOCS_ONLY reading exactly `true` and FULL_TIER exactly
          # `false`; and a `nightly` job skipped off the schedule and dispatch
          # (v1.24), NIGHTLY not reading `true`; and a `main` job skipped on a
          # pull request (#1411), PULL_REQUEST reading exactly `true`. Anything
          # else fails closed. A
          # draft PR fails first (v1.26): its jobs all skip, and a gate that
          # passed on those skips would let a draft merge untested.
          if [ "${DRAFT}" = true ]; then
            echo "FAIL draft pull request: no CI runs on a draft. Mark it ready, then push an empty commit to start its run."
            exit 1
          fi
          echo "full tier selected: ${FULL_TIER}; nightly selected: ${NIGHTLY}"
          status=0
          check() {
            tier="$1"
            name="$2"
            result="$3"
            case "$tier" in
              pr|docs|full|nightly|main) ;;
              *) echo "FAIL $name (unknown tier '$tier' - failing closed)"; status=1; return ;;
            esac
            case "$result" in
              success) echo "OK   $name" ;;
              "")      echo "FAIL $name (result unreadable - failing closed)"; status=1 ;;
              skipped)
                if [ "$tier" = full ] && [ "$FULL_TIER" = false ]; then
                  echo "SKIP $name (full tier not selected - passes)"
                elif [ "$tier" = docs ] && [ "$DOCS_ONLY" = true ] && [ "$FULL_TIER" = false ]; then
                  echo "SKIP $name (docs-only PR - passes)"
                elif [ "$tier" = nightly ] && [ "$NIGHTLY" != true ]; then
                  echo "SKIP $name (nightly and dispatch only - passes)"
                elif [ "$tier" = main ] && [ "$PULL_REQUEST" = true ]; then
                  echo "SKIP $name (never on a pull request - passes)"
                else
                  echo "FAIL $name (skipped in the $tier tier - see its job)"; status=1
                fi
                ;;
              *)       echo "FAIL $name ($result)"; status=1 ;;
            esac
          }
          # v1.29.3: a schedule run reaches this step on any verdict but
          # `busy`. Any verdict but `run` means its bigdisk jobs skipped
          # because the guard had no count: fail closed.
          if [ "${SCHEDULE}" = true ] && [ "${SCHEDULE_GUARD}" != run ]; then
            echo "FAIL schedule-guard (verdict '${SCHEDULE_GUARD:-none}': the bigdisk jobs skipped because the guard could not read the API; see its log)"; status=1
          fi
          check pr changes "$RESULT_CHANGES"
          check pr schedule-guard "$RESULT_SCHEDULE_GUARD"
          check pr image "$RESULT_IMAGE"
          check pr lint-gates "$RESULT_LINT_GATES"
          check pr arch-gates "$RESULT_ARCH_GATES"
          check docs sdkjs "$RESULT_SDK_JS"
          check docs race "$RESULT_RACE"
          check full web "$RESULT_WEB"
          check full integration-image "$RESULT_INTEGRATION_IMAGE"
          check full integration "$RESULT_INTEGRATION"
          check full vuln "$RESULT_VULN"
          check nightly soak "$RESULT_SOAK"
          check main fips "$RESULT_FIPS"
          exit $status
