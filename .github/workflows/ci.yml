name: CI

# ci-template: v1.9 (staged fail-fast) — adopted 2026-08-20 per issues #21/#22.
#
# Gitea has no API to cancel in-flight jobs, so fail-fast comes from ORDERING:
# the fast tier (lint + build, ~minutes) gates the expensive tier (test,
# security). A broken push reports in minutes and burns nothing downstream; a
# green push pays one fast-tier of extra latency.
#
# trivy and fips live in nightly.yml (schedule + workflow_dispatch) and gate
# nothing here. Repo-specific caveat recorded there: trivy was NOT known-red in
# this repository — it was green and caught two live HIGH CVEs on 2026-08-19.
# It moved for portfolio conformance, which means a dependency CVE now surfaces
# at the next nightly rather than blocking the push that introduces it.
#
# One workflow, both hosts. Gitea Actions is GitHub-Actions-compatible, so the
# GitHub-only mechanics (SARIF upload to code scanning, aquasecurity/trivy-action,
# whose setup cannot authenticate to github.com from a Gitea runner) are guarded
# on `github.server_url` and the Gitea leg installs the Trivy CLI instead.
# See automatethethings software/conventions/devops.md §1 and §8.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Gitea has no API to re-run a finished run, so a run that failed for the
  # runner's own reasons can only be repeated by inventing a commit unless the
  # workflow can be dispatched by hand (ci-template v1.3).
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.26.7"
  # The toolchain the repository must keep COMPILING under, one release ahead of
  # GO_VERSION — see the `gonext` job. Pinned exactly, like GO_VERSION, so the
  # lane cannot change what it tests without a commit. When GO_VERSION moves to
  # 1.27 this moves to 1.28; it is never allowed to equal GO_VERSION, or the job
  # tests nothing.
  GO_NEXT_VERSION: "1.27.0"
  # Builds never resolve through a workspace: first-party modules come from
  # Gitea tags (conventions/dependency-resolution.md §2). The runner injects
  # GOPRIVATE and the tokenised git rewrite for github.com/jeremyhahn/* itself —
  # no credentials belong in this file.
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Backstop above the Makefile's GOLANGCI_LINT_TIMEOUT (45m, measured — see
    # its comment, #426). Measured job wall times on this fleet: 20 min green,
    # 33–40 min when golangci-lint itself hit 19 min under contention; go vet in
    # the same job stretched from 8 to 17 min. Without this the job has only the
    # runner's implicit limit, and a hung linter would sit until that.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # devops.md §9: tools installed in CI take @latest, never a pin. This one
      # IS pinned, and the pin plus its justification live in the Makefile
      # (GOLANGCI_LINT_VERSION) rather than here, so CI and a developer machine
      # cannot drift apart — the two-lists-that-must-agree defect. Installing via
      # the make target is also devops.md §4: CI runs the same target a developer
      # runs, which is what makes a local `make lint` trustworthy (#297).
      - name: Install golangci-lint
        run: make install-golangci-lint

      # devops.md §4: CI runs the same targets a developer runs. `make fmt-check`
      # is the gofmt check, not a rewrite.
      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

      # Repo-local rule: TLS verification may only be skipped inside the
      # allowlist recorded in the Makefile.
      - name: InsecureSkipVerify allowlist
        run: make check-insecure-tls

  # Job id is `sdkjs`, deliberately without a hyphen, for the same reason
  # `gonext` is: ci-gate dereferences it as `needs.sdkjs.result`, and this
  # file already carries one gate bug that came from assuming Gitea
  # evaluates a GitHub expression the way GitHub does. Do not "tidy" this
  # to `sdk-js`.
  sdkjs:
    name: SDK JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fast tier, deliberately without `needs`. Staged fail-fast exists to keep
    # the expensive tier from burning runner-minutes behind a broken fast tier;
    # nothing this job does is made cheaper or safer by waiting for `lint` and
    # `build` to pass first, so gating it on them would add latency to every
    # green push and save nothing. It runs in ~2 minutes, alongside lint and
    # build.
    #
    # It exists because sdk/javascript's vitest suite ran in NO stage of this
    # workflow, and 33 tests sat red on `main` behind a green badge until #211
    # found them. `npm ci`, not `npm install`: the lockfile is what makes the
    # run reproducible, and a job that silently resolves a different dependency
    # tree than the developer is a gate that reports on something else.
    #
    # Both `npm test` and `npm run lint` are gated. Lint was deliberately left
    # out when this job landed (#211) because eslint reported 38 errors on
    # `main` and a gate that lands red is not a gate; #231 cleared the baseline
    # to zero and this is that job's second half.
    #
    # `npm run typecheck` is STILL not gated, and that is the same deliberate
    # omission for the same reason, not an oversight. Removing the test-file
    # exclude from `tsconfig.json` (#247) made `tsc` see the vitest suite for
    # the first time and it reports 42 errors. Seventeen of them are #246:
    # assertions contradicting the SDK's own response types, which cannot be
    # settled here because 79 of the 84 quicbaas routes this SDK calls have no
    # server-side implementation at all (§G7). Typecheck gets gated by the PR
    # for #246 — that issue is the gate on gating it.
    steps:
      - uses: actions/checkout@v6

      # Go is not used by the tests. It is here because the root Makefile
      # evaluates `go env GOARCH`, `go env GOOS` and ``dirname `which go` ``
      # as simple assignments at PARSE time, so EVERY target — this one
      # included — resolves them before a recipe runs. Without a toolchain the
      # target still succeeds (make ignores $(shell) failures and takes the
      # empty string), but the log opens with two `make: go: No such file or
      # directory` lines and a `dirname: missing operand`, which is exactly
      # the noise that gets misread as the cause when something else breaks
      # later. Installing Go makes this job's Makefile parse identical to
      # lint's and build's.
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Pinned, like GO_VERSION, so the lane cannot change what it tests
      # without a commit. sdk/javascript declares only `engines: >=18.0.0`, so
      # there is nothing in the package to derive this from; 22 is the active
      # LTS line. Bump it deliberately, not by drifting onto whatever the
      # runner image happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # devops.md §4: CI runs the same targets a developer runs.
      - name: JavaScript SDK unit tests
        run: make test-sdk-js

      - name: JavaScript SDK lint
        run: make lint-sdk-js

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Compile-check every package with the default (untagged) build, then the
      # daemon/CLI/gateway binaries with the Makefile's default feature tag set —
      # this repository is build-tag driven, so an untagged build alone compiles
      # very little of it.
      #
      # `build-no-web` (CGO_ENABLED=1), not `build`, and it is the same target
      # `make ci-local` uses. `make build` sets CGO_ENABLED=0 for musl/Alpine
      # and no longer links: go-qrdb's SQL engine pulls in
      # dolthub/go-mysql-server, whose internal/regex package has no non-cgo
      # build — "build constraints exclude all Go files". That is a real defect
      # in the static build, tracked separately; gating CI on it would only hide
      # it behind a red job nobody can fix from here.
      - name: Build all packages (default tags)
        run: go build ./...

      - name: Build platformd, platformctl and gatewayd
        run: make build-no-web

      - name: Build sdk/go module
        working-directory: sdk/go
        run: go build ./...

  # Job id is `gonext`, deliberately without a hyphen: ci-gate dereferences it
  # as `needs.gonext.result`, and this file already carries one gate bug that
  # came from assuming Gitea evaluates a GitHub expression the same way
  # (`join(needs.*.result)`). Property access on a hyphenated id is not worth
  # re-testing that assumption on. Do not "tidy" this to `go-next`.
  gonext:
    name: Go Next
    runs-on: ubuntu-latest
    # v1.9 staged fail-fast ordering: no point asking whether the tree builds on
    # the NEXT toolchain until it builds on the current one.
    #
    # It gates ci-gate, and DELIBERATELY does not gate test/race/security/trivy.
    # Putting it in their `needs` was proposed and rejected: this job is strictly
    # heavier than `build` (same untagged compiles, PLUS both tagged modules,
    # plus the initrd link, plus a second toolchain to download), so making the
    # expensive tier wait on it would add that latency to EVERY green push to
    # save runner-minutes only on the rare push that breaks solely on
    # GO_NEXT_VERSION. The fast tier that gates is "lint + build, ~minutes" by
    # design (see the header); this job is not that, and moving it there trades
    # a certain per-push cost for a rare one. If it ever becomes cheap enough to
    # belong in the gating tier, move it — but measure both first.
    needs: [build]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_NEXT_VERSION }}

      # WHY THIS JOB EXISTS (#195). A dependency can gate its own source on the
      # toolchain version: github.com/cockroachdb/swiss defined fastrand64,
      # hashFn and getRuntimeHasher under `go1.20 && !go1.27`, so on a 1.27
      # toolchain those symbols simply were not there and the whole tree failed
      # to compile. Every job above is pinned to GO_VERSION, so the entire gate
      # was green while the repository did not build on 1.27 at all — and the
      # hosted Codex reviewer, which runs 1.27, had been reviewing this
      # repository without ever building it.
      #
      # WHY BUILD-ONLY, AND NOT A SECOND TEST MATRIX. The failure class this
      # guards is version-gated build constraints in dependencies. That is a
      # COMPILE error, not a behavioural one: a build detects it completely, and
      # running the suite a second time adds no detection for it. Against that,
      # sdlc.md §0b is measured and binding — gpu-host's act_runner is
      # `capacity: 3` for the WHOLE portfolio, a repo workflow is already about
      # seven jobs, and two PRs in CI saturate it. Duplicating test+race+security
      # would triple this lane's cost on the fleet's scarcest resource to detect
      # nothing extra. One build job is the whole return.
      #
      # HONEST LIMIT, so nobody reads more into a green than it carries: this
      # proves both modules COMPILE on GO_NEXT_VERSION. It does not run the
      # suite there, does not compile _test.go files there, and says nothing
      # about runtime behaviour on that toolchain. Test-file compilation and
      # behaviour are covered on GO_VERSION by the test and race jobs. Moving
      # GO_VERSION to a new toolchain is still a deliberate change that has to
      # be validated on its own, not something this job pre-approves.
      #
      # `make build-check`, not an ad-hoc `go build ./...`: BUILD_TAGS is
      # assembled in the Makefile in two stages (a literal `:=` line plus
      # conditional `+=` appends), so a hand-copied tag list silently drops every
      # codec and compiles a tree nobody ships. The target single-sources it and
      # covers BOTH modules in BOTH tag configurations (devops.md §4: CI runs the
      # targets a developer runs).
      #
      # Untagged as well as tagged, because neither is a superset of the other:
      # files selected by the ABSENCE of a tag (pkg/api/daemon's
      # iam_service_stub.go is `//go:build !iam`, and !cluster, !fips,
      # !platform_web and others exist) are compiled ONLY by the untagged build,
      # which is why the build job above keeps one.
      - name: Build both modules (tagged and untagged)
        run: make build-check

      # The binaries too: build-check emits no executables, and linking is where
      # a cgo or ldflags incompatibility surfaces rather than at type-check.
      - name: Build platformd, platformctl and gatewayd
        run: make build-no-web

      # platform-initrd is built separately because it IS built separately: its
      # own INITRD_BUILD_TAGS (osusergo,netgo,local — nothing like BUILD_TAGS)
      # and CGO_ENABLED=0, a static binary that runs before networking and links
      # the sdk/go/xkms re-exports directly (AGENTS.md, "Note: pkg/initrd/ and
      # cmd/platform-initrd/"). Neither step above compiles that configuration,
      # so without this a next-toolchain break in the shipped initramfs artifact
      # would pass a green lane.
      - name: Build platform-initrd
        run: make platform-initrd

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # `make test` = `go test -tags "$(BUILD_TAGS)" -v -skip "$(TEST_SKIP)"`
      # over ./pkg/... ./cmd/... minus TEST_EXCLUDE. 141 packages run; what does
      # not, and why:
      #
      #   1. The tags are required, not optional. Untagged, the codec registry
      #      is empty and pkg/api/quic, pkg/api/daemon and pkg/bmc fail with
      #      "no codec available for encoding". `-short` is not a substitute —
      #      the suite does not honour it.
      #   2. TEST_EXCLUDE is the hardware/root/daemon list, every entry carrying
      #      a written reason in the Makefile beside it: pkg/vtpm, pkg/swtpm and
      #      pkg/uefi/firmware need a TPM; pkg/storage/luks needs cryptsetup;
      #      pkg/compute/podman needs an OCI runtime; pkg/iso needs cpio/zstd/
      #      grub; pkg/sdn/netlink needs CAP_NET_ADMIN; pkg/app, pkg/dns,
      #      pkg/webservice* and pkg/cli/commands need a running platformd; and
      #      pkg/bootstrap needs a reachable deploy host — without one its
      #      install-log poller spins forever and the package dies on the 10m
      #      timeout.
      #
      #      THOSE PACKAGES' OWN TESTS RUN IN NO STAGE OF THIS WORKFLOW.
      #      An earlier version of this comment credited
      #      `make integration-test` with running them. Measured 2026-09-05
      #      (#359), that was wrong twice over, independently:
      #        - `make integration-test` runs 24 ./test/integration/* directories
      #          and ZERO ./pkg/... paths, so it never compiles the _test.go
      #          files inside the packages named above. It exercises the
      #          subsystems end-to-end; that is not the same thing.
      #        - No workflow invokes `make integration-test` at all. The only
      #          occurrence of the string in .github/workflows/ is this comment.
      #      So an excluded package's tests can rot, or stop compiling, without
      #      turning anything red. The population is 59 packages / 460 test
      #      files (#34); TEST_UNIT_PKGS in the Makefile names the handful
      #      deliberately re-added. Do not restore a "covered elsewhere"
      #      sentence here without a stage that actually runs them.
      #   3. TEST_SKIP quarantines five named assertions about the Supermicro
      #      X10 UEFI virtual-CD alias that contradict pkg/quirks/registry.go.
      #      The Makefile records which commit made which claim; the conflict
      #      needs a boot on real X10 hardware to settle, not a CI edit.
      - name: Unit tests
        run: make test

      # sdk/go is a SEPARATE MODULE, so the step above does not reach it:
      # `make test` lists ./pkg/... ./cmd/..., and a package list does not cross
      # a module boundary. Without this step no _test.go file under sdk/go is
      # compiled by anything in CI — the build job compiles the module's
      # non-test code, which is not the same guarantee.
      - name: SDK Go unit tests
        run: make test-sdk-go

  race:
    name: Race
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # `make test-race` = the unit suite under the race detector, over the same
      # discovered package set as `make test` plus TEST_UNIT_PKGS, minus
      # RACE_EXCLUDE. The Makefile carries the reason for every exclusion.
      #
      # Why this is a gate job and not a nightly one: a data race is undefined
      # behaviour, so it does not fail on demand the way an assertion does — it
      # corrupts state, tears a read, or does nothing for months. Three races
      # sat in pkg/app indefinitely because `make test` has never passed -race
      # (#37). Off the push path this would find the next one just as late.
      #
      # Honest limit, measured 2026-08-23: race detection is sampling, not
      # proof. The pkg/app races reproduced in 7 of 10 `-count=1` runs, so a
      # single green run is evidence, not a guarantee. It is a ratchet against
      # reintroduction, not a certificate of race-freedom.
      - name: Unit tests (race detector)
        run: make test-race

  # Job id is `web`, one word, for the same reason `sdkjs` and `gonext` are:
  # ci-gate dereferences it as `needs.web.result`.
  web:
    name: Web Console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Expensive tier, beside gonext, by measurement not by kind: the job is
    # ~60s of npm (sdk/javascript `npm ci` 18s + `npm run build` 17s, web
    # `npm ci` 27s, measured 2026-09-05 on d043be83) plus checkout and
    # setup-node, ~2 minutes. Nothing it does is cheaper after `build`; it
    # waits on it because runner capacity is 3 portfolio-wide (sdlc.md §0b):
    # a FOURTH fast-tier job (lint, build, sdkjs, web) queues behind the other
    # three and lengthens the gating tier's critical path on every push, while
    # here it is one ~2-minute job among five already sharing three runners.
    # If capacity grows, move it up — and measure both first, as gonext says.
    #
    # It exists because web/ was built, typechecked and linted by NO stage of
    # this workflow (#396): console edits merged unverified, the same gap #211
    # closed for sdk/javascript one directory over.
    #
    # What is gated: `make web-deps` — `npm ci` + `npm run build` in
    # sdk/javascript, then `npm ci` in web. The SDK build is a check no other
    # job runs (sdkjs runs test and lint, never `npm run build`), and it is
    # the dist/ the console resolves every trusted-platform-sdk import into;
    # the two `npm ci` runs prove both lockfiles install cleanly. `npm ci`,
    # not `npm install`, for the sdkjs reason: the lockfile is what makes the
    # run reproducible.
    #
    # Also gated, each with its rationale on the step below: web/'s vitest
    # unit suite (#450), the console typecheck, and `next build`.
    #
    # Typecheck and `next build` were kept out by 8 type errors. #407 deleted
    # the one that was a page-local copy of an SDK type; #438 cleared the
    # remaining 7, which were a single string-vs-number disagreement about ids
    # between the console and the SDK. Measured 0 errors and a green
    # `next build` on main 08a5bff9 before the steps landed (#396).
    #
    # What is deliberately NOT gated, and why — measured on main d043be83
    # with dist/ built first. A gate that lands red is not a gate; it gets
    # gated by the PR that clears its baseline:
    #   - `make web-lint`: 294 problems, 179 errors (149 no-explicit-any),
    #     tracked as #419 — the shape sdk/javascript was in before #231.
    # It is not run as a non-blocking step either: a check that displays a
    # count without gating trains readers to scroll past red.
    needs: [build]
    steps:
      - uses: actions/checkout@v6

      # Same reason as sdkjs: the root Makefile evaluates `go env` at parse
      # time for every target, so a missing toolchain fills the log with
      # noise that gets misread as the cause when something else breaks.
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Pinned for the sdkjs reason; web/package.json declares no engines
      # field at all, so there is nothing in the package to derive it from.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # devops.md §4: CI runs the same target a developer runs.
      - name: Install from lockfiles and build the SDK the console consumes
        run: make web-deps

      # Zero-baseline gate: web/'s vitest suite (hooks, stores, contexts in
      # jsdom — the auth-gate hydration semantics from #436) was 11/11 on
      # the day it landed, so it gates from its first run. Playwright
      # (`make web-test`) is not here: it needs the dev server and a mocked
      # backend and is the console's E2E, not a per-push unit gate.
      - name: Web console unit tests
        run: make web-test-unit

      # Gated since #438 (7 → 0 type errors). `next build` runs the same type
      # check plus the bundle, so a console that no longer compiles or no
      # longer builds turns this red.
      - name: Web console typecheck
        run: make web-typecheck

      - name: Web console build
        run: make web-build-check

  security:
    name: Security
    runs-on: ubuntu-latest
    # v1.9 staged fail-fast: Gitea has no cancel API, so fail-fast comes from
    # ORDERING — the fast tier (lint + build) gates the expensive tier, and a
    # broken push stops before spending security/test runner-minutes.
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # `make gosec` carries GOSEC_EXCLUDE and its written justifications in the
      # Makefile, so the exclusion list is single-sourced rather than copied
      # into this file (devops.md §8).
      - name: gosec
        run: make gosec

      # SARIF is a GitHub code-scanning feature; Gitea has no equivalent
      # ingest. The gate above already ran, so this leg only produces the
      # report — `make gosec-sarif` is deliberately non-blocking.
      - name: gosec (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        run: make gosec-sarif || true

      - name: Upload gosec SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/gosec-results.sarif
          category: gosec

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Blocking, in both modules. This is also the §9 forcing function for
      # toolchain currency — it fails on a known-vulnerable stdlib.
      #
      # `make vuln` carries the module list and the GOVULN_ALLOW allowlist,
      # with a written reason and a date beside every allowlisted ID, so CI
      # and a developer's local run apply exactly the same policy. Findings
      # outside the allowlist fail the job, and a scan that cannot complete
      # fails it too rather than being read as a pass.
      - name: govulncheck (both modules, via make)
        run: make vuln

      - name: go mod verify
        run: make mod-verify

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    # v1.9 staged fail-fast ordering applies here too.
    #
    # DELIBERATE DIVERGENCE from ci-template v1.9, which moves trivy to
    # nightly.yml. devops.md §8 is normative and says `trivy fs` is BLOCKING on
    # CRITICAL/HIGH, and that "the §1 gate job includes the security jobs in its
    # needs". The template's stated reason for the move is that trivy was
    # known-red on every push from an undiagnosed install failure — a condition
    # this repository does not have: trivy is green here, and on 2026-08-19 it
    # caught two live HIGH CVEs against golang.org/x/mod (CVE-2026-56864 /
    # CVE-2026-56865) that nothing else in the pipeline would have flagged.
    # Moving it would mean a dependency CVE surfaces at the next nightly instead
    # of blocking the push that introduces it.
    #
    # The template-vs-convention conflict is filed upstream; if that resolves in
    # favour of the template, delete this job and this comment together.
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v6

      # GitHub leg: a fresh source-scoped scan is uploaded to code scanning on
      # every run so the dashboard never reflects a stale analysis, then a
      # second pass gates on CRITICAL/HIGH. test/, examples/ and vbmc/ hold
      # harnesses and sample trees that ship in no release; web/ is NOT skipped
      # — the Next.js frontend is a shipped artifact and its lockfiles are in
      # scope. Suppressions live in .trivyignore with a reason and a date.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples,vbmc,web/node_modules
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples,vbmc,web/node_modules
          trivyignores: .trivyignore

      # Gitea leg: trivy-action's setup step cannot authenticate to github.com
      # from a Gitea runner, so install the CLI and run the identical gate.
      - name: Install Trivy CLI
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --skip-dirs test --skip-dirs examples --skip-dirs vbmc --skip-dirs web/node_modules .

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    # devops.md §1: one gate for branch protection to require, with every job
    # listed explicitly. `join(needs.*.result)` is a GitHub extension that
    # evaluates to an empty string on Gitea, so a gate built on it reports
    # success while jobs fail. Adding a job means adding it to `needs` AND to
    # the env block and the checks below.
    #
    # v1.9 moves trivy to nightly; this repo keeps it gating per devops.md §8
    # (trivy fs is BLOCKING on CRITICAL/HIGH). Since #187 nightly.yml ALSO runs
    # trivy, advisory and not gating: this job judges a diff, that one judges
    # the tree against a database that has moved since the last push. This job
    # is unchanged and remains the gate.
    needs: [lint, build, sdkjs, gonext, web, test, race, security, trivy]
    steps:
      - name: Verify every job succeeded
        env:
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_SDK_JS: ${{ needs.sdkjs.result }}
          RESULT_GO_NEXT: ${{ needs.gonext.result }}
          RESULT_WEB: ${{ needs.web.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_RACE: ${{ needs.race.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
          RESULT_TRIVY: ${{ needs.trivy.result }}
        run: |
          # v1.9: skipped != failed, but BOTH fail the gate. Under staged
          # fail-fast a skipped job means an UPSTREAM stage failed, and naming
          # it prevents the go-qrdb#42 class — a red that looks like a test
          # failure while the tests never ran at all.
          status=0
          check() {
            name="$1"
            result="$2"
            case "$result" in
              success) echo "OK   $name" ;;
              "")      echo "FAIL $name (result unreadable - failing closed)"; status=1 ;;
              skipped) echo "SKIP $name (upstream stage failed - see its job)"; status=1 ;;
              *)       echo "FAIL $name ($result)"; status=1 ;;
            esac
          }
          check lint "$RESULT_LINT"
          check build "$RESULT_BUILD"
          check sdkjs "$RESULT_SDK_JS"
          check gonext "$RESULT_GO_NEXT"
          check web "$RESULT_WEB"
          check test "$RESULT_TEST"
          check race "$RESULT_RACE"
          check security "$RESULT_SECURITY"
          check trivy "$RESULT_TRIVY"
          exit $status
