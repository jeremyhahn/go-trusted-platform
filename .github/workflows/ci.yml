# ci-template: v1.15 (customized)
#
# Every job starts at once (ci-template v1.14, automatethethings#207/#209), the
# docs tier just after the seconds-long `changes` job (v1.24), so a run takes
# as long as its slowest job; ci-gate, the one required check, needs
# every gated job and fails closed on any result but success. push runs on main
# only: automerge.yml's merge trains are PRs from merge-train/* and get their CI
# from pull_request (v1.15).
#
# The one ordering kept is isolation, not staging: integration waits on test,
# because the privileged integration suite (OVS, swtpm, qemu, platformd) and
# the unit suite starve a shared runner when they overlap. Neither consumes
# the other's output.
#
# The five CI-standard stages (handbook ci-standard.md §1) run in this
# project's devcontainer image (§2): `image` runs build, test, security and
# deps-check in the toolchain image, `integration` runs the integration suite
# in the integration image. The jobs on the runner around them carry what the
# five stages do not: lint and vet, the JavaScript SDK and web console, the
# sdk/go module, the Raspberry Pi cross-build, the race detector and FIPS.
#
# Two tiers (#852; handbook sdlc.md §5a, devops.md §1/§5):
#
#   PR tier    every run. lint, changes, sdkjs, security, image, build, test.
#   Full tier  push to main, workflow_dispatch, or a pull_request carrying
#              the label `ci:full`. race, web, integration.
#
# Docs-only PRs (ci-template v1.24, handbook ci-standard.md §10 (a)): a PR
# whose every changed file is markdown or under docs/ runs lint and CI Gate
# only. sdkjs, security, image, build and test are the docs tier: they need
# `changes` and skip when its docs_only output reads `true`. `ci:full`
# overrides it.
#
# fips is the one main-only job (#853): push to main and workflow_dispatch,
# never a pull_request, and never gated (see its comment).
#
# Each full-tier job carries the same `if:`, spelled out per job because
# Gitea's workflow parser does not expand YAML anchors. ci-gate passes a
# full-tier job that its tier skipped and nothing else that skipped. A
# full-tier job may need a PR-tier one; never the reverse.
# pkg/arch/citiers_test.go fails `make test` when the tiers, the gate's needs
# and its check lines disagree.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # No `labeled` (#853): adding `ci:full` takes effect on the next push, not
    # on the label event, so a label never re-runs the PR tier on the same
    # commit. pkg/arch/citiers_test.go holds the list.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel superseded runs. Keyed on the ref so a branch only supersedes itself,
# and set at workflow level so the whole superseded pipeline goes. ci-gate
# treats `cancelled` as a failure, which never blocks a merge: only a
# superseded PR commit gets cancelled (#510).
#
# On main the group is the commit instead (DS-3465): every main commit needs
# its own Gate result, so the next push to main is a new group and never
# cancels the run in progress. Gitea 1.27.1 evaluates expressions in `group`
# but not in `cancel-in-progress`, which stays the literal true. The sha, not
# run_id: the sha comes from the event, so it is known whenever Gitea evaluates
# the group. Each push to main has a new sha, so only a re-run or dispatch of
# the same main commit shares its group.
# pkg/arch/citiers_test.go holds the policy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  # An exact patch release, never "stable", so an upstream release cannot change
  # the toolchain under a running pipeline. The `go` directive in every go.mod
  # must not exceed this, and nested modules must match the root's.
  GO_VERSION: "1.27.3"
  # Modules resolve from tags, never from a workspace. A stray go.work in the
  # tree would silently change what every job compiles (the Makefile and
  # release.yml set the same).
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"
  # ci-template v1.24 (CA m749, m751 (a)): the files a docs-only PR may touch.
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'
  # The docs/ pages unit tests read: a PR that changes one runs every PR-tier
  # job. They are the doc-contract tests in pkg/config (docs/daemon/*.md), cmd/platformd
  # (docs/daemon/cli.md) and pkg/webservice (docs/web/user.md). No go:embed
  # reads docs/ or markdown.
  DOCS_TESTED_PATTERN: '^docs/(daemon|web)/'

jobs:
  # ci-template v1.24 (CA m749, m751 (a)): a PR whose every changed file
  # matches DOCS_ONLY_PATTERN, and none DOCS_TESTED_PATTERN, runs lint only:
  # the docs-tier jobs (`needs: [changes]` and an `if:` on docs_only) skip,
  # and ci-gate passes their skip only when docs_only reads exactly `true`.
  # Off pull_request, or on a ci:full PR, docs_only is always false. Any doubt
  # (a failed diff, an empty list) reads as false, so the tier fails toward
  # running the tests.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        with:
          fetch-depth: 0
      - name: Is every changed file docs or markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
          FULL_TIER: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ] && [ "$FULL_TIER" = false ]; then
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$DOCS_ONLY_PATTERN" \
                && ! printf '%s\n' "$files" | grep -qE "$DOCS_TESTED_PATTERN"; then
                docs_only=true
              fi
              printf '%s\n' "$files"
            fi
          fi
          echo "docs only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # CUSTOMIZE (lint job): this project's lint is its make targets, so CI and a
  # developer machine run the same thing (devops.md §4). golangci-lint and
  # actionlint are built from their tools modules under build/tools-src, the
  # one place their pins live, so there is no baked tool to verify here.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Backstop above the Makefile's GOLANGCI_LINT_TIMEOUT (45m, measured, #426).
    # Measured job wall times on this fleet: 20 min green, 33-40 min under
    # contention. Without this a hung linter sits until the runner's limit.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: make install-golangci-lint

      # `make fmt-check` is the gofmt check, not a rewrite.
      - name: gofmt
        run: make fmt-check

      # go vet compiles test files, cgo included: the TPM simulator pkg/app's
      # IDevID mTLS tests use needs the OpenSSL headers (#149).
      - name: Install OpenSSL headers for the TPM simulator
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: go vet
        run: make vet

      # actionlint over .github/workflows, then golangci-lint.
      - name: golangci-lint
        run: make lint

      # Repo-local rule: TLS verification may only be skipped inside the
      # allowlist recorded in the Makefile.
      - name: InsecureSkipVerify allowlist
        run: make check-insecure-tls

  # CUSTOMIZE (SDK JavaScript): sdk/javascript's vitest suite and eslint, both
  # zero-baseline gates (#211, #231). Typecheck is not gated until #246.
  #
  # Job id is `sdkjs`, deliberately without a hyphen: ci-gate dereferences it
  # as `needs.sdkjs.result`. Do not "tidy" this to `sdk-js`.
  sdkjs:
    name: SDK JavaScript
    runs-on: ubuntu-latest
    if: needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Go is not used by the tests: the root Makefile evaluates `go env` at
      # parse time for every target, and without a toolchain the log opens
      # with noise that gets misread as the cause when something else breaks.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Pinned, like GO_VERSION. sdk/javascript declares only
      # `engines: >=18.0.0`; 22 is the active LTS line.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript SDK unit tests
        run: make test-sdk-js

      - name: JavaScript SDK lint
        run: make lint-sdk-js

  # CUSTOMIZE (security job): the make targets carry GOSEC_EXCLUDE, the
  # govulncheck module list and GOVULN_ALLOW with their written reasons, so
  # the policy is single-sourced in the Makefile (devops.md §8). gosec is
  # built from build/tools-src/gosec, not taken from the runner (#98).
  security:
    name: Security
    runs-on: ubuntu-latest
    if: needs.changes.outputs.docs_only != 'true'
    # Needs only `changes` (v1.14, v1.24): starts with lint and build, not
    # after them.
    needs: [changes]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gosec
        run: make gosec

      # SARIF is a GitHub code-scanning feature; Gitea has no equivalent
      # ingest. The gate above already ran, so this leg only produces the
      # report: `make gosec-sarif` is deliberately non-blocking.
      - name: gosec (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        run: make gosec-sarif || true

      - name: Upload gosec SARIF
        # Gitea has no code-scanning API; the upload 404s and fails the job.
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: build/gosec-results.sarif
          category: gosec

      # Kept although the runner image bakes govulncheck (#98): the runner
      # pins v1.7.0, while `make vuln` was last verified against v1.8.0 on this
      # module's Go 1.27 line (GOVULN_ALLOW in the Makefile). Drop this step
      # with the matching bakedToolInstallKept entry in
      # pkg/arch/cibakedtools_test.go once the runner pin reaches it.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Blocking, in both modules (GOVULN_MODULES), with the allowlist and its
      # reasons in the Makefile.
      - name: govulncheck (both modules, via make)
        run: make vuln

      - name: go mod verify
        run: make mod-verify

  # CUSTOMIZE (ci-template v1.18, image job): builds the devcontainer images
  # from build/docker/devcontainer/Dockerfile at this commit, runs the
  # toolchain stages in the toolchain image (handbook ci-standard.md §1-§2),
  # and gates the integration image with trivy image. The checkout is copied
  # into each toolchain container (scripts/in-toolchain-image.sh): the daemon
  # is reached through a socket, so a bind mount would resolve on its host.
  # make security and make deps-check get a network, for the vulnerability
  # databases and the module proxy; build and test run without one. The scan
  # is a gate only: nothing is uploaded to code scanning.
  #
  # make security includes `trivy fs` (blocking on CRITICAL/HIGH, devops.md
  # §8, .trivyignore), the gate the old `trivy` job ran in the full tier; it
  # now runs on every PR.
  image:
    name: Devcontainer image [build, test, security, deps-check, trivy image]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    timeout-minutes: 120
    env:
      IT_IMAGE: go-trusted-platform-ci-it:${{ github.run_id }}-${{ github.run_attempt }}-image
      # The project's own BuildKit builder (Makefile BUILDX_BUILDER). Its
      # cache is this project's alone: `docker image rm` frees the image, and
      # `docker buildx prune --builder` trims what the build left behind,
      # never another project's cache (ruling 108 (b)). Shared by the image
      # and integration jobs and by every run, so the cached tools, modules
      # and apt layers stay warm up to BUILDKIT_KEEP_STORAGE.
      BUILDX_BUILDER: go-trusted-platform-ci
      BUILDKIT_KEEP_STORAGE: 40gb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh go-trusted-platform-ci-

      # Creates the builder once per daemon and reuses it after; a second
      # create or bootstrap racing a concurrent job's is retried. The prune
      # also bounds what a cancelled run, whose teardown never ran, left.
      - name: Prepare the project's BuildKit builder
        run: |
          docker buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1 ||
            docker buildx create --name "$BUILDX_BUILDER" --driver docker-container >/dev/null ||
            docker buildx inspect "$BUILDX_BUILDER" >/dev/null
          docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null ||
            docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE"

      # As in the integration job: the forge credentials reach the build only
      # as the gomodauth BuildKit secret, from a file outside the context.
      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      - name: Build the toolchain and integration images
        run: |
          make docker-build MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      - name: make build (toolchain image)
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make build

      - name: make test (toolchain image)
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make test

      - name: make security (toolchain image)
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make security

      - name: make deps-check (toolchain image)
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make deps-check

      # Blocks on CRITICAL/HIGH findings that have a fix (#933):
      # --ignore-unfixed is the handbook's rule for image scans (devops.md §8:
      # "fixable findings (--ignore-unfixed on the OS layer)"); Debian's
      # unfixed advisories have no package to move to.
      # --skip-dirs /gomodcache: the baked module cache is third-party source,
      # and its test fixtures (gosec's, echo's, aws-sdk-go's sample keys) are
      # not credentials. Module vulnerabilities stay gated by govulncheck and
      # `trivy fs` on go.mod in `make security`, secrets in our own tree by
      # `trivy fs`.
      # --ignorefile: dated, path-scoped suppressions for advisories in the
      # dependencies npm bundles, with the reason per entry in the file.
      - name: trivy image (integration image)
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          docker save -o it-image.tar "$IT_IMAGE"
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
            trivy image --input it-image.tar --severity CRITICAL,HIGH --exit-code 1 \
              --ignore-unfixed --skip-dirs /gomodcache \
              --ignorefile build/docker/devcontainer/trivyignore-image.yaml

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env" it-image.tar
          docker image rm "$IT_IMAGE" || true
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE" || true

  # CUSTOMIZE (build job): this repository is build-tag driven, so an untagged
  # `go build ./...` compiles very little of it. The binaries build with the
  # Makefile's tag set (`make -s print-build-tags`, never a hand-written list).
  build:
    name: Build
    runs-on: ubuntu-latest
    if: needs.changes.outputs.docs_only != 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages (default tags)
        run: go build ./...

      # The CGO_ENABLED=1 build of platformd, platformctl and gatewayd. The
      # static CGO_ENABLED=0 build is `make build`, the image job's stage.
      - name: Build platformd, platformctl and gatewayd
        run: make build-no-web

      # The Raspberry Pi factory image ships aarch64 binaries cross-built
      # with CGO_ENABLED=0 (docs/factory-image/engineering.md). The full image
      # build and the emulated boot are in nightly.yml `rpi-image`.
      - name: Cross-build the aarch64 binaries (Raspberry Pi image)
        run: make rpi-binaries

      # CUSTOMIZE (sdk/go module): a separate module that `./...` from the
      # root never enters.
      - name: Build sdk/go module
        working-directory: sdk/go
        run: go build ./...

      # A consumer gets only the sdk/go tree from the module's tag, so this
      # builds every SDK package from a throwaway module that sees nothing
      # else, and fails if the build reaches any root-module package (#840).
      - name: Build sdk/go as a module consumer
        run: make sdk-consumer-check

  # CUSTOMIZE (test job): `make test` is `go test -tags "$(BUILD_TAGS)"` over
  # ./pkg/... ./cmd/... minus TEST_EXCLUDE, whose every entry carries its
  # reason in the Makefile. Untagged, the codec registry is empty and
  # pkg/api/quic, pkg/api/daemon and pkg/bmc fail with "no codec available
  # for encoding". The excluded packages' own tests (59 packages, #34) run in
  # no stage of this workflow; `make integration-test` exercises the
  # subsystems end to end, which is not the same thing.
  test:
    name: Test
    runs-on: ubuntu-latest
    if: needs.changes.outputs.docs_only != 'true'
    # Needs only `changes` (v1.14, v1.24): starts with the other PR-tier jobs.
    needs: [changes]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # pkg/diskimage/netboot repacks its installer initramfs with cpio, and
      # pkg/app's IDevID mTLS tests run go-tpm-tools' simulator, which compiles
      # the reference TPM with cgo against OpenSSL (#149).
      - name: Install cpio and the OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y cpio libssl-dev

      - name: Unit tests
        run: make test

      # CUSTOMIZE (sdk/go module): `make test` lists ./pkg/... ./cmd/..., and a
      # package list does not cross a module boundary.
      - name: SDK Go unit tests
        run: make test-sdk-go

  # ==========================================================================
  # The full tier. These gate every push to main, and a PR labelled
  # `ci:full`.
  # ==========================================================================

  # CUSTOMIZE (race job): the unit suite under the race detector, over the
  # same package set as `make test` plus TEST_UNIT_PKGS, minus RACE_EXCLUDE.
  # A data race does not fail on demand (#37), so it gates every push to main.
  # Race detection is sampling, not proof: a ratchet against reintroduction.
  race:
    name: Race
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install cpio and the OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y cpio libssl-dev

      - name: Unit tests (race detector)
        run: make test-race

  # CUSTOMIZE (web console): `make web-deps` installs both lockfiles and builds
  # the SDK dist/ the console resolves, then the console's vitest suite (#450),
  # typecheck and `next build` (#396, #438). `make web-lint` is not gated
  # until #419 clears its baseline.
  #
  # Job id is `web`, one word, for the same reason `sdkjs` is.
  web:
    name: Web Console
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install from lockfiles and build the SDK the console consumes
        run: make web-deps

      - name: Web console unit tests
        run: make web-test-unit

      - name: Web console typecheck
        run: make web-typecheck

      - name: Web console build
        run: make web-build-check

  integration:
    name: Integration [build tag integration]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    # `needs: test` keeps the heavy jobs off the runner at the same time.
    needs: [test]
    # One job per leg of the suite runner's INTEGRATION_LEGS, in parallel
    # (#1119, ruling 211 (4)): no leg is to run over 20 minutes. Each leg is
    # its own compose project, so its platformd, OVS and swtpm sit in their
    # own container and network namespace, on the fixed ports, beside the
    # other legs'. pkg/arch/integration_legs_test.go fails `make test` when
    # this list and the runner's legs disagree. A failed leg does not cancel
    # the others; ci-gate reads the job's combined result.
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5]
    # Backstop above the 20-minute target, for a leg that hangs.
    timeout-minutes: 60
    # CUSTOMIZE (ci-template v1.18, integration job that starts containers):
    # the suite runs in the devcontainer `integration` image built at this
    # commit, under the compose service in build/docker/devcontainer/
    # compose.yaml (handbook ci-standard.md §2). That service is privileged,
    # not hardened: the suite starts OVS, swtpm, qemu and loopback LUKS2
    # volumes (docs/test/integration.md). The compose project is
    # go-trusted-platform-ci-<run>-<attempt>, the reaper runs first, and the
    # teardown runs last under if: always().
    env:
      IT_PROJECT: go-trusted-platform-ci-${{ github.run_id }}-${{ github.run_attempt }}-leg${{ matrix.leg }}
      IT_IMAGE: go-trusted-platform-ci-it:${{ github.run_id }}-${{ github.run_attempt }}-leg${{ matrix.leg }}
      # The image job's builder (see there).
      BUILDX_BUILDER: go-trusted-platform-ci
      BUILDKIT_KEEP_STORAGE: 40gb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh go-trusted-platform-ci-

      - name: Prepare the project's BuildKit builder
        run: |
          docker buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1 ||
            docker buildx create --name "$BUILDX_BUILDER" --driver docker-container >/dev/null ||
            docker buildx inspect "$BUILDX_BUILDER" >/dev/null
          docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null ||
            docker buildx inspect --bootstrap "$BUILDX_BUILDER" >/dev/null
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE"

      # The forge credentials the runner injects (dependency-resolution.md §6)
      # reach the image build only as the gomodauth BuildKit secret, from a
      # file outside the build context. `docker build` does not inherit the
      # job's environment.
      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      # Go on the runner for scripts/foreignfailures (ruling 125, below).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # This leg's share of the runner's ALL_TARGETS
      # (build/docker/devcontainer/run-integration-tests.sh, INTEGRATION_LEGS).
      # CUSTOMIZE (ruling 125): IT_FOREIGN_BASELINE=1 keeps the suites' output
      # in IT_LOG and, when they fail, makes scripts/foreignfailures the step's
      # verdict: every failed leaf test must be a row of
      # .github/foreign-failures.tsv, and anything the checker cannot attribute
      # to a listed test (a build failure, a panic or timeout, an unreadable
      # log) fails the step. ci-gate reads this job's result unchanged.
      - name: Run integration suite leg ${{ matrix.leg }} in the integration image
        run: make integration-test-leg LEG="${{ matrix.leg }}" MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PROJECT="$IT_PROJECT" IT_IMAGE="$IT_IMAGE" IT_FOREIGN_BASELINE=1 IT_LOG="$RUNNER_TEMP/integration-leg${{ matrix.leg }}.log"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          GO_TRUSTED_PLATFORM_IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$IT_PROJECT" down --volumes --remove-orphans ||
            echo "::warning::teardown of $IT_PROJECT failed; the next job's reaper removes what is left"
          docker image rm "$IT_IMAGE" || true
          docker buildx prune --builder "$BUILDX_BUILDER" --force --keep-storage "$BUILDKIT_KEEP_STORAGE" || true

  # CUSTOMIZE (FIPS 140-3, #853): the main-only, ungated job. It runs on push
  # to main and on workflow_dispatch, and NEVER on a pull_request, not even
  # one labelled `ci:full`, so its `if:` is the full-tier condition without
  # the label clause.
  #
  # It is deliberately NOT in ci-gate's `needs`: it is still red on causes
  # this repository cannot close (the header of nightly.yml lists them), so
  # it reports `CI / FIPS (push)` on main without turning main's CI Gate red.
  # pkg/arch/citiers_test.go fails `make test` if it is ever gated, or if its
  # `if:` lets a pull_request in. Its steps match nightly.yml's `fips` job;
  # change the suite in the Makefile (`make test-fips`), not here. That target
  # also applies the FIPS foreign-failure baseline (ruling 125,
  # .github/foreign-failures-fips.tsv); nightly.yml's header lists what it
  # tolerates.
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install cpio and the OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y cpio libssl-dev

      - name: FIPS build and unit tests
        run: make test-fips

  # ==========================================================================
  # The gate
  #
  # Branch protection requires a single status context, and this job speaks
  # for the whole pipeline. `if: always()` makes it report when a dependency
  # fails instead of being skipped. Anything other than `success`, including
  # `cancelled`, is a failure, with one exception: `skipped` passes for a job
  # tagged `full` when this run did not select the full tier (FULL_TIER is
  # the same expression as the full-tier jobs' `if:`). A PR-tier job never
  # skips legitimately, and in a full-tier run neither does a full-tier job,
  # so `skipped` there still fails.
  #
  # A new job must be added to `needs`, to the env block and to a `check`
  # line tagged `pr` or `full`; pkg/arch/citiers_test.go asserts all three.
  # `join(needs.*.result)` is a GitHub extension that is empty on Gitea, so
  # every result is named. The one exception is `fips`, the main-only job: it
  # is in none of the three.
  # ==========================================================================

  ci-gate:
    name: CI Gate
    # The reserved 1-CPU ci-gate runners (DS-2273), so the gate does not queue
    # behind ubuntu-latest jobs: never add a checkout or a `uses:` step here.
    runs-on: ci-gate
    if: always()
    needs: [lint, changes, sdkjs, security, image, build, test, race, web, integration]
    steps:
      - name: Verify every job succeeded
        env:
          FULL_TIER: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_SDK_JS: ${{ needs.sdkjs.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
          RESULT_IMAGE: ${{ needs.image.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_RACE: ${{ needs.race.result }}
          RESULT_WEB: ${{ needs.web.result }}
          RESULT_INTEGRATION: ${{ needs.integration.result }}
        run: |
          # skipped != failed, and a skipped job fails the gate: it means the
          # job did not run (go-qrdb#42). Two exceptions: a `full` job skipped
          # on a run that did not select the full tier (#852), FULL_TIER
          # reading exactly `false`; and a `docs` job skipped on a docs-only
          # PR (ci-template v1.24), DOCS_ONLY reading exactly `true` and
          # FULL_TIER exactly `false`. Anything else fails closed.
          status=0
          check() {
            tier="$1"
            name="$2"
            result="$3"
            case "$tier" in
              pr|docs|full) ;;
              *) echo "FAIL $name (unknown tier '$tier' - failing closed)"; status=1; return ;;
            esac
            case "$result" in
              success) echo "OK   $name" ;;
              "")      echo "FAIL $name (result unreadable - failing closed)"; status=1 ;;
              skipped)
                if [ "$tier" = full ] && [ "$FULL_TIER" = false ]; then
                  echo "SKIP $name (full tier not selected - passes)"
                elif [ "$tier" = docs ] && [ "$DOCS_ONLY" = true ] && [ "$FULL_TIER" = false ]; then
                  echo "SKIP $name (docs-only PR - passes)"
                else
                  echo "FAIL $name (skipped in the $tier tier - see its job)"; status=1
                fi
                ;;
              *)       echo "FAIL $name ($result)"; status=1 ;;
            esac
          }
          check pr lint "$RESULT_LINT"
          check pr changes "$RESULT_CHANGES"
          check docs sdkjs "$RESULT_SDK_JS"
          check docs security "$RESULT_SECURITY"
          check docs image "$RESULT_IMAGE"
          check docs build "$RESULT_BUILD"
          check docs test "$RESULT_TEST"
          check full race "$RESULT_RACE"
          check full web "$RESULT_WEB"
          check full integration "$RESULT_INTEGRATION"
          exit $status
